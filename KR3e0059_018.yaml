body:
  text: 世醫得效方卷十八元危亦林撰正骨兼金鏃科秘論骨節損折肘臂腰膝出臼蹉跌須用法整頓歸元先用麻藥與服使不知痛然後可用手凡脚手各有六出臼四折骨每手有三處出臼脚亦三處出臼手掌根出臼其骨交互相鎖或出臼則是剉出鎖骨之外須是搦骨須鎖骨下歸窠或出外則須搦入内或出内則須搦入外方入窠臼若只用手拽斷難入窠十有八九成痼疾也手六出臼四折骨凡手臂出臼此骨上段骨是臼下段骨是杵四邊筋脉鎖定或出臼亦挫損筋所以出臼此骨須拽手直一人拽須用手把定此間骨搦教歸窠看骨出那邊用竹一片夾定一邊一邊不用夾須在屈直處夾才服藥後不可放定或時又用拽屈拽直此處筋多喫藥后若不屈直則恐成疾日後屈直不得肩胛上出臼只是手骨出臼歸下身骨出臼歸上或出左或出右須用舂杵一枚小凳一箇令患者立凳上用杵撑在下出臼之處或低用物簟起杵長則簟凳起令一人把住手尾拽去一人把住舂杵令一人助患人放身從上坐􅀢骨節已歸窠矣神效若不用小凳則兩小梯相對木棒穿從兩梯股中過用手把住木棒正稜在出臼腋下骨節蹉跌之處放身從上墜下骨節自然歸臼矣脚六出臼四折骨或脚板上交􅀈處出臼須用一人拽去自用手摸其骨節或骨突出在内用手正從此骨頭拽歸外或骨突向外須用力拽歸内則歸窠若只拽不用手整入窠内誤人成疾脚膝出臼與手臂肘出臼同或出内出外不用一邊夾定此處筋脉最多服藥後時時用屈直不可定放又恐再出窠時時看顧不可疎慢脚大腿根出臼此處身上骨是臼腿根是杵或出前或出後須用一人手把住患人身一人拽脚用手盡力搦歸窠或是剉開又可用軟綿繩從脚縳倒吊起用手整骨節從上墜下自然歸窠背脊骨折法凡剉脊骨不可用手整頓須用軟繩從脚吊起墜下身直其骨使自歸窠未直則未歸窠須要墜下待其骨直歸窠然后用大桑皮一片放在背皮上榆樹皮兩三片安在桑皮上用軟物纒夾定莫令屈用藥治之脚手骨被壓碎者須用麻藥與服或用刀割開甚者用剪剪去骨鋒便不衝破肉或有粉碎者與去細骨免膿血之禍然後用大片桑白皮以二十五味藥和調糊藥糊在桑白皮上夾在骨肉上莫令差錯三日一洗莫令臭穢用藥治之又切不便輕易自恃有藥便割便剪便弄須要詳細審視當行則行尤宜子細或頭上有傷或打破或刀傷骨碎用藥糊角縳不使傷風切須記之用藥治傷則用糊藥封角切不可使風入之浮腫其惡血自消散不攻瘡口正骨金瘡脈候正骨金瘡須看脈候如傷臟腑致命處一觀其脈虛促危矣傷處淺命脈虛促亦為後慮傷至重命脈和緩永無慮也脈有虛有實有去來有疏密或被傷臟脈不死者必闗脈實重則無慮或傷至死處其闗脈無别脈洪大則難醫如用兩件藥後脈不轉動急急住藥若脈漸漸隨藥轉此則可治無慮或血出甚者脈不要洪大只要平正重實其血不曾出者亦無惡血在内者其脈欲洪大不要疎密亦不要進退來去恐其變凶看傷脈每與内科脈不同或傷内或致命或難醫處被傷者命脈便已去矣此等切勿治之十不治證攧撲損傷或被傷入於肺者縱未即死二七難過左脇下傷透内者腸傷斷一半可醫全斷不可治小腹下傷内者證候繁多者脈不實重者老人左股壓碎者傷破陰子者血出盡者肩内耳後傷透於内者皆不必用藥用藥加減法傷有淺深隨其吉凶用藥如折骨者則用後二十五味接骨方治之再加自然銅白芷乳香沒藥川芎各五錢立效若傷臟腑用清心藥加川芎當歸赤芍藥各三錢或肚腸傷破加白芨五錢同後清心藥服或被傷浮腫不退加皂角黄栢皮半兩入紫金皮散内傅之或頭破傷風亦用紫金皮散加皂角黄栢皮𫝊之立退或筋斷接筋者用二十五味加斷續半兩或諸處傷痛不止者仍用二十五味加川芎五錢或惡血汚心不下用后清心藥加大黄枳殻五錢或氣觸痛加木通丁香藿香三錢同二十五味服之凡加減末者加末散者加散其餘只依本方不用加減孕婦攧撲傷損先用安胎藥後服二十五味接骨去草烏川芎餘依本方腸肚傷治法肚上被傷肚皮俱破腸出在外只腸全斷難醫傷破而不斷者皆可治療腸及肚皮破者用花蕊石散傅線上輕用手從上縫之莫待糞出用清油撚活放入肚内肚皮裂開者用麻縷為線或搥桑白皮為線亦用花蕊石散傅線上須用從裏重縫肚皮不可縫外重皮留外皮開用藥掺待生肉又用藥加減法凡損若不折骨不碎骨則不可用自然銅於藥内除去無瘡處不用半夏老人有傷者骨脈冷每用加當歸川芎川烏木香丁香人参五錢去白芍藥生地黄此亦是二十五味内加減老人即服此或傷臟腑者不問老少如有血并痰從口中出者用清心藥加丁皮川芎半夏入二十五味内同服退腫角血或皮冷加乾薑五錢入退重藥内糊腫上腫及血自然退散或皮膚熱者加黄栢皮皂角五錢入腫藥内角腫處自然退用麻藥法攧撲損傷骨肉疼痛整頓不得先用麻藥服待其不識痛處方可下手或服後麻不倒可加曼陁羅花及草烏五錢用好酒調些少與服若其人如酒醉即不可加藥被傷有老有幼有無力有血出甚者此藥逐時相度入用不可過多亦有重者若見麻不倒者又旋添些更未倒又添酒調服少許已倒便住藥切不可過多用掺藥法瘡口血出不止則用方中止血藥傅之如洗開後瘡孔大甚且先用降真香龍骨沒藥掺之内即生上瘡孔上須用油單貼待膿血汁出莫待蔽塞如夏月用藥以薄荷葉貼瘡孔一日一度湯洗又用藥掺如肉上滿瘡口用手搦不痛如好肉一般即用收瘡口藥傅上却莫貼待風稍瘡口立收若未生實肉切不可先收瘡口裏面恐為患也傷破肚皮用藥法如傷孔大肚腸與脂膏俱出放入内則用縫如孔小只有膏出先用清心藥與服用手擘去膏不用縫此膏出者已無用了不可復入肚中反成禍只須擘去不妨此是閑肉但放心去之肚肉被傷者重用退利大小腸不可待秘恐成重患打攧及樹木壓徧身痛者打攧樹木壓或自髙處攧下者此等傷皆驚動四肢五臟必有惡血在内専怕惡心先用清心藥打血藥及通大小腸藥次第先服臨服加童子小便入藥内立效専用大小腸洗利恐作隘塞利害之甚清心藥加前方通利大小腸藥服之自然俱通無悶煩無惡血汚心以次用止痛藥服之即止去惡血法攧撲傷刀石傷諸般傷撲至重者皆先服清心藥次服清小便藥三服去血藥或被傷者血未結打從瘡口中出或結在内用藥打入大腸時即泄出或被打被攧被木壓惡血未積者用藥打散四肢或歸臟腑者或歸上膈者打從口中吐出或歸中膈打入大腸泄出先用此急救次服止痛藥止痛藥即二十五味藥中加減用用藥湯使法凡藥皆憑湯使所使方先但用清心藥煎後用童便一盞同服或止痛重傷者則用薑湯燈心藥調二十五味藥服之薄荷湯亦可凡傷或刀傷及損内臟腑恐作煩悶崩血之患如折骨者用薑酒服接骨藥傅之如骨碎被重打重攧重木及石壓者皆用先服湯使法並未用酒服如輕攧撲損傷則用薑酒調下二十五味藥立效通治攧撲刀傷接骨方服傅臘月猪脂五兩黄蠟半斤以上洗煎鉛丹羅自然銅四兩研宻陁僧四兩研朱砂一兩研右用新鐺鼎先鎔脂次下蠟於冷處下宻陁僧鉛丹自然銅緩火再煎入水中不散更出鼎於冷處下諸藥用栁篦攪勻㵼入甆噐内不住手攪至凝圓如彈子大且用笋皮之類襯之極冷方收凡傷碎骨者木石壓碎骨者先用此藥火化開糊骨上然後夾定用此藥服之須作小圓如梧桐子大每服十圓葱酒調下或傷損深者撚成條入孔中淺者用油單為膏藥貼之甚者燈心裹木夾之如藥力散再覺痛更一服痛即止又痛甚者貼之即止又方二十五味服治攧撲損傷骨碎骨折筋斷刺痛不問輕重悉能治之大效香白芷醋炒加減紫金皮醋炒劉寄奴川當歸煨鹽水炒赤芍藥白芍藥米水浸炒黒牽牛生地黄鹽水浸炒川芎米水浸川牛膝茶水炒乳香可加減沒藥可加減破故紙醋炒木通去節自然銅骨不碎折不用臨好時用木香茶水炒藿香木賊官桂可加減羗活獨活半夏五錢水炒無痰不用骨碎補草烏醋炒孕婦不用川烏火煨孕婦則不用各一兩或加土當歸熟地黄鹽水炒杜牛膝茶水炒土芎米水炒尤妙金刀傷剉出臼者去自然銅骨碎骨折者用之然須於此方内且去自然銅臨欲好時却入用之早服成他疾右先擇出自然銅官桂沒藥乳香不炒者其餘藥或炒或火焙或日曬乾皆可然後入不炒四味同研為末用蜜糊圓如彈子大用黄丹為衣或被攧撲傷損金刃箭鏃不問輕重每服一圓如被刃傷全斷損内重者以薄荷湯或木𤓰湯薑湯燈心湯吞下皆可或攧碎骨及折骨用自然銅其他不用如骨折碎刺痛不止加乳香沒藥白芷川芎各五錢入諸藥中生薑酒下或不作圓為末亦可功效如神又方服傅治攧撲接骨刀傷川當歸半兩洗浄别搗鉛粉半兩洛粉為上鵬砂二錢右為末每服二錢濃煎蘇木汁調下若損在腰上先喫淡麫半椀後服藥若在腰以下先服藥後喫淡麫仍不住呷蘇木汁更以糯米為粥入藥末三錢半和攤在紙上或絹上封裹損處如骨碎更須用竹木夾定以紙或衣包之清心藥方服降真香香白芷醋炒蘇木鹽水炒枳殻水浸去心藿香清油炒丁皮鹽水炒紫金皮木香茶水炒丁香米泔水炒木通去節山梔子大黄蓮子肉酒煮沉香人参當歸濕紙煨川芎煨羗活獨活花蕊石醋炮烏豆燈心少許赤芍藥各等分右為末或大小腸不通服此亦可用五膈寛中散同服立效或惡血汚心或煩悶暴死每服二錢薄荷湯或燈心湯調下或童子小便尤好為散水煎服亦可如痰血口中出加半夏自然銅散治打攧折骨損斷正骨科中經驗方也乳香沒藥蘇木降真香川烏去皮尖松明節自然銅火煆米醋焠七次各一兩地龍去土清油炒半真血竭三錢龍骨生用半兩土狗十枚油浸焙為末本草名螻蛄右為末每服五錢用無灰酒調下如病在上食後服病在下空心服服之自頂心尋病至下兩手再周遍一身下及兩足遇病處則颯颯有聲患人自覺藥力習習徃來又方自然銅累累然相綴如亂絲者最佳一兩重右研細水飛過同當歸沒藥各半錢和勻每服三錢酒調服仍以手摩痛處導滯散治重物壓迮或從髙墜下作熱吐血下血血出不能禁止或瘀血在内胸腹脹滿喘麄氣短兼能打去惡血當歸大黄各等分炒過右為末每服二錢不以時温酒調下鷄鳴散凡墜壓死者急安好處以手袖揜其口鼻上一食頃瞑開先與熱小便若初覺氣絶不能言急擘開口以熱小便灌之打撲悶絶亦先用以此利去瘀血活血丹治患者血脈不和筋急行歩不可服之寛筋乾地黄酒煮二兩當歸煨白芍藥續斷麫水炒白术煨川芎醋炒各一兩右為末麫糊圓梧子大每服三十圓温酒下大嶽活血丹治男子婦人外傷内損狗傷虫咬車馬撲墜手足折傷一切疼痛腹中瘀血刺脇築心左癱右瘓走住疼痛癰疽痔漏及婦人冷氣入腹血脉不通産後敗血灌注四肢及吹嬭腫痛花桑枝如臂大者燒烟淬米醋中焙乾栗楔栗蒲中心扁薄者薄切日乾各一斤細墨半斤一半用車麻三兩細研塗墨上塗盡紙包黄泥固濟乾炭火用七斤燒赤冷地上出火兩時一半用醋化碙砂塗墨上火炎令乾皂角刺一斤燒赤淬醋中灸乾大黒豆一斤濕布揩去浄黒皮焙乾秤亂髪二斤皂角水浄洗用清油二斤炒頻捻看焦即止為末乳香四兩通明滴乳者細研入米醋一碗熬熟右和為末杵三千下圓如彈子大如膏乾更入醋糊圓痛甚一圓輕者半圓以無灰酒一盞乳香一豆大先磨乳香次磨藥盡煎三五沸臨卧温服以痛處就床欲汗則被覆仍用藥塗傷處切忌一切動風物婦人服入當歸末一錢孕婦勿服當歸散救急療墜馬落車被打傷腕折臂呼呌不絶服此呼吸之間不復大痛三日筋骨相連當歸炒令香桂心甘草灸蜀椒去汗各三分芎藭六分炒附子炮去皮澤蘭炒各一兩右為末酒服二三錢日三服如小兒被奔車馬所損傷其膝皮肉决見骨節絶死少蘇啼不可聴聞服之便睡十數日便行走其神驗如此忌海藻菘菜生葱猪肉冷水花蕊石散治一切金刀斫傷箭鏃及打撲傷損身體猫犬咬傷或至死者急於傷處糁藥其血化為黄水再糝藥便差更不疼痛如内損血入臓腑熱煎童子小便入酒少許調一大盞服之立效若牛觝腸出不損者急内入細絲桑白皮尖茸嘗線縫合肚皮縫上糁藥血止立活如無桑白皮用生麻蘇亦得並不得封裹瘡口恐生膿血如乾瘡以津潤之然後糁藥方見大方科失血類内損大紫金皮散治打撲傷折内損肺肝嘔血不止或瘀血停積於内心腹脹悶紫金藤皮降真香續斷補骨脂無名異燒紅酒淬七次琥珀别研蒲黄牛膝酒浸一夕當歸洗焙桃仁去皮炒各一兩大黄紙裹煨朴梢别研各一兩半右為末每服二錢濃煎蘇木當歸酒調并進三服利即安没藥散治打撲内損筋骨疼痛没藥乳香芍藥川芎川椒去子及合目者當歸各半兩自然銅二錢半炭火燒右為末用黄蠟二兩溶開入藥末不住手攪勻圓如彈子大每服一圓用好酒煎開乗熱服之隨痛處卧霎時運進有效打撲傷損加味芎藭湯治打撲傷損敗血流入胃脘嘔黒血如豆汁芎藭當歸白芍藥百合水浸一日荆芥穂各等分右剉散每服四錢水一盞酒半盞煎不以時服木香勻氣散治從髙墜下或打撲傷損腰脇心腹作痛加紅麯末少許童子小便同酒調空心熱服如無紅麯紅酒亦可方見大方科諸疝類麝香散治從髙墜下及打撲損傷麝香水蛭各一兩右用水蛭剉碎炒至煙出研為末入麝再研勻每服酒調一錢若當下蓄血未效再服其應如神又治折傷用水蛭熱酒調一錢食須知痛更進一服痛止便將折骨藥封直至安平方去平胃散治打撲傷損不問􅎲破與暗傷悉能治之用冷水調塗則愈方見大方科脾胃類雙烏散治諸傷百損如被打破傷損久後時時疼痛雖新被傷縱不破皮而内損者尤宜服此川烏草烏略炮各三錢當歸白芍藥蘇木大黄生乾地黄紅麯炒各半兩麝香少許右為末用酒煮一瓦瓶放冷服如覺痺麻無害但二烏頭生用有力恐太猛所以用温火畧炮救急方療墜馬落車傷腕折臂當歸炒桂心甘草炙蜀椒炒出汗各七錢半川芎兩半附子炮澤蘭炒各一兩右為末每用酒服二錢立效忌海藻菘菜生葱冷水等物洗心散治傷損瘀血凝滯大痛大便亦痛方見大方科積熱類黑神散治傷損大吐血或因酒食飽低頭􅀈損吐血至多竝血妄行鼻口俱出但聲未失無不效者百草霜蚌粉各等分右為末每一二錢糯米飲調下側栢枝研汁尤妙速鼻衂搐一字皮破灸瘡出血舌上出血並乾糁立止墜馬方細研銅末服之頓愈蘇合香丸治從髙墜下挾驚悸血氣錯亂昏迷不省急服大效方見大方科中氣類接骨散治打撲傷損折骨半兩古文錢不拘多少以鉄線貫之用鉄匣盛以炭火煆通紅椀盛好酒米醋各半升鐵冷開匣取錢於酒醋中淬盡澄去滴醋以温水淘洗如此三次淘洗數多尤妙火毒不盡令人患啞既浄焙乾研細入乳香没藥水蛭等分同為末毎服半字或一字生薑自然汁先調藥次用温酒浸過服若不傷折即時嘔出若損折則藥徑下如金絲如弓上筋神效初服忌酒三日刀斧棒杖傷禁聲飲子治棒杖刀斧傷疼痛不可忍者防風去蘆南星湯洗右剉散每服三大錢水酒各半盞生薑搥碎同煎通口服甚者不過三服立效龍骨膏治金瘡真龍骨海螵蛸五倍子赤石脂黄丹煆過或不用只使血竭尤佳石亭脂一方不用只用麝右斟酌或等分用如傷大先以冷鹽水洗浄却用黄桑生漿塗四圍待水乾皮歛即乾敷百發百中若小小傷只以冷鹽水略洗便敷此且絶妙甚奪香散治刀刃所傷及從髙墜下木石壓損瘀血凝積心腹疼痛大小便不通紅蛭用石灰慢火炒令乾黄色半兩大黄黒牽牛各二兩右為末每服二錢用熱酒調約人行四五里再用熱酒調牽牛末二錢催之須下惡血成塊以盡為愈單方治打撲傷金瘡悶絶右用蒲黄不以多少為末熱酒灌下取箭鏃灰牛散天水牛一个獨角者尤妙以小瓶盛之用碙砂一錢細研水少許化開浸天水牛自然成水右以藥水滴箭鏃傷處當自出神仙刀箭藥妙不可言右以桑葉隂乾為末乾貼如無旋熨乾貼之又方土狗數箇搗取汁滴上三五度箭頭自出治箭鏃入骨不可拔巴豆半粒羌蜋大者一箇去足趐右各去殻同㣲熬研勻塗傷處斯須痛定必㣲癢且忍之候不可忍便撼動拔之立出以黄連貫衆温湯洗了用牛膽製風化石灰傅之針灸傷内托黃耆圓治針灸傷經絡膿流不止黄耆八兩當歸三兩洗肉桂木香沉香乳香别研兩各一右為末用菉豆粉四兩薑汁煮糊圓梧桐子大每服五十圓不拘時候熱水下消煩四聖散治傷重煩悶欲死者用此打血利大小便花蕊石散黒神散二方見前大聖散蒲黄散以上二方並見婦人科當歸煨牛膝川芎米水炒白芷醋炒蘇木大黄各半兩蓮子肉酒煮半兩右為末和圓童子小便調服或木通湯亦可惡血立下傅藥活血散治打撲傷損手足右用菉豆粉新鉄銚内炒令真紫色新汲水調令成膏厚𫝊損處須教徧滿貼以紙花將杉木皮一片縳定其效如神治刀傷磕損血不止痛難禁用葱白一大握炒熟搗爛乗熱縳定痛與血隨止葱冷再易立效治傷損用生骨碎補研爛取汁以酒煎服滓傅傷處數日平復及被笞捶身無全膚用之大效治折骨傷筋痛不可忍生地黄一斤切藏𤓰糟薑一斤生薑四兩炒令勻熟以布裹罨傷處冷則易之竒效腫重加赤小豆半升地黃膏治打撲傷損臂臼脱出及一切癰腫未破令内消用生地黄研如膏木香為末以地黄攤紙上糁木香末一層又再攤地黄貼上明旦痛即止效單方治刀傷血出不止欲死用花蘂石散無效則用絶好降真香一片用瓷瓦片刮下石碾碾細傅之大效又方白滑石二兩黄丹五錢為末乾糁歛金瘡止疼痛右以劉寄奴為末糁之立效又方以門扉後塵傅之鉛粉散治手足折傷可服可敷半日後痛止手足堅牢立愈右以川當歸鉛粉各半兩鵬砂二錢同研細蘇木煎汁調化一大錢損若在上先喫淡粥却服損在下先服藥後食仍頻呷蘇木汁别作糯米飲拌和藥攤貼損處以絹帛裹之骨碎用竹木同夾甚妙白灰散治惡瘡刀斧傷見血白石灰末不以多少韭菜汁調陰乾為末少許傅上擦少時血止便安如腸潰出桑白皮線縫合罨之帛繫定效又方晚蚕沙生用為末掺勻綿裹之隨手瘡愈血止黃丹散治金瘡并一切惡瘡上等黄丹軟石膏不以多少火煆通紅右研細和勻如桃花色糁傷處甚妙又方胡孫頭草黄花子如蒺藜骨䤪者村人謂之草血竭以其能止血也用其子爛研或爛嚼傅傷處血立止又方黄蘖半斤半夏四兩右為末每用半兩生薑半兩生地黄取自然汁調塗攧處如折斷用絹帛封縳次用杉木皮扎定乾則頻上薑地黄汁潤又方治金刃或打傷及碎首血出不止降真香五倍子鏡面上削下銅青各等分為末傅傷處效又方治刀斧傷隔年四月苧麻揉令極軟覆在傷處縳定血止用野苧葉亦可又方水龍骨即船上多年油灰為末傅傷處用帛片扎定皮裂開以桑白皮線縫合用蘇木五倍子末封之又方治傷至重但不得透膜者海味中鹹白鰾揀大片色白而有紅絲者成片鋪在傷處以帛子扎之血止如膏脂出不傷内膜者即剃去傷人頂心髪以熱熨斗不令其知於新剃頂上一燙膏脂即入以桑白皮線縫合用血竭草木臘葉磁石為末乾𫝊瘡上即合又方五月五日採馬鞭草缺盆草血見愁即草血竭擂爛同風化石灰為末塗之即愈治血聚皮不破方蘿蔔葉研細罨傷處以帛縛之滅㾗方治打撲有痕傷瘀血流注半夏為末調塗傷處一宿不見痕又方治瘀血流注紫黒或傷眼上血紫黒大黄為末用薑汁調塗一夜一次上藥一宿黒者紫二宿紫者即白矣洗方荆葉散治從髙墜下及一切傷折筋骨瘀血結痛頑荆葉兩半蔓荆子白芷細辛去苗防風去蘆桂心川芎丁皮羌活各一兩右為末每用一两鹽半匙連根葱白五莖漿水五升煎五七沸去滓通手淋洗痛處冷即再換宜避風破傷風玉真散治風自諸瘡口入為破傷風强項牙闗𦂳欲死者防風去蘆天南星湯泡各等分右為末每服三錢童子小便一大盞煎熱服香膠散治破傷風口噤强直魚膠澆十分留性麝香少許右研勻每服二錢酒調不飲米飲下一方蘇木煎酒下急風散治久新諸瘡被傷中風項强背直腰反折口噤不語手足抽掣眼目上視喉中鋸聲及取箭頭麝香研丹砂一两生黒豆一分同草烏為末草烏三兩半生用半燒存米泔同淬右為末和勻破傷風以酒一盞調半錢服神效如出箭頭先用酒一盞調服半錢却以藥貼箭瘡上破傷濕牡蠣散治破傷濕口噤强直牡蠣取末粉𫝊瘡口仍以末二錢煎甘草湯調下舒筋法舒筋法治破傷後筋變縮不能伸他病筋縮亦可用大竹管長尺餘鑽一竅繫以繩掛于腰間平坐貼舉足搓衮之勿計工程久當有效退腫蒼术散治打撲損傷皮不破浮腫者及角血用此退之紫金皮蒼术猪牙皂角鹽醋炒雞脚風葉骨碎補各等分右為末糊水調糊腫處紫金皮散治一切打撲損傷金刃箭鏃浮腫用此效紫金皮醋炒天南星半夏黄柏鹽炒草烏炮川烏川芎茶水炒川當歸煨杜當歸烏藥川白芷鹽水炒破故紙劉寄奴川牛膝桑白皮各等分右為末生薑薄荷汁兼水調糊腫處或傷處皮熱甚加黄柏皮生地黄五錢有瘡口者勿封其口四畔用此糊之麻藥草烏散治損傷骨節不歸窠者用此麻之然後用手整頓猪牙皂角木鼈子紫金皮白芷半夏烏藥川芎杜當歸川烏各五兩舶上茴香坐拏酒煎熱草烏各一兩木香三錢傷重刺痛手近不得者更加坐拏草烏各五錢及曼它羅花五錢入藥右並無煆製為末諸骨碎骨折出臼者每服二錢好紅酒調下麻到不識痛處或用刀割開或用剪去骨鋒者以手整頓骨節歸元端正用夾夾定然後醫治或箭鏃入骨不出亦可用此麻之或用鉄鉗拽出或用鑿鑿開取出後用鹽湯或鹽水與服立醒合瘡口松皮散治金刃箭鏃傅瘡口兼能生肉老龍皮二分末生石灰取古壙者用瓦盛上用瓦盖炭火四畔上下煉一夜至曉取研細右為末傅之止血收瘡口立效又方合瘡口黄丹白滑石研細傅之又方黄連木香檳榔為末傅之又方降真香牛膝石灰人骨醋炒真龍骨老松皮各一兩右用黄牛膽一枚將小竹管挿膽中以石灰末從管中入膽内掛髙處日乾要用刀破開同諸藥為末傅瘡肚中不痛自愈太乙膏治金瘡箭鏃不問輕重用此傅之并治癰疽癤毒白芷乳香火製沒藥蒼术白膠香石膏醋炒黄丹各五錢右為末用真清油四兩桐油真者亦可以黄蠟一兩先煎油栁枝攪次入白芷等四味煎少頃却入膠香石膏得同煎試欲成珠却入蠟同煎片時用生布濾過瓦器収藏用油單攤之損傷𫝊瘡口自然肉不痛速愈止血收瘡口方藏血用此瘡大者以燈心蘸入孔中白膠香老松皮白芷龍骨血竭各一兩右為末傅之又方土朱二兩用瓦盛瓦上火煉一日人骨火煉者老松皮龍骨各等分右為末傅之妙又方雞内金焙為末傅之立止乳香膏老金瘡杖瘡神效乳香七錢没藥七錢白芷當歸羌活獨活川牛膝川芎自然銅石膏劉寄奴黒牽牛黄栢皮破故紙白膠香生地黄熟地黄赤芍藥白芍藥黄丹紫金皮各五錢黄蠟一兩右為末用真清油四兩煎沸却入藥同煎留膠香黄蠟黄丹末入用栁枝不住手攪試將欲成膏却入三味更試成膏生布濾淨用瓦器盛水傾在水中用油單攤開貼傅瘡口孔深者撚成膏條穿入孔中不問淺深放瘡上作熱加輕粉梅花腦子朴硝入膏内貼又留可再用瓦下盛須封裹斷筋小香膠散白膠香末傅之又方金沸草根擂汁塗筋封之可相續止痛乳香散治打撲傷損痛不可忍者白术炒當歸炒粉草川白芷沒藥另研交趾桂明乳香另研右為末入别研藥令服二錢酒調不以時服應痛圓治折傷後為四氣所侵手足疼痛生蒼术半斤破故紙半斤半生半炒舶上茴香六兩炒骨碎補半斤去毛穿山甲去腹桑灰炒脹為度柴炙亦可生草烏半斤剉如麥大右用草烏半斤用生薑一斤連皮生薑一斤擂爛草烏一處淹兩宿焙乾連前藥同焙為末酒煮下糊圓梧桐子大每服五十丸酒或米飲下忌熱物片時麻無妨止痛圓止痛清心行氣活血如神草烏去皮生用乳香火熨沒藥火熨五靈脂各三兩生麝香炒右為末酒糊丸如指頭大朱砂五錢研為衣每服用薄荷生薑研汁磨化痛止世醫得效方卷十八
