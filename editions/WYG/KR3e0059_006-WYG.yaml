半細研用水浸濾去皮取濃汁脂麻半盞㣲炒研用水浸取濃汁桃仁湯洗去皮麩炒黄研如泥荆芥穗搗末兩各一右用前藥入塩少許同煎可以當茶飲之以利為度葱白散治老人大便不通葱白二莖阿膠一片右以水煎葱候熟不用却入阿膠溶開温服胃氣散治老人胃寒氣怯大便反秘毎服五十丸米飲空腹下未效生薑自然汁著熱水少許吞下方見霍亂類黄耆湯治年髙老人大便秘澁綿黄耆陳皮去白兩各半右為末毎服三錢用大麻仁一合爛研以水投取漿水一盞濾去滓於銀石器内煎候有乳起即入白蜜一大匙再煎令沸調藥末空心食前服秘甚者不過兩服愈常服即無秘澁之患此藥不冷不燥其效如神熱秘神功圓治氣壅風盛大便秘澁後重疼痛煩悶此藥當量虚實加减大黄四兩煨蒸皆可人參二兩訶子皮四兩麻仁二兩另研右為末煉蜜丸如梧子大毎服二十丸温湯酒米飲任意下食後臨卧服㯽榔圓治大腸實熱氣壅不通心腹脹滿大便秘結㯽榔大黄蒸麻子仁炒去殻别研枳實麩炒羌活去蘆杏仁去皮尖炒牽牛炒白芷黄芩各一兩人參半兩右為末煉蜜丸如梧子大毎服四十丸空心熟水下四順清涼飲治同上毎服三錢水一盞半燈心十莖枳殻十片去穰煎立效方見積熱類小三黄圓治熱証大便秘結毎服三十圓温水下方見積熱類小柴胡湯治傷寒陽結能食而大便不下方見傷寒陽証類濕秘㯽榔散治腸胃有濕大便秘澁㯽榔不拘多少右為末毎服二錢用蜜湯㸃服不以時候香蘇散多加枳殻㯽榔亦效方見傷寒和解類通治甘遂散治大小便不通右以甘遂二兩赤皮者為末煉蜜二合和勻毎一兩重分作四服日進一服蜜水下未知日二脈漸加之又方葵子末三合青竹葉一把水一升煑五沸頓服又方葵子末三合水一升煑去滓分作二服猪脂二兩空心服又方治大小便闗格不通經三五日者用不蛀皂角燒灰米湯調下即通又方猪脂二兩水一升煑三沸飲汁立通八正散治同上方見積熱類推車散治大小便秘經月欲死者推車客七个土狗七个如男子病推車客用頭土狗用身如女子病土狗用頭推車客用身右新瓦土焙乾為末用虎目樹皮向南者濃煎汁調只一服經驗如神又掩臍法治大小便不通用連根葱一莖帶土不洗以生薑一塊淡䜴二十一粒塩二匙同研爛掲餅烘熱掩臍中以帛札定良久氣透自通不然再換壹劑通治大便不通大潤腸圓大便秘澁通用杏仁去皮尖微炒枳殻浸去穰麻仁陳皮各半兩阿膠炒防風各二錢半右為末煉蜜丸梧桐子大毎服五十丸老者蘇子煎湯下壯者荆芥泡湯下獨棗湯治大便積日不通大好􅀥一枚擘開入輕粉半錢右以􅀥相合麻線扎縛慢火煑熟嚼細以􅀥汁送下敷藥治閉結至亟昏不知人生大螺一二枚以塩一匙和殻生搗碎置病者臍下一寸三分用寛帛𦂳繋之即大通未效烏桕木根三寸研井水服亦效就多研爛敷臍下亦可蜜兊法蜜三合入猪膽汁兩枚在内煎如飴以井水出冷候凝撚如指大長三寸許納下部立通活人書單用蜜一法入皂角末在人斟酌用一法入薄荷末代皂角用尤好又或偶無蜜只嚼薄荷以津液調作挺用之亦妙煨蒜方獨頭蒜煨熟去皮以綿裹納後部自通熏方不蛀皂角用碗燒置於桶内其後部自通老人臟腑秘不可用大黄老人津液少所以臟腑秘澁更服大黄以㵼之津液皆去定須再秘甚於前只可服寛潤大腸之藥更用槐花煎湯淋洗亦效更有老人發熱而大腑秘澁或因多服丹藥脾胃虚弱煑化不行遂為臟腑積熱須用神保圓得通㵼一行熱亦即退脹滿風寒暑濕脹大正氣散治脾胃怯風寒濕氣傷動冲和心腹脹滿有妨飲食厚朴薑製炒藿香葉半夏橘紅白术各一兩甘草炙㯽榔桂枝不見尖枳殻去穰麩炒乾薑炮各半兩右剉散毎服四錢水一盞半生薑五片􅀥子二枚煎至七分去滓不以時温服疏順飲子治喜怒不節肝氣不平邪乘脾胃心腹脹滿連兩脇妨悶頭暈嘔逆脈來浮弦防風去蘆桂枝不見火枳殻去穰炒赤芍藥桔梗去蘆炒各一兩木香不見火人參㯽榔當歸去蘆酒浸川芎橘紅甘草炙各半兩右剉散毎服四錢水一盞薑五片煎七分不拘時温服五膈寛中散治七氣流滯飲食不下氣滿膨脹方見五膈類木香流氣飲調榮衛利三焦行痞滯消脹滿方見諸氣類附子粳米湯治憂怒相乘神志不守思慮兼并擾亂臟氣不主傳使諸陽不舒反順為逆中寒氣脹腸鳴腹痛胸脇逆滿嘔吐不食附子一个去生皮臍虚人畧炮半夏湯洗七次粳米各三錢甘草炙錢半一乾薑一分去皮右剉毎服二錢水一盞棗三个煎至七分去滓食前服温胃湯治憂思聚結脾肺氣凝陽不能正大腸與胃氣不平脹滿衝欬食不得下脈虚而𦂳濇附子炮去皮劑當歸厚朴去麄皮生用人參橘皮白芍藥甘草炙各一兩乾薑一兩一分川椒炒出汗去合口者三分右剉散毎服四大錢水二盞煎七分去滓食前服沉香降氣湯治中脘脹滿時復脇肚痛楚毎噫則覺氣快氣不噫則悶漸覺面浮磨㯽榔入紫蘇同煎下神丸五七圓二方並見諸氣類糓脹大異香散治失飢傷飽痞悶停酸早食暮不能食名糓脹京三稜蓬术青皮陳皮半夏麯藿香北梗益智仁枳殻製香附子炒半兩各甘草炙分三右剉散毎服三錢水盞半薑五片􅀥二枚煎服蓽澄茄圓治痞滿脹痛糓脹氣脹通用蓽澄茄白豆蔲仁縮砂仁青皮蘿蔔子木香各二分肉豆蔲煨茴香炒辣桂丁香各一分半陳皮三分右為末麫煑稀糊丸梧桐子大毎服三十丸陳皮湯下水脹大半夏湯治脾土受濕不能制水水漬於腸胃溢於皮膚漉漉有聲怔忪喘息名水脹半夏湯洗陳皮茯苓桔梗㯽榔甘草各等分右剉散毎服三錢水一盞半薑三片煎温服青木香圓治同上方見諸疝類血脹人參芎歸湯治煩燥嗽水迷忘驚狂痛悶喘惡虚汗厥逆小便多大便黑名血脹當歸半夏製同上三分川芎一兩蓬术煨木香縮砂仁烏藥甘草炙各半兩人參辣桂去麄皮五靈脂炒一分各右剉散毎服三錢薑五片􅀥二枚紫蘇四葉煎食前服熱脹七物厚朴湯治腹滿發熱以陽并隂則陽實隂虚陽盛生外熱隂虚生内熱脈必浮數浮則為虚數則為熱隂虛不能宣導飲食如故致脹滿者為熱脹厚朴薑汁炒一兩甘草炙大黄蒸各三力三字枳實麩炒去穰半兩桂心一分右剉散毎服四錢水盞半生薑七片􅀥三枚煎至七分食煎服嘔加半夏利者去大黄寒多則加生薑十片煎推氣圓治三焦痞塞氣不升降胸膈脹滿大便秘澁小便赤少並宜服之大黄陳皮㯽榔枳殻小者去穰黄苓黑牽牛生用分各等右為蜜丸如梧桐子大毎服五七十丸臨卧以温然水下更量虚實加减寒脹朴附湯治老人虚人中寒下虚心腹膨脹不喜飲食脈來浮遲而弱此名寒脹附子炮去皮臍厚朴薑製炒右等分剉散毎服四錢水二盞生薑七片紅􅀥二枚煎至八分去滓温服不拘時候加少木香尤佳順氣木香散治氣不升降嘔逆惡心胸膈痞悶脇肋脹滿及酒食所傷噎氣吞酸心脾刺痛大便不調面色痿黄肌肉消痩不思飲食兼婦人血氣刺痛及一切冷氣並治之丁香不見火縮砂仁良薑去蘆肉桂去麄皮乾薑炮甘草炙陳皮去白厚朴去麄皮薑汁炙蒼术米泔浸炒桔梗去蘆茴香炒三兩各右剉毎服二錢水一盞生薑三片棗二枚煎至八分稍熱不拘時或入塩少許沸湯㸃服寛中順氣和胃進食食脹強中湯治脾胃不和食啖生冷過飲寒漿多致腹脹心下痞滿有妨飲食甚則腹痛乾薑炮去土白术各一兩青皮去白橘紅人參附子炮去皮臍厚朴薑製甘草炙各半兩草果仁丁香各三兩右剉散毎服四錢水一盞半生薑五片大棗二枚煎至七分去滓温服不拘時嘔者加半夏半兩或食麫致脹滿加蘿蔔子半兩温中散治虚人老人喜啖生冷多致腹脹心下痞滿有妨飲食或刺痛洩利氣痞滯悶厚朴去皮細剉甘草細剉青州􅀥生薑洗切右以厚朴甘草搗令得所方入生薑再杵令勻取出同棗焙令浥浥微燥却入鍋内慢火炒至紫色再焙乾為末毎服一大錢擦生薑少許沸湯㸃空腹以和為度氣味甚美兼能愈疾又易修合桂香圓治大人小兒過食雜果腹脹氣急肉桂不見火一兩麝香另研右為末飯丸如菉豆大大人十五圓小兒七圓不拘時熟水送下未痊再服獨聖散治脾胃不足過食𤓰菓心腹堅脹痛悶不安塩五合右用水一升煎消頓服自吐下即定或因食麥令人腹脹暖酒和薑汁飲一兩盃即消感應圓治積食停滯脾胃作脹方見秘澁類北亭圓治禀受怯弱脾胃易傷因此積聚中脘脹滿心腹堅硬㽲痛攻衝牽引小腹如蠱之狀方見虚損類温中圓治心腹積聚九癥癖塊腹脹心下堅結大如杯椀傍攻兩脇心痛積年食不消化吴茱茰湯洗七次焙炒桔梗柴胡去蘆菖蒲紫苑黄連去鬚乾薑炮肉桂去麄皮茯苓去皮蜀椒去目及閉口者炒出汗人參去蘆厚朴去麄皮薑汁製巴豆去皮心膜出油炒研已上各半兩川烏炮去皮臍二兩半皂莢去皮子炙半兩右為末入巴豆令勻煉蜜圓如梧子大毎服三十丸紫蘇湯下取下積滯如魚腦爛綿而安鼔脹嘉禾散四柱散治脾胃虚憊腹脹如綳鼔氣宇喘促食後愈甚方見脾胃類四柱散方見泄㵼類厚朴橘皮煎治傷冷溏下腹肚䐜脹其狀如覆栲栳喘息奔急鼻張口呿氣上下不得分泄厚朴去麄皮薑製三兩枳殻麩炒乾薑炮良薑切各一兩二錢青皮去白陳皮去白肉桂去麄皮全蝎去尾足毒斟酌分兩右為末醋糊圓如梧子大毎服三十丸生薑橘皮湯吞下或紫蘇湯下三稜煎圓青木香圓治心腹堅脹喘滿短氣𦂳促噫氣不通飲食不消或嘔逆吐痰或腸中水聲大便或秘或泄二藥合和毎服三十圓食後米飲下方見諸氣諸疝類四炒枳殻圓主腹脹鼓疾枳殻去穰四兩右分作四分毎分一兩一分用剉散碎蒼术一兩同炒一分用蘿蔔子一合同炒一分用乾漆一兩同炒一分用茴香一兩同炒各以枳殻黄為度只取枳殻一味為末却將蒼术等四味用水二椀煑至一椀半去滓取汁煑麫糊為丸如梧桐子大毎服五十丸食後米飲下氣針圓専治氣膨全蝎去毒并足木香丁香不見火胡椒肉豆蔲煨各一兩片子薑黄青皮去白兩各二右為末用蘿蔔子炒净退殻取仁四兩爛研和藥令勻紅酒生薑汁各少許煑糊丸如梧子大毎服四五十圓紫蘇陳皮湯下不以時候丁沉透膈湯治氣滿不食腹中膨脹刺痛方見脾胃類導氣圓治諸痞塞闗格不通腹脹如鼓大便結秘等証又腎氣小腸氣等功效尤速青皮水蛭等分同炒赤去水蛭蓬莪术䖟虫等分同炒去䖟虫胡椒茴香炒去茴香三稜乾漆炒去乾漆茱茰牽牛炒去牽牛赤芍川椒炒去川椒石菖蒲桃仁炒去桃仁㯽榔斑猫炒去斑猫乾薑碙砂炒去碙砂附子靑塩炒去塩右各剉碎與所註藥炒熟去水蛭等不用秪以青皮等十味為末酒糊丸如梧子大毎服五十丸加至七十圓空心紫蘇湯吞下熨法治腹脹𦂳如鼓澁如木皮様杜烏藥荆芥蒼术菵草山茵陳夏蚕沙松毛樟根葉北蒜螃蚍葉橘葉椒目烏豆赤豆藠各等分右剉細分作二次炒熟以布袋盛熨腫處冷又炒熨三四十度或後用煎水熏洗或服神保圓㣲溏泄去其氣敷藥治腹𦂳硬如石或隂囊腫大先用熱水嚼甘草後用大㦸芫花甘遂海藻各等分右為末醋調塗或用白麫和藥調一片覆肚上通治沉香飲治腹脹氣喘坐卧不得沉香木香枳殻各半兩蘿蔔子炒右剉散毎服三錢水一盞半生薑三片煎七分温服㯽榔治脾虚腹脹不進飲食快氣寛中蘿蔔子炒㯽榔煨黒牽牛炒木香各半兩右末水煑麫糊圓梧桐子大毎服三十圓薑湯食前下灸法脹滿水腫灸法腧隨年壯穴在第十一椎下兩傍各去一寸半胸滿心腹積聚痞痛灸肝腧百壯穴在第九椎下兩傍各去一寸半腹脹滿繞臍結痛堅不能食灸中守穴百壯在臍上一寸一名水分胸滿瘕聚滯下冷疼灸氣海十壯穴在臍下一寸五分腸中膨脹不消灸大腸腧四十九壯穴在第十六椎下兩傍各一寸半腸中雷鳴相逐痢下灸承滿五十壯穴在俠巨闕相去五寸巨闕在心下一寸灸之者俠巨闕兩邊各二寸半五臟六腑心腹滿腰背疼飲食吐逆寒熱往來小便不利羸瘦少氣炙三焦腧隨年壯穴在十三椎下兩傍各一寸半世醫得效方卷六
