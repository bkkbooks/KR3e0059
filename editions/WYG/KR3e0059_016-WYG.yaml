body:
  text: 世醫得效方卷十六元危亦林撰眼科總論人有雙眸如天之有兩曜乃一身之至寶聚五臟之精華其五輪者應五行八廓者象八卦凡所患者或因生食五辛多啖炙􅏼熱飡麫食飲酒不已房室無節極目逺視數看日月頻視星火夜讀細書月下觀書抄寫多年彫鏤細作博奕不休久處煙火泣淚過多刺頭出血多若此者俱喪明之本復有馳騁田獵衝冐塵沙日夜不息者亦傷目之媒又於少壯之時不自保惜逮至四十以漸昏蒙故善衛養者纔至中年無事常須瞑目勿使他視非有要事忽宜輙開則雖老而視不衰大扺榮衛順則斯疾無由而生榮衛衰則致病多矣且傷風冷則淚出虚煩則昏䝉勞力則眥赤白腫則脾家受毒生瘡則風熱侵肺黄乃酒傷於脾血灌瞳人及赤色俱是心家有熱羞明見紅花為午令黑花則腎虚青花膽有寒五色花為腎虚兼熱不可一槩為治若虚不補而實不㵼亦難收效然上虚乃肝虚下虚乃腎虚肝虚則頭暈耳聾目眩腎虚則虚壅生花耳作蟬鳴大宜補肝益腎其有熱淚交流兩臉赤痛乃肝之極熱迎風有淚為腎虚客熱涼肝㵼腎必得其宜至於五臟各以類推虚則生寒實則生熱補㵼之用須在叅詳毫釐之差千里之謬餘則無非有所觸動或大病之後所患不一至如暴赤一證多因泛熱衝上或眠食失時飽食近火得之加以勞役失於調攝過食毒物變成惡證醫者不原本始但知暴赤屬陽或以散血之劑或以涼心之藥縱使退散遂致脾經受寒飲食不進頭目虚浮五臟既虚因成内障亦有見其不進飲食俾更服熱藥遂致三焦暴燥熱氣上攻昏澁眵淚或犯盛怒辛苦重勞遂生弩肉心氣不寧風熱交併變為攀睛證狀不一是為外障又若讀書博奕等過度而致疾者名曰肝勞不可但投以治肝之劑及作他證治之卒於莫效惟須閉目珍䕶不極逺視庻乎可瘳若夫患風疹者必多眼暗先攻其風則暗自去婦人胎前産后用藥亦須避忌小兒所患切宜慎治惟畧加淋洗披䥥針炙端不可施猶須戒其用手頻揉或因兹睛破至於莫救以上諸證專是科者宜留意焉五輪之圖風輪病因喜怒不常作勞用心晝凝視逺物夜勤讀細書眼力既勞風輪内損其候􅗃頭尤澁睛内偏疼視物不明胞胘緊急宜去風藥血輪病因憂愁思慮悲喜煩勞内動於心外攻於目其候赤筋纒眥白障侵睛胞腫難開昏暮多澁日久不治失明愈深宜洗心涼血藥肉輪病因多飡熱物好喫五辛逺道奔馳駐睛驟騎食飽耽眠積風痰壅其候胞胘赤腫暴赤昏䝉眼淚常盈倒睫澁痛瘀血侵睛宜服醒脾藥氣輪病因淩寒冐暑吸飲寒漿肌體虚疎寒邪入内或痛或昏傳在白睛筋多腫赤視日如隔霧觀物生煙日久不治變成白膜黑暗難開水輪病因勞役不止嗜慾無厭大驚傷神大怒傷志加之多食酒麫好啖鹹辛因動腎經通於黑水冷淚鎮流於臉上飛蠅相趂於睛前積聚風虚或澁或痒結成翳障多暗多昏宜補腎藥天廓病因雲中射鴈月下看書多食腥膻侵冐寒者致目廓有病内動視物生煙􅗃疼難開不能辦認地廓病因濕漬頭上冷灌睛眸致令有病眼眩緊急瘀血生瘡火廓病因心神恐怖赤脉侵􅗃血灌瞳人熱淚如傾其證瞼頭紅肺睛内偏疼熱淚難開水廓病因大勞努力争鬬擊棒開弓驟騎强力致令生病常多暗二睛眩淚多風廓病因枕邊牕穴有風不能遮閉坐卧當之腦中邪風攻於風廓以致黒睛多痒兩瞼常爛或昏多淚雷廓病因失枕睡卧酒後行房血脉溢滿精宣閉滯風虚内聚上攻故令眥頭赤腫瞼内生瘡倒睫拳毛遮睛山廓病因撞刺磕損致令肉生兩瞼翳閉雙睛若不早治永沉昏暗瘀血侵睛澤廓病因春不宣解冬聚陽毒多喫脂肥過飱熱物致令腦脂凝聚血淚攻潮有如霧籠復見飛蜂繚繞黑花常滿難於瞻視七十二證方内障圓翳第一圓翳者黑珠上一㸃圓日中見之差小隂處見之則大或明或暗視物不明醫者不曉以冷藥治之轉見黑花此因肝腎氣虚而得也宜服後藥地黄湯熟地黄白茯苓去皮家菊細辛各半兩芍藥三分柏子仁一分甘草半錢炙防風一分北柴胡一兩去蕾右剉散每服三錢水一盞半煎食后服補腎圓巴㦸去心山藥破故紙炒茴香牡丹皮各半兩肉蓯蓉一兩酒浸枸把子一兩青鹽一分后入右為末煉蜜圓梧桐子大每服三十圓空心鹽湯下冰翳第二冰翳者如冰凍堅實傍觀目透於瞳人内隂處及日中看之其形一同疼而淚出此因膽氣盛遂使攻於肝而得之宜服後藥通肝散山梔子蒺蔾炒去尖枳殻去白荆芥各半兩車前子牛蒡子各一分炒甘草五錢炙右為末毎服二錢苦竹葉湯調食後服滑翳第三滑翳有如水銀珠子但微含黄色不疼不痛無淚遮繞澁翳第四澁翳微如赤色或聚或開兩傍微光瞳人上如凝脂色時復澁痛而旡淚出散翳第五散翳形如鱗㸃或瞼下起粟子而爛日夜痛楚瞳仁最疼常下熱淚前件三訂並是肝肺相傳停留風熱宜服八味還睛散白蒺蔾炒尖去防風粉草炙木賊山梔炒去設各半兩草决明一兩炒青箱子一分微炒蟬退一分右為末麥門冬去心煎湯食後調下横開翳第六此證上横如劔脊下靣微白甚薄不赤不痛病此希少浮翳第七此疾上如水光白色環遶瞳人初生自小􅗃頭至黑珠上不痛不痒無血色相潮沉翳第八此病白藏在黑水下向日細視方見其白或兩眼相傳疼痛則早輕夜重間或出淚偃月翳第九此疾膜如凝脂一邊厚一邊薄如缺月其色光白無瑕疵前件諸證並不可治皆是宿生注受當有此病縱强用藥終無安日􅀥花翳第十此候周回如鋸齒四五枚相合赤色刺痛如針視物如煙夜輕而晝則痛楚迎風多淚昏暗不見白翳黄心十一此候四邊皆白但中心一㸃黄大小􅗃頭微赤時下澁淚員團在黑珠上前件亦是肝肺相傳停留風熱宜服前還睛散后墜其風熱黑花翳十二此候其狀青色大小􅗃頭澁痛頻頻下淚口苦不喜飲食蓋膽受風寒宜服涼膽丸黄連洗見火不荆芥黄芩草龍膽各半兩蘆薈防風各一兩黄柏去皮地膚子一分右為末蜜圓梧桐子大毎服三十丸薄荷湯下胎患十三此候初生二三歲觀物則近看轉睛不快至四五歲瞳人潔白昏蒙不見延至年高無藥可治蓋胎中受熱致損其目莫能治之五風變十四五色變為内障其候顔色相間頭疼甚却無淚出兼毒風腦熱所致日中如坐暗室常自憂歎雷頭風十五此候熱毒之氣衝入眼睛中年牽引瞳人或微或大或小或視全不見驚振十六此候因病目再被撞打變成内障日夜疼痛淹淹障子赤膜遶目不能視三光亦如久病内障前件四證設有患者俱不可治所謂針刀難下手藥力並無功若强治之不過還睛散然終難愈綠風十七此病初患則頭旋兩額角相牽瞳人連鼻鬲皆痛或時紅白花起或先左而後右或先右後左或兩眼同發或吐逆乃肺之病肝受熱則先左肺受熱則先右肝肺同病則齊發先服羚羊角散後服還睛散方見前羚羊角散家菊防風川芎羌活車前子川烏炮去皮尖各半兩半夏泡羚羊角薄荷葉各一分細辛一兩右剉散生薑煎或為末食後荆芥茶清調下鳥風十八此眼雖痒痛而頭不旋但漸漸昏暗如物遮定全無翳障或時生花此肝有實熱宜服㵼肝散郁李仁荆芥各一分甘草炙大黄各半兩右剉散每服三錢水一盞半煎食後温服黑風十九此眼與綠風候相似但時時黑花起乃腎受風邪熱攻於眼宜涼腎青風二十此眼不痛不痒瞳人儼然如不患者但微有頭旋及見生花或勞則轉加昏䝉前件二證宜服還睛散方見前肝虚雀目二十一雀目者肝臟虚勞時時花起或時頭疼年深則雙目盲小兒患者因疳得之高風雀目二十二雀目二證病狀雖同中有異處蓋高風纔至黄昏便不見經年瞳子如金色所謂黄風者即此也前件二證均不可治肝虚目暗二十三此病逺視不明眼前花子頻起􅗃目皆赤痛有時看一成二此乃肝虚宜服補肝散稍稍加涼劑與之方見前外障肝臟積熱二十四眼先患赤痛腫疼痛自淚澁難開忽生翳膜腫或初患一目不見以致兩目齊患此因作勞用力肝膈熱勞宜服大决明散石决明一兩炒草决明炒羌活山梔子各半兩木賊五錢大黄煨荆芥各一分青箱子炒芍藥各半錢右為末毎服二錢麥門冬去心煎湯調食後服傷寒熱病後目昏二十五傷寒病安後眼目疼痛紅腫或食毒物過多壅熱上衝熱淚交流澁痛難開兼生翳膜宜服前决明㪚后春雪膏㸃之混睛二十六此候白睛先赤而後痒痛迎風有淚閉澁難開或時無事不久又發年深則睛變成碧色滿目如凝脂赤路横赤如絲此毒風積熱宜服地黄散生地黄一兩芍藥半兩土當歸半錢甘草右剉㪚毎服三錢水一盞半煎食后溫服弩肉攀睛二十七此證或先赤爛多年肝經為風熱所衝而成或用力作勞有傷肝氣而得或痒或痛自兩􅗃頭努出心氣不寧憂慮不已遂乃攀睛或起筋膜宜服二黄散黄芩大黄防風薄荷各半兩右剉散毎服三錢水一盞半蜜少許煎食后臨睡温服定心圓石菖蒲甘菊枸把子各半兩辰砂二錢逺志一分去心麥門冬一兩去心右為末蜜圓梧桐子大毎服三十圓食后熟水下兩瞼粘睛二十八此乃爛胘風是也雙目赤爛粘滯經年不安或痒或痛宜服消風㪚桑白皮煎湯調下方見風科熱證類仍用驅風湯洗膜入水輪二十九此因黑珠上生瘡稍安其痕疤不没侵入水輪雖光未絶終亦難治釘翳根深三十此因心肝滯留偏熱致使眼疼痛生翳膜經久其色如銀釘釘入黑睛此證不可治黑翳如珠三十一此起在黑水上如小黑豆疼痛而淚出不可用㸃藥此乃腎虚受風熱而得之宜先服羚羊角散後服補腎圓方見前花翳白䧟三十二此白翳旋遶瞳仁㸃㸃如花白鱗砌者乃因肝肺伏藏積熱又喫熱物因而得之宜膏藥㸃後服前羚羊角散水瑕深翳三十三此乃黒水内横深瑕盤青色沉沉深入痛楚無時蓋五臟俱受風熱宜服二荆散蔓荆子荆芥苦竹葉甘草各半兩山梔子一分去皮右剉散毎服三錢水一盞半薄荷七葉煎温服玉翳浮滿三十四此證黑珠上浮玉色不疼不痛翳根不紅不宜針割但服前還睛㪚磨翳膏㸃之即愈方見後因他病後生翳三十五眼内他病得時漸漸不見初則微生翳膜後則遍睛俱白患此者無可治矣順逆生翳三十六翳自上而生下者為逆自下生上者為順逆則難治順則易安宜用㸃藥磨翳膏空青二錢片腦三錢蕤仁一兩口含去皮殻右於乳鉢内研合盛旋㸃之鷄􅃣蜆肉三十七翳生在瞼内如鷄􅃣蜆肉或青或黒須飜出看之阻礙痛楚怕日羞明蓋脾經先受熱后有所傳宜服决明㪚瞼生風粟三十八兩瞼上下初生如粟米夫漸漸大如米粒或赤或白不甚疼痛堅硬者蓋肝壅瘀血所成宜服大黄散大黄半兩煨牛旁子一分炒甘草一分荆芥半兩右剉散毎服三錢水一盞半煎食後温服胞肉膠凝三十九眼胞皮肉有似膠凝腫高如桃李者時時出熱淚乃風毒所注宜消風散及花草膏㸃之方見風利熱證類及見后漏睛膿出四十􅗃頭結聚生瘡流出膿汁或如涎水粘睛上下不痛仍無翳膜此因心氣不寧并風熱停留在瞼中宜服白薇圓白薇半兩防風白蒺蔾去角炒石榴皮羌活右為末米粉糊圓如梧桐子大毎服二十圓白湯下蟹睛疼痛四十一此證如大豆出黒珠上疼痛不可忍又名損翳亦不可用㸃藥宜服前决明散突起睛高四十二風毒流注五臟不能消㪚忽然突起痒痛熱極所致宜服前瀉肝散風起喎偏四十三偏風牽引雙目喎斜淚出頻頻却無翳膜不痒不痛宜服消風散用荆芥湯下方見風利熱證類倒睫拳毛四十四此疾淚出涓涓翳膜漸生乍愈乍發多年不安眼皮漸急睫倒難開如刺刺様痛瞳人不安此乃脾受風熱先服㵼肝散後服五退散蟬退洗蛇退醋煑荆芥猪蹄退一分燒性存穿山甲燒性存川烏炮去皮粉草各半兩蚕退二錢半右為末鹽湯調下二錢風牽瞼出四十五上下瞼俱赤而或飜出一瞼在外此亦脾受風毒宜服前五退散若患年深瞼内俱赤則不可治之神祟疼痛四十六舊無根因忽然疼痛或如針刺或如火炙及太陽穴掣痛早輕晩重先宜求福却服决明散方見前旋螺尖起四十七目疼痛生翳膜尖起而赤似旋螺宜服前通肝散次服前决明散鶻眼凝睛四十八輪硬而不能轉側此為鶻眼凝睛此不可治轆轤轉闗四十九此乃睛藏上下瞼不能歸中所以言之為轆轤也其證亦難治然當且服後藥天門冬飲子天門冬茺蔚子知母各二兩五味子防風各一兩人參茯苓羌活各兩半右剉㪚毎服三錢水一盞煎食後服瀉肝散麥門冬去心二兩大黄黄芩細辛芒硝各一兩黑參桔梗各兩半右剉散毎服三錢水一盞煎食后服被物撞打五十目被撞打疼痛無時瞳人被驚昏暗濛濛眼眶停留瘀血用地黄膏貼去血次服前决明散地黄膏生地黄一合黄連一兩黄柏寒水石各半兩右地黄研自然汁和藥成餅子要用時以紙貼目上非但是撞打可用凡風熱赤目熱淚出等眼皆可用以其性涼能逐去熱毒耳撞刺生翳五十一因撞刺生翳疼痛無時經久不安者復被物撞之兼為風熱所攻轉加痛楚昏暗不見宜服經效散大黄當歸芍藥各半兩北柴胡一兩粉草連翹各一分犀角一錢后入右剉散毎服三錢水一盞煎食后服仍用后磨翳膏㸃之血灌瞳人五十二瞳人為血灌注其痛如錐刺皆無翳膜覩物不明者或因有損或由肝氣閉血無所歸而得宜引血歸肝通血圓生地黄焙赤芍藥各半兩川芎一兩甘草五錢防風荆芥當歸尾各一兩右為末煉蜜圓如彈子大食后荆芥薄荷茶嚼下血既散而歸肝又恐眼自生花須再用前還睛散服之眯目飛塵五十三塵埃飛揚入目粘睛不脫或被飛絲所侵或被沙石所苦疼痛引澁揩碎不開宜用後瞿麥㪚敷天行赤目五十四目忽然赤腫晨昏痛澁此天行時疾或長幼傳染不安雖因熱氣相傳方有輕重宜服前㵼肝散即安虚人則用后五行湯洗暴赤眼後忽生翳五十五此證輕則無妨重則疼痛而白睛紅花乃生翳膜者是五臟積熱宜先用前地黄膏次服前㵼肝散胎風赤爛五十六小兒初生下便有此證至三四歲雙目紅而肱邊赤爛曉復痒痛經年不安先服消風散桑白皮煎湯調下仍以后湯泡散洗風赤目疾五十七此症臉似朱砂塗而生瘡黑珠端然無所染此因風熱生於脾臟若經久不治則生翳膜宜服前五退散次湯泡散洗衝風淚出五十八風證至冬月極甚發作不休此因肺虚受風遇風冷發宜服白僵蠶散白僵蠶直者去絲觜炒粉草細辛各半兩旋覆花蒸熟焙半兩荆芥一分木賊半兩黄桑葉一兩嫩者右剉散毎服三錢水一盞半煎食後温服暴風客熱五十九眼為暴風熱所攻白睛起障覆黑珠瞼腫痒痛宜服前藥瞼硬睛疼六十瞼中紅赤而堅硬眼睛疼痛而淚出無時怕日羞明宜服前通肝散若有障膜用後春雲膏㸃之痛如針刺六十一睛忽然疼痛如針刺雙目根緊急坐卧不安此因熱毒在心服洗心散次服前還睛散方見大方科積熱類痒極難任六十二眼痒極甚瞳子連􅗃頭皆痒不能收瞼此因清浄腑先受風熱得之宜服消風一字散川烏半兩炮去皮尖羌活防風各一分川芎荆芥右為末毎服二錢食后薄荷湯調下起坐生花六十三凡起坐生花或覺頭旋而悶耳内蟬鳴此乃腎虚兼受客熱不節房事宜多服補腎圓瞳人乾缺六十四此證其睛乾澁全無淚液或白或黒始則疼痛后來稍定而黑不見此證不可治療黄膜上衝六十五黑睛從下生其黄膜上衝疼痛至甚閉澁難開此乃脾經受風食毒傷胃而得之宜服犀角飲犀角二兩黄芩半兩白附子一分炮去皮尖麥門冬一分去心車前子羌活各半兩右剉散毎服三錢水一盞半煎食后温服赤膜下垂六十六眼中有膜自上埀下遮黑睛或名埀簾膜望風淚出怕日羞明此乃客熱上衝用後明上膏㸃之次服前通肝㪚小􅗃赤脉六十七小􅗃中生赤脉漸漸衝眼急宜早治此蓋三焦積熱得之宜服前犀角飲兼戒忌辛酸熱毒等物及房事方安小兒通睛六十八嬰兒雙眼睛通者欲觀東邊則見西畔若振掉頭腦則睛方轉此肝受驚風宜服地黄膏牛黄一錢犀角二錢金銀箔各五片甘草一分二右為末蜜圓菉豆子大毎服七圓用薄荷湯吞下小兒斑瘡入眼六十九眼胞患斑瘡熱氣衝透睛中疼痛淚出翳如銀片腫澁難開宜服柴胡散柴胡黄芩芍藥各半兩甘草一分右剉散毎服三錢水一盞煎大人小兒加減服兼以藥墜洗之餘方見後小兒瞼中生贅七十眼瞼中生贅子初生如麻子大日漸如豆懸埀瞼内乃脾經風熱所攻宜加減服前五退散小兒疳眼七十一小兒疳眼初生則澁痒久而生瘡翳腫難開怕見光明時時出淚此因肝風所攻或因㵼痢後虚熱上衝不可㸃宜服前還睛㪚餘方見小方科諸疳類小兒青盲七十二胎中受風五臟不和嘔吐黄汁兩眼一同視物不明無方可治右七十二證方藥條陳于前毋謂其畧蓋眼科中用藥不可太繁或有好竒鳩撮衆藥合為一方不問虚實凉熱悉與服之羣隊争功豈知補㵼温涼之性各異其為害也不少可不戒之虚證三味磁朱圓丹砂之畏磁石猶火之畏水今合用之砂法火入心磁法水入腎心疾各得其養則目自然明蓋目疾多因脾胃有痰飲潰侵於肝久則昏眩神麯倍於二味用以建脾胃消痰飲極有方効神麯四兩辰砂一兩磁石二兩煅醋淬柴炊右為末煉蜜圓梧桐子大毎服五十圓食前米飲日進三服常服益眼力一方加夜明沙大補腎圓治腎氣不足眼目昏暗瞳人開縮漸成内障可服磁石煆醋淬染兎絲子酒蒸研各二兩五味子熟地黄枸把子楮實覆盆子蓯蓉車前子酒浸石斛去根兩各一沉香青鹽研各半兩右為末煉蜜圓梧桐子大毎七十圓空心食后鹽湯下養肝圓治肝血不足眼目昏花或生眵淚久視無力當歸酒浸車前子酒浸防風白芍藥蕤仁熟地黄川芎楮實各等分右為末煉蜜圓梧桐子大毎服七十圓不以時温水下錦鳩圓治肝經不足風邪内乘上攻眼暗淚出怕日羞明胞胘痒痛瞻視茫茫多見黑花或生翳膜並治之草决明子二兩牡礪取粉黄連去鬚杜蒺蔾炒去尖防風去蘆甘菊花倲浄肉桂去皮各五兩蕤仁羌活去蘆瞿麥各三兩蔓菁子二升淘洗絹袋盛飯上蒸一伏時取出晒乾白茯苓去皮四兩細辛去苗五兩羯羊肝一具批炙令焦斑鳩一隻去皮毛腸觜爪用文武火連骨炙乾右為末煉蜜和杵五百下圓如梧桐子大毎十五至二十圓空心温酒或得水下日午臨卧日三服如久患外障眼服諸藥未效者漸加服五十圓必效暴赤服疼痛食后用荆芥湯下二十圓駐景圓治肝腎俱虚眼常黒暗多見黒花或生障翳旋螺􅇠絲子酒浸炒取末五兩熟地黄洗蒸三兩車前子三兩右為末煉蜜圓梧桐子大每服五十圓空心温酒下青鹽圓巴㦸圓治並同上各見大方科虛損類錦鳩駐景青鹽巴㦸四件合和鹽湯吞下二三十圓久久服除昏花增目力大效花草膏治患眼腫痛澁痒昏淚羞明羯羊膽一枚飯上蒸熟右以冬蜜研和入朱砂末少許頻研成膏食后臨卧匙抄少許含嚥亦可㸃目椒目圓治久年眼生黒花不可耐者椒目炒一兩蒼术二兩炒右為末醋糊圓梧桐子大每服二十圓醋茶下十日可效黒神散治血壅赤腫臨卧酒調服方見産科産后類神效參附正氣散治男子婦人痛不生糞此便是元氣憊腎經虛夜間小便二三次耗傷陽氣致生内障腦中有風致鼻流清涕或腦脂流下或瞳人開散此皆腎憊黑水㪚也加炮附子枸把子去生炒揀菊花蘃生姜紅棗煎食前空心服仍以錦鳩青鹽山藥八味等圓對和食前温酒服及四柱散十全大補湯去熟地黄加附子枸把子菊花蕊藿香正氣散並用薑棗煎服婦人服冷藥過多或崩或白帶致令眼昏不見亦可服此急救方見大方科諸氣類寒餘方並見虛損傷類熱證清􅈵散治心熱衝眼赤腫時流熱淚羞明毎服三錢水一盞半燈心二十莖苦竹葉七皮生地黄二根桑白皮七寸煎食后臨睡服方見大方科積熱類即八正㪚聖效㪚治諸般風熱風痒熱毒大人小兒生翳生膜生血筋但是外障熱眼並可服若内障是虛則不宜服黄苓北細辛甘草熟地黄大黄山梔子赤芍藥當歸尾極細者牛蒡子桑白皮各二兩有翳膜加一兩用菊花五兩去梗右剉散每服四錢水一盞半煎温泠服合滓煎早食午食晩間臨卧各一服忌鷄魚酒麫糯米鹹酸熱油諸般毒物眼乃一身之主如不能忌己藥亦無功自䧟此身也毎日惟白煑精猪肉米飯或山藥蘿蔔菜果山查梨柿子銀杏土𤓰榧子生葛可喫地黄圓素問云久視傷血血主肝故勤書則傷肝而目昏肝傷則自生風而熱氣上湊目昏益盛不宜專服補藥當益血鎮肝而目自明熟地黄兩半黄連去鬚决明子各一兩防風甘菊花羌活桂心朱砂研没藥研各半兩右為末煉蜜圓梧桐子大食后熟水下三十圓日三服决明散治風熱毒氣上攻眼目腫痛或卒生翳膜或赤脉努肉或澁痒羞明多淚或始則昏花漸成内障但是一切暴風客熱並宜服之黄芩甘菊花去枝梗木賊草决明子石膏赤芍藥川芎川羌活甘草蔓荆子石决明右剉散毎服三錢水一盞半生薑五片煎食后服敗毒㪚治熱眼澁痒昏蒙毎服三錢加薄荷桑白皮煎方見大方科傷寒類羊肝圓治肝經有熱目赤睛疼視物昏澁羯羊肝一具生用黄連去項别研為末右先將羊子肝去筋膜於砂盆内擂爛入黄連末杵和為丸梧桐子大毎服五十圓不拘時候熱水下五行湯治眼暴赤時行赤腫作痛黄蘗用力畧去粗皮取内皮不以多少右以濕紙褁黄泥包煨候泥乾取出毎用一彈子大紗帛包水一盞浸飯上蒸熟乗熟熏洗極效此方有金木水火土故以名一圓可用二三次退赤膏治赤眼右用生地黄肥者洗浄研細絹帛包之仰卧以藥搭在眼上初似碍而痛少頃清涼小兒赤眼黄連為末水調貼脚心其赤自退又方治血灌瞳人生障膜右用生地黄研細和大黄末成膏以帛鋪二寸揜在眼上可再易之黄連湯治火眼鷹爪黄連七莖節去毛杏仁七粒尖去皮北棗七枚大者右用新瓦盆存貯入水八分以紙覆蓋慢火熬存二三分放在地上去火毒候冷存在湯瓶上蒸温不要熱病者仰卧令人滴藥汁在眼尖角近鼻者候口中有苦味即是藥透如未知苦則一靣滴數次即安其效如神蔓荆散又名小洗肝散治赤腫澁痛多淚𤓰根蔓荆子荆芥梔子甘草右剉散毎服三錢水一盞煎先熏後服食后用之㸃眼方治眼目赤腫翳障羞明鵬砂三錢腦子一錢通明朴硝五錢右為末入乳鉢研再用細絹羅過毎用一小錢光弦者㸃津液沾藥末入目中閉霎時令藥自方開眼淚出效神針散治仝前木賊五錢去黒不用陳者香附子去毛細辛洗浄日乾菊花去梗蒂羌活各五錢右為末毎服二錢用好茶少許同㸃食后服又方治眼有血紅或有紅線及生糞此是熱眼服前經效㪚又方治眼開不得羞明怕日此是風熱牽閉所致芎芷香砂散加前胡連根葱白三莖煎服若臟腑閉加大黄小兒翳障及瘡疹不得開加生桑白皮七寸同煎根新能瀉肺膜不生翳便退方見大方科傷寒類石决明散治眼生外障不問男女小兒皆治先服經效散不退却進此藥石决明一兩火煆蒺蔾炒去刺浄二兩荆芥穗二兩薄荷葉一兩人參蜜炙五錢右各於地上出火毒研末毎服二錢沙糖冷水調食后服食治方治眼赤腫及治毎睡起時赤須臾又白名血熱非肝病也右以生地黄自然汁以粳米半斤三次浸三次曝乾用磁瓶煎湯一升令沸下地黄及米煮成薄粥半飽飢飲一兩盞即睡三次立效貼藥治眼痛十分甚者右以生薑自然汁調飛過白礬貼眼胞上痛即止又方治風熱上衝弩肉攀睛右用青萍少許研爛入片腦子少許貼眼上䪺效風證消風散治昏澁風痒加荆芥煎湯服方見風利熱詮類撥雲散治肝受風毒眼目昏䑃漸生翳膜蟬退去足木賊去節童便浸一宿白蒺蔾炒搗去刺羌活各三兩甘菊去兩四荆芥穗甘草各二兩右為末毎服二錢食后茶清調下白蒺藜散治腎經風毒攻眼昏淚澁痒白蒺蔾炒刺去防風甘草各一兩甘菊去葉一兩半生直殭蠶炒去絲觜一兩天南星兩半用黒豆二合青鹽半兩水煑透焙去鹽豆右為末毎服二錢沸湯少鹽㸃服蟬花無比散治風眼氣眼昏淚痒翳膜或頭風牽引眼小胞爛並治之石决明用東流水入鹽煑一伏時細研如粉當歸防風羌活各一兩半菊花洗晒甘草炙各一兩荆芥細辛蛇皮皂角水洗新瓦焙各半兩茯苓二兩蒺蔾炒去刺四兩芍藥蒼术童尿浸二宿去皮切碎各一兩右為末毎服二錢米泔或茶清食后調下荆芥散治風熱攻眼赤腫荆芥穗梔子仁牛蒡子蔓荆子甘菊花細辛甘草炙防風白蒺藜𤣥參川芎大黄黄芩木賊去節童尿浸晒草决明各半兩蒼术米泔浸一宿焙一兩右為末毎服二錢紫蘇或蜜湯調食后臨卧服祛風散治風毒攻眼昏淚颼癢蒼术日換童便浸二宿剉晒防風二兩白蒺藜炒搗去刺二兩荆芥穗一兩半甘草鹽水炙七錢半右為末毎服二錢入鹽少許沸湯㸃服或用消風㪚夾和尤佳方見風科熱證類龍膽湯治爛胘風赤浮翳努肉攀睛澁痒眵淚防風去蘆龍膽草各五錢銅青三錢五倍子二錢淡竹葉一粒去根右為末毎服半錢熱湯一合泡停泠澄清洗㨗效取蟲方治爛眩風此眼有蟲絲其絲色赤而長滋生不已覆盆子葉不以多用右洗浄研自然汁以皂紗帛蒙在眼上以筆蘸藥汁於二下眼眶當有細蟲出於紗上或研細著藥於紗上便蒙亦可此方治眼暗不見及冷淚浸滛不止乃青盲者其法搗取自然汁澄隂乾入飲男子乳化開㸃入目中即仰卧更入少許腦子尤好三四日間視物如年少㨗效方治爛眩風眼痒痛淚漬兩瞼皆成瘡百藥不效用此㸃之須臾淚下從瘡中流出其間有小蟲立愈黄連淡竹葉各一兩相樹皮半濕用右剉散以二升水煎至五合稍冷用滴目内兩􅗃及洗爛處日三四次洗方治爛眩風赤眼五倍子搥碎去蛀末蔓荆子揀浄右用水煎澄清温熱洗或用桑枝灰淋水洗亦效又方青礬火煅研出火毒毎用半匕熱湯一盞泡洗爛眩筋及拳毛倒睫效又方治眼痒多因布巾拭破了眼眩致成爛眩風不得乾白礬一兩煅過銅青三兩右同研細和勻如色白再加銅青毎用半錢熱湯一合泡汀清以手蘸開眼如法洗必澁不可拭乾但閉目坐待澁止自然眼開如藥冷將紙蓋盞面于湯瓶上坐温又洗一日洗四五次即效氣訂木香流氣飲治因怒氣或食熱物或飲酒而致目赤眼胞紫内生赤脉加大黄煎服復加川芎治氣眼浮軟上壅分心氣飲治同上挾熱者服之特效方並見大方科石膏羌活散治久患雙目不覩光明逺年近日内外氣障瞳人昏暗拳毛倒睫一切眼疾羌活治内熱頭風蜜䝉花治羞明見日木賊退翳障川白芷清頭北細辛去葉除風蘿蔔菜子起倒睫麻子起拳毛川芎治頭風黄芩洗心退熱石膏清頭目墜痰藁本治頭風頭疼甘草解諸藥毒各等分右為末毎服二錢食后臨卧蜜水一盞調下或茶清或淘米苐二遍泔水調日進三服至十日漸明二十日大效翳障神醫散治目内翳障兼治瘡疹后餘毒不散目生翳膜真蛤粉細研一兩榖精草一兩為末右和勻毎服二錢用生猪肝一片三手指大批開摻藥在上捲定再用麻子一札濃米泔一椀煑肝熟為度取出稍冷食后臨卧細嚼却用元煑肝米泔送下忌一切炙煿毒物名方治目赤后暴生翳右以鵝不食草塞鼻中立瘥觀音夣授方治内障及因病赤眼食减物而得者夜明沙洗浄當歸去尾蟬退去足木賊去節浄各三兩右為末用白羯羊肝四兩湯煑爛搗如泥入藥末丸如梧桐子大食后温熱水下五十丸百日眼如故矣羊肝丸治翳障青盲服之眼可復明方見前眼藥方治外障眼亦名一方右以猪膽一枚用銀石器煎成膏入氷片腦子少許㸃入眼中微覺翳輕又用猪膽白蘝皮隂乾合作小鳳頭釵大小止用一頭燒作灰待泠㸃翳數日后翳退葛仙翁方治内障有效生熟地黄川椒去目及閉口者微微炒右等分為末煉蜜圓梧子大空心鹽湯米飲下五十圓又方治瘡疹入眼及昏暗翳尤妙右用兎子糞焙為末毎服用好茶清調下即安須待疹瘡安后服此重明散治風熱内外障氣眼疾川獨活去蘆川羌活去蘆川芎射干仙靈脾防風去蘆甘草片泉石蒼术各五錢草决明丹參白术石决明右剉散毎服三錢水一盞半煎温服食后臨卧日三服小五退散治内障眼蟬退蛇蛻蚕紙烏雞卵殻男子髪右火燒存性研為末毎用一錢和羊肝湯喫不以時常服熟地黄圓治内障眼熟地黄麥門冬車前子右等分旋焙旋研煉蜜圓用酒送下二三十圓屢效退翳圓治眼目昏翳蟬退洗晒蒼术童子尿浸二宿焙熟地黄川芎白蒺藜炒杵去刺各一兩茺蔚子羌活木賊去節童尿浸一宿焙乾甘菊荆芥石决明煅存半生杏仁去皮尖兎絲子研酒浸焙蛇皮酒浸洗防風各五錢右為末煉蜜圓如彈子大毎一圓食后細嚼薄茶下黄連膏治逺年近日翳膜遮障攀睛瘀肉連眶赤爛視物昏暗不覩光明隱澁多淚迎風難開治之神效盧甘石不以多少揀粉紅海花色者為妙用鍋子盛火煅七次入黄連淬七次用黄連不以多少搥碎水浸一宿去滓將粉紅盧甘石淬足七次了同黄連水細研飛過候澄在下去上靣水曝乾再用乳浸極細羅過方可用三錢桑柴燒存性研細末二錢龍膽草不以多少洗浄日乾不見火細研為末一錢好黄丹不以多少水飛浄右件同白蜜四兩一處入在一紫黒磁器内文武火慢􅆈以竹箆子攪如漆色不粘手為度切勿犯生水仍不用鉄器熬藥藥成依舊以磁器盛頓毎服用如皂角子大新冷水半盞化開洗三日不用毎日洗數次無妨藥盞須用紙蓋不可犯灰塵截赤目極有功效神仙照水膏治障翳黄蠟黄丹水飛兩各一蛇蛻一分獨燒水銀一錢初生烏雞殻右以栁木槌研細滴蠟為餅臨卧用之候天明將水照眼藥投水中其氣上逹自能退翳聖水丹神驗㸃翳朱砂半錢海螵蛸一錢右入乳鉢内同研細水飛過澄取又用少許黄蠟溶旋入藥待要用時就火旋圓如蘿蔔子大臨卧用一圓㸃入眼角緊合眼睡著次日用温湯洗下未全退者更用一服極妙通治㸃眼膏子治眼目諸疾右用羊膽一枚入蜜一錢在内線扎定甘鍋内蒲入水煮熟冷水内浸取出候乾傾入瓦罐内竹筯㸃眼四角效洗方湯泡散治肝虛風熱攻眼赤腫羞明漸生翳障當歸尾赤芍藥黄連去鬚杏仁各五錢銅青二錢薄荷葉三錢防風五錢右剉散毎用二錢極沸湯泡乗熱先熏后洗冷則再煖每日兩三次又方沸湯白鹽入少許閉目沃洗鹽亦散血水淋法治眼睛腫脹突出新汲水沃眼中數換水睛目入仍以麥門冬桑白皮山梔仁煎湯通口服之明目膏治逺年日近不覩光明内外障眼攀睛瘀肉眩眶赤爛隱澁難開怕日羞明多眵有淚視物茫茫時見黒花或瞼生風粟或翳膜侵睛時發痒痛並皆治之此藥神妙兼治口瘡塗之立愈白沙蜜一斤黄丹四兩􅔈砂乳香青鹽輕粉鵬砂腦子各二錢並别研麝香半錢别研金星石銀星石井泉石雲母石各一兩黄連去須烏賊魚骨各半兩右件藥於浄室中不得令雞犬婦人見用銀石器慢火先炒黄丹令紫色次下蜜候熬得沫㪚其色皆紫次入臘月雪水三升再熬二十餘沸將餘藥研成末一處同熬用筯滴於指甲上成珠不散為度以厚紙三張鋪在筲箕上傾在紙上濾過再用瓶子盛放在新水内浸三晝夜去火毒其水日一易之看病眼輕重臨晚用筯蘸藥㸃大􅗃頭以眼澁為度若治内障用麫水和成條揑作圈子臨卧置眼上傾藥在内如此用之一月見效治赤眼後生翳膜方右以蘭香子浄洗曬乾毎用一粒以筯㸃大􅗃頭閉目即覺藥在目内團圓旋轉藥力過即不轉須臾自隨眵淚出若翳膜在上如魚眼然再易一粒以退病為度洗眼方韶粉防風馬牙硝餅子銅青右為末毎用一字温湯調不拘時洗立效小决明散治斑瘡入眼草决明青箱子乾葛槐花敗荷葉水上者一皮右為末食後米泔水調下二錢如四五十日病只此藥若半年日久則眼老睛懸宜合后藥香白芷香門子連翹甘草蟬退右剉散毎服二錢水一盞煎去滓調前藥服仍忌熱味浮萍散治斑瘡入眼大人小兒皆可用之浮萍隂乾為末右毎服二錢以生羊子肝半箇入盞内以杖子刺碎投水半合絞取肝汁調下食后不甚者一服差已傷目者十服見效黄連膏治眼瘀肉攀睛風痒淚落不止朴硝一升以水半盞淘去土隂乾用白丁香半升以水半盞淘去土攪細用黄連二兩為末右取水入硝香釡内熬至七分淘出令經宿水靣浮牙者取出控乾以紙作袋盛風中懸至風化將黄連末熬清汁曬乾稍用猪膽羊膽和加蜜㸃之尤效滌昏膏治風眼疼痛不可忍者洗之妙好崖蜜半斤黄連五錢没藥二錢半黄丹四錢炒紫色右以蜜同熬黒煎黄連成稠汁入二味藥内煎熬稠更入没藥末同熬數沸濾去滓洗仍用后通天散搐鼻通天散治偏正頭疼一切壅滯明目赤芍藥川芎黄連黄芩𤣥胡索草烏頭當歸乳香别研各等分右為末毎服少許紙撚子蘸藥搐鼻神效飛絲入眼腫痛方右用清菜汁㸃如神刮指甲上細屑筯頭㸃津液㸃爪屑入眼甲其絲自聚㧞去又方飛絲害左目以石菖蒲搗破塞右鼻中右目即塞左鼻中百發百中運墨法治飛絲入眼令人睛脹突出痛不可忍新筆兩三管濡好墨更換頻運眼上飛絲纒筆而出即安灸法目中痛不能視上星穴主之其穴在直鼻上入髪際一寸䧟中是灸七壯仍先灸譩譆穴其穴在肩􅈩内亷第六椎兩傍三寸其穴抱肘取之灸二七壯次灸風池其穴在顳顬髪際䧟中與中府正相當即是側相去各二寸青盲無所見逺視􅍃􅍃目中滛膚白膜覆瞳子巨窌主之穴在鼻孔下俠水溝傍眼暗灸大椎下數節第十當脊中安灸二佰壯惟多愈佳至驗風翳患右目灸右手中指本節頭骨上五壯炷如小麥大左手亦如之目卒生翳灸大指節横紋三壯在左灸右在右灸左良針法目不明淚出目眩瞢瞳子痒逺視􅍃􅍃昏夜無見目瞤動與項口叅相喎僻口不能言刺承泣穴在動十七分直瞳子拾遺十六方闗明圓治年深日近翳障昏蒙寂無所見一切目疾熟地黄兩半酒洗兎絲子酒洗車前子麥門冬去心蕤仁去皮决明子地膚子茺蔚子枸把子黄芩五味子防風去蘆澤㵼細辛去葉火不見杏仁炒皮尖去北亭藶炒青箱子各一兩桂皮半兩羊肝須用白羊者只用肝薄切瓦上焙乾研作末或只以肝煮搗藥為圓庻可久留少則以蜜湊之右為末圓如梧桐子大毎服三十圓熱水下日三服仍戒忌生姜糟酒炙􅘤等熱物當歸圓治頭疼腦虛眼目昏矇生犀人參白术當歸芍藥木香茯苓丁香牛膝酒炒蓯蓉天麻各半兩腦麝少許右為末好酒三升生羊膽一枚熬成膏圓如梧桐子大毎服三十圓麝香酒下明眼地黄圓治肝腎虛熱風毒黑花眵淚補肝益腎大見效石斛去苗防風去蘆兩各二枳殻去穰兩炒二生乾地黄酒洗焙熟乾地黄洗焙斤各半川牛膝去蘆酒浸一兩半杏仁去皮尖炒另研一兩右為末煉蜜圓梧桐子大毎服三十圓食前温酒或米飲鹽湯亦可忌一切動風毒等物菊花散治目赤腫麻因傷寒后服熱藥并毒食腫痛如桃子大不得開者黄芩大黄菊花甘草防風各一兩土當歸半兩右剉散十歲已下毎服二錢水一盞煎空心服貼藥治小兒赤熱腫目川大黄白礬朴硝右為末冷水調作掩子貼目上搐鼻藥治風熱腫赤難開雄黄水透過辰砂各二錢細辛半兩腦麝少許右為末口含水以少許搐鼻中决明圓治諸般眼患因熱病後毒氣攻目生翳膜遮障服此漸漸消退免使針刀青箱子炒防風枳殻各一兩茺蔚子細辛各半兩枸把子澤㵼生乾地黄石决明燒各半兩土當歸酒浸二兩宣連半兩去湏車前子炒麥門冬去心兩各二右為末煉蜜圓如梧桐子大毎服三十圓食后麥門冬煎湯送下洗藥治目生翳膜内外障海螵蛸生龍膽草少許右為末極細用熱湯侵起以銅筯㸃五七次㸃藥暑月行路眼昏澁者生龍膽草汁一合黄連三寸切爛右用生絹挒出汁㸃入目中蜜蒙花㪚治十六般内障多年昏暗或近日不明淚出胘爛一切目疾並皆治之羚羊角一兩水煮剉炒乾人參一兩蜜䝉花二兩覆盆子蠐螬醋浸兩各一茺蔚子析明子各半兩北膚子甘草枸把子各一兩菊花槐花各半兩右為末食后用飯飲調下二錢㸃眼藥右用大田螺一箇浄養去泥然後入瓦合中以腦麝少許入田螺内揜中封起候三日餘開即便成水㸃之洗眼碧霞散銅青三錢滑石一錢石膏半兩輕粉麝香各少許右為末每用少許湯泡洗敷藥瞿麥散右以瞿麥炒令黄色為末用鵝涎調逐時塗􅗃頭即開墜翳圓青羊膽青魚膽鯉魚膽各七枚熊膽一分牛膽半兩麝香少許石决明一兩右為末麫糊圓梧桐子大空心茶下十圓消翳散龍腦曽青水晶各半兩真珠末琥珀各一分右為末夜后以少許㸃立效空青圓治微翳細看方見其病最深空青二錢五味子車前子細辛各一兩防風生乾地黄知母各二兩石决明一兩别研右為末煉蜜圓如梧桐子大毎服十圓空心茶送下世醫得效方卷十六
