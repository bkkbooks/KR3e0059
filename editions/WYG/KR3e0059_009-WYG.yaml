衣被覆足熏一時取汗再淋洗不可頻用灸法風市穴可令病人起正身平立垂兩臂直下舒十指掩著兩髀便㸃當手中央指頭髀大筋上是三里穴在膝頭骨節下三寸人長短大小當以病人手尖度取灸之絶骨穴在脚外踝上一尺亦云四寸以上三穴多灸取效凡病一脚則灸一脚病兩脚則皆灸未效再灸犢鼻穴在膝頭下骭上俠解大筋中以手按之得窟解是或灸肩隅穴在肩骨骨端兩骨間陷者宛宛中舉臂取之曲尺穴在肘外輔骨屈肘曲骨之中以手拱胸取之足十趾端名曰氣端日灸三壯並有神效遇間深處按穴針之亦效腫滿虛證復元丹治水腫夫心腎真火能生脾肺真土今真火氣虧不能滋養真土故土不制水水液妄行三焦不瀉氣脈閉塞樞機不通喘息奔急水氣盈溢滲漏經絡支膚溢滿足脛尤甚兩目下腫腿股間冷口苦舌乾心腹堅脹不得正偃偃則咳𠻳小便不通夢中虛驚不能安卧附子炮二兩南木香煨茴香炒川椒炒去汗獨活厚朴去皮剉薑製炒白术畧炒陳橘皮吳茱茰炒桂心各一兩澤瀉一兩半肉豆蔲煨檳榔各半兩右為末糊丸梧桐子大毎服五十丸不以時紫蘇湯下此藥世𫝊屢驗未嘗示人其間君臣佐使與造物同妙服者自知要當屏去諸藥一日三服先次漩利如傾次乃腫消喘止葢藥能助真火以養真土運動樞機安平必矣法當禁慾并絶鹽半年乃不再作禹餘粮圓治十種水氣凡脚膝腫上氣喘滿小便不利但是水氣悉皆治之蛇黄大者三兩以新鐵銚盛入一秤炭火中燒蛇黄與鉗子一般通紅用鉗取銚子出便傾蛇黄入酸醋二升中候冷取出研極細禹餘粮三兩用真乾二五兩先以水淘浄烘乾更用銚子炒入禹餘粮一處用米醋二升就銚内煑醋為度却用銚研藥入一秤炭火中燒通赤傾藥淨磚地上候冷研無聲即止以三物為主其次量人虛實入下項藥治水多是取轉惟此方三物既非大㦸甘遂芫花之比又有下項扶持故虛老人皆可服羌活木香茯苓川芎牛膝酒浸白豆蔲炮土茴香炒蓬术炮桂心乾薑炮青皮去穣京三稜炮白蒺藜附子炮當歸酒浸一宿各半兩虛人老人用實壮減半右為末拌極匀以湯浸蒸餅挒去水和藥再搗極匀丸如梧子大食前温酒白湯任下三十圓至五十圓唯忌鹽雖毫末許不得入口若無以為味即水病去後且以醋少許調和食不能忌鹽勿服果欲去病切須忌鹽但試服藥即於小便内旋去不動臟腑病去日日三服兼以温和調補氣血藥助之真神方也又名萬金丹實脾散治隂水先實脾土厚朴去皮炒薑製白术木𤓰去穰木香不見火草果仁大腹子附子炮去皮臍白茯苓去皮乾薑炮各一兩甘草炙兩半右剉散毎服四錢水一盞半生薑五片棗子一枚煎至七分去滓温服不以時服加味腎氣圓治腎虛腰重脚腫小便不利附子炮兩二白茯苓去皮澤瀉山茱茰取肉山藥炒車前子酒蒸牡丹皮去木兩各一官桂不見火川牛膝去蘆酒浸熟地黄各半兩右為末煉蜜圓梧桐子大毎服七十丸空心米飲下木香流氣飲治面目虛浮四肢腫滿喘急水道澁赤方見諸氣熱証神助散舊名葶藶散治十種水氣面目四肢遍身俱腫以手按之隨手而起咳嗽喘急不得安卧腹大腫脹口苦舌乾小便赤澁大便不利澤瀉二兩椒目一兩半黒牽牛㣲炒取末二兩半猪苓去黒皮二兩葶藶炒香入研三兩右剉散毎服以葱白三莖漿水一盞煎至半盞入酒半盞調藥三錢絶早面向東服如人行十里久以漿水葱白煑稀粥至葱爛入酒五合熱啜量人啜多少須啜一升許不得喫鹽并麫自早至午當利小便三四升或大便利喘定腫減七分隔日再服既平之后必須大將息及斷鹽房室等三年加味控涎圓治熱証消浮退腫下水大效方見喘急類疎鑿飲子治水氣通身洪腫喘呼氣急煩躁多渇大小便不利服熱藥不得者澤瀉赤小豆炒商陸羌活去蘆大腹皮椒目木通秦艽去蘆檳榔茯苓皮右等分剉散毎服四錢水一盞半薑五片煎至七分去滓温服不拘時候通苓散治腫滿口燥咽乾小便絶少方見傷暑類赤小豆湯治年少血氣俱熱遂生瘡疥變為腫滿或煩或渇小便不利商陸赤小豆炒當歸去蘆炒澤瀉連翹仁赤芍藥漢防己木猪苓去皮桑白皮炙澤漆已上各半兩右剉散毎服四錢水一盞半薑五片煎至八分去滓温服不計時候熱甚者加犀角二錢半三仁圓治水腫喘急大小便不利郁李仁杏仁炮去皮尖薏苡仁各一兩右為末米糊丸如梧子大毎服四十丸不拘時米飲下分心氣飲治滯氣去浮滿利漩大效方見諸氣類三和散和暢三焦治痞脹浮腫加赤茯苓一兩可以和氣利水方見諸氣類封臍膏治水腫小便絶少地龍猪苓去皮針砂各一兩右為末擂葱涎調成膏敷臍中約一寸髙闊絹帛束之以小便多為度日兩易五皮散治脾水四肢頭面悉腫按之没指不惡風其腹如故不喘不渇脈不浮大腹皮炙桑白皮炙茯苓皮生薑皮陳橘皮各等分右剉散毎服四錢水一盞半煎七分去滓熱服日二三服效一方用青木香丸毎服三十五丸黒牽牛末少許新汲水調吞下二便得利效方見諸疝類麻黄甘草湯治水腫從腰以上俱腫以此湯發汗麻黄去根節四兩甘草二兩右剉散毎服三錢水一盞半煑麻黄再沸内甘草煎至八分取汗慎風冷有人患氣促積久不差遂成水腫服之有效但此藥發表老人虚人不可輕用更宜審察秘傳八方芫花圓治水腫大巴豆二十粒去殻葶藶子大黄桂枝芫花杏仁各等分右為末米糊丸毎服五十丸空心温酒吞五更早喫下水大效牽牛湯催發巴豆甘遂各三錢檳榔大㦸當歸各五錢青皮黒牽牛取頭末各一兩右為末用一大錢葶藶子煎湯調下五更初喫下神效蓯蓉散用補木香五錢肉豆蔲煨肉蓯蓉酒洗炙各一兩右為末毎服一大錢米飲調下忌生冷油麵烏鯉魚湯治水腫消腫及四肢腫烏鯉魚一箇赤豆桑白皮白术陳皮各一兩葱白五根右用水三椀同煑不可入鹽先喫魚後服藥郁李仁散治腫滿小便不利陳皮郁李仁檳榔茯苓白术各一兩甘遂五錢右為末毎服二錢薑􅀥湯下川活散治水氣腫羌活蘿蔔子炒一兩各右為末用酒調下紅豆散𦂳皮丁香木香各三錢縮砂紅豆白薑桂枝陳皮青皮桔梗胡椒各五錢右為末毎服二錢秋石湯調下紫金圓白薑香附子炒去毛紫金皮石菖蒲青木香針砂特煅紅右各等分為末米糊圓用三十圓第一茶清下第二商陸根湯下第三赤小豆常喫用好酒吞下秘傳方止此防風散治風腫皮麄麻木不仁或時疼痛麻黄去節牽牛炒頭末取甘草各分半炙杏仁去皮防風半夏泡芍藥辣桂白芷防己當歸川芎羌活獨活檳榔各一分右剉散毎服三錢薑四片蘇葉三皮煎服茯苓散治諸氣腫等疾芫花醋炒澤瀉郁李仁甜葶藶漢防己藁本各二錢半陳皮白茯苓白檳榔瞿麥各半兩白滑石大㦸各七錢半為末毎服一錢桑白皮煎湯空心調下取下碧緑水如爛羊脂即差未盡隔日又服腫消如故不服忌鹽百日治脚腫方小續命湯加羌活一倍煎服之遂愈方見風科虚証背腫方以煉石塗之立瘥烏梅醋法治手指甲頭腫用烏梅搥碎去核肉只取仁研米醋調入指漬之自愈腮腫方以赤小豆為末傅之立效隂腫方治男子隂腫大如升核痛人所不能治者以馬鞭草搗爛塗之治婦人隂腫堅硬方枳實半斤碎炒令熟舊帛裹熨冷即易之灸法足第二指上一寸半隨年壯又灸兩大手指縫頭七壮治水氣通身腫滿效大衝腎腧各百壮治虚勞浮腫效世醫得效方卷九
