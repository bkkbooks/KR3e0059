body:
  text: 世醫得效方卷九元危亦林撰大方脈雜醫科健忘小定志圓治心氣不定五臟不足甚者憂憂愁愁不樂忽忽喜忘朝差暮劇暮差朝發及因事有所大驚夢寐不祥登髙履險致神魂不安驚悸恐怯菖蒲炒逺志去心薑汁淹各二兩茯苓茯神人參各三兩辰砂一兩為衣右為末煉蜜圓如梧桐子大毎服五十圓米湯下一方去茯神名開心散毎服二錢匕不以時服菖蒲益智圓治喜忘恍惚破積聚止痛安神定志聰耳明目菖蒲炒逺志去心薑汁淹炒川牛膝酒浸桔梗炒人參各三兩三分桂心三分茯苓一兩三分附子一兩炮去皮臍右為末煉蜜圓梧子大毎服三十圓食前温酒米湯下加味茯苓湯治痰迷心胞健忘失事言語如癡人參去蘆半夏湯洗陳皮去白一兩半白茯苓去皮一兩粉草五錢益智去殻香附子炒去毛各一兩右剉散毎服四錢水一盞半生薑三片烏梅半箇同煎不拘時温服朱雀圓治心神恍惚舉事多忘方見心恙類虛煩淡竹茹湯治心虛煩悶頭疼氣短内熱不解心中悶亂及婦人産後心虛驚悸煩悶欲絶麥門冬去心小麥各二兩半甘草炙一兩人參白茯苓各一兩半半夏湯洗七次二兩右剉散毎服四錢水二盞生薑七片􅀥子三枚淡竹茹一塊如指大同煎食前服虛勞煩悶尤宜服之温膽湯治大病後虛煩不得眠此膽寒故也此藥主之又治驚悸自汗觸事易驚半夏竹茹枳實麩炒去穰各二兩陳皮三兩甘草炙一兩茯苓一兩半人參一兩右剉散毎服三錢水一盞半生薑五片􅀥一枚煎食前服未效加逺志去心薑汁炒北五味子各一兩酸􅀥仁一兩蚌粉炒入酸􅀥仁湯治霍亂吐下増劇虛勞煩擾奔氣在胸中不得眠或發寒熱頭疼暈悶酸棗仁炒一兩三分人參桂心各一分知母茯苓各三錢三字石膏煅半兩甘草炙二錢右剉散煎同上小草湯治虛勞憂思過度遺精白濁虛煩不安小草黄耆去蘆當歸去蘆酒浸麥門冬去心石斛去根各一兩酸棗仁人參甘草炙各半兩右剉散毎服三錢水一盞半生薑五片煎不以時服神妙散治傷寒後伏暑後煩熱不安及煩熱虛勞地骨皮去本二兩防風去蘆一兩甘草炙半兩右剉散煎同上清心蓮子飲治心中藴積虛熱煩燥方見消渇類自汗風證桂枝湯治傷風脈浮自汗惡風桂枝不見火白芍藥各一兩甘草炙半兩右剉散毎服四錢生薑五片大􅀥二箇煎不拘時服發汗汗不止者謂之漏風宜加炮熱附子一兩暑證五苓散消暑圓卻暑散治傷暑自汗方並見傷暑類濕證术附湯治傷濕自汗方見傷濕類防己黄耆湯治同上方見四氣相感類體虛牡蠣散治諸虛不足及新病暴虛津液不固體常自汗夜卧即甚久而不止羸瘠枯瘦心忪驚惕短氣煩倦牡蠣米泔浸煅取粉麻黄根黄耆知母各一兩右為末毎服用小麥百餘粒煎湯濃調服一方為散毎三錢水三盞薤白三寸煎一盞半分三服黄耆湯治喜怒驚恐房室虛勞致隂陽偏虛或發厥自汗或盜汗不止悉宜服之黄耆去蘆蜜水炙一兩半白茯苓去皮熟地黄酒蒸肉桂不見火天門冬去心麻黄根龍骨各一兩五味子小麥防風去蘆當歸去蘆酒浸甘草炙各半兩右剉散毎服四錢生薑五片煎不拘時候發厥自汗加熟附子發熱自汗加石斛未效或多喫麫食則安撫芎湯治自汗頭眩痰逆惡心撫芎白术去油畧炒橘紅各二兩甘草炙半兩右剉散每服四錢生薑七片煎温服建中湯治表虛自汗官桂三分芍藥一兩半甘草炙半兩右剉散每服四錢薑五片棗二枚食前服本方加黄茋一兩名黄耆建中湯治虛勞自汗加當歸一兩名當歸建中湯治婦人血虛自汗其自汗漏不止者加桂半兩熟附子半箇名桂枝附子湯每服四錢生薑七片棗子二枚空心煎服防風散治盜汗川芎一分人參半分防風二分右為末每服一錢臨卧米飲調下白术散治盜汗極驗白术不拘多少剉成小塊或稍大右用浮麥一升水一斗煑乾如白术尚硬又加水一二升煑取出切作片焙乾去麥不用研為末别用浮麥湯每服二三錢不以時候茯苓湯治虛汗盜汗右用白茯苓為末煎烏梅陳艾湯調下二錢服之神妙大建中湯治虛熱盜汗百節酸疼腰痛肢體倦怠日漸羸弱口苦舌澁心怔氣短綿黄耆炙逺志燈心煑去心當歸洗澤瀉各三兩白芍藥龍骨人參各二兩甘草炙兩一右剉散每服四錢水二大盞生薑五片煎熱服氣弱加炮附子二兩腰痛筋急加去麄皮官桂一兩止汗温粉右用川芎白芷藁本各一分為末入米粉三分綿裹撲於身上止汗紅粉麻黄根牡蠣火煅兩各一赤石脂龍骨各半兩右為末以絹袋盛如撲粉用之虛脫正元散治下虛手冷自汗方見虚損類三建湯治真陽不足上盛下虚面赤自汗小便頻數方見痼冷類耆附湯桂附湯治氣虛陽弱虛汗不止四體倦怠方見痼冷類虛勞麥煎散治榮衞不調夜多盜汗四肢煩痛飲食進退肌瘦面黄秦艽柴胡去苗兩各二大鼈甲二兩醋煑三五十沸去裙䦨别用醋徐炙黄乾漆炒令煙盡人參茯苓乾葛川烏炮去皮尖各一兩𤣥參右為末毎服二錢小麥三十粒煎湯一盞去麥入藥煎食後服如久患後亦宜服此以退其勞倦調理經絡青蒿散治虛勞盜汗骨蒸咳𠻳胸滿皮毛乾枯四肢懈惰骨節疼痛心腹驚悸咽燥唇焦頰赤煩燥涕唾腥臭困倦少力肌體潮熱飲食減少日漸瘦弱天仙藤龞甲醋炙香附子炒毛去桔梗去蘆柴胡去苗秦艽青蒿已上各一兩重烏藥半兩甘草炙兩半一川芎二兩半右剉散毎服薑三片煎不拘時候温服小兒骨蒸勞熱肌瘦減食者毎一錢水盞半小麥三十粒煎服隂汗大蒜圓治陰汗濕癢右用大蒜不以多少煨剥去皮爛研同淡豆䜴末搜圓如梧子大朱砂為衣每服三十圓􅀥子燈心煎湯送下青娥圓治同上毎服五十圓酒服大效方見虛損類治隂汗溼癢方爐甘石一分眞蚌粉半分為粉撲傅治隂汗不止方小安腎圓臭乾舊醤煎湯入鹽少許吞下方見虚損類洗方蛇床子酒浸炒白礬陳醤煎水淋洗宿食香蘇散治宿食留飲聚積中脘噫臭腐氣心腹疼痛或臟腑飱泄毎服四錢生薑葱白烏梅煎方見傷寒和解類盧氏感應丸健脾進食消化宿滯酒食飽後宜服方見諸積類縮砂香附湯治心䐜膨滿噫宿腐氣或時冷疼方見諸氣類穀神丸消食健脾益氣進美飲食人參縮砂香附子炒毛去三稜煨莪术煨青皮陳皮神麯炒麥芽炒枳殻炒去穰各等分右為末粳米糊圓梧子大毎服三十圓空腹米飲吞下鹽湯亦可紅圓子磨化宿食止腹痛方見痎瘧類三稜煎圓治膨滿消食積氣塊及傷食夾臍痛甚方見諸氣類癆瘵總說夫骨蒸殗殜復連屍疰癆疰蟲疰毒疰熱疰冷疰食疰鬼疰皆曰傳屍者以疰者注也病自上注下與前人相似故曰疰其變有二十二種或三十六種或九十九種大畧令人寒熱盜汗夢與鬼交遺泄白濁髮乾而聳或腹中有塊或腦後兩邊有小結核連復數箇或聚或散沈沈黙黙咳𠻳痰涎或咯濃血如肺痿肺癰狀或復下痢羸瘦困乏不自勝持積月累年以至於死死後乃疰易傍人乃至滅門是也凡疾始覺精神不爽氣候不調切須戒愼酒色調節飲食如或不然妄信邪師或言鬼祟以致不起愼之愼之又云男女傳尸之病心胷滿悶背膊疼痛兩目不明四肢無力雖欲寢卧卧不得寐脊膂急痛膝腦痠疼多卧少起狀如佯病每至平旦精神尚好日午向後四肢微熱面無顔色喜見人過常懷忿怒纔不如意又便多嗔行立脚弱夜卧盜汗夢與鬼交或見先亡或多驚悸有時咳𠻳雖思飲食不䏻多餐死在須臾精神尚好或時微利兩脇虛脹口燥鼻乾常多粘唾有時唇赤有時欲睡漸成沈羸猶若涸魚不覺死矣尸蟲逰食日辰及治法大抵六蟲一旬遍逰四穴轉流周而復始具后六代法中自立春一日後食起三日一食五日一醉歸於所歸穴大醉五日故五日蟲醉可以下藥及灸其三日蟲食切不可妄有醫治蟲在人身中一蟲可占十二穴六蟲在人身中共逰七十二穴上旬十日從心至頭逰四穴中旬從心至臍逰四穴下旬從臍至足逰四穴上旬可先服藥後灸所遊穴其蟲頭向上若下火灸蟲如紫蠶苗出在汗中更服藥取之以蟲盡為度便服補藥永得安耳中旬其蟲所遊穴中頭向内可服藥取之下旬蟲在所遊穴中頭向下亦服藥取之不灸也恐蟲覺悟永難取蓋此蟲性已通靈務在精審勿令有悟可也觀尸蟲色知病淺深法凡明醫者先須知毒氣與蟲並行攻人臟腑遇陽日長雄蟲隂日生雌蟲縁先食臟腑脂膏故其蟲色白次食血肉血肉盡故其蟲黄赤次食精髓故其蟲紫色精髓盡故其蟲黒色傳入腎中病人方死須求醫士曉達病源先取其蟲視其色理自知輕重其蟲如白色可三十日服藥補之其蟲如黄赤色可六十日服藥補之其蟲如紫黒色此疾已極可百二十日服藥補之十中可保一二雖不能為一身除害亦可為子孫除害矣服藥仍須一載之中刻意調攝方可痊平如此得命可謂再生於世又云蟲頭赤者食患人肉其病可治頭口白者食患人髓其病難治只得斷後不傳子孫矣世代傳病及諸蟲形状凡治病之道要須藥病相應效同神聖仍在瀉實補虛調治臟腑方得痊愈故三尸九蟲種種靈異莫令知之或似蜣蜋或似紅絲馬尾或似蝦蟆或似刺蝟或似鼠形或如爛麫或有足無頭或有頭無足或化精血歸於元陽之内種種形類實難辨之淺學之流難施方劑誤醫甚多枉死不少或則取蟲不補或則淺學妄𫝊皆是徒費資財終無去病之理遂致夭折豈不悲哉第一代謂初勞病受其病而不測病源酒食加餐漸覺羸瘦治療蹉跎乃至病重醫人不詳其故誤用湯藥枉而致死此蟲在人身中如嬰兒狀背上毛長二寸此蟲變動形如鬼在臟腑中此蟲形如蝦蟆變動在人臟腑中上三蟲在人身中染著之後或大或小令人夢寐顛倒魂魄飛揚精神離散飲食不減形容漸羸四肢酸痛百節勞倦増寒壮熱背摶拘急腦與頭痛口苦舌乾面無顔色鼻流青涕虛汗常多行步艱難眼睛多痛其蟲遇丙丁日食起醉歸心腧穴中四穴輸轉周而復始大醉可醫矣取蟲出後補心當瘥第二代為覺勞病謂傳受此疾已覺得病覺病者患乃自知夜夢不祥與亡人為伴醒後全無情思似醉神識不安所嗜食味輒成患害或則發氣動風所加四體不和心胷滿悶日漸羸瘦骨節乾枯或嘔酸水或則醋心唇焦口乾鼻塞腦痛背膊酸疼虛汗常出腰膝刺痛如此疾状須早醫治失時致傷命上諸蟲在人身中居於腎臓透連脊骨令人思食是物要餐身體汪羸腰膝無力髓寒骨熱四肢枯乾眼見火生或眼多黒暗耳内虛鳴隂汗燥痒冷汗如油夢與鬼交小便赤黄醒後昏沈臍下結硬或奔心胸看物如艷心腹悶亂骨節疼痛其蟲遇丑亥日食起醉歸腎臟穴四穴輪轉周而復始大醉可醫矣蟲出後補腎填精當瘥取蟲防護法先令病人家用好紙糊一密室不留些罅隙尋一老成人過遞以安息香水洒了過遞人之身又以雄黄雌黄塗其鼻孔耳眼唇上安排鐵鉗一个布巾一幅用香油二斤以鍋盛頓微煎令沸仍用髙桶一个以好石灰在桶内生布巾葢桶口却服取蟲藥五更初一服五更三㸃時一服服藥後腹中疼痛如刀斧劈不妨至已牌必須下蟲或取下臭穢如膠漆或吐瀉膿血癥塊皆於灰桶中其蟲或從汗出紫蠶苗状或於耳鼻口中出或小便中出異般形状不止一也或青或黒或黄紅大者急用鐵鉗取於油内煎當日將油紙裹蟲入瓦罌内石灰填實埋棄於深山逺僻處免致再染人患人衣服床席並皆棄去醫人分付藥後亦須逺避神效取蟲青桑枝飲青桑枝柳枝石榴皮桃枝梅枝各七莖並長四寸許鬼臼五錢青蒿一小握赤箭五錢右用童子小便一升半葱白七莖去頭葉煎及一半去滓别入安息香阿魏各一分再煎至一盞去滓調辰砂末半錢檳榔末一分麝香一字分作二服調下五更初一服五更三㸃時一服至己時必取下蟲紅者可救青黒不治見有所下即進軟粥飯温煖将息不可用性及食生冷毒物合時須擇良日不得令猫犬孝服穢惡婦人等見一方不用鬼臼赤箭雄黄圓雄黄半兩糞二兩天靈葢一兩酥炙黄鼈甲木香各半兩輕粉右為末法酒一升大黄半兩􅆈膏圓如彈子大朱砂為衣凡此疾先燒安息香烟吸之不𠻳非傳尸也不可用此藥若烟入口咳不止乃尸也宜用此藥五更初服勿令人知用童子小便同酒一盞化一圓服之如人行二十里正吐出蟲或如燈心或如爛𤓰李或如蝦蟆未效再服以應為度蟲用紅火燒之又用油煎神授散治諸傳尸勞氣殺蟲川椒二斤擇去子并合口者炒出汗右為末每服二錢空心米湯調下須痺暈悶少頃如不能禁即以酒糊圓如梧子大空心服三五十圓昔人嘗與病勞婦人交婦人死遂得疾遇一異人云勞氣已入臟遂令急服二斤其病當去如其言服之幾盡大便出一蟲状如虵遂安續有人服之獲安濟者多矣虛證凝神飲子治勞瘵増寒發熱口乾咽燥自汗煩鬱咳𠻳聲重唾中血絲痩劇倦乏人參去蘆當歸去尾白芍藥白茯神去木白茯苓黄耆去蘆白术半夏麯五味子熟地黄洗酒蒸甘草蓮肉去心大麥門冬去心桔梗各等分右剉散每服四錢水一盞半烏梅紅􅀥各一箇煎服如𠻳加阿膠虛極胸滿者加木香濕紙裹煨沈香亦可不思食加扁豆刼勞散治心腎俱虛勞𠻳時復三四聲遇夜發熱熱過即有盜汗四肢倦怠體瘦恍惚異夢𠻳中有血名曰肺痿白芍藥五兩黄耆甘草人參白茯苓熟地黄洗酒蒸當歸去尾五味子半夏麯阿膠蚌粉炒各二兩右剉散毎服三錢水一盞半生薑三片紅􅀥二枚煎與凝神飲相類黄耆飲子治諸虛勞氣四肢倦怠骨節酸痛潮熱乏力自汗怔忪日漸黄瘦胷鬲痞塞不思飲食咳𠻳痰多甚則唾血黄耆蜜炙一兩半當歸去蘆酒浸紫宛洗去土石斛去根地骨皮人參桑白皮去赤附子炮去皮臍鹿茸酒蒸欸冬花各一兩半夏湯泡七次甘草炙各半兩右剉散毎服三錢生薑七片􅀥子一枚煎不拘時服此藥温補榮衛枯燥者不宜進此唾血不止者加阿膠蒲黄各半兩十全大補湯治虛勞發熱加北柴胡地骨皮煎方見虛損類養榮湯黄耆益損湯治同上方見虛損類熱證生犀散方見前枳殻半夏湯治𠻳甚咽痛失音方見痰飲類温金散治積勞咳𠻳喘悶咯痰中有血甘草黄芩桑白皮防風去蘆各一兩茯神半兩麥門冬一分去心杏仁去皮尖米泔浸一宿取出握乾畧炒一兩右剉散毎服三錢水一盞入黄蠟一片如指頭大同煎食後熱服鼈甲地黄湯治熱勞手足煩心怔悸婦人血室有乾血身體羸瘠飲食不為肌肉柴胡去蘆當歸去蘆酒浸麥門冬去心鼈甲醋炙石斛去根白术熟地黄酒浸焙茯苓去皮秦艽去蘆各一兩人參肉桂不見火甘草炙各半兩右剉散毎服四錢水一盞半生薑五片烏梅少許煎不拘時服此藥專治熱勞其性差寒脾胃快者方可服餌弱甚而多汗者不宜服阿膠圓治勞𠻳並𠻳血唾血阿膠蛤粉炒生地黄洗卷柏葉山藥剉炒大薊根五味子雞蘇各一兩柏子仁炒别研人參防風去蘆麥門冬去心各半兩右為末煉蜜圓如彈子大毎服一圓細嚼濃煎小麥湯或麥門冬湯嚥下地仙散治骨蒸肌熱一切虛勞煩燥生津液地骨皮二兩防風去蘆一兩甘草半兩麥門冬一兩去心右剉散毎服三錢水一盞生薑五片煎不拘時候黄連飲治骨節間熱積漸黄瘦黄連剉一兩右用童子小便一大升浸經宿㣲煮三四沸去滓食上分二服如人行五里再服四美圓凡骨蒸莫非是勞脊骨尤属腎虛髓竭也以局方黄耆鼈甲散沈香鼈甲散秦艽鼈甲散青蒿鼈甲散四散和合為末以雄羊脊骨一具斫碎煉汁調和為圓温酒吞下治脊痛骨熱漸成蒸疾一劑而效其功全在脊骨膏葢醫者意也通治太上混元丹河車者天地之先隂陽之祖乾坤之槖籥鉛汞之匡廓胚腪将兆九九數足我則戴而成之故謂之河車厯驗篇中名曰混沌皮葢亦生天地隂陽之始為七十二丹之首髙士垂慈始開端緒太上云若欲長生當修所生實資於此所以成功靈應非金石草木夜露曉霜之所比倫修真之士服之不輟誠足以返本還元補益之道真得其真紫河車一具用初生男子者良蒂子全者以東流水洗斷血脈入麝香二錢在内以綫縫定用生絹裏懸胎於砂瓶内入好酒五升慢火􅆈成膏子沈香朱砂各一兩人參蓯蓉酒浸乳香各二兩白茯苓去皮安息香去沙酒􅆈各二兩右為末入河車膏子和藥末杵千百下圓如梧子大毎服七十圓空心温酒送下沈香湯尤佳詳此丹以紫河車為主但佐使之藥太輕無病之人久服可以輕身延年補損扶虛乃若病重之人服之却宜増添之法也一方有天靈葢一片酥炙黄治男子真陽耗竭腰背疼痛自汗怔忡痰多咳喘夢遺白濁潮熱心煩脚膝無力宜於内加鹿茸火燎去毛酥炙川巴㦸去心鍾乳粉陽起石酒煑半日附子炮裂鹽水浸黄耆桑寄生生鹿角龍骨紫苑五味子各一兩右依法修製和前藥末用膏子為圓治婦人血海虛損榮衛不足多致潮熱心煩口乾喜冷腹脇刺痛腰腿疼痰多咳𠻳驚惕怔忡經候不調或閉斷不行宜於内加當歸去尾石斛去根柏子仁紫石英米醋淬七次鹿茸去毛酥炙鼈甲醋炙各一兩卷柏葉一兩去土川牛膝酒浸一兩半去苗右依法修製和前藥末膏子圓虛寒者加炮附子二兩咳𠻳者加紫苑茸二兩治熱勞尤加河車依前法修治鼈甲醋炙半兩桔梗白芍藥大黄煨甘草苦參貝母知母秋石豉心草龍膽黄藥子莪术煨犀角鎊消石各半兩右為末以前膏子圓湯使如前蘓合香圓治傳尸骨蒸殗殜肺痿疰􅂒鬼氣心痛藿亂時氣瘴瘧等方見中氣類青蒿散治男子婦人骨蒸勞増寒壮熱青蒿春夏用葉秋冬用子用子不用葉用根不用莖四者相用而反以為痼疾必用童子小便浸過使有功無毒一握大鼈甲炙黄醋淬五七次去腥白术濕紙褁煨熱地骨皮白茯苓粉草炙揀參去頭𤓰蔞根北柴胡去蘆桑白皮蜜炙各半兩右為散每服三錢水一盞半煎温服不拘時候加減黄耆建中湯治男子婦人五勞骨蒸者世用神效白术白茯苓桔梗各三錢人參三錢半秦艽北柴胡去蘆防風白芍藥甘草當歸去尾澤瀉生乾地黄熟地黄地骨皮肉豆蔲煨檳榔縮砂仁各五錢猪苓四錢黄耆一兩右為散每服三錢水一盞半煎温服不拘時候老人更加黄耆一兩或為末蜜湯調服臨期斟酌青骨散治男子婦人童男童女初覺勞瘵五心煩熱去骨熱如神北柴胡生地黄各二兩熟地黄人參去蘆防風去蘆秦艽赤茯苓各一兩胡黄連半兩薄荷葉七錢半右剉散毎服三錢水一盞半煎温服先服荆蓬煎圓一服㣲泄臟腑後服此方見痰飲類團魚散治骨蒸潮咳𠻳累效貝母前胡知母杏仁北柴胡各等分團魚二箇右用藥同團魚煑魚熟提起去頭取肉連湯食之却将前藥焙乾為末就用團魚裙甲及骨更煑汁一盞和藥為圓如梧子大每服二十圓煎黄耆湯空心下病安仍服黄耆益損湯補理方見虛損類蛤蚧圓治積勞咳𠻳日久不差自汗口中無味蛤蚧一兩酥炙欵冬花皂角不蛀者酥炙去皮子弦二片木香不見火熟地黄酒蒸焙杏仁去皮尖童子小便浸一晝夜晒乾蜜炙五味子各一兩右為末煉蜜圓梧桐子大每服十五二十圓生薑湯送下食後臨睡服灸法癸亥夜二更六神皆聚之時解去上體衣服於腰上兩傍微陷處謂之腰眼直身平立用筆㸃定然後上牀合面而卧毎灼小艾炷七壮蟲或吐出或瀉下即安又法四花穴灸見蘇沈良方及資生經效又法膏肓肺腧穴毎穴各灸九壮仍依前蟲醉日各穴腧多灸為妙灸後百日忌煎􅏼生冷熱物毒食仍戒房事避風寒減喜怒安心静處将息若一月猶覺未瘥於初穴上再灸隂㿗茱茰内消圓治隂㿗偏大上攻臍腹㽲痛膚囊腫脹或生瘡瘍時出黄水腰腿沈重足脛腫滿行步艱辛服之内消不動臟腑川楝三兩剉炒大腹皮五味子海藻洗𤣥胡索各二兩半茴香炒桂心川烏炮去皮臍吳茱萸食茱萸桃仁麩炒别研各一兩木香一兩半桔梗青皮山茱茰各二兩右為末酒糊圓梧子大毎服三十圓温酒下木香流氣飲兼服大㦸圓治隂㿗腫脹或小腸氣痛大㦸去皮剉炒黄半兩重葫蘆巴四兩炒木香附子炮去皮臍舶上茴香訶子煨核去檳榔各一兩川練五兩後入麝香半錢别研右八味為末外留川楝以好酒二升葱白七莖長三寸煑軟去皮核取肉和藥末圓如梧子大五七圓至十圓空心温酒下薑湯亦可潮發疼痛炒薑熱酒下十五圓煉隂丹治隂器下墜腫脹卵核偏大堅硬痛不可忍𤣥胡索㣲炒去殻海藻洗昆布洗青皮去穰茴香炒川楝去核馬藺花各一兩木香半兩大㦸酒浸三宿切片焙乾一分右為末别将硼砂阿魏安息香各一分用酒醋各一升淘去沙石熬成膏入麝香一錢沒藥一分入前藥和圓如菉豆大用綿灰酒下十圓至十五圓空心服兼金圓治熱入膀胱臍腹上下兼脇筋疼痛便燥欲飲水按之痛者大黄濕紙裹煨八錢硝石桂心甘草桃仁四十箇去皮尖右為末煉蜜圓如梧子大毎服五七圓至十圓米飲下婦人血閉疼痛亦宜服之應痛圓治敗精惡物不去結在隂囊成疝疼痛不可忍久服去病阿魏二兩醋和用蕎麥作成餅厚三指裹阿魏慢火煨熟檳榔大者二箇刮作瓮子滿盛滴乳香将刮下末用蕎麥麫拌作餅子慢火煨熟右同研為末入硼砂末一錢赤芍藥末一兩同為麫糊搜和圓梧子大毎服十圓至二十圓食前温酒鹽湯下三白散治膀胱藴熱風濕相乘隂㿗腫脹大小便不利白牽牛畧炒二兩白术桑白皮陳皮木通各半兩右為末毎服空心薑湯調下初進一服未覺再進此藥不損臟氣只導利留滯疝方大率多用熱藥此方惟壅熱證宜服之金鈴子散治膀胱疝氣閉塞下元大小便不通疼痛不可忍者服之神效分心氣飲吞青木香圓亦效方見諸疝諸氣類金鈴子四十九箇去核剉如豆大不得碎細用巴豆四十九箇去皮亦不得碎細同炒以金鈴子深黄色為度去巴豆不用茴香一兩炒右不用巴豆将二味為末毎服二錢食前温酒調下金鈴圓治膀胱腫硬牽引疼痛及小腸氣隂囊腫毛間水出並能治之金鈴子肉五兩茴香炒馬藺花海蛤絲子破故紙海帶各三兩木香丁香各一兩右為末糊圓如梧子大毎服二三十圓空心食前温酒鹽湯任下牽牛圓治膀胱有熱服煖藥攻成壅滯作痛黒牽牛三錢大黄二錢白礬二錢右用巴豆去皮三十粒先入銚炒焦乾去巴豆入衆藥炒香為末煨大蒜研細為圓茴香湯送下茘核散治腎大如斗不過二劑除根舶上茴香青皮全者茘枝核右等分剉散炒出火毒為末酒下二錢日三服桔核圓治四種㿗病桔核炒海藻昆布海帶川楝肉各一兩桃仁去皮尖炒一兩厚朴薑炙木通枳實炒𤣥胡索炒桂心木香各半兩右為末酒糊圓如梧子大毎服六十圓空心鹽湯酒任下虛寒者加川烏一兩腎腫久不消加硼砂二錢醋煑旋入有熱氣滯者加黒牽牛大黄各半兩牡丹散治小兒卵腫偏墜防風牡丹皮右等分為末毎服二錢温酒調服鹽湯亦可竹皮湯治交接勞後隂囊腫脹痛入腹中右刮竹青皮一升以水三升煑一半去滓分三服立愈灸法闗元穴在臍下三寸灸三七壮大敦穴在足大指甲後三毛上灸七壮脚氣陽經表散二香散治男子婦人初患脚氣其病寒熱或頭眩忽然脚弱有筋一條自脚脛骨至臀及腰而起作痛皆因風寒暑溼之氣相感而成先須解散毎四錢加檳榔一箇切片木𤓰二片生薑三片葱白二根水二盞煎熱服不拘時候大便秘加大黄每服半錢方見傷寒和解類神秘左經湯治風寒暑溼流注足三陽經手足拘攣疼痛行步艱難増