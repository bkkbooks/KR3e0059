榔三稜蓬术炮青皮去白陳皮川楝肉芫花醋浸炒各半兩辣桂牽牛生取仁各三錢川巴豆肉不去油一錢右為末麵糊圓麻子大毎三圓空心午前各一服薑湯下五苓散治隂核氣結腫大釣痛多因啼怒不止傷動隂氣結聚不散得之或胎婦啼泣過傷令兒生下小腸氣閉加以風冷血水相聚水氣上乗於肺故先喘而後疝痛外腎木硬臍下痛楚不可忍惟利二便則安以木通葱白茴香食鹽煎湯調下得小便利為效方見大方科傷暑類當歸散治疝氣大腑秘小腹隂囊牽引撮聚痛甚辣桂牽牛炒取仁各半兩當歸北大黄桃仁浸去皮焙各二錢上全蝎一錢半右剉散毎一錢入蜜煎温服以利大便利后以青皮陳皮茯苓木香縮砂甘草為散生薑煎和胃唇青不治鈎藤膏治盤腸内釣腹中極痛乾啼明乳香没藥同上别研木香薑黄各四錢半木鱉子十二箇爛去皮研右以木鱉子搜和四味末為圓櫻桃大煎鈎藤湯化下一嵗可服半圓次魏香散阿魏散用蓬莪术半兩真阿魏一錢先以温水化開阿魏浸莪术一日夜焙乾為末毎服一字或半錢煎蘇葉米飲空心調下吐衂蒲黄散治吐血咯血生蒲黄油髪灰等分右研細每服一錢煖生地黄汁調下米飲亦可生地黄汁方治吐血衂血生地黄汁取一合髮灰半錢調分作兩服食后少頃灌下鼻衂方生蘿蔔汁仰頭滴下鼻仍飲其汁腫滿五苓散香薷散治伏暑感濕腫滿用生薑皮木瓜車前草山茵陳煎方見大方科傷暑類分氣飲治腫脹作喘氣短而急北梗赤茯苓陳皮桑白皮大腹皮枳殻半夏麯真蘇子炒紫蘇甘草各二錢草果仁一錢右剉散每服一錢半水一盞生薑二片􅀥子一枚煎服若臍心凸起掌心平缺盆平背心平不治大喘氣麄不食乃腎水盈溢上行傍浸於肺亦不治五皮散神助散相兼服方見大方科腫滿類竒方治熱毒遊腫破草鞋人亂髮燒灰醋調傅熱毒處三黄散貼腫毒右用大黄黄柏黄連各等分為末獖猪膽汁調塗頭心及脚心又方斫石白麪等分研匀井水調睡時塗脚心效單方治脚氣腫痛及蠱腫右商陸不以多少切碎酒煮熟候酒温連商陸飲喫腹肚蠱腫同米煮粥喫大人亦可服盜汗白术散安神圓小驚圓牡蠣麻黄根煎湯下方並見前又方治心腋汗大人小兒皆有之大人乃心血溢盛面常發赤者是也小兒因驚得之有人常有盜汗不止氣弱體羸乆醫不可乃心血溢盛為汗非虚也宜用藥収歛心血川當歸人參各半兩右剉散用猪心二箇可切三片藥亦分三服每服水一椀猪心一片煎服黄耆健中湯治盜汗入米糖煎服效牡蠣散治血虚自汗或病後暴虚津液不固自汗夜卧愈甚又不止則枯瘦短氣煩倦方見大方科自汗類竒方治脚汗白礬乾葛為散煎水洗效又方治睡中汗出酸􅀥仁人參茯苓為細末米飲下半錢項軟天柱圓治風氣頸起軟頭不得正或去前或去后蛇含石大一塊服七次用醋淬七次川鬱金末少許右碾細又入鉢内研極細和前藥米入少麝香和匀用雪白大米飯圓龍眼大毎服一圓荆芥湯化下或又入生薑汁一二滴或用金銀薄荷湯早晨不拘時下風熱項軟合用涼肝圓方見前五加皮散治頸軟右用五加皮為末酒調塗傅頸骨上健骨散治乆患疳疾體虚不食及諸病後天柱骨倒醫者不識謂之五軟白殭蠶為末三嵗兒半錢薄荷酒調下後用生筋散貼生筋散治如前木鱉子六个去殻黄麻子六拾箇去殻右研細先拖起顱摩項上令熱津唾調貼之效又方用附子生用去皮臍天南星切各等分生薑自然汁調貼項軟處語遲菖蒲圓治受胎其母卒有驚怖邪氣乗心舌本不通四五嵗長猶不能言人參石菖蒲麥門冬去心逺志取肉薑汁炒川芎當歸各二錢滴乳香朱砂各一錢别研右為末煉蜜圓麻子大每服十圓粳米米飲下聤耳明礬散治腎經有熱上衝於耳遂使津液壅滯為稠膿為清汁耳内痛亦有沐浴水入耳中濕氣停滯為膿但不疼二證乆不瘥變成聾耳明礬煅龍骨研三錢各黄丹煅錢二胭脂一錢麝少許右為末先以綿枚取去水次以鵝毛管吹藥入耳本方加海螵蛸末亦好月蝕耳瘡方胡粉和東方壁土為末傅又方蝦蟆燒灰存性搗為末和猪膏傅重舌傅藥治重舌乃心脾俱有熱也心候於舌所主者血脾之脈絡出於舌下若心脾有熱則血氣俱盛附舌根而重生一物形如舌而短小是也有著頰裏及上腭者曰重腭有著齒齗者曰重齗皆當刺去其血也用真蒲黄傅之或髪灰傅之或馬牙硝傅之或竹􅄋浸黄柏㸃之燄消亦好其餘並見大方科舌病類木舌紫雪治木舌舌迺心之候脾之脈絡於舌臟腑壅滯心脾積熱熱氣上衝故令舌腫漸漸脹大塞滿口中是為木舌若不急療必至害人每用一字研細竹􅄋調下方見和劑局方又方黄蜀葵花研細黄丹半之同研㸃七次又方川朴消二分紫雪一分白鹽半分同研每半錢竹􅄋井水調傅滯頤冷證温脾圓治滯頤涎流出而潰於頥間也涎者脾之液脾胃虚冷故涎液自流不能収約法當温脾半夏木香丁香各半兩川白薑生白术青皮陳皮各二錢半右為末糕糊圓麻子大一嵗十圓二嵗二十圓米湯灌下脚拳不展海桐皮散治稟受腎氣不足血氣未榮脚指拳縮無力不能伸展海桐皮牡丹皮當歸熟地黄牛膝各一兩山茱萸補骨脂各半兩右為末毎服一錢葱白二寸煎食前服行遲地黄圓治氣血不充骨髓不滿軟弱不能行或肝腎俱虚肝主筋筋弱不能束所致一方加川牛膝五加皮酒炙鹿茸妙方見前又方虎骨圓虎股骨酒炙赤生乾地黄酸􅀥仁酒浸去皮炒香白茯苓辣桂防風當歸川芎牛膝等分右為末煉蜜圓麻子大每五圓酒吞下或木瓜湯五加皮散治三嵗不能行者真五加皮一分牛膝酸木瓜乾各半分右為末每服一錢半粥飲調次入好酒兩㸃再調食前服日二劑鶴節地黄圓治稟受不足血氣不充故肌肉瘦薄骨節呈露如鶴之膝乃腎虚得之腎虚則精髓内耗膚革不榮易為邪氣所襲日就枯瘁其殆鶴脚之節乎本方加鹿茸酥炙川牛膝各二錢修合服餌並同三嵗以下與十圓三嵗以上與十五圓方見前龜胷百合丹胸髙脹滿其狀如龜此肺經受熱所致也乳母酒麪無度或夏月熱煩熱乳與兒得之或乳母多食五辛而亦成此疾川大黄三分焙天門冬去心焙杏仁去皮炒百合木通桑白皮炒甜葶􅏣紙上炒爛石膏各半兩右為末煉蜜圓菉豆大每服五圓食后臨卧熟水化下龜背松蘂丹治嬰兒生下不能䕶背客風吹脊入於骨髓致之或坐太早亦致傴僂背髙如龜多成痼疾松花枳殻防風獨活各一兩麻黄川大黄前胡桂心各半兩右為末蜜圓黍米大每服十粒粥飲下量兒加減灸法肺腧穴第三椎骨下兩傍各一寸半膈俞穴第七椎骨下兩傍各一寸半以小兒手中指中節為一寸艾炷如小麥大但三五壯而止髮不生蓯蓉圓治稟受血氣不足不能榮於髮當歸去尾生乾地黄肉蓯蓉酒洗炙揚芍藥各一兩胡粉五錢右為末煉蜜圓如黍米大毎服十粒煎黒豆湯下兼磨化塗抹頭上齒不生地黄散治齒不生齒者由骨之所終髓之所養稟氣不足則髓不能充於骨故齒久不生川芎乾地黄當歸山藥白芍藥各一兩沈香半兩粉草三錢右為末温鹽湯調服半錢用少許揩齒脚亦佳瘡毒濕癬用蛇床子為末先以韭菜根煎湯洗次用臈月猪脂調藥傅之炙甲散治眉叢中生瘡名曰錬銀癬右用穿山甲前膊鱗炙焦為末清油輕粉調傅漏瘡方錬成松脂末并髮灰生黄丹填傅白歛散治凍耳成瘡或痒或痛黄蘗白歛各半兩右為末先以湯洗瘡後用生清油調塗三物散治鬢邉生軟癤名發鬢有數年不愈者此極妙猪頸上毛猫頸上毛各一撮燒灰鼠屎一粒右為末清油調傅或加輕粉尤妙生附散治凍爛脚成瘡生附子半个去皮臍右為末麪水調貼之即愈隂瘡方治隂股間汁出先痒后痛愈後復發及隂囊生瘡以火炙瘡􅎲去痂令乾以蜜傅却搜麪作燒餅炙熟以餳塗於燒餅上乗熱熨之冷則再炙再熨數度為妙胎毒瘡方治一嵗二嵗内滿頭延及遍身生瘡皆因在胎中父母恣情交合所致名曰胎蛆經乆不瘥先用化毒丹消毒飲服却用父小便以鵝翎刷洗瘡上青黛為細末乾糝效即效方治頭上生瘡及肥疳瘡猪筒骨中髓調輕粉早傅晩愈又用樹上乾桃燒灰清水調傅效暑毒軟節皆可疣目瘡方治遍身如魚目無膿又名征膚瘡川升麻剉散煎百一沸入蜜一二匙以磁器盛鵝翎蘸拭瘡上諸惡瘡生頭面南星貝母等分用湯泡七次研為細末入土朱少許乾則清油調搽濕則乾糝口瘡㵼心湯治血盛將養過温心有客熱熏發於上焦遂成瘡右用黄連一兩去鬚或加腦子麝香硼砂為末毎服一字温水臨卧服連翹飲治心肺有熱瘡發班駁如丹身體有熱或熟煮大栗與食亦佳方見疹瘡類洗心散治心熱煩渇作成口瘡毎用一字乾糝兒口中嚥喫亦無妨乳母同服尤妙方見大方科積熱類傅藥治滿口瘡爛黄丹一兩好蜜一兩瓦盞盛甑上蒸一炊乆取出以鵝翎刷瘡上效貼藥吳茱萸末醋調貼兩脚心移夜即愈藥性雖熱能引熱就下至良又方天南星密陀僧為末治口瘡不能吮乳醋調貼兩手内心即洗去背熱加薄荷水拭口又方生硫黄為末新汲水調貼手心脚心效即洗去軟癤猪頭散治軟癤愈而再作用野蜂房一二箇燒灰存性以巴豆三七粒去殻煎清油三二沸去巴豆以油調藥敷立效白礬枯為末清油調傅亦效此藥有驗人以猪頭為謝遂名之又方大枳殻一枚去穰令空地上磨令口平以稠麪糊搽四唇霑在癤上自破膿溜出盡更無瘢痕又方治軟癤屢安再作者右用桑螵消燒炙存性以清油調傅又方鷄抱卵殻燒灰存性為末入輕粉少許清油調傅此物難得只以雞子抱退殻如上法用亦可敷瘡口方白芨赤石脂各一錢研當歸三錢去蘆龍骨少許研右為細末乾糝脱肛釣腸圓治大腸虚寒或因服涼藥過度或乆痢後臟寒所致圓如粟米大大者細嚼胡桃温酒送下小者木香湯下方見大方科諸痔類瓜蔞圓治初病脱肛鼻梁青脈唇白齒根燋黄乆病兩頰光眉赤唇燋多啼哭黄瓜蔞一箇白礬半兩右將白礬入瓜蔞内固濟火煅為末米糊圓每服三十圓米湯送下痢頻脱肛黒色生殻方右用巴豆殻燒灰芭蕉自然汁煑入朴消少許洗軟用真清油㸃三滴放三角白礬煆過研爛真龍骨少許同研糝肛頭用芭蕉葉托上勿令便去出入令大兒抱定龍骨散治大腸虚肛門出龍骨訶子肉炒各二錢半没石子大者二枚罌粟殻去頰醋炒赤石脂各二錢右為末每服一錢米飲調下洗方香附子荆芥皂角煎水洗又方以葱湯洗令軟用芭蕉葉托上又方五倍子朴消大腹皮煎水洗以赤石脂末糝在芭蕉葉上托入貼方萆麻子四十九粒研爛水調作餅子貼腮頂上収上立有效水聖散子治脱肛不収右用浮萍草不以多少杵為細末乾貼患處紫蕺膏治臟熱肛門脱出右用紫背蕺一大握又為魚腥草擂爛如泥先用朴消水洗參肛門用芭蕉托入却用藥於臀下貼坐自然致入又方用新磚一片燒紅以醋澆之氣上即用脚布疊數重壓定使熱氣上透不可過熱令病者以臀坐於布上如覺布温逐旋減之以常得温熱為度灸法頂上旋毛中三壯即入又灸尾翠骨三壯又灸臍中隨年壯遺尿鷄腸散治腎與膀胱俱虚冷氣乗之不能約制故遺尿不禁或睡裏自出辣桂龍骨各二錢半雞腸燒牡蠣灰白茯苓真桑螵蛸炒半兩各右剉散每服一錢水一盞薑二片􅀥一枚煎服又方鷄䏶胵一具鷄腸燒猪胞炙焦右為末毎服一錢酒調下男用雌鷄女用雄鷄者尿白茯苓散治乳哺失節有傷於脾致使清濁色白也乆而成疳亦心膈伏熱兼而得之京三稜蓬莪术煨縮砂仁赤茯苓各半兩青皮陳皮滑石甘草炙各二錢半右為末毎服一錢麥門冬燈心煎湯調下又方大甘草頭煎湯服淋閉葵子散治諸淋兼小便不通葵子車前子木通瞿麥桑白皮炒赤茯苓山梔子仁甘草炙各等分右剉散每服一錢井水一小盞葱白二寸煎食前服導赤散治血淋仍以米飲調油髮灰少許空心灌下方見前尿血方生蒲黄生地黄赤茯苓甘草炙各等分右剉散毎服一錢水一小盞煎調油髪灰少許食前服順經散治十餘嵗因驚之候心氣下行小便淋􅄋日夕三四十次漸覺黄瘦宜服韭子炒琥珀别研益智去殻炒金毛狗脊去毛白茯苓去皮石燕子火煅醋淬研細各半兩石韋去毛一錢右為末毎服一錢韭湯調日二服大便秘没藥散治風與滯血留蓄上焦胸膈髙起大便不通没藥大黄枳殻炒北梗各二錢木香甘草炙一錢各右剉散每服一錢薑二片水一盞煎服隂腫三白散治膀胱藴熱風濕相乗隂囊腫脹大小便不利白牽牛二兩桑白皮白术木通去節陳皮去白兩各半右為末每服二錢薑湯調空心服桃仁圓治啼呌怒氣鬬擊於下結聚不散水竇不行發為此疾桃仁浸去皮麩微炒三錢辣桂牽牛炒碾取仁白蒺蔾炒香劑搗去牡丹皮北大黄各二錢右為末煉蜜圓如麻子大每服五圓或七圓青皮木通葱白鹽少許煎湯灌下或煎大流氣飲研青术香圓灌下蟬退散治隂囊忽腫多坐地為風或蟲蟻咬著右用蟬退半兩水一椀煎湯洗腫處其痛立止腫亦消再温再洗洗后仍與五苓散加燈心煎服又方用葱園内蚯蚓糞甘草汁調塗傅藥地龍膏治外腎腫硬或疝或風熱暴腫及隂瘡乾地黄不以多少為末先以葱椒湯於避風處洗次用津唾調傅其上外腎熱者雞子清調傅或加牡蠣少許又方地龍糞研生薄荷汁調傅牡蠣散治外腎腫大莖物通明牡蠣粉研極細先以津唾塗腫處次用糝傅又方卵腫研桃仁唾調傅遇仙方治風熱外腎焮赤腫痛日夜啼呌不數日退皮如鷄卵殻愈而復作用老杉木燒灰入膩粉清油調傅效卒暴捷方治卒然腹皮青黒而死灸臍上下左右去臍各半寸并鳩尾骨下一寸凡五處各灸三壯仍用酒和胡粉塗其腹又暴腹滿欲死半夏不以多少微火炮為末酒和為圓如粟米大三五粒淡薑湯或蜜湯下又中惡暴死葱白納下部及鼻中立活或用菖蒲末著舌底及吹入兩鼻兩耳中效又中蠱欲死甘草濃煎湯服立驗斷乳畫眉膏梔子三箇燒存性雌黄朱砂各少許右為末入生清油輕粉少許調匀候兒睡著濃抹於兩眉醒来自不喫乳未效再用即驗世醫得效方卷十二
