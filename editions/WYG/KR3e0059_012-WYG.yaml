body:
  text: 世醫得效方卷十二元危亦林撰小方科癉毒平血飲治風熱積毒聚成發於頭面手足熱者如胭脂色其熱如火輕輕著手痛不可忍加紫草煎與犀角消毒飲相間服赤癉火癉紫萍癉並治壯熱煩渴甚加黄芩麥門冬去心朴硝各半錢方見後瘡腫科諸瘡類内托散紅内消當歸茄片甘草節羌活黄芩各半兩麝香半錢右為末每服一錢茄蒂煎湯調成或生地黄亦可敗毒散治癉毒初發如白梅様遊走遍體燥悶腹脹焦啼每服二錢水一盞生薑二片紫草少許煎温服方見大方科傷寒類通治平血飲與敗毒散合和生薑薄荷蟬退去足翼防風去蘆細切煎湯加天花粉少許又方角癉遊走不定掀然赤腫疼痛用藥角歸手足上為妙後取碎蜞針之寒水石石膏黄連黄柏各一兩右為末水調刷又方青黛土朱為末井水調入蜜敷角亦可又方黄丹不拘多少磨刀水調刷又方癉毒腫痛如火用大黄朴硝為末調塗腫處立效水苔生地黄菘菜浮萍梔子皆可研爛水調傅洗方用防風酸車草赤豆竈心土煎水洗又方洗角後用小驚圓壓邪大驚圓鎮驚方見前蜞針法取碎用水蜞數條以青苔盖覆或濕紙亦可去血即消未消再用癉毒滿身徧黒入腹入隂難治諸疳大安神圓治心疳面黄臉赤煩滿壯熱心燥口瘡虚驚見前益黄散治脾疳體黄肚大愛喫泥土脹滿氣麄痢下酸臭方見後生熟地黄湯治肝疳搖頭揉目白膜遮睛流汗合面而卧肉色青黄髪立筋青腦熱羸痩生乾地黄洗熟地黄洗淨蒸各半兩川芎半赤茯苓枳殻煨穰去杏仁去皮尖川黄連去鬚半夏麯天麻地骨皮甘草炙當歸各二錢半右剉散每服二錢生薑二片黒豆十五粒水煎臨卧温服清肺湯治肺疳咳嗽氣逆多啼揉鼻咬甲寒熱桑白皮炒兩半紫蘇北前胡黄芩當歸去尾天門冬去心連翹防風赤茯苓北梗生乾地黄甘草炙各一分右剉散每服二錢水一盞煎温服不拘候地黄圓治腎疳極痩身有瘡疥寒熱作時頭極熱脚冷如水生乾地黄八錢乾山藥山茱萸各四錢澤瀉牡丹皮白茯苓去皮各三錢右為末煉蜜圓梧桐子大每用一二圓化開服胡黄連圓治熱疳潮熱如火大便澁胡黄連川黄連各半兩朱砂一錢半别研右黄連為末和朱砂入猪膽内繫定虚懸於釜中煑一炊時取出研蘆薈青黛乾各二錢半去足蝦䗫灰二錢麝少許粳米飯圓麻子大每服十圓食後米飲下五福化毒丹治熱疳肌肉黄瘦雀目夜不見物陳粟米飲化下方見前至聖圓治冷疳時時泄㵼虚汗不止丁香丁皮各一錢木香紫厚朴製見前史君子肉焙橘紅肉豆蔲濕紙畧煨各二錢右為末神麯糊圓麻子大每七圓食前米飲下銅青散圓走馬疳口内生瘡牙齦潰爛齒黒欲脫或出血臭氣丈夫婦人同川白芷半兩生馬牙硝一錢銅青一分麝香一字右為末乾傅口角及擦齒上妙仍服蟾酥圓效方見後下蟲圓治蛔疳圓食肉太早或腸胃停蓄肥膩為蛔其證多啼嘔吐清沫腹痛脹滿唇口紫黒腸頭及齒痒新白苦楝根皮酒浸焙緑色貫衆木香桃仁浸去皮焙蕪荑焙二錢各雞心檳榔二錢鶴虱炒錢一輕粉半錢乾蝦䗫炙焦三錢史君子畧煨取肉五十箇右為末飛羅麵糊圓麻子大每二十圓天明清肉汁下内加當歸川黄連各二錢半治脊疳兼疳勞可擇用大蘆薈圓治脊疳蟲蝕脊膂身熱羸黄煩熱下痢脊骨如鋸齒十指背瘡頻嚙指甲蘆薈蕪荑木香青黛乾檳榔川黄連淨各一分蟬退二十一枚麝少許胡黄連半兩右為末猪膽二箇取汁浸糕圓麻子大每服二十圓米飲下龍腦圓治腦疳頭皮光急滿頭餅瘡腦熱髮結身汗顋腫顋髙龍膽草川升麻苦楝根皮焙防風赤茯神蘆薈油髮灰青黛乾黄連淨三錢各右為末猪膽汁浸糕糊圓麻子大每二十圓薄荷紫蘇泡過下食後仍以蘆薈末入鼻保童圓治乾疳瘦悴少血舌乾目睛不轉乾啼身熱手足清冷皮燥大便乾結搭口癡眼乾渴黄連去鬚白鱔頭草龍膽去蘆青橘皮去穰五倍子蟾頭夜明砂炒苦楝根雄黄麝香青黛天漿子炒熊膽蘆薈胡黄連已上各一分右為末研令匀糯米糊和圓麻子大一嵗兒每服一圓不計時候米飲下日進三服尤佳一方有乾蝸牛微炒一分白术散又名清寧散治疳渴煩燥引水乳食不進夜則渴甚加烏梅陳米疳瀉停積宿滯水穀不聚頻泄不效加肉豆蔲訶子方見前木香圓治疳痢冷熱不調五色雜下裏急外重黄連淨錢三木香紫厚朴去麄皮薑汁炒縮砂仁夜明砂隔紙炒各二錢訶子肉炒一錢右為末粳米飯圓麻子大每服十五圓乾艾葉生薑煎湯食前温下褐圓子治疳腫脹因虚中有積腹肚𦂳脹頭面虚浮蘿蔔子一兩炒陳皮青皮好檳榔黒牽牛取仁半生半炒北五靈脂赤茯苓蓬莪术煨半兩各木香二錢半右為末飛羅麪糊圓菉豆大毎服十五圓紫蘇桑白皮煎湯下黄耆湯治疳癆嗽喘不定虚汗骨蒸渴而復瀉乳食遲進黄耆蜜炙當歸川芎白芍藥生乾地黄蝦䗫去足炙焦鱉甲醋炙焦各三錢人參白茯苓橘皮半夏麯北柴胡史君子畧煨甘草各二錢炙右剉散每服貳錢水一盞薑二片􅀥一枚煎食前服鱉血圓治疳癆人參半兩川芎蕪荑北柴胡各一兩史君子二十一箇胡黄連川黄連各二兩右用鱉血一盞吳茱萸一兩拌和二連淹一宿次早炒乾透出茱萸鱉血只用二連夾餘藥杵末粟米粉糊圓麻子大每服二十圓食前熟水下蚵蚾圓治腦後項邊有核如瘰癧狀按之轉動軟而不疼名無辜疳毒兼治諸疳一服虚熱退二服渴止三服瀉痢住蟾蜍一枚夏月溝渠中取腹大不跳不鳴者其身癩磊者右取糞蟲一杓置桶中以尿浸之桶上要乾不與蟲走却將蟾蜍殺之頓在蟲中任與蟲食一日夜次以新布袋盡包繫定置之急浸一宿取出瓦上焙為末入麝一字粳飯揉圓麻子大每服二三十圓米飲下一方白蕪荑黄連胡黄連青黛各半兩蚵蚾一箇只用酒浸炙去骨為末麪糊圓粟米大每服三十圓食後臨卧米飲下日三服立效又方治無辜疳右以夜明砂炒為末入諸飲食中與之通治蟾酥圓治諸疳殺蟲止腹痛退虚熱大效或因病後通泄太過成疳蟾酥一箇酥油炙去骨胡黄連宣連去鬚龍膽草陳皮川楝子去核木香史君子去殻蕪荑各一兩麝半錢入或不巴豆二七粒去油茴香一兩炒右為末猪膽汁圓或糊圓青黛為衣常服紫蘇湯下肥兒圓治諸疳多因闕乳喫食太早或因乆患臟腑胃虚蟲動日漸羸瘦腹大不能行髮豎發熱無精神黄連神麯各一兩大麥蘖半兩炒木香二錢檳榔二箇火不見史君子肉肉豆䓻麪褁煨各半兩右為末麪糊圓蘿蔔子大每服三四十圓量兒嵗數加减熟水吞下六神圓捉疳止瀉丁香木香肉豆䓻去殻各半兩三味用麪褁同入慢炭火煨令麪熟為度訶子史君子蘆薈各一兩細研入右為末􅀥肉圓麻子大每服五圓至七圓温米飲下乳食前服五疹圓治疳傷肚大青皮不去白炒焦黄乾薑燒㣲存性北五靈脂蓬莪术各一兩右為末搜和秤藥末一兩用肥巴豆肉去油秤一錢研細拌和粳米飯圓麻子大每三五圓米湯不饑飽時下小黄連阿膠圓治諸疳作熱頻瀉每服二十圓米飲下方見大方科咳嗽類疳啞不能發聲方右以肥兒圓每服十五圓用蘇合香圓一粒入朱砂五靈脂末各少許石菖蒲煎湯調開下方見前大蘇合香圓方科中氣類猪肚黄連圓治疳瘡自孩提至弱冠潮熱發瘡乃疳氣使然疳蟲食其肌膚空虚疳熱流注遍身熱瘡發歇無已蟾酥圓相間服尤妙雄猪肚一具淨洗鷹爪黄連去鬚淨七兩右剉作小截少水和納猪肚中用線縫密頓在五升粳米上蒸十分爛取放臼中入些蒸飯搗千餘杵粘實得所衆手揑圓如小菉豆大每服二十圓米飲下童子倍之冠者又倍之仍以川芎生地黄茯苓茯神與之調血清心熱多者間服生犀散方見前二十嵗以上潮熱發瘡是為虚勞皆一種病也用藥同前凡兒童諸病不出於疳則出於熱熱則生痰常須識此矣洗方按證用大腹皮苦參川白芷為剉散煎湯淋洗妙又方甘草黄柏馬鞭草帶鬚葱荆芥煎水洗後却用訶子連肉核燒灰入麝香輕粉少許和匀傅瘡上效傅藥治疳後虚熱小便腫右以韭菜地龍糞煆為末出火毒清油調傅針法治無辜疳腦後項邊有核如彈按之轉動軟而不疼其間有蟲如米粉不速破之則蟲隨熱氣流散淫蝕臟腑以致肢體作癰瘡便利膿血壯熱羸瘦頭露骨髙皆因氣血虚憊所致用針刺破以膏藥貼則愈或因澣濯兒衣露於簷下為飛鳥落羽所汚兒著此衣蟲入皮毛亦致斯疾凡曬兒衣須微火烘之丁奚哺露十全丹治小兒手足極細項小骨髙尻削體痿腹大臍突號哭胸陷或生穀癥是名丁奚虚熱往来頭骨分開翻食吐蟲煩渴嘔噦是為哺露二者皆因脾胃乆虚不能消化水穀以榮血氣致肌肉銷鑠腎氣不足復為風冷所傷柴骨枯露亦有胎中受毒臟腑少血致之此皆無辜種類之疾並難治宜服青皮去穰陳皮去白蓬术煨川芎比五靈脂白豆蔲仁雞心檳榔蘆薈各半兩木香史君子肉焙蝦䗫灰各三錢右為末猪膽汁浸糕糊圓麻子大每服三十圓米飲下有熱薄荷湯下鬾病龍膽湯治孕婦被惡祟導其腹中令兒病也其證下利寒熱去来毫毛鬢髮不悦澤及治婦人有兒未能行時復有孕使兒飲此乳亦作此病龍膽草北柴胡去蘆及苗黄芩桔梗鈎藤皮芍藥甘草炙茯苓各二錢半蜣蜋二枚大黄一兩裹煨温紙右剉散以水一升煮取五合為一劑十嵗已下小兒皆可服若兒生一日至七日分一合為三服八日至十五日分一合半為三服生十六日至二十日分二合為三服二十日至三十日四十日盡以五合為三服皆以得下即止此劑為出腹嬰兒所作若日月長大者以次依此為例必知客忤及有鬼氣可加人參當歸各二錢半一百日兒加一錢一字二百日兒加二錢半一嵗兒加半兩餘准此積滯葱湯圓治積神效巴豆三十五粒用水浸一宿五更初去水後去皮殻心膜不去油另研輕粉半錢滑石五錢鷹糞五錢右為末研飯為圓如粟米大周嵗以下毎用三圓以上四圓未效再加圓數膈上有涎或吐亦無妨如有蟲用苦楝皮少許甘草二寸煎湯五更初先將化蟲藥服了後用此取下春季燈心湯下夏季蘇鹽湯下秋季蘇湯冬季葱白湯下初生兒以一粒放口中乳汁下消積圓治乳積吐乳瀉乳其氣酸臭此由啼哭未已以乳與兒停滯不化得之丁香烏梅五錢炒巴豆十四箇去油殻縮砂仁各等分右為末麪糊圓每服七圓米飲下消鐡丹治食積肚硬帶熱渇瀉或嘔皆因飲食無度多餐過飽飽後即睡得之烏梅八箇取肉巴豆十六粒去殻青皮五錢去穰陳皮五錢去白右為末米糊圓粟米大每服七圓米飲下化鐵亦消盧氏感應圓紅圓子治食積面目腫黄肚熱脹痛覆睡多困酷啼不食或大腸乾澁小便如泔或便利無禁糞白酸臭服之大效方見大方科諸積及痎瘧類蘇感圓治氣積腹痛啼呌利如蠏涎皆因觸忤其氣榮衛不和淹涎日乆得之蘇合香圓感應圓各等分和圓如粟米大紫蘇湯下三十圓立效方見方科中氣澁類異香散取積後調理石蓮肉一兩蓬莪术益智仁京三稜甘草各六兩青皮去穰陳皮去白兩各三厚朴薑汁炒二兩右剉散毎服二錢水一盞生薑二片􅀥一枚鹽少許煎通口服鹽湯㸃鹽酒調亦可不拘時服辰砂香附湯平胃散合和滋氣和胃消積每服一錢蘇鹽下多服尤妙方見大方科殺蟲史君餅治因喫食麄肥甘生熱肌瘦體虚口吐清涎唇間腫痛腹中絞痛口鼻中出黒色蟲不治史君子四十箇去殻雷丸半兩定粉二分輕粉半錢青箱子鶴虱一分右為末用雞鴨卵和蒸為餅先將此藥隔日夜五更時服將葱湯圓取下方見前褐圓子湯毎服二錢苦楝根少許煎湯調服近病亦效見前化蟲圓鶴虱去土胡粉檳榔白礬半生半枯苦楝根皮各