body:
  text: 世醫得效方卷二元危亦林撰大方脈雜醫科傷風桂枝湯治足太陽膀胱經傷風脈陽浮而隂弱陽浮者熱自發隂弱者汗自出濇濇惡寒洒洒惡風翕翕然發熱鼻鳴乾嘔又太陽證宜汗其人失血及下利則頻與服使體潤漐漐連日當自解桂枝去皮芍藥各三兩甘草一兩右剉散毎服二錢水一盞半生薑三片􅀥一枚擘破共煎至七分去滓温服不拘時惟冬春初可行自春及夏至以前可加黄芩半兩夏至以後加知母半兩石膏二兩或升麻半兩若病人素虚寒者不用加减無汗者不宜服之杏子湯治足陽明胃經傷風惡食口苦咽乾腹滿微喘發熱惡風自汗嗜臥身重小便難潮熱而噦其脈浮弦長而數悉主之杏仁去皮尖半夏湯去滑五味子各三錢半芍藥桂心細辛乾薑大黄蒸甘草炙各三錢茯苓四錢右剉散毎服四錢水一盞半煎至七分去滓食前服柴胡加桂湯治足少陽膽經傷風四五日身熱惡風頸項強脇下滿手足温口苦而渇自汗其脈陽浮隂弦或發汗多亡陽譫語可以此和其榮衛通具津液自愈柴胡一兩三錢半夏湯去滑字四錢一甘草炙一錢一字芍藥黄苓人參辣桂各半兩右剉散毎服五錢水一盞半薑五片􅀥一枚煎至七分去滓空心温服桂枝芍藥湯治足太隂脾經傷風自汗咽乾腹滿自利不渇四肢倦怠手足自温其脈弦大而緩者桂心半兩白芍藥三兩右挫散每服五錢鹽水一盞半薑五片􅀥一枚煎七分去滓温服腹痛甚者加大黄一兩桂附湯治足少隂腎經傷風胸滿心煩咽喉痛自汗腰疼連胻骨酸痛嘔吐涎沫頭痛其脈沈弦者附子生去皮臍桂心乾薑芍藥甘草炙茯苓桃仁去皮尖麪炒各一兩右剉散每服四錢水二盞煎七分去滓食前服或咽喉痛加桔梗半兩八物湯治足厥隂肝經傷風惡風而勌自汗小腹急痛寒熱如瘧骨節煩疼其脈尺寸俱微而遲者桂心當歸川芎前胡防風各三分芍藥一兩半甘草炙茯苓各半兩右剉散毎服四錢水一盞半薑五片􅀥三枚煎至八分去滓空心服傷暑五苓散治傷暑煩渇引飲無度兼治傷風温熱表裏未解煩渇引水水入即吐或小便不利及汗出表解煩渇不止又治霍亂吐利黄疸瘟疫澤㵼二兩半桂心一兩猪苓去皮赤茯苓去皮白术去蘆各一兩半右為末毎服二錢沸湯調下不拘時候服訖多飲熱湯汗出即愈温熱病加甘草一兩炙瘀熱在裏身發黄疸濃煎茵蔯湯食前服疸病發渇及中暑引飲白水調服小兒加白术末少許發虚熱毎料綿黄茋人參麥門冬去心各一兩分隂陽退實熱山茵蔯車前草毎服各二根止㵼加紫蘇陳米各少許薑汁半匕久痢加肉豆蔲五錢毎服鹽梅一枚赤痢烏梅一枚粟殻二枚去􅎞赤膜醋炒白痢粟殻二枚製同上粟米一撮腹痛南木香半錢渇烏梅一箇枇杷葉二片去白毛糯米一撮伏暑鼻衂白茅花一把小便血以生料者毎服加梔子三箇車前子一撮煩熱心神恍惚朱砂一字燈心二十莖麥門冬二十粒去心淡竹葉十片車前草二根傷暑吐血白茅花一握熱瀉車前子一撮麥門冬二十粒去心暑濕㵼紫蘇五葉木𤓰三片車前子一撮傷暑頭痛濃煎葱白湯大便水瀉小便不利加真車前子末少許又方治燥渇去桂心加人參謂之春澤湯濕㵼身痛加蒼术少許秋多淫雨人患濕疫在冬時服之效縮脾飲治伏暑熱煩渇燥悶乾霍亂草果去皮縮砂烏梅去核兩各一乾葛白扁豆生薑切片日乾各五錢重右剉散毎服五錢水一盌煎至八分浸冷服或欲温欲熱亦可斟酌傷暑發熱頭目痛用以吞消暑丸方見後中暑類卻暑散治冒暑伏熱頭目眩暈嘔吐㵼利煩渇背寒面垢赤茯苓去皮甘草生各四兩寒食麫生薑各一斤細切捜麫令勻右為末毎服二錢新汲水調下或湯㸃服不拘時候香薷丸治大人小兒傷暑伏熱燥渇瞀悶頭目昏眩胸膈煩滿嘔噦惡心口苦咽乾肢體困倦不思飲食或發霍亂吐利轉筋並宜服之香薷去梗紫蘇去梗乾木𤓰各一兩丁香甘草炙檀香白茯苓去皮藿香各十兩右為末蜜丸彈子大毎一丸至二丸熱水嚼下或新汲水化下亦得小兒半丸桂苓甘露散治傷寒中暑冒風飲食中外一切所傷傳受濕熱内甚頭痛口乾吐㵼煩渇喜飲冷小便赤澁大便急痛濕熱霍亂吐下腹滿痛悶及小兒吐㵼驚風茯苓一兩去皮甘草二兩炙白术半兩澤瀉一兩桂半兩去皮石膏二兩寒水石二兩滑石半兩猪苓半兩右為末毎服三錢温湯調下新水亦得生薑湯尤良小兒毎服一錢六和湯治心脾不調氣不升降霍亂轉筋嘔吐泄瀉寒熱交作痰喘咳𠻳胸膈痞滿頭目昏痛肢體浮腫嗜臥倦怠小便赤澁并傷寒隂陽不分冒暑伏熱煩悶或成痢疾中酒煩渇不食婦人胎前産後並宜服之人參縮砂甘草炙杏仁去皮尖半夏湯炮七次各三兩白扁豆薑汁略炒赤茯苓去皮藿香葉拂去塵木瓜各二兩香薷去梗厚朴薑汁兩各四右剉毎服四錢水一盞半生薑三片􅀥子一枚煎至八分去滓不拘時候服冷香飲子老人虚人伏暑煩燥引飲無度惡人疲倦服凉藥不得者草果仁三兩附子炮去皮臍橘紅各一兩甘草炙兩半右剉散毎服一盌水二盌生薑十片煎半盌去滓沈冷旋旋服不拘時潑火散傷暑煩燥發渇口乾及治血痢婦人熱崩青皮去白赤芍藥黄連去鬚地榆各等分右為細末毎服一錢冷水調下如蓄熱而氣血妄行加甘草等分枇杷葉散治中暑伏熱煩渇引飲嘔噦惡心頭目昏眩或隂陽不和致成霍亂吐利轉筋煩燥枇杷葉去毛炙半兩香薷三兩白茅根甘草炙麥門冬去心乾木𤓰各一兩陳皮去白焙半兩丁香厚朴去皮薑汁炙各半兩右剉散毎服五錢水一盞半生薑三片煎服煩燥沈冷服如脾虚感暑嘔吐不食以此藥煎去滓吞消暑丸六十粒立効體本虚嘔吐昏倦手足冷除茅根麥門冬加附子炮用香薷散治臟腑冷熱不調飲食不節或食腥膾生冷過度起居不節或露臥濕地或當風取凉而風冷之氣歸於三焦傳於脾胃脾胃得冷不能消化米榖致令真邪相干腸胃虚弱飲食變亂於腸胃之間致吐利心腹疼痛霍亂氣逆有心痛而先吐者有腹痛而先利者有吐利俱發者有發熱頭痛體疼而復利吐虚煩者或但吐利心腹刺痛者或轉筋拘急疼痛或但嘔而無物出者或四肢逆冷而脈欲絶或煩悶昏塞而欲死者此藥悉能主之香薷去梗四兩厚朴去麄皮切碎薑汁炒令黄白扁豆各二兩右剉散毎服五錢水一盞酒一分同煎七分去滓水中沈冷連喫二服立效不拘時候治中暑復傷風搐搦不省人事者宜先服蘇合香丸候其甦省却以此藥加黄連羌活各一錢暑濕腫滿香蘇散合和加生薑三片木𤓰二片車前草二根伏暑頭疼小便澁濁加山茵蔯車前草各二根霍亂吐利加木瓜二片藿香少許生薑三片傷暑腹痛加陳大蓼三寸陳壁土一指頭大木瓜二片臟腑有熱便血加黄連厚朴枳殻烏梅各一錢小便血加瞿麥穗一錢車前子一撮燈心二十莖感暑濕手足繾痛痺冷合和香蘇散毎服四錢薑三片木𤓰二片陳大蓼三寸煎服留滓再加葱葉橘葉竹葉陳大蓼各一握水一斗煮七分先薫後洗立效脚氣作痛行步艱辛毎料加入木𤓰羌活炒蒼术枳殻去穰陳皮半夏甘草各一兩成十味毎服加生薑三片葱白二根脾胃不和嘔逆惡心冒暑心腹脹滿去羌活加藿香烏梅各一錢壯熱大渇肚皮熱或五心熱加燈心二十莖麥門冬去心白茅根各一錢淡竹葉十片晩禾根凈洗一握四時感冒嘔泄亦合和香蘓散毎服四錢加生薑五片木𤓰二片諸熱毒小便赤濁毎服四錢加車前子黄連去鬚各一錢則清利以上皆温服暑月煩燥潮熱甚加茵蔯車前草各二莖苦竹葉十片山梔子三枚擘破心胸煩燥只依本方宜淸前血冷服暑月潮瀉亦加烏梅車前子一錢陳米一撮暑月虚人腹痛嘔血加丁香白术炮附子木𤓰各半錢生薑五片亦名六和湯解暑和脾胃加人參陳皮白术白茯苓黄茋木𤓰甘草毎料各一兩亦名十味香薷散傷暑單有頭痛正方加山茵蔯多服取效以上並熱服常服消暑健脾或為末煉蜜為膏酒服亦妙陳大蓼須用家園種者江邉赤蓼則不用小黄龍湯治伏暑發熱作渴嘔吐惡心及年深暑毒不差黄連一斤去鬚酒二升半右將黄連以酒煑乾為度焙為末用麫糊丸如梧子大毎服三十丸熟水吞下又治傷酒過度臟毒下血或泄瀉米飲下食前日二服酒及熱物過度吐血茅花湯下來復丹治上盛下虚裏寒外熱伏暑泄瀉如水及治中暑方見後痼冷類小柴胡湯治傷暑外熱内渴於内更加生薑三片烏梅一箇麥門冬三十粒去心煎服不拘時候方見前傷寒陽證類竹葉石膏湯治伏暑内外熱熾煩燥大渇方見前傷寒通冶類二陳湯治傷暑復感冷及内傷生冷嘔吐方見前飲類濯執散治傷暑迷昏及泄瀉霍亂作渇立效亦能解諸毒白礬五倍子烏梅去核甘草各一兩右為末入飛羅麫四兩拌勻毎服二錢新汲水調下雖平日不敢飲冷者服之不妨真有竒效為丸如彈大隂乾冷水調下亦可通苓散治傷暑潮熱煩渴小便不利方見後泄瀉類毎服三錢水一盞半燈心二十莖麥門冬二十粒去心淡竹葉十片車前穗五莖煎不拘時候服渇甚晚禾根少許白茅根五莖枇杷葉二皮去白毛蜜塗微炙煎服傷濕香蘇散加蒼术川芎白芷木𤓰對合各用四錢生薑三片煎服日近逺年傷濕倦弱如虚損多服取効方見前傷寒和解類黄耆建中湯治傷濕鼻塞身痛黄耆㣲炙辣桂各二兩甘草炙二兩白芍藥六兩右挫散毎服三錢薑四片􅀥一枚煎食前服不換金正氣㪚治傷濕益脾順氣加茯苓一兩生薑毎服三片方見後時疫類术附湯治傷濕大小便自利方見後中濕類茵陳湯治濕氣瘀熱發黄小便秘澁渇引水漿茵陳一兩半大黄半兩小紅梔子十枚右剉散毎服三錢水煎服腎著湯治身重腰冷痺如坐水中形如水狀及不渇小便自利飲食如故病屬下焦從身勞汗出衣裹冷濕而得之腰以下冷痛腰重如帶五千錢甘草炙白术各二兩去蘆乾薑炮茯苓各四兩去皮右剉散毎服四大錢水一盞半煎十分去渣食前服滲濕湯治坐臥濕地或為雨露所襲身重脚弱闗節重疼發熱惡寒或小便秘澁大便飡泄或汗出衣裏濕漬得之腿膝或腫小便利反不渇蒼术米泔浸白术去蘆甘草炙各二兩乾薑炮茯苓各四兩陳皮丁香各半兩右剉散毎服四錢用水一盞半生薑三片紅􅀥一枚煎至七分去渣温服或腹膨腰脚重滯青木香丸熟水下兼服方見諸疝類𤓰蒂搐鼻法治傷濕鼻塞頭疼爪蒂不以多少㕮咀為細末口含水搐一字許入鼻中流出黄水即效中寒附子理中湯治五臓中寒口噤四肢強直失音不語大附子炮去皮臍人參乾薑炮甘草炙白术各等分右為剉散毎服四大錢水一盞半煎七分去渣不以時服口噤則斡開灌之薑附湯治中寒卒然暈倒或吐逆涎沫狀如暗風手脚攣搐口噤四肢厥冷或復燥熱乾薑炮附子炮去皮臍各一兩右為剉散毎服四錢水盞半煎七分去渣食前服入肝加木𤓰入肺加桑白皮入脾加白术入心加茯苓隨證加之挾風加防風兼濕多加白术筋脈牽急加木𤓰肢莭疼痛加桂心人參白术各等分仍須暖室添衣被火等圍護中暑又名中暍大黄龍丸治中暑眩暈不知人身熱惡寒頭疼狀如傷寒或往來寒熱煩燥渇甚嘔吐泄瀉常服去暑毒分隂陽硫黄消石各一兩雄黄通明者滑石白礬寒食麫四兩右為末滴水為丸如梧桐子大毎服五丸至七丸漸加至二十丸新汲水下昏塞不知人事以水化開灌之中暑忌得冷此藥却以冷水下之乃熱因寒用疑者釋之益元散治中暑身熱嘔吐熱瀉赤痢癃閉澁痛利小便益精氣通九竅六府消畜水止渇除煩熱心燥百藥酒食等毒解疫癘及兩感傷寒及婦人下乳催生兼吹乳乳癰孕婦莫服白滑石六