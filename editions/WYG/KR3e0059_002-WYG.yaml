白不進飲食脈來弦數毎服生薑七片􅀥二枚多寒加炮附子方見傷寒隂證類小柴胡湯與養胃湯合和名加減清脾湯寒多熱少多用養胃湯熱多寒少多用柴胡湯寒熱均則平用生薑桃柳枝地骨皮紅􅀥煎多服取效藿香正氣散治瘧徧身腫滿加草果縮砂一兩方見傷寒隂證類小柴胡湯與五苓散合和名柴苓湯治傷風傷暑瘧大效毎服薑三片麥門冬二十粒去心地骨皮少許煎温服方見傷寒熱證類五苓散方傷暑類柴胡桂薑湯治瘧或有寒者但寒不熱者亦治久不愈者北柴胡四分桂心一分半黄芩一分半栝樓根二分牡蠣杵碎炒甘草乾薑各一分右剉散毎服五錢水一盞半煎八分温服加味二陳湯毎服四錢薑五大片加旋覆花四錢煎日四服不拘時候久瘧有效虚弱人菓附湯兼服方見前截瘧勝金丸治一切瘧病發作有時葢因外邪客於臟腑生冷之物内傷脾胃或先寒後熱先熱後寒或寒多熱少或寒少熱多或但熱不寒或但寒不熱或連日不發或間日而發或發後三五日再發寒則肢體顫掉熱則舉身如火頭痛惡心煩渇引飲氣喘急口苦咽乾背膂痠疼腸鳴腹痛或痰聚胸中煩滿欲嘔並皆治之㯽榔四兩常山酒浸煎焙一斤右為末水麫糊為丸梧桐子大毎服三十丸於發前日晩臨卧用冷酒吞下便睡不得喫熱物茶湯之類至四更盡再用冷酒吞十五丸忌食一切熱羮湯粥食牛間可食温粥至晩方可食熱忌一切生冷魚腥等物又方川恒山二兩為末雞卯二箇取漬為丸治證服餌一如上法露星飲常山一味細剉每用五錢半酒半水煎去滓於當空以薄綿封葢椀露至天微明時取盪温服些小嘔泄無妨辰砂丸治瘧之為苦異於諸疾世人治之不過用常山砒霜之類發吐取涎而已雖安所損和氣多矣有人病瘧半年前人方術用之略盡皆不能效服此遂愈辰砂有牆壁光明者阿魏真者兩各一右研勻和稀米糊丸如皂角子大空心濃煎人參湯下一丸瘧之為病雖在忌醫之列但體認得所因真的按方用藥無不切效一方用白茯苓甘草各三錢分三服水一盞煎臨發時䪺服自效又方生薑四兩連皮搗爛止用自然汁納明日當發隔夜安排將紗片遮葢露一宿五更初攪動澄者一上吞吃或有痰吐任之即安或微利亦安灸法大椎在第一椎下䧟中宛宛中灸三七壯至四十九不止或灸第三骨節亦可大陵穴在掌後兩骨間灸三壯立效噫譆二穴在肩膊内廉第六椎兩傍三寸其穴抱肘取之灸二七壯至一百壯止凡灸瘧必先問其病所發之先先尋穴灸之亦可針法於十指近甲梢針出血及看兩舌下有紫腫紅筋亦須針去血效痰病順元散治暴患痰厥氣虚身微冷面淡白昏悶不知人事方見風科虚證類星香飲治暴患痰厥氣盛身熱面赤方見中風熱証類單方治暴患痰厥不省人事右用生清油一盞灌入喉中須㬰逐出風痰立愈眩冒白薇湯治乎居無苦疾忽如死人身不動揺黙黙不知人目閉不能開口噤不能言或微知人惡聞人聲但如眩冒移時方寤此由已汗過多血少氣併於血陽獨上而不下氣壅塞而不行故身如死氣過血還陰陽復通故移時方寤名曰鬱冒亦名血厥婦人多有之白薇當歸各一兩人參去蘆半兩甘草一分右剉每服五大錢水二盞煎至一盞去渣温服不拘時倉公散𤓰蒂藜蘆礬石煅雄黄各等分右為細末少許吹入鼻中得􅅉為度此藥能起死人卒厥尸厥追魂湯治卒厥暴死及主客忤鬼擊飛尸奄忽絶氣不覺口噤麻黄去節三兩杏仁去皮尖二百五十箇甘草炙兩一右為剉散每服四錢水一􅊦半煎七分去渣灌之通治諸感忤或口噤拗口不開去齒下湯入口活不下分病人髮左右提搦肩引之藥下漸甦令服盡取效千金有桂心二兩金匱云寸脈沈大而滑沈則為實滑則為氣實氣相摶血氣入臓則死入胃則愈若卒厥唇口青身冷為入臓即死身和汗出則愈内鼻散治尸厥脈動而無氣氣閉不通靜而若死名卒厥菖蒲去毛為末毎用二字内兩鼻中吹之令入仍以桂末安於舌下硫黄散治尸厥奄然死去四肢逆冷不省人事腹中氣走如雷鳴焰硝半兩硫黄一兩右二件細研如粉分作三服每服用好酒一大盞煎覺焰起傾於盞内葢候温灌與服如人行五里又進一服不過三服即安又方附子七錢炮熟去皮臍為散分作二服每服用酒三盞煎至二盞温服又方生薑自然汁半盞酒一􅊦煎令百沸灌二服却用灸灸法頭上百㑹穴四十九壯兼臍下氣海丹田穴三百壯覺身體温煖即止沙證艾湯試沙證江南舊無今所在有之原其證古方不載所感如傷寒頭痛嘔惡渾身壯熱手足指末微厥或腹痛悶亂須㬰能殺人先濃煎艾湯試之如吐即是右用五月蠶退紙碎剪安椀中以碟葢之以百沸湯泡艾椀許仍以别紙封褁縫良久乗熱飲之就臥以厚被葢之汗出愈又近時多有頭額上及胸前兩邉有小紅㸃在於皮膚者却用紙撚成條或大燈草微蘸香油於香油燈上㸃燒於紅㸃上焌爆者是又名水傷寒却用樟木煎湯服或葱頭湯汗出愈如腹痛不止又用針於兩手十指近甲梢針出血即愈鹽湯吐法治心腹絞痛冷汗出脹悶欲絶俗謂攪腸沙今攷之此證乃名乾霍亂此亦由山嵐瘴氣或因饑飽失時隂陽暴亂而致急用鹽湯吐法此法救人不一右用鹽半錢許以熱湯數椀泡鹽令患人盡服連致數椀不得住手方可却以雞羽埽咽喉間即時吐所吃鹽湯盡出即時愈又法治沙證但用苧麻蘸水於頸項兩肘臂兩膝腕等處戛掠見得血凝皮膚中紅㸃如粟粒狀然後葢覆衣被吃少粥湯或葱頭湯或清油生葱茶得汗即愈此皆使皮膚腠理開發鬆利誠不藥之良法也又法兩足墜痛亦名水沙可於兩顋曲腕内兩筋兩骨間刺出血愈名委中穴時疫十神湯治時令不正瘟疫妄行感冒發熱或欲出疹此藥不問隂陽兩感風寒並宜服之川芎甘草炙麻黄去根乾葛升麻赤芍藥白芷陳皮香附子炒毛去紫蘇各四兩右剉散毎服三錢水盞半薑五片煎七分去渣熱服不以時候如發熱頭痛加連鬚葱白中滿氣實加枳殻煎不換金正氣散治四時傷寒瘴疫時氣頭痛肚熱腰背拘急五勞七傷山嵐瘴氣寒熱往來五膈氣噎咳嗽痰涎行步喘乏或霍亂吐瀉臟腑虚寒下痢赤白並宜服之厚朴去皮薑汁炒藿香甘草半夏蒼术米泔浸陳皮各等分右剉散每服三錢水一􅊦半生薑三片􅀥二枚煎八分去渣食前稍熱服忌生冷油煎毒物不伏水土宜服之常服進飲食調脾胃一方加白茯苓桂枝黄芩湯治風疫脈浮數而不弱頭項疼腰脊痛發熱惡風逓相傳染缺傷寒證候頃刻傳變傷寒治法繩尺謹嚴非可以輕心視之也其間種類不一條例浩繁是固難矣至於隂極發燥熱極發厥隂證如陽陽證如隂脚氣似乎傷寒中暑似乎熱病與去蓄血一證上熱下冷乍閧乍寒甚至四肢發厥昏迷悶絶凡此等類尤當審思而明辨之若疑似未别體認未明姑且試探切不可妄投決病之劑方匕雖微死生係也謹之哉傷寒篤證揺頭直視形如烟熏心絶唇肳反青四肢多汗肝絶反目直視狂言遺尿腎絶汗出髪潤喘而不休肺絶環口黧黒柔汗發黄脾絶汗出如油喘促無已水漿不下形體不仁命絶大發濕家汗則成痓熱而痓不治發濕温汗身青面變耳聾不語曰重暍不治發風温汗必譫語並不治發風濕中濕汗並逆發動氣汗不治發少隂汗九竅出血曰下厥上殞不治發少陽汗則譫語發汗只在頭面不至遍身鼻衂不止者逆發汙不至足者逆諸逆發汗劇者言亂目眩並不治當汗無汗服麻黄數劑七日汗不出者不治汗出如珠不流不治汗出如油口噤肉戰呻吟喘促不治汗後嘔吐水藥不入口者逆熱病脈燥盛而不得汗不治汗後不為汗衰復大熱脈躁疾狂言不食曰隂陽交不治忽冒昧無脈服藥提汗解則生若無汗脈不至者不治少隂厥逆無脈服藥通脈其脈漸續則生暴出則不治下利厥逆無脈灸之脈不回身不温微喘不治少隂四逆下利惡寒而拳發躁無脈不治下利日十餘行其脈反實者逆少陽陽明合病下利脈長大而弦曰負不治陽病見隂脈不治發斑屬陽見隂脈不治代脈不治吐血衂血脈反浮大而牢不治隂易陽易脈離經外腎腫腹中絞痛手足拳攣不治欬逆上氣脈散者不治譫語脈反沈微四肢厥冷不治脈隂陽俱虚熱不止者不治七八日以上發大熱難治舌本爛熱不止者逆下利發熱或汗不止厥不止並不治下利發熱厥逆燥不得眠不治譫語直視或喘滿或下利並不治譫語屬陽見隂證者逆傷寒脈乍疎乍數不治發斑先赤後黯面色黧晦不治發斑大便自利不治發黄而變黒不治口乾舌黒不治口張目陷不治張口出氣乾嘔骨骸熱痛者逆咳逆不止者不治心下痞悶上氣喘麄者逆霍亂喘脹煩燥不治誤下温家額汗喘促或小便不利大便自利不治頭汗内外闗格小便不利此為陽脱不治腹滿欬逆不得小便不治腹大滿而下泄不治若脈洪緊而滑尤可慮臟結如結胸舌白胎隂筋引臍腹痛時時下利不治結胸證具加煩躁不治臓厥七八日發厥膚冷煩燥下利無時暫安不治少隂吐利厥逆煩燥不治悶利反能食者曰除中不治四肢厥逆臍下絞痛石硬眼定者逆厥隂脣青舌卷黒而耳聾囊縮不治頭連腦痛甚手足俱寒不治隂毒陽毒過六七日不治兩感難治狐惑咽乾聲啞脣瘡不治赤斑五救其一黒斑十救其一尋衣摸空者逆世醫得效方卷二
