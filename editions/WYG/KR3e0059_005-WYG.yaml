body:
  text: 世醫得效方卷五元危亦林撰大方脈雜醫科脾胃虚證丁沈透膈湯治氣滿不快飲食不入胷膈痞悶或時膨脹腹中刺痛等證丁香五錢沈香五錢木香五錢並不見火人參去蘆半兩青皮去白神麯各一兩茯苓去皮甘草炙陳皮去白厚朴薑汁製草果仁藿香葉去土半夏泡七次縮砂仁去殻各二兩白豆蔲去殻白术去蘆炒麥蘖炒香附子炒去毛各一兩右剉散每服三錢水一盞半入生薑三片紅棗一枚同煎去渣熱服又方治氣滿不食以四味香蘇散同煎大人尤宜服未效更服丁香煑散加蓽撥良薑各一兩方見嘔吐類穀神嘉禾散治中滿下虚五噎五膈脾胃不和胸膈痞悶脇肋脹滿心腹刺痛可進飲食或多痰逆口苦吞酸胸滿短氣肢體怠惰面色萎黄如中焦虚痞不任攻擊臟氣虚寒不受峻補或因病氣衰食不復常禀受怯弱不能多食尤宜服之常服育神養氣和補脾胃進美飲食枇杷葉去毛姜汁炙令香熟一兩石斛細剉酒拌和㣲炒一兩沈香鎊三分薏苡仁㣲炒一兩木香三分縮砂去殻一兩杜仲去粗皮用姜汁與酒合和塗炙令香熟焦三分藿香葉去土三分隨風子如無陳小𦂳訶子實者亦得三分榖蘖㣲炒半兩丁香半兩半夏一分用湯洗七遍生薑一分切作片子與半夏同搗爛做餅子炙黄白术去蘆炒二兩青皮去白二兩大腹子㣲炒三分梹榔炒半兩陳皮去白三分桑白皮㣲炒半兩白豆䓻㣲炒去皮半兩人參去蘆一兩五味子㣲炒半兩白茯苓去皮一兩神麯㣲炒一分甘草㣲炒一兩半右剉散每服三錢水一盞入生薑三片肥棗二枚同煎至七分温服不拘時候及療四時傷寒能調理陰陽使無變動尅日得安如療五噎入乾柿一枚同煎十服見效如膈氣吐逆羸困入薤白三寸棗五枚同煎婦人亦可服四君子湯治脾胃不調不思飲食人參去蘆甘草炙白茯苓去皮白术去蘆各等分右剉散毎服三錢水一盞煎至七分不拘時服一方加橘紅名異功散又方加陳皮半夏名六君子湯嘔吐加藿香縮砂泄瀉加木香肉豆蔲附子建中湯治脾氣虚寒腹脇脹滿身體沈重面色萎黄嘔吐不食水榖不化大腑自利肉豆蔲麫裹煨白豆蔲仁附子炮去皮臍厚朴去皮薑汁拌炒白术去蘆乾薑炮紅豆神麯炒各一兩丁香胡椒木香不見火甘草炙各半兩右剉散每服四錢水一盞半生薑五片紅􅀥一枚煎至七分去渣温服參苓白术散理心脾氣弱神昏體倦飲食不進多困少力中滿痞噎心忪上喘嘔吐瀉利人參白茯苓去皮白术去蘆山藥甘草各一兩縮砂仁桔梗去蘆薏苡仁蓮肉扁豆薑汁浸去皮七錢半右為末每服二錢棗湯下小兒量嵗數與之此藥中和不熱久服養氣育神醒脾悦色順正辟邪千金養脾圓治脾胃虚弱停寒畱飲膈氣噎塞反胃吐食心胸痞滿脇肋虚脹胸腹刺痛牽引背膂食少易傷言㣲氣短口苦舌澁惡心嘔􅎪喜睡嚥酸夕病泄利腸胃虚滑病後氣不復常飲食無味形容憔悴酒後痰多人參白术白茯苓去皮甘草山藥炒木香丁香白扁豆炒縮砂仁薏苡仁益智仁藿香葉紅豆肉豆蔲乾薑炮髙良薑三稜炮莪术炮神麯炒麥蘖炒陳皮枳殻茴香炒苦梗炒各一兩右為末煉蜜圓如彈子大毎服一圓細嚼白湯下温酒亦得空心食前常服温養脾元進美飲食治中湯治脾胃不和嘔逆霍亂中滿虚痞或致泄㵼方見傷寒陰證類平胃散治脾胃不和不思飲食心腹脇肋脹滿刺痛口苦無味胸滿短氣嘔􅎪惡心噫氣吞酸面色萎黄肌體痩弱怠惰嗜卧體重節痛常多自利或發霍亂及五噎八痞膈氣反胃並宜服之蒼术去粗皮米湯浸二日一斤二兩厚朴去粗皮薑汁拌炒陳皮去白各一兩二錢甘草炒三分右為末每服二錢以生薑三片紅棗二枚煎湯調服或塩湯調空心食前熱服常服調氣煖胃化宿食消痰飲辟風寒冷濕四時非節之氣為散煎亦可加人參尤妙胃丹朱砂禀太隂之精不經火煆以术附等脾藥隂煉成用平補不僣善治真陽衰虚心火怯弱不養脾土沖和失布中州虚寒飲食不進胸膈痞塞或不食而脹滿或已食而不消痰逆惡心翻胃吐食臟氣虚寒米榖不化心腹絞痛泄利不止應是一切脾胃諸疾不問男子婦人皆可服朱砂大塊不夾石者十二兩半羅參去蘆縮砂去殻肉豆䓻麫裹煨蓽澄茄白豆䓻去殻紅豆髙良薑挫碎附子炮去皮臍白术去蘆厚朴去皮薑汁拌炒丁香不見火藿香葉去土五味子去梗乾薑炮去土胡椒益智仁麥門冬去心草果仁橘紅去白已上各一兩右将人參等二十味各如法修製剉如豆大以銀鍋一口用白砂蜜二十兩将藥一半同蜜拌匀入銀鍋内以夾生絹袋盛貯朱砂懸胎入銀鍋内以桑柴火重湯煮三日三夜取沙淘净焙乾入乳鉢用玉槌研直候十分細米粽為丸如菉豆大陰乾每服十粒加至十五粒空心食前用人參湯送下棗湯亦得如或嘔吐用淡薑湯送下忌食猪羊血補真丸大抵不進飲食以脾胃之藥治之多不效者亦有謂焉人之有生不善攝養房勞過度真陽衰虚坎火不温不能上蒸脾土沖和失布中州不運是致飲食不進胸膈痞塞或不食而脹滿或已食而不消大腑溏泄此皆真火衰虚不能蒸藴脾土而然古云補腎不如補脾予謂補脾不若補腎腎氣若壯丹田火經上蒸脾土脾土温和中焦自治膈開能食矣葫蘆巴炒附子炮去皮臍陽起石煆川烏炮去皮兔絲子淘净酒蒸沈香不見火别研肉豆蔲麫裹煨肉蓯蓉酒浸焙五味子去枝梗各半兩鹿茸去毛酒蒸焙川巴㦸去心鍾乳粉各一兩右為末用羊腰子二對治如食法葱椒酒煑爛入少酒糊杵和為圓如梧子大每服七十丸空心食前米飲鹽湯任下進食散理脾元虚冷不思飲食久病脾虚全不食者及胃虚有風不食只三服便效甘草炙兩一肉桂去粗皮良薑炒陳皮去白青皮去穣各一分訶子五箇煨去核草豆蔲三箇去皮川烏一箇炮右剉散每服二錢水一中盞生薑二片煎七分空心服熱證瀉黄散治脾胃壅實口内生瘡煩悶多渇頰痛心煩唇口乾燥壅滯不食藿香葉去土七錢石膏煅縮砂去殻山梔子去殻甘草炙各半兩防風去蘆四兩右剉碎同蜜酒炒香焙為細末每服三錢水一大盞煎至七分温服不拘時候枳殻丸治脾實心腹壅滯四肢疼悶兩脇脹滿大小便不利方見秘結類橘皮竹茹湯治胃熱多渇嘔􅎪不食赤茯苓去皮陳皮去白枇杷葉拭去毛麥門冬去心青竹茹半夏湯泡七次各一兩人參去蘆甘草炙各半兩右剉散每服四錢水一盞半薑五片煎至八分去渣温服不拘時候翻胃安脾散治胃氣先逆飲食過傷或憂思蓄怒宿食痼癖積聚冷痰動擾脾胃不能消磨榖食致成斯疾女人得之多由血氣虚損男子得之多因下元冷憊有食罷即吐有朝食暮吐暮食朝吐所吐酸臭可畏或吐黄水凡有斯疾乃是脾敗惟當速療遲則發煩渴大便秘水飲纎悉不得入咽不旋踵斃矣髙良姜一兩以百年壁上土三合敲碎用水二碗煑乾薄切成片南木香草果麫裹煨去殻胡椒白茯苓白术丁香陳橘皮湯洗去穣人參去蘆各半兩甘草炙一兩半右為末每服二大錢食前米飲入鹽㸃服鹽酒亦得薤白粥治翻胃無問久遠冷熱人參一兩細切以水一大升煎取三合雞子三箇去黄薤白二莖熟稀粟米粥右以雞子白及薤白粟等三味熟調攪然後煖人參湯相和更調攪䪺服之不限早晩服無忌當時便定准前服萬不失一如思飲食即與粟米粥飲漸漸加粳米和之熟水草果飲法烏梅肉四兩草果乾薑炮各三兩赤茯苓二兩甘草炙半兩右剉散每服用半兩水一碗半煎至一碗去滓磁器盛和熟水随意服之桂苓散治翻胃發渴半夏四錢桂心甘草各三錢赤茯苓四兩澤㵼四兩右剉散每服四錢生薑煎服三稜煎丸治宿食積聚翻吐酸􅁾方見諸氣類正胃散治翻胃嘔逆藥食俱不下結腸三五日至七八日來大便不通如此者必死之疾白水牛喉一條去兩頭節并筋膜脂肉節節取下加阿膠片黑牛不可用須就宰牛人買下修治好臨病時旋炙修合右用喉節以好米醋一大盞浸頻翻令匀㣲火炙乾再蘸再炙醋盡為度存性不得見太陽研為末每服一錢食前用陳米飲調下輕者一服見效靈砂丹治脾疼翻胃靈砂一兩蚌粉同炒畧變色二兩丁香胡椒各四十九粒右為末生姜自然汁煑半夏糊圓如梧子大每服三十丸翻胃煨生薑湯吞下虚人脾痛炒鹽湯下青金丹治一切吐逆水銀八錢生硫黄右二件入無油銚内用慢火化開以柳木箆子撥炒或有烟焰以醋洒之結成砂子再研為細末用米粽尖杵和為圓如菉豆大每服三十丸用姜橘皮煎湯送下不拘時服大掌中金治翻胃服水藥不得者大綿附一箇生姜自然汁一椀煑乾為度母丁香一箇為末以少許安掌中心舐喫立效丁附散治翻胃大附子一箇切去葢刳令空入丁香四十九粒以葢覆之線縳着置銀器中浸以生姜自然汁及葢而止慢火煑乾為度右為末用一錢匕糝舌上漱津下若煩渴徐徐食糜粥忌油膩生冷大倉圓治脾胃虚弱不進飲食翻胃不食亦宜服之陳倉米一升用黄土炒米熟去土不用白豆蔲二兩縮砂仁二兩右為末用生姜自然汁法圓如梧子大每服一百圓食後用淡姜湯送下小半夏圓治翻胃及不忺飲食半夏湯洗十次胡椒右等分為末薑汁圓如梧子大每服三五十圓薑湯下六丁圓治翻胃如神五靈脂醋炙生辰砂一錢母丁香一兩不見火右為末入黄狗膽糯米粽子尖為圓如鷄頭大每用姜湯化下香牛飲治哽噎翻胃吐食神效先以羯牛用繩掛開牛口以浄布巾抹令口舌浄却拖牛舌出來候有涎出以椀盛之每服用八分盞為一服研好麝香末一捻打匀却以銀盞盪令温先以絹帛束縳中脘胃口令極𦂳候氣喘乘熱解開隨氣喘一二口便服服時先對病人説煑白粥惱煩之并煎丁香汁和粥服藥罷隨與粥喫鹽衮圓治翻胃膈氣丁香木香肉豆蔲縮砂厚朴陳皮胡椒蓽撥沉香各等分右為末以大蒜瓣子不拘多少每瓣作二瓣入去殻巴豆一粒用餅藥調麫裹蒜片慢火煨熟去巴豆及麫只將蒜研成膏將前項藥末一半捜和為圓如梧子大每服三十圓於鹽内衮過蘿蔔湯調前藥末二錢吞下神效温胃散治翻胃真附子一箇去皮臍分作四塊生薑一兩研水一盌慢火同煑至水盡取附子切焙右為末每服一錢空服鹽湯下治翻胃嘔吐便秘結虛冷者用靈砂或養正丹温而利之又蘇合香圓用四分感應圓用六分夾研作細圓薑汁泡沸湯下此亦温利若大便熱結用蜜煑凝捻作指鋌納後部導之或用獖猪膽一枚取汁入法醋少許以筆蘸滴灌於後部或燒皂角於桶内熏􅂖道或用連根葱白一握漢椒五十粒搗細作餅焙熱和輕粉掩臍續以葱椒煎湯熏盪身下又方治翻胃真蚌粉右每服二錢薑汁米飲調下治吐逆不止真黄丹四兩研細用米醋半升入銚内煎令乾更以火煆通紅令研細為末水米飯為圓如梧子大醋酵湯吞七圓不以時服灸法兩乳下各一寸以瘥為度又灸臍上一寸二十壯又灸内踝下三指稍斜向前三壯中腕一穴在臍上四寸足三里二穴在膝下三寸各灸七壯或九壯其效尤著導引方除腹肚冷風宿疾積胃口冷食欲進退吐逆不下正坐兩手向後捉腕反拓席盡勢使腹絃絃上下七左右換手亦然乾食方惟食乾飯餅餌盡去羮飲水漿藥亦用圓自不反動調理旬日竒效有人三世死於胃及至孫收效此方咳嗽風證神术散治四時瘟疫頭痛項強發熱增寒身體疼痛及傷寒鼻塞聲重咳嗽頭昏並皆治之蒼术五兩米汁浸一宿切焙香白芷細辛去葉土羌活去蘆川芎甘草炙各一兩右剉散每服三錢水一盞生薑三片葱白三寸煎七分温服不拘時候如覺傷風鼻塞為末葱茶調下三物湯治感冒風邪鼻塞聲重語音不出或傷風傷冷頭目痛眩四肢拘倦咳