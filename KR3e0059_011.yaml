疹豆入眼决明子赤芍藥各一錢半𤓰根甘草各一錢右為末毎服一錢蜜水調下羌菊散治疹瘡後毒氣不散生翳障并治暴赤眼疼翳障著明羌活蟬退去足翼土防風蛇退菊花榖精草木賊甘草梔子白蒺藜大黄黄連沙苑蒺藜各半兩右為末毎服一錢清米泔温煖調下竒方治瘡疹入眼用兎屎焙乾為末茶清調下瘡疹安後方可服多服即愈仍治昏翳又治豌豆瘡入目痛楚恐傷眼睛浮萍陰乾為末毎服三錢隨記大小以羊子肝半箇入盞内以杖􅀈碎爛投水半合攪取汁調下食後服不甚者一錢差已傷目者十服差蜜蒙花散治疹豆瘡并諸毒氣入眼昏暗生翳膜蜜䝉花一錢半青箱子决明子車前子各半錢右為末白羊肝一片破開作三片摻藥令勻却合作一片以濕紙裹火煨於地上出火毒米泔嚼下空心服决明圓治豆瘡入眼雖赤白障翳膜遮漫黒睛但得瞳子不陷者可治之石决明煅川芎黄蘗各一兩蒼术半兩米泔浸右為末用兎肝成無以白羯羊肝代之研爛捜和圓如緑豆大毎服二三十圓食後臨卧米泔下又方用榖精草煮白杮喫仍用緑豆根燒灰淋水以上面清者洗下面濃者服之通聖散治豆瘡入眼生翳緑豆皮榖精草去根白菊花各一兩右剉散毎服二大錢乾杮一枚生粟米泔一盞同煎候米泔盡祇將乾柿去核食之不指時候日三枚淺者五七日可效逺者半月决明散浮萍散治斑瘡入眼方見眼科通治類熏藥真榖精草蛤粉各等分毎服二錢水一盞入猪肝二片青竹葉十皮煎熟先熏後服洗方右以黄連去鬚白滑石銅青用絹帛包泡湯候温洗塞耳丹治疹瘡入眼右以水銀一錢國丹五錢同圓作六圓入鎔銀窩中圓瓦上葢濕紙糊䕶定用香爐盛炭火燒一日後取出以薄綿裹之疹瘡在右則塞右耳在左塞左耳立見墜下消毒加味犀角飲治毒氣壅遏壯熱心煩瘡疹雖出未能匀透口舌生瘡不能吮乳牛蒡子三兩荆芥穗五錢甘草炙兩一防風川升麻各七錢半犀角三錢麥門冬去心桔梗去蘆各五錢右剉散毎服二錢水一盞煎去滓令温時時令呷或頻灌之大便利不宜服射干湯治瘡疹後身壯熱大便堅口舌生瘡咽喉腫痛餘毒未盡鼠粘子一兩炒升麻甘草射干各三錢半右剉散毎服三錢水一盞煎温服不以時候連翹飲治瘡疹壯熱小便不通餘毒未解連翹瞿麥荆芥木通車前子赤芍藥當歸去尾防風柴胡去鬚滑石蟬退甘草炒一各錢山梔仁去殻黄芩各一錢右剉散毎服二錢加紫草煎温服五福化毒丹治瘡疹餘毒上攻口齒及治藴積毒熱驚惕狂燥頰赤咽乾口舌生瘡夜卧不寜譫語煩渴頭面身體多生瘡癤朱眼等疾亦名青黛圓人參半兩𤣥參兩半茯苓一兩青黛甘草各五錢桔梗一兩牙硝枯過半兩麝香腦子各半錢腦子有金銀箔一方無右為末蜜圓毎兩作十二圓一嵗兒一圓分四服用薄荷湯下瘡疹上攻口齒涎血臭氣生地黄自然汁化一圓用雞翎刷在口内熱疳肌肉黄痩㾪自夜不見物陳粟米泔水化下食後臨睡服甘露飲解毒殊效方見前瘡疹成片方右用黄牛糞乾傅膿多痛甚者乾浄黄土為末傅之瘡徧口中痛不能食者五福化毒丹或生蜜浸清黄柏取汁啖之為愈凡瘡欲成痂頻以面油乳酥清蜜潤之可揭即揭血出無害若乾硬已久必成瘢痕如茶醋如猪肝猪血之屬妄與食之則已脱之迹必為之黯慘然而瘡痂已脱肌肉成靨外不可盥洗太早亦不可以手加之葫荽酒能辟惡氣左右所不可無或蒼术降真用之亦可曰聖瘡七日熱而發七日泡而乾又七日則平復如瘡舊矣大抵調順血氣温和脾胃均平冷熱則瘡出為甚易若實實虚虚損不足而益有餘則瘡出為甚難調解之法無以逾此活血散治疹子出多疼痛及體痛時時呌唤方見前敗草散治瘡疹􅎲搔成瘡膿血淋漓右用多年葢屋爛草或葢牆草不以多少曬乾為末乾貼無毒若渾身瘡破膿水不絶粘沾衣服難以坐卧可用三二升攤於席上令兒坐卧少即乾貼以其草經霜雪雨露感天地陰陽之氣多善解瘡毒或用蕎麥粉荔枝核燒灰糝瘡上亦好糝方治水泡豆瘡苦參滑石蚌粉輕粉川白芷各等分右為末乾糝之立效通治木香散治發瘡疹身熱作渴木香大腹皮人參去蘆桂心赤茯苓去皮青皮去穰前胡去蘆阿棃勒去蘆半夏薑製丁香甘草炙三錢各右剉散毎服二錢水一盞薑二片煎空心温服異功散治豆出欲靨未靨之間頭温手冷腹脹渴瀉急服此切不可與蜜水木香當歸各三錢半官桂去皮白术茯苓各三錢陳皮厚朴去粗皮薑汁炒人參去蘆肉豆䓻丁香各二錢半附子炮去皮半夏薑製各一錢半右剉散毎服二錢水一盞薑二片棗二枚煎服白术散治豆已靨身熱不退清神生津除煩止渴人參白术藿香葉木香甘草白茯苓各一兩乾葛二兩右剉散毎服二錢水一盞煎不以時温服人參麥門冬散治發熱煩渴麥門冬一兩去心人參去蘆甘草炙陳皮白术厚朴薑汁炒各半兩右剉散毎服二錢水一盞煎不拘時微温服消風散治疹豆或發透或未透忽面青暴吼是為風邪所傷此藥主之疹豆證以耳冷尻冷足下冷及耳後有紅縷驗之然湏見心胸間細㸃如粟起則為真是加蟬退末方見同科熱證類五苓散治小便赤澁加燈心十莖麥門冬去心車前子各半錢煎湯調人參湯加枳殻去穰切少許治大便秘結内煩外熱未效更加四順清凉飲少許方見大方科傷暑及傷寒陽證類人參湯即小柴胡湯四順清凉飲治同下熱實者用方見大方科積熱類大如聖湯治瘡疹毒攻咽喉腫痛桔梗甘草生牛蒡子炒各一兩麥門冬去心半兩右為末毎服二錢沸湯㸃細細呷服入竹葉五皮煎湯尤妙枳殻桔梗湯治胸腹脹滿桔梗枳殻麩炒去穰各一兩右剉散毎服二錢水二盞煎至一盞分二服二陳湯治痰壅吐食毎服二錢生薑二片烏梅半箇煎服方見大方科嘔吐類理中湯治下利嘔逆加木香熟附子毎服各一錢半方見大方科泄瀉類豆蔲圓治疹豆滑泄不止水穀不化木香縮砂仁各三錢白龍骨訶子肉各半兩赤石脂枯白礬各七錢半肉豆䓻各半兩右為末麵糊圓如黍米大毎服三十圓至五十圓煎異功散下或瀉水榖白色淡黄色木香散下方見前蘇合香圓治疹瘡為陰邪穢氣所傷亦令變壞可用醋炭熏後以蘇湯化服解之方見大方科中氣類神妙化毒散治豆瘡欲發未發便服之此藥以毒攻毒縱然瘡出亦少決無惡證右於冬月先取人猫猪犬糞各等分於髙處黄土窖五日取出却用沙鍋盛葢鹽泥固濟日乾於臘月八日煅令通紅取出去火毒為末入麝香少許毎用一字蜜調勻温湯化下或挑少許於舌上用乳汁嚥之此方多秘不湏令病家知之二參飲治豆瘡後餘熱不退柴胡甘草炙黒參人參龍膽草各二錢半麥門冬去心半三錢右剉散毎服三錢水一盞煎稍熱服不拘時量大小加減木筆花散治豆瘡出後有餘瘡生塞鼻中不能睡卧右用木筆花研為細末加生麝香少許葱白蘸藥入鼻中數次即通㓕瘢散治豆瘡愈後瘡痂雖落其瘢尤黯或凹或凸用此韶粉即水粉一兩輕粉一兩右同研勻猪脂油調塗又方白蜜不以多少塗於瘡上其痂易落且無疤痕亦不臭穢或用升麻同蜜煎摩痕上并數食之綿繭散治豆瘡後身體及肢節上生疳蝕瘡濃水不絶右以出蛾綿繭不拘多少用白礬搥碎塞入繭内令滿上以炭火燒候白礬汁鹽取出研細毎用乾貼豆瘡内若不早治則潰筋骨以致難治瘧疾表解香蘇香薷散治春傷風夏伏暑作瘧其證自汗惡風先熱後寒或但熱不寒毎服三錢生薑三片葱白二根水一大盞煎服方並見大方科傷寒傷暑類十神湯治夏傷濕秋傷風作瘧其證寒熱自汗嘔吐身疼毎服三錢水一大盞生薑三片木𤓰二片煎秋末感風冷冬又傷寒或感温暖之氣先寒後熱亦服方見大方科時疫類五苓散分陰陽和榮衛用人參少許茵陳車前草各一根煎湯服弱者木𤓰紫蘇湯或服通靈散亦可方並見大方科傷暑類人參湯治熱多寒少毎服二錢生薑二片麥門冬十粒去心淨地骨皮少許煎多服取效即小柴胡湯方見大方科傷寒陽證類草果平胃散治寒多熱少方見大方科痎瘧類争功散治熱瘧多效知母貝母柴胡去蘆常山甘草山梔子㯽榔各五錢蟬退十箇地骨皮去骨五錢右剉散毎服三錢用桃栁枝各五寸煎未效用過路蒙藤五寸煎服截瘧勝金圓方見大方科痎瘧類蕩脾圓化痰消積進食駐顔及治氣喘府積杏仁一兩去皮尖用蚌粉炒令黄色半夏一兩生薑自然汁浸一宿次日焙巴豆五粒去殻并心膜以皮紙出油右為末用大好北棗七枚入燈心水蒸去皮核取肉為圓毎服五圓常服燈心棗子煎湯下駐顔㯽榔煎湯消宿食陳米湯空心臨睡服化痰烏梅湯治瘧蒜湯或薤水下消痞癖此方大效通神餅截瘧有功甘草末三錢綠豆末敗荷葉各三錢砒霜半錢生朱砂一錢半定粉半錢腦子麝香各少許金銀箔十片右煉蜜圓梧桐子大作餅子用嵗半圓或一圓大者二圓而止一日止一服不可過多服時用井花水或桃栁枝煎水磨化向北服了忌燒熱飲食亦可繫於候脉處參苓白术散愈後調理脾胃方見大方科脾胃類癖氣紅圓子治血膜包水僻側於脇旁時時作痛發寒熱瘧家中脘多蓄黄水日久結癖亦效三􅏢煨莪术煨芫花桃仁去皮别研杏仁去皮别研朱砂烏梅炒巴豆右為末醋糊圓小綠豆大朱砂為衣米湯空腹下又方三􅏢莪术川練去核陳皮去白青皮去白芫花右以芫花醋浸一夕炒漸乾入三􅏢莪术同炒又入川楝陳皮青皮同炒焦取為末等分如各半兩杏仁亦用半兩去皮尖别研巴豆二十粒去油膜和勻醋糊圓黍米大一嵗二圓臨睡米飲下此二方稍相似不若於方中和桃仁與烏梅則尤妙又用蒜湯下蕩脾圓化痰涎一日一服或兩服日用如此服蠏水亦可木鼈膏貼痞癖木鼈多用去殻獨蒜半錢雄黄半錢右杵為膏入醋少許蠟紙貼患處灸法兩乳下一寸各二壯痞結枳實理中圓治虚氣痞塞胸膈留飲聚水腹脇或加脹滿手不可近四君子湯加枳實去穰麵炒乾薑泡為末煉蜜圓綠豆大熱湯化下渴加𤓰蔞根下利加牡蠣粉各等分已用經驗桔梗枳殻湯治熱氣痞滿胸膈兩脇按之則痛枳殻去穰桔梗去蘆錢各五半夏湯洗黄芩𤓰蔞仁黄連去鬚錢各三右剉散生薑麥門冬去心煎利黄涎沫即安客忤蘇合香圓治神氣嫩弱外邪客氣獸畜異物暴觸忤口吐青黄白沫水穀鮮雜面色變易喘息腹痛反側瘈瘲狀似驚癎但眼不上竄視其口中懸癰左右若有小小腫核即以竹鍼刺潰之或以指𤓰摘破急作醋炭降真香皂角燻之却服此方見大方科中氣類右毎服一圓薑湯調開頻頻與服次用豉三合水濕搗為圓如雞子大摩兒𩕄上及足心各五六徧次摩臍心及頭上良久擘開自有毛即擲之大法宜辟邪正氣散驚定心延久難為力也雄麝散治客忤腹痛危急雄黄一錢明乳香半錢生麝香一字右為末毎一字刺雞冠血調灌之犀角散治客忤驚啼壯熱天麻犀角麥門冬去心鈎藤朱砂各一錢鐡粉雄黄半錢生麝少許右為末毎服半錢金銀煎湯調但服安神圓亦可方見前黄土散治小兒卒客忤竈中黄土蚯蚓糞各等分右研細水調塗兒頭上及五心良世醫得效方卷十一
