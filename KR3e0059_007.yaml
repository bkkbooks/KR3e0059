body:
  text: 世醫得效方卷七元危亦林撰大方脈雜醫科痟渴肺痟澄源丹治氣實血虛熱在上焦心煩燥渴引飲無度小便數晝夜一二十行有麩片形者此疾多得之飲啖灸煿日就羸瘦咽喉唇口焦燥吸吸少氣不能多語兩腳痠食倍於常不為氣力牡礪粉苦參蜜陀僧知母水銀以白蠟半錢結栝樓根一兩黃丹一兩與水銀沙同研右為末男子用雌豬肚一箇女人用雄豬肚一箇入藥在內以線縫定用繩縛在新磚上别用生栝樓半斤切碎同煮早晨至午時取藥出不用栝樓根只爛研豬肚和藥為圓如梧桐子大每服三十粒食前米湯下日三服十日可去病根真味圓治心虛煩悶或外傷暑熱內積愁煩酣飲過多致煩渴口乾舌燥引飲無度小便或利或不利知母一兩一分川連一兩去毛苦參玄參各一兩鐵胤粉一兩一分研牡礪煆一兩一分朱砂另研二兩麥門冬去心天花粉各半兩金箔銀箔二百片白扁豆煮去皮一兩右為末煉蜜入生栝樓根汁少許圓如梧子大用金銀箔為衣每服二十圓至三十圓先用栝樓根汁下一服次用麥門冬熟水下病退日二服忌炙􅏼酒色次投蓯蓉圓補之蓯蓉圓蓯蓉酒浸磁石煆碎熟地黃洗山茱茰去核黃耆去蘆鹽湯浸澤瀉鹿茸去毛切醋炙逺志去心薑汁炒石斛覆盆子五味子去梗萆薢破故紙炒巴戟酒浸兔絲子酒浸龍骨杜仲去皮銼薑汁拌炒斷絲各半兩附子炮去皮臍一箇重八錢右為末煉蜜圓梧桐子大每服五十圓空腹米飲下生地黃膏治渴證通用生地黃揀如常碗大一把冬蜜一碗人參半兩白茯苓去皮一兩右將地黃洗切研細以新水一碗調開同蜜煎至半次入參苓末拌和磁器密收匙挑服脾痟之證飲食入腹如湯澆雪隨小便而出落於溷僻溝渠中皆旋結如白脂肌膚日益消瘦用熱藥則熱愈甚用涼藥則愈見虛羸不能起止精神恍惚口舌焦乾或陽強興盛不交而泄其斃不久無治法姑録一二方聊為備用薑粉散治消中多因外傷疸熱內積憂思喜啖鹹食及麵致脾胃乾燥飲食倍常不為肌膚大便反堅小便無度生薑研汁輕粉右搜勻每服二錢匕長流水調下齒浮是效次投附子豬肚圓補附子豬肚圓附子炮去皮臍檳榔焙一兩各鱉甲醋煮半七錢當歸知母木香川楝子去核銼秦芁去苖土炒大黃酒蒸龍膽草白芍藥破故紙酒浸炒枳殼麩炒去穰各半兩右為末分作三分將二分入豬肚內縫定用蜜酒三升童子小便五升同入砂鉢內熬乾爛研細入一分末同搜搗為圓梧桐子大每服五十圓溫酒米湯任下白术散治消中消穀善飢人參去蘆白术去蘆白茯苓甘草炙藿香葉去土兩各一白乾葛二兩木香半兩加北五味去梗柴胡去毛枳殼去穰兩各半右銼散每服三錢新水煎去滓不拘時候茯神圓治消中煩熟消穀小便數人參去蘆茯神去木生乾地黃去土黃連淨麥門冬去心枳殼去穰牡礪粉各一兩蓮肉去心黃耆去蘆炙知母去毛各半兩瓜根七錢半右為末煉蜜和搗三伯杵圓如梧桐子大每服五十圓清粥飲下腎痟加減八味圓治腎水枯竭不能上潤心火上炎不能既濟煎熬而生心煩燥渴小便頻數白濁隂痿弱飲食不多肌膚漸漸如削或腿腫腳先瘦小宜降心火生腎水其煩渴䪺止熟地黃大者洗焙乾切片酒蒸七次焙乾稱二兩真山藥微炒山茱茰去核取肉焙乾稱一兩肉桂去粗皮不見火取末半兩澤瀉水洗切酒間蒸七次牡丹皮去骨白茯苓去皮為末飛錢取沉者各八真北五味略炒别為末兩半右為末煉蜜圓梧桐子大五更初未言語時溫酒鹽湯下三五十圓午前及晚間空腹再服此方用真北五味子最為得力服此不惟止渴亦免生癰疽久服永除渴疾氣血加壯天王補心丹寧心保神益血固精壯力強志令人不忘清三焦化痰涎祛煩熱除驚悸療咽乾口燥育養心氣熟地黃洗人參去蘆白茯苓去皮逺志去心石菖蒲去毛黑參柏子仁桔梗去蘆天門冬去心丹參洗酸棗仁去骨炒甘草炙麥門冬去心百部洗杜仲薑汁炒斷絲茯神去木當歸去尾五味子去枝梗各等分右為末煉蜜圓每一兩作十圓金箔為衣每服一圓燈心棗湯化下食後臨卧服作梧子大圓吞服亦可鹿茸圓治失志傷腎腎虛消渴小便無度鹿茸去毛切酒浸炙七錢麥門冬去心二兩熟地黃洗淨黃耆去蘆雞肶胵麩炒蓯蓉酒浸山茱茰去核取肉破故紙炒川牛膝去蘆酒浸五味子各三分白茯苓去皮地骨皮去骨兩各半人參去蘆三分右為末蜜圓如梧子大每服三十圓至五十圓米湯下雙補圓治腎虛水涸燥渴勞倦鹿角膠二兩沉香半兩火不見澤瀉截塊酒蒸半兩覆盆子白茯苓去皮人參去蘆宣木瓜薏苡仁炒黃耆炙熟地黃洗酒蒸蓯蓉酒浸焙兔絲子酒浸蒸焙五味子石斛炒當歸去尾酒浸焙各一兩生麝一錢别研右為末煉蜜圓梧桐子大朱砂為衣每服五十圓空心棗湯送下丹石毒瓜蔞散治盛壯之時不自謹惜恣情縱欲年長腎氣虛弱惟不能房多服丹石真氣既盡石氣孤立唇口乾焦精液自泄小便赤黃大便乾實小便晝夜百十行須當除熱補虛白茯苓去皮天花粉宣連白扁豆人參去蘆石膏甘草節寒水石白术去蘆豬苓各等分右為末每服二錢熱湯調服立效石膏薺苨湯治強中多因耽嗜色欲及快意飲食或服丹石真氣既脫藥氣隂發致煩渴引水飲食倍常隂氣常興不交精出故中焦虛熱注於下焦三消之中最為難治薺苨石膏各三兩人參去蘆茯神去木栝樓根磁石煆淬知母去毛乾葛黃芩去心甘草各二兩右銼散每服用水三盞腰子一箇去脂膜黑豆一合煮至一盞半去腰子黑豆入藥四錢煎至七分去滓食后服下焦熱則夜間服渴止勿服次投補藥黃連豬肚圓治強中消渴服瓜蔞散薺苨湯後便可服此亦能補養豬肚一枚治如食法黃連去蘆小麥炒各五兩天花粉茯神去木各四兩麥門冬去心二兩右五味為末內豬肚中縫塞安甑中蒸之極爛木臼小杵可圓如梧桐子大每服七十圓米飲送下隨意服之如不能圓入少煉蜜罌粟湯治腎渴解五石毒罌粟子右煮稀粥入蜜飲之加減三黃圓治丹石毒及熱渴以意測度須大實者方用春黃芩四兩大黃三兩黃連四兩夏黃芩六兩大黃一兩黃連七兩秋黃芩六兩大黃二兩黃連三兩冬黃芩三兩大黃四兩黃連二兩右為末煉蜜圓梧桐子大每服十圓服一月病愈甘草烏梅木瓜湯治飲酒多發積為酷熱熏蒸五臟津液枯燥血泣小便併多肌肉消鑠專嗜冷物寒漿木瓜乾烏梅打破不去仁麥蘖炒甘草草果去皮各半兩右銼散每服四錢水盞半生薑五片煎七分不拘時服枳椇子圓治同上枳椇子二兩麝香一錢右為末麵糊圓梧桐子大每服三十圓空心鹽湯吞下三神湯治同上烏梅肉逺志去心甘草水煮過卻以薑汁拌炒各一兩枳實去穰一兩夏加黃連五錢春秋冬不用右銼散每服四錢水兩盞糯禾根一握煎七分去滓不拘時溫服若無糯禾根白茅根亦可如無白茅根禾稈繩代之亦可龍鳳圓治同上鹿茸火燎去毛一兩酒浸炙山藥兔絲子酒浸炒各二兩右為末煉蜜圓梧桐子大每服三十圓食前米飲下濃煎人參湯亦可薑連圓治消渴小便滑如油頻數者黃連去須瓜蔞連穰各等分右為末生地黃自然汁圓如梧子大每服五十圓食後牛乳汁下酪湯下一日二服忌冷水豬肉或研麥門冬自然汁為圓熟水吞下朱砂黃連圓治心虛藴執或因飲酒過多發為消渴朱砂一兩别研宣連三兩生地黃二兩右為末煉蜜圓如梧子大每服五十圓燈心棗湯吞下酒蒸黃連圓治膈熱解酒毒止渴厚腸胃方見下痢類通治玄兔丹治三消渴利神藥常服禁精止白濁延年兔絲子酒浸通軟乘濕研焙乾取末十兩白茯苓去皮乾蓮肉各三兩五味子去梗酒浸稱七兩右為末别研山藥末六兩將所浸酒餘者添酒煮糊為圓如梧子大每服五十圓天花粉北五味子煎湯下溫酒鹽湯亦可腳膝無力木瓜湯下清心蓮子飲治心中蓄熱時常煩燥因而思慮勞力憂愁抑鬱是致小便白濁或有沙膜夜夢走泄遺瀝澀痛便赤如血或因酒色過度上盛下虛心火炎上肺金受尅口舌乾燥漸成消渴睡卧不安四肢倦怠男子五淋婦人帶下赤白及病後氣不收斂陽浮於外五心煩熱藥性溫平不冷不熱常服清心養神祕精補虛滋潤腸胃調順血氣黃芩去心半兩黃耆去蘆蜜炙石蓮肉去心白茯苓去皮人參去蘆錢各七麥門冬去心甘草地骨皮去骨車前子去沙土五錢右銼散每服三錢麥門冬十粒去心水一盞半煎取八分去滓水中沉冷空腹服發熱加柴胡薄荷煎六神湯治三消渴疾蓮房乾葛枇杷葉去毛甘草炙栝樓根綿黃耆去蘆蜜炙各等分右銼散每服四錢水一盞煎七分去滓溫服小便不利加赤茯苓子童桑白皮湯治三消渴病或飲多利少或不飲自利肌膚瘦削四肢倦怠常服補虛止渴利童根桑白皮即未多時栽者去粗皮曬乾不焙白茯苓去皮人參去蘆麥門冬去心乾葛乾山藥桂心去粗皮各一兩甘草半兩生用右銼散水一盞半煎至七分去滓溫服梅花湯治三消渴利神效糯谷旋炒作爆桑根白皮厚者切細等分右每用稱一兩許水一大碗煮取半碗渴則飲不拘時文蛤散治渴欲飲水不止文蛤即五倍子最能回津右為末以水飲任調方寸匕不拘時服羊乳丸治嶺南山瘴風熱毒氣入腎中變寒熱腳虛弱滿而渴者宣連去鬚不拘多少為末生栝樓根汁生地黃取汁羊乳無羊乳牛乳人乳亦得右以三汁搜和為丸如梧子大每服三五十丸米飲下一法濃煮小麥飲下益元散白虎湯去桂五苓散合和大治消渴方見中暑傷寒傷暑類生地黃飲子治消渴咽乾面赤煩燥人參去蘆生乾地黃洗熟乾地黃洗黃耆蜜炙天門冬去心麥門冬去心枳殼去穰麩炒石斛去根炒枇杷葉去毛炒澤瀉甘草炙各等分右銼散每服三錢水一盞煎至六分去滓食後臨卧溫服此方乃全用二黃丸甘露飲料生精補血潤燥止渴佐以澤瀉枳殼疏導二腑使心火下行則小腑清利肺經潤澤則大腑流暢宿熱既消其渴自止造化精深妙無踰此栝樓粉治大渴右深掘大栝樓根削去粗皮寸切以水浸一日夜一易浸五日取出爛研細綃絞汁如作粉法乾之水服方寸一日三四服入牛乳一合服尤好降心湯治心火上炎腎水不濟煩渴引飲氣血日消人參去蘆逺志去骨以甘草水煮過去甘草薑汁拌炒乾當歸去尾熟地黃洗去土蒸白茯苓去皮黃耆去蘆蜜炙北五味子去梗甘草微炙各半兩天花粉一兩右銼散每服三錢水一盞半棗一枚煎食前服蠟苓丸補虛治濁止渴潤腸婦人血海冷白帶白淫白濁黃蠟雪白茯苓去皮各四兩右茯苓為末溶蠟和圓彈子大每服一圓不飢飽細嚼下棗湯亦可辰砂妙香散治渴證小便澀數而瀝兼有油濁用燈心茯苓煎湯下方見心恙類神效散治渴疾飲水不止白浮石蛤粉蟬殼右為末用鯽魚膽七箇調七錢服不拘時候神效三痟圓治消渴骨蒸宣連去鬚為末不以多少銼冬瓜肉研栵自然汁和成餅子隂乾再為末再用汁浸和如是七次即用冬瓜汁為圓如梧桐子大每服三四十圓以冬瓜汁煎大麥仁湯送下尋常渴止一服浮萍圓治消渴虛熱者大佳乾浮萍栝樓根等分右為末以人乳汁和圓每服二十圓空腹米飲下日三服三年病者三日可又白芷末水調服止又方鉛丹二兩附子一兩乾葛栝樓根各三兩右為末煉蜜圓每服十圓米飲下日三服渴則服之治日飲水至一石者春夏去附子白术散治胃虛發渴白术一兩人參去蘆白茯苓甘草各半兩右為末每服七錢水一盞半煎至七分服凡渴之後多有腫疾仍預服復元丹數服參蓍湯治消渴人參去蘆桔梗去蘆天花粉甘草各一兩綿黃耆鹽湯浸炙白芍藥各二兩白茯苓去皮北五味各一兩半右銼散每服四大錢水盞半煎八分日進四服合滓煎雞蘇圓治病後虛羸發渴右雞蘇圓以北五味煎湯吞下仍服安腎圓方見失血虛損類麵餅圓治消渴蜜陀僧二兩别研極細川黃連一兩為細末右用蒸餅圓如梧子大每服五圓煎繭空茄根湯下臨卧服次日加至五十圓以後每日五圓至三十圓止服藥後以見水惡心為度即住服不過五六服必效若覺惡心但每日食乾物壓之旬日後自定竒甚竒甚繭空是出蠶蛾子空繭殼忍冬圓治渴疾愈須預防發癰疽忍冬草不以多少根莖花朵皆可用一名老翁鬚一名蜜啜花一名金銀花以洗淨用之右以米麴酒於瓶內浸以粳火煨一宿取出曬乾入甘草少許為末即以所浸酒為糊圓如梧子大每服五十圓至百圓酒飲任下不拘時候此藥不特治癰亦能止渴並五痔諸漏牡蠣散治不渴而小便失利以牡蠣末取患人小便煎服單方治渴糯稻稈灰取中一尺燒淋汁飲或不燒便煎服亦妙或生牛乳細呷或生蘿蔔搗取汁時飲少許繭絲湯治渴神效煮繭繅絲湯任意飲之䪺效如非時以絲或綿煎湯服煞蟲方治消渴有蟲苦楝根取新白皮一握切焙入麝少許水二碗煎至一碗空心飲之雖困䪺不妨自後下蟲三四條狀如蛔蟲其色真紅而渴䪺止乃知消渴一證有蟲耗其津液凡消渴大忌飲酒房事食油麵煎炙糟藏鹹物及一切熱物百日以上不可針灸針灸則生瘡膿或成癰疽膿水不止則死漩濁心濁瑞蓮圓治思慮傷心便下赤濁白茯苓去皮石蓮肉炒心去龍骨生用天門冬洗心去逺志洗去心甘草煮柏子仁炒研别紫石英火煆七次研令極細當歸去蘆酒浸酸棗仁炒殼去龍齒已上各一兩乳香半兩别研右為末煉蜜圓梧桐子大朱砂為衣每服七十丸空心溫酒棗湯任下加味清心飲治心中客熱煩躁赤濁肥脂石蓮肉白茯苓各一兩益智仁麥門冬逺志水浸取肉薑製炒人參各半兩石菖蒲車前子白术澤瀉甘草微炙分各二右銼散每服三錢燈心二十莖煎服有熱加薄荷少許寧志膏治心臟虧虛神志不守恐怖赤濁常多恍惚易於健忘睡卧不寧夢涉危險一切心疾並皆治之人參去蘆酸棗仁微炒去皮各一兩辰砂研細水飛半兩乳香七分以乳鉢坐水盆中研右為末煉蜜圓如彈子大每服一圓溫酒化下棗湯亦可空心臨卧服十四友圓補諸虛不足益血收斂心氣治怔忪不寧精神昏倦睡卧不安赤白濁甚柏子仁别研逺志去心酸棗仁去殼炒香紫石英明亮者熟乾地黃洗川當歸洗淨去尾蘆白茯苓去皮茯神去皮人參去蘆黃耆蜜炙去蘆阿膠蚌粉炒肉桂不見火已上各一兩龍齒一兩半辰砂半兩别研右為末煉蜜圓如梧子大每服三四十圓棗湯食後臨卧吞服香苓散治男子婦人小便赤濁諸藥不效者五苓散辰砂妙香散右和勻用天門冬麥門冬去心煎湯空心調服一大錢一日三服當䪺愈桑螵蛸散治小便日數十次如稠米泔色心神恍惚憔悴食減以女勞得之服此不終劑而愈乃主安神魂定心志菖蒲鹽炒龍骨人參去蘆茯神去木當歸去尾鱉甲醋炙右等分為末每服二錢夜卧人參湯調服蠟苓圓治同上方見消渴類逺志圓治小便赤濁如神逺志去心用甘草煮半斤茯神去木益智仁各二兩右為末酒糊圓每服五十圓臨卧棗湯下心腎圓治水火不既濟心下怔忪夜多盜汗便赤夢遺牛膝去苖酒浸熟地黃洗蒸蓯蓉酒浸各二兩鹿茸火去毛酒潤炙附子炮去皮臍五味子去枝人參去蘆黃耆蜜炙去蘆逺志去心甘草水煮薑汁炒白茯神去木山藥炒當歸去蘆尾酒浸龍骨煆各一兩兔絲子酒浸研成餅三兩右為末浸藥酒煮糊圓如梧子大每服七十圓棗湯下腎濁祕精圓治元氣不固遺精夢泄大附子炮去皮濟龍骨煆通赤肉蓯蓉酒浸一夕牛膝酒浸一宿焙巴戟去心各一兩右末煉蜜圓如梧子大每服三十圓鹽酒鹽湯空心下震靈丹治腎經虛憊漏濁不止用二陳湯加白茯苓煎湯送下方見泄瀉類鎖精圓治小便白濁破故紙炒青鹽各四兩白茯苓五倍子各二兩右為末酒糊圓空心三十圓鹽湯酒任意下芡實圓治勞傷心腎水火不交漩白如油光彩不定漩腳盛下凝如膏糊頻數無度又治遺泄不禁之疾方見虛損類固精圓治下虛胞寒小便白濁或如米泔或若凝脂腰重少力牡礪煆兔絲子酒蒸焙乾韭子炒龍骨五味子白茯苓去皮桑螵蛸酒浸炙白石脂各等分右為末酒糊圓如梧子大每服七十圓空心鹽湯送下地黃圓治心腎水火不濟或因酒色遂至已甚謂之土淫蓋脾有虛熱而腎不足故土邪干水先賢常言夏則土燥而水濁冬則土堅而水清此其理也醫者往往峻補其疾反甚此方中和補瀉兼之水火既濟而土自堅其流清矣熟地黃九蒸十兩兔絲子洗酒浸蒸鹿角霜各五兩茯苓柏子仁各三兩附子一兩右為末鹿角膠煮糊圓如梧子大每服百十圓鹽酒下四精圓治濁渴鹿茸肉蓯蓉山藥茯苓各等分右為末米糊圓如梧子大每服三十圓棗湯下或加沉香木香蒜圓治濁杜仲川烏破故紙人參巴戟各等分右為末蒜膏圓如梧子大每服三十圓鹽湯溫酒任下入藥靈砂圓治諸虛白濁耳鳴大效當歸酒洗鹿茸去毛鹽酒炙黃耆鹽水炙沉香鎊北五味炒逺志肉酸棗仁炒吳茱茰去枝茴香炒破故紙炒牡蠣煆熟地黃蒸人參去蘆龍骨煆附子炮巴戟各一兩淨靈砂二兩研右各煆製如法為末酒糊圓每服五十粒至七十粒空心溫酒鹽湯任下小兔絲子圓治腎氣虛損五勞七傷小腹拘急四肢酸疼面色黧黑唇口乾燥目暗耳鳴心忪短氣夜夢驚恐精神困倦喜怒無常悲憂不樂飲食無味舉動乏力心腹脹滿腳膝痿緩小便滑數房室不舉股內濕癢水道澀痛小便出血時有遺瀝並宜服之久服填骨髓續絶傷補五臟去萬病明視聽益顔色輕身延年聰耳明目石蓮肉二兩兔絲子酒浸焙研為末五兩白茯苓焙一兩山藥二兩七錢半