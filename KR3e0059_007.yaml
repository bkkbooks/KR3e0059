血臍腹疼痛裏急後重脫肛酒痢荆芥二兩燒亂髮燒槐花燒槐角燒一兩各枳殼二兩燒一兩炒甘草炙蝟皮燒一兩半各右將合燒藥同入瓷瓶內黃泥固濟燒存三分性出火氣同甘草枳殼一兩搗為末每服二錢白水煎空心服溫酒調亦可黑五丹治丈夫婦人久新腸風痔瘻著床頭痛不可忍者服此不過三四次見效初得此疾發癢或疼穀道周回多生硬核此是痔如破為瘻只下血是風皆因酒色氣風食五事過度即成此疾人多以外醫塗治病在腸自有蟲若不去根本其病不除此藥的效刺蝟皮四兩銼研豬懸蹄二十五箇牛角腮三兩銼碎雷丸一兩槐角一兩半敗棕二兩銼亂髮皂角水洗淨焙二兩脂麻一兩苦楝根皮一兩二錢半右銼碎入瓷罐內燒存性碾為末入麝香二錢乳香五錢研令和勻用酒打麵糊為丸如梧子大每服八粒先細嚼胡桃一枚空心晚食前溫酒吞日二服病甚日三服切忌别藥不過三兩日可除根本加味雙和湯加側柏葉每服三皮炒過生薑三片棗二枚烏梅一箇煎空心服方見虛損類治同上卷柏散治臟毒下血神效卷柏生土石塝上髙四五寸根黃如絲莖細上有黃點子止以柏枝曝乾用黃耆右等分為末每服二錢米飲調下聖金圓治腸風下血溺血百藥煎三兩一兩生存一兩炒焦一兩燒性右為末煉蜜丸如梧子大每服五十丸空心米飲下神丹治腸風痔漏刺蝟皮一箇鐡器中炒焦黑為度皂角刺燒存性硫黃研豬牙皂角去黑皮蜜塗炙白礬枳殼炒黃耆蜜炙附子去皮兩各半白雞冠花子一兩右為末酒糊丸如梧桐子大每服七丸至十丸空心食前溫酒下不飲米飲下久年漏痔服至三四十丸肉滿平安諸痔服之即自消外痔用藥十丸同朱砂細研蜜調塗常服永除根本若服藥覺熱加白雞冠花子一兩半或二兩更加三五丸服之臟腑自調小烏沉湯香附子杵去皮毛焙二兩天台烏藥去心一兩甘草炒分一右為末每服一錢空心鹽湯點服治同上震靈丹玉葉白丹治臟腑虛損大腸不收久作腸風下血二藥夾用每服五十丸煎不換金正氣散加川芎空心咽下方並見痼冷類理中湯治同上加木香妙方見霍亂類香梅圓治腸風臟毒下血烏梅同核燒灰存性香白芷不見火百藥煎燒存性各等分右為末米糊丸梧桐子大每服七十丸空心米飲下斷紅圓治臟腑虛寒下血不止面色痿黃日漸羸瘦側柏葉炒黃川續斷酒浸鹿茸火去毛醋煮附子炮去皮臍黃耆阿膠蛤粉炒當歸酒浸兩各一白礬半兩枯右為末醋煮米糊丸梧子大每服七十丸空心米飲下冷熱不調黃連香薷散香薷扁豆厚朴薑製黃連去鬚右銼散用水煎服香連圓治冷熱不調下血方見泄瀉類芎歸湯熱加茯苓槐花冷加白茯苓丁香方見婦人科保産類即佛手散真人養臟湯治大人小兒冷熱不調便下膿血魚腦裏急後重方見泄瀉類消風散米飲調熱者吞酒蒸黃連丸冷者吞烏梅丸方見風科熱證通治及下痢類通治單方治腸風下血百藥不效山裏棗俗名鼻涕團取乾者為末米飲調立效又方柏子十四枚撚破紗囊貯以好酒三盞煎至八分服之初服反覺加多再服立止非飲酒而致斯疾以艾葉煎湯服之神效勝如它藥又方生豬臟一條切控乾以槐花炒乾為末填入臟內兩頭線縛了以好米醋於磁瓦器內慢火煮爛切片沙鉢內研爛為丸梧桐子大每服二十丸煎當歸酒下又方荆芥穗縮砂仁各等分為末糯米飲下灸法第二十椎隨年壯又法平立一杖子比臍平却向後脊骨當中灸七壯或年深於脊骨兩傍各一寸灸七壯余謂寸半則是腎腧自佳小便出血酒蒸黃連圓白苑根濃煎湯放溫吞下方見下痢類五苓散加辰沙一字燈心一握煎湯調下方見傷暑類茯苓調血湯治酒麵過度房勞後小便出血半赤茯苓一兩赤芍藥川芎半夏麯各半兩前胡柴胡青皮枳殼北梗桑白皮白茅根燈心甘草各二分半右銼散每服三錢半薑五片蜜二匙新水煎服薑蜜湯治小便出血不止生薑七片蜜半盞白茅根一握右用水同煎服神效鹿角膠圓治房室勞傷小便尿血鹿角膠半兩沒藥别研油頭髮灰各三分右為末用白茅根汁打糊丸如梧桐子大每服五十丸鹽湯送下髮灰散右用自己頭髮一握洗淨燒灰溫酒調下一服立效鏡而散治小便出血鏡面草取清汁入蜜少許同水調服效單方療小遺出血條淡豆䜴一撮煎湯服效又方治小便出血竹茹一大塊水煎服妙又方川牛膝一兩去蘆水一碗煎至半碗䪺服又方生地黃取自然汁半升生薑自然汁半合相和服未止再服又方當歸川白芷為末每服二錢溫米飲下脫肛文蛤散治大腸寒肛門脫出不收用力過多及小兒呌呼久痢後皆使脫肛五倍子右為末水煎汁浸洗更入白礬蛇床子尤佳洗後用赤石脂為末以少許摻在芭蕉上頻用托入或長尺餘者以兩床相接中空一尺以瓷瓶盛藥水滿架起與床平令病者仰卧以其所脫浸在瓶中換藥逐日如此浸縮盡為度木賊散右用木賊一味為末摻肛上槐花散治脫肛槐花槐角右等分炒香黃為末用羊血蘸藥炙熱食之以酒送下或以豬膏去皮蘸藥炙服釣腸圓治同上方見諸痔類蝟皮散治肛門或因洞泄或因用力太過脫出不收蝟皮一箇性燒存磁石煆碎桂心各半兩右為末每服二錢米飲空心調下治女人隂脫加鱉頭一枚燒灰研入香荆散治肛門脫出大人小兒悉皆治之香附子一兩半炒去毛荆芥穗二兩右為末每服三匙水一大碗煎熟淋洗灸法治寒冷脫肛出灸臍中隨年壯脫肛歷年不愈灸橫骨百壯又灸脊窮骨上七壯諸痔冷證釣腸圓治久新諸痔肛邉腫痛或生瘡癢時有濃血栝樓二箇性燒存蝟皮兩箇銼碎罐內燒存性白礬煆緑礬枯胡桃仁十五箇不油者罐內燒存性白附子生用半夏天南星雞冠花五兩銼炒枳殼炒附子去皮臍訶子去核兩各二右為末醋麵糊丸如梧子大每服二十丸空心臨卧溫酒下逺年不差者服十日見效久服除根黑玉丹治同上方見失血類橘皮湯治氣痔橘皮枳殼炒川芎槐花炒各半兩檳榔木香桃仁浸去皮炒紫蘇莖葉香附子甘草各二分半右銼散每服三錢水一盞半生薑三片紅棗二枚煎服立效圓百藥煎研為末每服三錢煮稀白粥攪勻服之立愈糊丸米飲下亦可黑圓子專治久年痔漏下血用之屢驗乾薑百草霜各一兩木饅頭二兩烏梅敗棕柏葉亂髮各五分右各燒灰存性再入桂心三錢白芷五錢同為末醋糊丸梧桐子大空心三十丸米飲下熱證逐瘀湯通利大小便取下黑物川芎白芷生乾地黃赤芍藥五靈脂枳殼製阿膠炒蓬莪术煨茯苓茯神大木通生甘草各一分實大黃桃仁湯去皮焙各一分半右銼散每服三錢井水一碗生薑三片蜜三匙煎服以利為度瘀血作痛通用白玉丹治久年腸痔下血服藥不效者寒水石不以多少右煆紅研細水飛再入銀窩中煆紅用糯米糊丸梧桐子大每服五六十圓陳米飲下只一服黃連阿膠圓解熱調血枳殼散送下方見泄瀉及婦人護胎類槐角圓治腸風痔瘡內生蟲裏急下膿血止癢痛消腫聚祛濕毒服之除根方見前乾葛湯專治酒痢白乾葛枳殼炒半夏茯苓生乾地黃芩杏仁各半兩黃芩甘草炙各一分右銼散每服三錢黑豆百粒薑五片白梅一箇煎服寬腸圓五灰膏塗痔瘡之後或臟腑祕結不通者用此藥寬腸五灰膏方見后黃連枳殼各等分右為末麵糊丸如梧子大每服五十丸空心米飲下通治祕方治諸痔捷效右用白礬信石各少許於新瓦上煆過為末再入朱砂末少許以新汲井水調成膏用舊金紙上藥隨瘡大小貼之先用鬱金國丹末以鵝翎刷於瘡四畔圍護恐傷好肉凡上藥貴宦人肉理嬌脆薄少用之愚俗人肉理粗厚稍多少許用之大抵上藥後多疼不可太過為妙仍用大青根晚蠶砂煎水洗後再上藥兼服槐角圓皂角圓臟腑結熱祕甚八正散加燈心枳殼薄荷葉煎再用大黃茶莽草荆芥穗防風煎水洗效八正散方見積熱類又方用川白芷煮白苧作線快手緊繫痔上微疼不妨其痔自然乾痿而落七日後安五灰膏治臟腑一切藴毒發為痔瘡不問逺年近日形似雞冠蓮花核桃牛乳或內或外並皆治之蕎麥灰七升荆柴薊柴山白竹老杉枝右以四件柴竹截作一尺許長以斧劈破成片各取一束曬乾於火上燒過置壜內為炭防為風所化俟燒盡却以水於鍋內煮出炭汁又用酒漏以布帛實其竅而置蕎麥灰於酒漏內以所煮炭汁淋之然後取汁於鍋內慢火熬汁約取一小碗候冷入石灰國丹調和成膏以瓦瓶貯之上用石灰傅面不令走氣臨用却去石灰以冷水調開令病者以水洗淨痔瘡仰卧搭起一足先以濕紙於瘡四圍貼護却用收效必矣世醫得效方卷七
