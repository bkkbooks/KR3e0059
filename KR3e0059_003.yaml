小者化為水大者自下虛證當歸建中湯治勞傷虛羸腹痛呼吸少氣小腹拘急連腰背時自汗出不思飲食當歸二兩桂心一兩半楊芍藥二兩黃蓍一兩半右銼散每服水二盞半薑三片棗二枚同煎食前溫服通治大抵冝通塞則為痛凡痛甚須通利臟腑乃愈隨冷熱須用巴豆大黃牽牛此最要法小理中圓治三脘氣弱中焦積寒脾虛不磨飲食遲化喫物頻傷胸膈滿悶脅肋痛刺嘔吐噦逆噫醋惡心腹脹腸鳴心腹疼痛噎塞膈氣翻胃吐食飲食減少草豆蔲煨京三稜煨乘熱碎乾薑炮青皮陳皮淨洗去蒂肉桂去粗皮各二兩牽牛炒香熟良薑炒各三斤阿魏三兩醋化去沙石研縮砂仁紅豆蓬莪术炒乘熱碎各一斤右為末用水煮麵糊圓如梧子大每服三十粒生薑橘皮湯下溫湯亦得不拘時此藥無利性不損脾胃氣偏虛寒者最宜服之與三稜煎圓和同服尤妙方見諸氣類腹痛作嘔欲利大便諸藥皆吐惟蘇感圓用薑汁泡湯吞服最妙蘇合香圓見中氣類感應圓見祕結類氣滯腹痛神保圓柿蒂燈心湯下二七圓最為捷效方見諸氣類或肚腹作痛以磁石數斤杵為末鋪席睡其上再以磁石煎湯調小調氣散服效諸痺風寒濕合痺附子湯治合痺骨節疼痛皮膚不仁肌肉重著四肢緩縱腰腳酸疼生附子一兩白芍藥官桂甘草白茯苓人參半兩白术三錢右銼散每服四錢水二盞生薑七片煎至六分去渣食前服惡甜者減甘草一半兼治瘦極筋脈氣虛倦怠遍體酸疼烏頭湯治寒冷濕痺流於經絡攣縮不得轉側大烏頭細辛川椒甘草秦芁附子官桂白芍各七分川獨活一兩三錢半右銼散每服三錢水一盞半棗二枚同煎至八分去滓空心食前服理中湯治寒濕痺加附子天麻四分之一方見霍亂類黃蓍酒治風濕痺身體頑麻皮膚瘙癢筋脈攣急言語謇澀手足不遂時覺不仁黃蓍去蘆防風去蘆官桂不見火天麻􅒝薢白芍藥當歸去蘆雲母粉白术茵芋葉木香不見火仙靈皮甘草川續斷各一兩右銼散以生絹袋盛以酒一斗浸之春五日夏三日秋七日冬十日每服一盞溫暖服之不拘時候常令酒氣相續為佳蒼耳散治一切風濕痺四肢拘攣蒼耳子三兩為散水一升半煎去滓分作三服或細末水糊圓如梧桐子大每服五十圓溫酒吞下薏苡粥治久風濕痺正氣除骨中邪氣利腸胃消水腫久服輕身益氣薏苡一升為末以水作粥空心服寒證麻痺五積散方見傷寒通治類痰飲茯苓湯治痰飲手足麻痺多睡眩冒半夏湯炮七次赤茯苓去皮橘皮各一兩枳殼去穰麵炒桔梗去蘆甘草炙半兩各右銼散每服四錢水一盞半薑七片煎至七分去渣溫服不拘時候血氣滯三痺湯治血氣凝滯手足拘攣療風痺氣痺等疾川續斷杜仲去皮切薑汁炒防風桂心華陰細辛人參白茯苓當歸白芍藥甘草各一兩秦芁生地黃川芎川獨活各半兩黃蓍川牛膝各兩右銼散每服五錢水二盞薑三片棗一枚煎至一盞去渣熱服不拘時但腹稍空服筋痺羚羊角湯治筋痺肢節束痛羚羊角薄桂附子各一兩三錢半川芎一兩獨活一兩三錢半白芍藥防風各一兩右銼散每服三大錢水一盞半生薑三片同煎至八分取清汁服日可一二服熱證升麻湯治熱痺肌肉熱極體上如鼠走唇口反縱皮色變兼諸風皆治升麻三兩茯神去皮人參防風犀角鎊羚羊角鎊羌活各一兩官桂半兩右銼散每服四錢水二盞生薑二片竹瀝少許同煎至一盞不拘時溫服諸疸風證艾煎丸治因傷風瘀熱不解發為風疸舉身黃小便或黃或白寒熱好卧不欲動其脈陽浮陰弱生艾二月採一束搗爛銅器煎如膏大黃蒸黃連炒括樓根凝水石煆苦參甘草葶藶紙隔炒各等分右為末以艾膏和得所丸如梧子大初服六七圓漸加至二十丸有熱加苦參渴加括摟根小便澀加葶藶小便多加凝水石小便白加黃連大便難加大黃並倍加麻黃酒治傷寒不解發為黃疸其脈緊以汗解之麻黃三兩右用水酒五升煎至二升每服一盞溫服汗愈春夏秋水暑證五苓散治伏暑中熱發黃小便不利煩渴茵陳煎湯調下一方治疸通用方見傷暑類茵蔯湯治濕熱瘀黃小便祕澀頭汗而渴茵陳蒿一兩半大黃半兩小紅梔子十枚右銼散每服三錢水煎服五苓散亦治發黃二藥夾煎濕證礬石滑石散治濕疸得之一身盡疼發熱面色黑黃七八日後壯熱在裏有血下如豚肝狀小腹滿者急下之身目盡黃小便不利其脈沉細礬石煆滑石各等分右為末每服二大錢麥粥飲調下日三服食前便利如血者效或汗愈時行梔子圓治時行病急黃及瘴瘧疫癘茵陳梔子芒硝縮砂大黃蒸一兩一分杏仁去皮尖炒各三分甘草豆䜴二分半湯浸軟别研恆山檳榔鱉甲醋炙兩各半巴豆去皮壓去油一分右為末餳飴為圓如梧子大每服三圓飲下吐利為效未效加一圓覺體氣有異急服之黃汗苦酒湯治身體洪腫發熱自汗如蘗汁其脈沉黃蓍五兩芍藥桂心三兩右銼散每服四錢苦酒三合水一盞半煎至七分去渣不以時服初服當心煩以苦酒阻故也至六七日稍愈桂枝加黃蓍湯治黃汗身腫汗出出已輒輕久久必身困胸中痛腰以下無汗腰臗弛痛如有物在皮中劇者不能食煩燥小便不利桂枝去皮芍藥各三兩甘草二兩炙黃蓍五兩右銼散每服四錢水一盞半薑五片棗三枚煎至七分去渣溫服仍飲熱粥以助藥力覆取微汗未汗再服黃疸茵陳散治黃疸食已即飢身體面目瓜甲牙齒及小便悉黃寒熱或身體多赤多青皆由酒食過度為風濕所摶熱氣鬱蒸而成茵陳木通梔子仁各一兩大黃炒瓜蔞一箇石膏二兩甘草炙兩半右銼散每服水一盞半生薑五片蔥白一莖煎至八分去滓溫服不拘時候大小便閉加枳實赤茯苓葶􅏣子小半夏湯治黃疸小便色不異欲自利腹滿而喘者不可除熱熱去必噦半夏右銼散每服三錢水二􅊦薑十片煎至七分不以時服單方治黃疸身眼黃如金色不可使婦人雞犬見修製東引桃根以細如筋若叉股者以下一握右以水一大升煎取一小升適溫空腹頻服後三日其黃離離如薄雨散最後瘥百日方平復身黃後可時時飲一盞清酒則眼中易散不飲則散遲忌食麵豬魚肉穀疸苦參圓治胃暑瘀熱氣濁食谷不消大小便不利脹滿不下食少陽脈緊而數亦治因勞發熱熱鬱發黃苦參三兩龍膽草一兩梔子去皮炒半兩人參三分右為末以豬膽汁入熟蜜少許搜和圓如梧子大以大麥煮飲下五十圓日三服不效稍加之脾疸龍腦圓治胸中鬱熱肺熱喘嗽口臭喉腥或口甜丈夫吐血婦人熱血崩並皆治龍腦薄荷五兩淨葉真蒲黃一兩麥門冬去心二兩阿膠一兩甘草一兩人參一兩川當歸黃蓍一兩半木通一兩生乾地黃三兩柴胡好者半兩右為末煉蜜圓如梧子大每服二十圓上焦食後用熟水吞下微嚼破更好病下焦空心服小兒加減與之此藥大有竒效不可盡述紅圓子治榖疸腹滿眩暈怫鬱怔忡酒疸通用二陳湯加縮砂煎湯下方見痎瘧類酒疸葛根湯治酒疸因下後久久為黑疸目靑面黑心中如啖非虀狀大便正黑小便亦或黑其脈微而數大抵五疸惟酒疸變證最多蓋酒之為物隨人性量不同有盈石而不醉者有濡唇而輒亂者以醖釀而成有大熱毒滲入百脈為病則不待發黃溢于皮膚為黑為腫流於清氣道中則眼黃鼻腫種種不同故方中論酒疸外有肉疸黑疸辨疸勞役疸葛根一兩枳實去穰麩炒梔子仁䜴各一兩甘草炙兩半右銼散每服四錢水盞半煎至八分去渣溫服不拘時酒蒸黃連圓治酒疸黃連去鬚淨四兩銼碎以酒灑醃一宿日乾為末粟米糊為圓梧桐子大每服三四十圓以二陳湯加葛根茵蔯薑棗煎湯送下六物飲治酒疸肚脹蓽撥荆芥穗不蛀川練子連皮核用生薑母軟烏梅甘草右件等分於石臼中搗細用磁器盛以自已滿腹小便去其首尾取中間小便浸藥兩重紗蓋露星一宿拂明飲其汁續用車前子山茵陳竹園荽煎湯乘熱調五苓散服自覺黃水從小便出而肚不脹妙人參散治飲酒房勞酒入百脈令人恍惚失常人參白芍藥栝摟根枳殼麩炒去穰茯神酸棗仁甘草炙一兩各熟地黃二兩右銼散每服四大錢水一盞煎至七分食後臨卧溫服辰砂妙香散治飲酒行房酒熱瘀於心經致成黃疸再加辰砂末少許每服二錢茵陳二根煎湯日三服方見心恙類土瓜方治酒疸熱疸土瓜搗汁取服任意如神散治酒毒不散發黃久久浸漬流入清氣道中冝引藥內鼻滴出黃水愈苦瓠子去殼苦葫蘆子各三七箇米百粒黃黍米三百粒安息香二皂角子大右為末以一字搐入鼻中滴盡黃水三升或過多則以香穰燒灰麝香末各少許搐入鼻中立止女勞疸石膏散治女勞疸身黃額黑日晡發熱惡寒小腹急足下熱其脈浮緊腹或滿者難治滑石石膏煅各等分右為末大麥粥飲調下二錢七日三四服小便利則瘥熱疸一清飲治疸發熱諸熱通用柴胡三兩赤茯苓二兩桑白皮製川芎一兩甘草炙兩半右銼散每服三錢生薑棗子煎服虛勞疸秦芁飲治五疸口淡耳鳴腳弱發寒熱小便白濁秦芁去蘆當歸去蘆酒浸芍藥白术官桂去皮火不見赤茯苓去皮熟地黃酒蒸橘紅小草川芎各一兩半夏湯洗甘草炙各半兩右銼散每服四錢水一盞半薑五片煎至七分去渣溫服不拘時候養勞湯治證同上方見虛損類久黃苦參散治人無故忽然振寒皮膚麯塵出小便赤澀大便時祕氣無異飲食不妨諸藥湯不除因為久黃苦參黃連瓜蒂黃蘖去皮大黃蒸各一分葶藶炒半兩右為末每服一大錢米飲調服當吐下隨時消息加減積黃無忌紫金圓理脾胃退黃針砂醋煮通紅紫金皮酒浸香附子炒三稜醋浸一宿煮蒼术米泔浸陳皮青皮去白厚朴薑製縮砂各一兩右醋糊圓每服三十圓酒熟水下川椒湯服亦可立效五噎五噎散治五種噎食飲不下胸背痛嘔噦不徹攻刺疼痛淚與涎俱出人參茯苓厚朴去粗皮薑汁製甘草炙枳殼麩炒去穰訶子炮去核桂心白术橘皮白薑三稜炮神麯炒麥牙炒二兩各木香檳榔蓬莪术泡各半兩右銼散每服二錢水一盞生薑三片棗子一枚煎至十分空心服為末鹽湯亦得沉香散治五噎五膈胸中久寒諸氣結聚嘔逆噎塞食飲不化結氣不消常服寬氣通噎寬中進食白术茯苓各半兩木通當歸橘皮青皮大腹子檳榔芍藥各一兩甘草炙兩半一白芷三兩紫蘇葉四兩枳殼麩炒去穰三兩右銼散每服水一盞薑三片棗二枚煎至六分空腹溫服嘉禾散治同上大七氣湯治喜怒不節憂思兼并多生悲恐或時振驚致臟氣不平增寒發熱心腹脹滿傍衝兩脅上塞咽喉有如炙臠吐咽不下皆七氣所生半夏湯泡七次五兩白茯苓四兩厚朴薑製炒三兩紫蘇二兩右銼散每服四錢水一盞薑三片棗一枚煎空腹溫服五膈寬中散治因憂恚寒熱動氣成五種膈氣不進飲食白豆蔲去皮二兩縮砂四兩香附子炒去毛十六兩丁香四兩木香三兩青皮去白四兩甘草炙五兩厚朴去皮薑汁炙令熟一斤陳皮去白四兩右為末每服二錢入生薑二片鹽少許沸湯點服不以時候諸冷氣用之亦效五膈散治五膈胸膈痞悶諸氣結聚脅肋脹滿痰逆惡心不進飲食枳殼去穰麩炒木香不見火青皮去白大腹子白术半夏麯銼炒丁香不見火天南星湯泡去皮乾薑炮麥牙炒草果仁各一兩甘草炙兩半右為末每服二錢水一中盞生薑五片煎至六分溫服不拘時候五膈圓治憂恚思慮膈塞不通及食冷物即發其病苦心病不得氣息引背痛如刺心下堅大如粉絮緊痛欲吐吐即差食飲不下甚者手足冷短氣或上氣喘急嘔逆者麥門冬去心甘草炙五兩各人參四兩川椒炒出汗逺志去心炒細辛去苖桂心各三兩乾薑炮兩二附子一兩右為末蜜圓彈子大含化日三服夜二服胸中當熱七日愈亦可圓如梧子大米湯下二三十圓夏加麥門冬甘草人參各一兩一方以吳茱茰代桂治遇寒冷則心痛咽中有物吐不出咽不入飲食減少並可服不拘時寬膈圓治氣不升降胸膈結痞木香京三稜青皮各半兩縮砂五錢半夏三兩湯洗七次大腹子一分右為末薑汁糊為圓如梧子大食後米湯下二三十圓瓜蔞實圓治胸中痛徹背喘急妨悶瓜蔞實别研枳殼去穰麩炒半夏湯泡七次桔梗各一兩右為末薑汁打糊圓如梧子大每服五十圓食後淡薑湯下世醫得效方卷三
