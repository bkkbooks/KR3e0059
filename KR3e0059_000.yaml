  text: 欽定四庫全書子部五
  hash: sha256:385bc2d94867d1b606f43bb11ebdc68a3a5579aafe48be2b02b9eb652717f689
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3e0059_WYG_000-1a, image: WYG0746/WYG0746-0043a.png}
body:
  text: 世醫得效方醫家類提要臣等謹案世醫得效方二十卷元危亦林撰亦林字達齋南豐人官本州醫學教授是編積其髙祖以下五世所集醫方合而成書一曰大方脈科分子目九十有一二曰小方脈科分子目七十有一三曰風科分子目十四曰産科兼婦人雜病科分子目三十有三五曰眼科分子目十二六曰口齒兼咽喉科分子目六七曰正骨兼金鏃科分子目二十九八曰瘡腫科分子目二十四共十九卷附以孫真人養生法節文一卷其總目針灸一科有録無書校檢其文皆散附各科之中葢標題疎舛實非闕佚自序稱剏始于天厯元年迄功于後至元三年其用力亦云勤篤前有至元五年太醫院題識備列院使十一人同知院事二人僉院事二人判官二人經厯二人都事二人掾史一人銜名葢江西官醫提舉司以是書牒醫院下諸路提舉司重校覆白于醫院而後刋行亦頗矜慎序中稱其髙祖遇仙人董奉二十五世孫傳其秘方雖技術家依託之言不足深詰而所載古方至多皆可以資考據未可以罕所發明廢之也乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀世醫得效方題識南豐危亦林世醫得效方編次有法科目無遺江西提舉司校正之牋上于院下諸路提舉司重校之復白于院院之長貳僚屬皆曰善付其屬俾綉梓焉噫是方之效豈以此一言而遂傳歟至元五年太醫院識世醫得效方銜名掾史䝉智奉直大夫太醫院都事郭毅承直郎太醫院都事阿老丁奉直大夫太醫院經厯田守信奉直大夫太醫院經厯卜顔帖木兒成和郎太醫院判官郎師顏承直郎太醫院判官齊顯成和郎同僉太醫院事胡缺成安郎同僉太醫院事弓叔正承直郎僉太醫院事賈文炳承務郎僉太醫院事馬文瑾奉訓大夫同知太醫院事許文美奉議大夫同知大醫院事趙良嘉議大夫太醫院使趙惟寅嘉議大夫太醫院使趙權嘉議大夫太醫院使馮適院使缺中奉大夫太醫院使張元珪資善大夫太醫院使張元澤資善大夫太醫院使張翼資善大夫太醫院使伴哥資徳大夫太醫院使五十四資善大夫太醫院使石卜尼資政大夫太醫院使哈剌歹世醫得效方序工欲善其事必先利其器器利而後工乃精醫者舎方書何以為療病之本自難經湯液靈樞傷寒論等篇出而後之醫師著述者殆如百家盖發縱指示俾對病而知體因體而得藥其用心亦仁矣哉僕幼而好學弱冠而業醫重念先世授受之難由鼻祖自撫而遷于南豐髙祖雲企逰學東京遇董奉廿五世醫方授以大方脉還家而醫道日行伯祖子美復傳婦人正骨金鏃等科大父碧崖得小方科於周氏伯熙載進學眼科及療瘵疚至僕再㕘究瘡腫咽喉口齒等科及儲積古方并近代名醫諸方由髙祖至僕凡五世其隨試隨效然而方卷浩若滄海卒有所索目不能周乃於天厯初元以十三科名目依按古方㕘之家傳昕夕弗怠刻苦凡十稔編次甫成為十有九卷名曰世醫得效方首論脉病證治次由大方脉雜醫科以發端至瘡腫科而終編分門析類一開卷間綱舉而目張由博以見約固非敢求異於昔人直不過欲便於觀覽云耳欽惟國朝念羣黎之疾苦惠民有局設教有學於醫尤切然自愧山林鄙陋見閣士傳妥協纂集舛謬惟多尤望當道縉紳醫師進而教之訂其訛補其偏俾綉諸科則庶幾廣聖皇好生之仁於無窮豈不韙歟仍至元三年嵗丁丑七月既望嘉禾後學達齋危亦林拜手謹書
