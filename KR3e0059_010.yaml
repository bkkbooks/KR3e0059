body:
  text: 世醫得效方卷十元危亦林撰大方脈雜醫科頭痛風證芎芷香蘇散治傷風鼻中清涕自汗頭疼或發熱方見傷寒和解類消風散治傷風及風虛嘔惡頭痛風疹浮滿方見風科熱證類寒證連鬚蔥白湯治傷寒已發汗未發汗頭疼如破生薑二兩連鬚蔥白小切半斤右用水二升煮令減半去滓分三服服不差者服後湯葛根蔥白湯治頭痛不止葛根白芍藥知母各半兩川芎生薑各一兩蔥白一握右銼散水三升煎取一升半去滓每服一盞半熱服暑證茵陳散治感暑自汗面垢脈微頭痛香需散加茵陳每服三根蔥白五寸生薑三片同煎熱服香薷散方見傷暑類濕證小芎辛湯治風寒在腦或感濕頭重頭痛眩暈欲倒嘔吐不定川芎一兩細辛去蘆白术去蘆炒甘草灸半錢各右銼散每服四錢水一盞半薑五片茶芽少許煎至七分不拘時溫服一方以川芎一兩細辛半兩甘草二錢防風半夏川白芷各半兩煎同上尋常風濕頭疼立效熱證防風散治積熱上衝頭熱如火痛入頂中防風去蘆羌活去蘆薄荷去粗梗當歸去尾大黃梔子去鬚川芎各一兩蟬退二十箇去足白粉草五錢右為散每服四錢水一盞半燈心二十莖苦竹葉十皮煎食後服大陽丹治腦寒之病皆因邪攻於上焦令人頭疼晝夜引痛不能安寧腦子二錢别研川芎甘草白芷各一兩石膏二兩别研川烏一兩重者炮去皮臍右為末蜜同麵糊圎每兩作十八圓朱紅為衣食後以生蔥茶嚼下或用五圓以水磨爛塗患處洗心散治風熱上壅頭目痛甚方見積熱類茶調散治丈夫婦人諸風上攻頭目昏重偏正頭疼鼻塞聲重傷風壯熱肢體煩疼肌肉蠕動膈熱痰盛婦人血風攻疰太陽穴疼但是感風氣悉皆治之常服清爽頭目薄荷去梗不見火四兩羌活一兩川芎二兩甘草炙兩一細辛去蘆五錢防風去蘆五錢白芷一兩荆芥去梗二兩右為末每服二錢蔥白茶清調下用蔥涎調貼兩太陽穴除痛甚者特效又用朴硝末少許吹入鼻中立愈左痛吹右右痛吹左芎犀圎治偏頭疼一邉鼻塞不聞香臭常流清涕或作臭氣一陳如芎蝎等遍服無效服此不十數服或作嚏突出一鋌稠膿即愈石膏細研四兩生龍腦别研朱砂研飛四兩內一兩為衣生犀屑一兩人參去蘆二兩茯苓去皮二兩川芎四兩阿膠碎炒半一兩細辛去苗二兩麥門冬去心三兩甘草灸兩二山梔子去皮一兩右除别研藥後入並為末煉蜜圓每服一圓至二圓細嚼茶酒任下食後服神芎圓治一切頭痛昏眩利咽膈能令遍身結滯通暢除痰飲解諸熱大黃黃芩各二兩黑牽牛炒白滑石各四兩黃連大川芎薄荷葉各半兩右為末水圓小豆大溫水下十圓至十五圓日三服或煉蜜圓亦可萊蔔汁治偏頭疼用一蜆殼仰卧左痛注右右痛注左或兩鼻皆注亦可數十年患皆一二注而愈加減辛夷散治風熱上壅鼻流濁涕或腥臭頭昏眉稜角痛右以茶調散加辛夷仁藁本蒼耳子木通各一兩為末淡茶清調立效方見前虛證大芎辛湯治痰厥飲厥腎厥氣厥等證偏正頭疼不可忍者只以此藥并如聖餅子服之不拘病退但多服自能作效氣虛髙年人仍服養正丹黑錫丹若發熱頭疼却不可服生附子去皮尖生烏頭去皮尖天南星泡洗乾薑炮細辛去蘆川芎各一兩甘草三分右銼散每服四錢水二盞薑七片茶芽少許煎至六分食前服中脘素寒者不用茶芽如聖餅子治男子婦人氣厥上盛下虛痰飲風寒伏留陽經偏正頭疼痛連腦巔吐逆惡心目眩耳聾常服清頭目消風痰暖胃氣川烏炮製臍去皮天南星炮乾薑炮一兩各甘草川芎各二兩天麻防風去蘆及叉股者半夏湯炮七次半兩一方加細辛右為末湯浸蒸餅和圓如雞頭子大捻作餅子曬乾每服二十餅薑湯或茶任意咽下須自合糊少及藥真易效若傷寒得汗尚餘頭痛者濃煎蔥白生薑湯下消風散治風證頭痛至亟用生抽葉蔥白研汁調貼頭上兩太陽穴立驗方見風科熱證類大附圓一名蔥涎圓治元氣虛壅上攻偏正頭疼不可忍大附子一隻炮去皮臍右為末蔥涎圓如梧子大每服十五圓至二十圓臨卧茶清送下一方以川烏頭炮去皮尖為末用韭葉自然汁和圓治風虛痰涎頭疼四川圓治頭痛如破大川烏一個生去皮臍川白芷川細辛去葉大川芎各一兩右為末韭菜自然汁圓黃丹為衣每服一圓細嚼蔥白淡茶清下又名鶴頂丹硫黃圓治頭痛如破每發則數日不食百藥不療硫黃二兩硝石一兩右用水為圓指頭大空心臘茶嚼下一圓或圓如梧子大每服十五圓暑暍懵冒者冷水服下咽即豁然清爽傷冷即以沸艾湯下葫蘆巴散治氣攻頭痛葫蘆巴微炒三稜銼醋浥一宿炒乾各一兩乾薑炮分等右為末每服二錢溫生薑湯或酒調下凡氣攻頭痛一服即差萬法不愈頭痛如破者服之即愈或瘴瘧差後頭痛呼號百方不效用此一服如失去小可頭痛更捷又方點頭散川芎二兩香附子炒去毛四兩為末淡茶清調常服除根附子湯治頭風至驗大附子一個生用去皮臍菉豆一合右同入銚子內煮豆熟為度去附子服豆即安清空膏治諸般火症頭疼惟血虛頭疼不治川芎五錢柴胡七錢黃連酒炒防風羌活各一兩炙草一兩五錢黃芩酒炒三兩右為末每服二錢入茶少許調和臨臥服白湯下一方治頭風鼻流涕人參甘草天麻白芍荆芥薄荷乳香炒去油沒藥炒去油白芷甘松甘菊藁本白茯苓北細辛洗淨各三錢右共為細末貯瓶中用少許嚊之竒方治偏腦疼將新瓦片打做圓片六片要茶鐘口大小在炭火內燒紅淬在陳醋內一兩次用絹包裹尉太陽穴片冷再換第二塊六片尉完用帕扎住避風雨三日永不再發祕方治偏正頭疼兩前茶四錢細辛川芎牛膝各二兩薏苡仁一錢五分甘草五分赤白首烏製一錢五分右銼散每服五錢水二盞煎七分溫服又方治偏頭疼及鼻淵龜板酥炙一個辛夷花麻黃藁本各五錢右共為細末每服二錢黑沙糖拌陳黃酒下覺醉而止年久者三服即愈又方治老年人血虛火動頭疼生地黃酒洗三錢山藥丹皮各一錢五分山萸白茯苓澤㵼黃柏酒炒知母各一錢右銼散水二盞煎七分溫服白附子散治腦逆頭痛齒亦痛麻黃不去節天南星炮烏頭炮去皮各半兩白附子炮兩一朱砂研麝香研乾薑各一分全蝎去毒足五個炒右為末酒調半錢服訖去枕卧少時備急圓治積聚頭疼大黃乾薑巴豆去皮心出油右等分為末煉蜜圓如豌豆大米飲下一圓羸人服半圓菉豆大以大便利為度四柱散治大病後及諸虛頭痛右用水煎將熟時入腦茶一錢服之方見痼冷類二陳湯治眉心并眉梁骨疼者痰飲也宜用二陳湯煎飲吞下青州白圓子最驗方見痎瘧及風科通治類瓜蒂散治胸中有伏痰吐之即愈瓜蒂末赤小豆末各等分右研勻熱米飲調一錢匕羸服半錢得吐為度痛即止都梁圓大治諸風眩暈婦人産前産後乍傷風邪頭目昏重及血風頭痛服之令人目明凡沐浴後服一二並甚佳暴寒乍暖神思不清頭目昏暈並宜服之香白芷大塊者以沸湯泡洗右為末煉蜜和圓如彈子大每服一圓多用荆芥點臘茶細嚼下食後常服諸無所忌只乾咽嚼亦可灸法𩕄會穴在鼻心直上入髮際二寸再容亘許是穴灸七壯真頭痛者其痛上穿風府陷入於泥丸宫不可以藥愈夕發旦死旦發夕死蓋頭中人之根根氣先絶也面病柏連散治面上有熱毒惡瘡胡粉炒黃柏灸黃連右等分為末面脂調傅豬脂亦可又方治面上肺風瘡右用無灰酒於沙碗鉢內濃磨鹿角尖傅之兼服治腎臟風黃耆圓即愈硫黃膏治面部生瘡或鼻臉赤風刺粉刺百藥不效者惟此藥可治妙不可言每臨卧時洗面令淨以少許如面油用之近眼處勿塗數日間瘡腫處自平赤亦消風刺粉刺一夕見效生硫黃香白芷瓜蔞根膩粉各半錢芫青七個足去翅全蝎一個蟬退五個泥洗去右為末麻油黃蠟約度如合面油多少熬溶取下離火入諸藥在內如法塗之一方加雄黃蛇床子各少許又方治抓破靣右用生薑自然汁調輕粉傅破處更無痕瑕又方治粉刺右以白礬末少許酒調塗之玉盤散洗面藥白芨白斂白芷甘松白术藁本芎藭細辛零陵香白檀香各半兩皂角一斤去皮稱乾楮實半升黃明膠半斤用牛皮膠四兩亦得灸令通起搗篩餘者炒作珠子又搗取盡糯米一升淨搗為粉曬令極乾若微濕則損香右為末令勻相合成澡豆皂角末别入看澡豆緊慢添減以洗面不熾為度藥末不可太細滑石散乾洗頭藥右用香白芷零陵香甘松滑石四味並不見火等分為末摻髮上梳笓得法染鬚方右用針砂以井水淘淨濾乾醋浸炒黑為末入百藥煎少許先一日將蕎麥粉各一半調和打為糊塗在鬚上以蓮葉包裹更以絹巾兜定次早用肥皂洗淨後再用訶子五錢好雄沒石子一個醋炒為末百藥煎少許又以蕎麥粉醋調作稠糊依前封裹其黑如漆一方加真膽礬入或生麝香入又方針砂不以多少用水淘洗以水清為度用栁枝半寸長數根於銅銚內炒過却用好米醋浸一宿次日再炒以栁枝成炭為度於地上攤冷另放後八件打和為末當歸甘松石膏滑石各一錢橡斗子一兩酸榴皮三錢母丁香白檀香各一錢以上另收各包為末生麝少許沒石子二個訶子四個去核百藥煎三錢白芨一錢右用針砂一匙白及二匙八件末半匙餘者皆少許一處合和好米醋調成膏子塗於髭鬚之上以荷葉緊包定勿寬慢次日早洗去即黑却用些核桃淨肉研爛成油撚放上則光軟五方中此方最勝又方漢防己緑礬各一兩桑椹子一百個須大紫黑者當歸去蘆尾二兩右以磁罐盛用香油十二兩浸以紙數重緊扎定罐口於飯甑上蒸飯熟為度取出埋地下窨一百日用大妙又方酸石榴一個水銀半兩右先將石榴去頂作一竅入水銀在內仍用頂子蓋定再用黃蠟封固放留一月石榴內化作水為度然後以雞內金蘸藥染於鬚上隨手黑又方用黑桑椹一升科斗子一升即蝦蟆子以瓶盛蜜封於東屋角百日盡化為黑泥染鬚髮如漆又用桑椹二七枚和胡桃研如泥拔去白者點孔中則生黑者洗面藥治面上黑皯風瘡黑牽牛半斤甘松香附炒去毛各四兩右為末作面藥逐日洗之耳病祕傳降氣湯加石菖蒲治氣壅耳聾大有神效方見諸氣類小清肺飲治上膈有熱耳聾方見咳嗽類排風湯治風虛耳聾方見風科通治類塞耳丹治氣道壅塞兩耳聾聵石菖蒲一寸巴豆一粒全蝎一個去毒右為末蔥涎圓如棗核大每用一圓綿裹塞耳內又方治耳卒風腫毒起右用栁木蛀蟲糞水化取清汁調白礬末少許點入耳內效蠟彈圓治耳虛聾白茯苓二兩山藥炒兩三杏仁去皮尖炒兩半黃蠟二兩右為末鎔蠟圓如彈子大鹽湯嚼下亦有以黃蠟細切嚼點好茶送下亦效乾蝎散治耳聾因腎虛所致十年內一服效乾蝎黃色小者并頭尾用四十九個生薑切如蝎大四十九片二味於銀石器內炒令至乾為末右向晚勿食初夜以酒調作一服至二更以來徐徐盡量飲五更耳中門百十攢笙響便自此聞聲解倉飲子治氣虛熱壅或失飢冒暑風熱上壅耳內聾閉徹痛膿血流出赤芍藥白芍藥各半兩當歸甘草灸大黃蒸木鱉子去殼又各一兩右銼散每服四錢水煎食後臨卧服羊腎圓治腎虛耳聾或勞䪺傷氣中風虛損腎氣升而不降或耳虛鳴山茱萸乾薑川巴戟芍藥澤㵼北細辛兔絲子酒浸逺志去心桂心黃耆石斛乾地黃附子當歸牡丹皮蛇床子甘草蓯蓉酒浸人參各二兩菖蒲一兩防風二兩半茯苓半兩右為末以羊腎一雙研細以酒煮麵糊圓梧桐子大食前鹽酒下三十圓至五十圓立效安腎圓治虛弱耳聾大安腎圓四兩磁石半兩醋煅石菖蒲羌活各半兩右三件為末混合為圓梧桐子大每服四五十圓鹽湯溫酒任下黃耆圓治腎虛耳鳴夜間睡著如打戰鼓耳內風吹更四肢抽掣痛黃耆一兩白蒺藜炒羌活各半兩附子一枚羯羊腎一對焙乾右為末酒糊圓如梧子大每服四十圓日午空心煨蔥鹽湯下清神散治氣壅於上頭目不清耳常重聽乾菊花白僵蠶炒去絲觜各半兩荆芥穗羌活木通川芎防風各四兩木香一錢甘草石菖蒲各錢半右為末每服三錢食後臨卧茶清調下蓯蓉圓治腎虛耳聾或風邪入於經絡耳內虛鳴蓯蓉切片酒浸焙山茱萸去核石龍芮石菖蒲免絲子淘淨酒浸蒸焙川羌活去蘆石斛去根鹿茸燎去毛切片酒浸蒸磁石火煅醋淬七次水飛淨附子炮去皮臍各半兩全蝎去毒七個麝香半字旋入右為末煉蜜為圓梧桐子大每服七十圓加至百圓空心鹽酒湯任下犀角飲子治風熱上壅耳內聾閉塞腫掣痛膿血流出犀角菖蒲木通玄參赤芍藥赤小豆炒甘菊花去核梗各半兩甘草灸二錢半右銼散每服四錢生薑汁水煎不拘時溫服八味圎治耳聵及虛鳴右用好全蝎四十九枚炒微黃為末每服三錢以溫酒調仍下八味圓百粒空心只三兩服見效方見腳氣類小柴胡湯治發熱耳暴聾頰腫脅痛肘不可以運由少陽之氣厥而熱留其經也方見傷寒陽證類雄黃圓壯實人積熱上攻耳出膿水不差服雄黃圓㵼三五行即效方見積熱類地黃圓治勞損耳聾大熟地黃洗爁當歸川芎辣桂兔絲子酒浸三日炒乾搗末大川椒出汗故紙炒白蒺藜炒刺去葫蘆巴炒杜仲薑汁製炒去絲白芷石菖蒲各一分磁石火燒醋淬七次研細水飛一分半右為末煉蜜圓如梧子大每服五十圓蔥白溫酒空心吞下晚食前又服芷芎散治風入耳虛鳴白芷石菖蒲炒蒼术陳皮細辛厚朴製半夏製辣桂木通紫蘇莖葉甘草炙各一分川芎二分右銼散每服三錢薑五片蔥白二根煎食後臨卧服芍藥散治熱壅生風耳內痛與頭相連膿血流出赤芍藥白芍藥川芎當歸甘草大黃木鱉子各半兩右銼散每服四錢煎食後臨卧服治耳久聵以九節菖蒲末萆麻子為膏綿包塞之耳鳴方草烏頭燒帶生石菖蒲右等分為末綿裹塞耳一日三度耳熱出汁方硝石爛石膏天花粉防風各半錢腦子少許右為末摻耳立止久聾方萆麻子二十一箇去油用遠志去心乳香磁石煅如前各一錢皂角煨取肉半錠生地龍甲者二條全蝎一箇焙右為末入蠟搗圓柱入耳又方甘遂半寸綿裹插放兩耳中却將甘草口中嚼自然通聽極效耳聰方右用白鹽炒熱重帛包尉又方右以杏仁炒焦研細用綿裹塞耳驢膏治積年耳聾以驢生脂和生薑搗綿裹塞耳妙不可言有人耳癢一日一作可畏直挑剔出血稍愈此乃腎臟虛致浮毒上攻未易以常法治也宜服透冰丹勿飲酒啖濕麵蔬菜雞豬之屬能盡一月為佳不戒無效方見風科熱證類立效散治聤耳底耳有膿不止真陳皮燈上燒黑一錢為末麝香少許别研右和勻每用少許以綿蘸耳內膿淨却上藥麝香散治聤耳底耳耳內膿出桑螵蛸一箇慢火灸八分熟存性麝香一字别研右為末研令勻每用半字摻耳內如有膿先用綿撚紙以藥摻之一法用染坯枯礬等分為末以葦管吹入耳中即愈或入麝尤佳治耳內痛方以鱔魚血滴數點入耳內便愈百蟲入耳用麻油灌之即出耳中出血以龍骨末吹入即止蒼蠅入耳最害人速皂角子蟲研爛用生鱔血調灌入耳中通耳法治耳聾無所聞緊磁石一塊如豆大研細穿山甲一大片燒存性為末右用新綿裹了塞所患耳內口中銜一片生鐵以線繫住覺耳內如風雨聲即愈透耳筒治耳聾治抽腎氣虛耳中如風水聲或如鐘鼓聲椒目巴豆菖蒲松脂右各半錢為末更以蠟攤金薄候冷捲作筒子塞耳內一日一易神效惡蟲入耳桃葉挼細塞耳自出或以藍青研汁滴入耳又蔥涕灌耳中蟲即出亦治耳聾又香油稻稈灰汁又以川椒為末法醋浸一宿滴耳桃葉為枕蟲自鼻出蟻入耳豬精肉一指許炙令香置耳孔邉即出蜈蚣入耳生薑取汁灌耳中自出或以韭汁灌耳中即自出治耳中有物不可出右以麻繩剪令頭散傅好膠著耳中使其物粘之徐徐引出效用弓弦尤妙水入耳薄荷汁點經驗鼻病茶調散治傷風鼻塞聲重兼治肺熱涕濁方見頭痛類辛夷散治肺虛風塞濕熱之氣加之鼻內壅塞涕出不已或氣息不通或不聞香臭辛夷仁細辛洗去土葉藁本去蘆升麻川芎木通去節防風去蘆羌活甘草灸白芷各等分蒼耳子右為末每服二錢食後茶清調服熱者茶調散合和服川椒散治流涕大紅開口川椒微炒出汗訶子煨取肉川白薑生者辣桂川芎細辛淨白术等分右為末每服二錢溫酒調下南星飲治風邪入腦宿冷不消鼻內結硬物窒塞腦氣不宣遂流髓涕上等天白南星切成片用沸湯蕩兩次焙乾每服二錢用棗七枚甘草少許煎食後服三四服後其硬物自出腦氣流轉髓涕自收仍以大蒜蓽撥末杵作餅用紗襯灸熱貼𩕄前尉斗火尉透或香附末及蓽撥末入鼻中細辛膏治鼻塞腦冷清涕出不已細辛川椒乾薑川芎吳茱萸附子去皮臍各三分皂角屑兩半桂心一兩豬脂六兩右煎豬脂成油先一宿以苦酒浸前八味取入油煎附子黃色止以綿蘸塞鼻孔治久患鼻膿極臭者右以百草霜末冷水調服芎藭散治鼻中涕清出腦冷所致通草辛夷仁各半兩北細辛去苗甘遂桂心芎藭附子各半兩右為末蜜圓綿裹納鼻中蜜封塞勿令氣泄圓如大麻子漸稍加大微覺小痛搗薑為圓即愈此方治腦冷所致然此疾亦有腦熱者亦有肺寒者素問云膽移熱於腦則辛頞鼻淵又曰腦滲為涕肺之液為涕當審治之神效方治腦漏天麻甘松草烏煨白芷白附子煨去皮川烏湯泡薄荷細辛川芎蒼朮炒甘草防風各五錢全蝎三錢雄黃二錢右共為細末用寒食麵打糊圓菉豆大每服三十圓食後細嚼蔥湯送下竒方治鼻淵右用老刀豆文火焙乾為末每服三錢酒下重者不過三服即愈又方治同上辛夷五錢蒼耳仁二錢五分白芷一兩薄荷五分右為末每服二錢水調下又方治赤鼻方硫黃豆腐水煮三次淨取二錢輕粉白芷陀僧金色各一錢白礬五分右共為細末以津唾搽之晚搽日洗去祕方治鼻中息肉右用藕節有毛處一節燒灰存性為細末吹患處又方治鼻中流黃水不止右用絲瓜近根三五寸燒灰存性酒調服又方治赤鼻生硫黃一錢輕粉一錢杏仁二七個去皮右為末生餅藥調臨卧時塗早則洗去白圎散治肺風酒􅖟等疾生硫黃乳香生白礬右同研如粉每用手微爪動患處以藥擦之月日必愈梔子仁圎治肺熱病發赤㿔即酒􅖟右以老山梔子仁為末鎔黃蠟等分圓如彈子大空心茶清嚼下忌酒炙一半月立效治酒􅖟白鹽常擦為妙齆鼻細辛散治鼻齆不聞香臭瓜蒂北細辛右等分為末綿裹如豆大塞鼻中通草膏治鼻塞清涕腦冷所致通草辛夷細辛甘遂桂心川芎附子右等分為末煉蜜圓綿裹納鼻中密封閉勿令氣泄圓如麻子大稍加微覺搗薑汁為圎即愈雄黃散治鼻齆雄黃半錢瓜蒂二箇緑礬一錢麝少許右為末搐些子入鼻亦治息肉鼻瘡甘露飲黃連阿膠圎又方敷藥右用杏仁研乳汁傅之或以烏牛耳垢傅或黃柏苦參檳榔為末以豬脂研傅或青黛槐花杏仁研傅瓜丁散治齆鼻有息肉不聞香臭此藥傅之即化黃水點滴至盡不三四日遂愈不復作瓜丁即瓜蒂也細辛右等分為末以綿裹如豆許塞鼻中須臾即通鼻中息肉俗謂之鼻痔無不效消鼻痔方瓜蒂甘遂各二錢白礬枯螺青草烏尖各二分半右為末麻油搜令硬不可爛旋圎如鼻孔大用藥入鼻內令達痔肉上其痔化為水肉皆爛下每日一次甚妙灸法𩕄會在鼻心直上入髮際二寸再容豆是穴灸七壯又灸通天在𩕄會上一寸兩傍各一寸灸七壯左臭灸左右臭灸右俱臭俱灸曽用此法灸數人皆於鼻中去臭積一塊如朽骨臭不可言去此全愈凡鼻頭微白者亡血也赤者血熱也酒客多有之若時行衄血不宜斷之或出至一二升不已即以龍骨為末吹入凡九竅出血皆用此法甚良腋氣蜘蛛散治胡臭熏人不可嚮邇者大蜘蛛一箇以黃泥入少赤石脂搗細入鹽少許杵煉為一窠蜘蛛在內以火近燒通紅冷剖開右一味為末臨卧入輕粉一字用酸醋調成膏傅腋下明早登厠必㵼下黑汁臭穢不可聞於遠僻處棄埋之免染人神良六物散治漏腋腋下手掌足心隂下股裏常如汗濕汚衣乾枸把根乾薔薇根甘草各二兩胡粉商陸根滑石各一兩右為末以苦酒少許和塗當微汗出易衣更塗之不過三著便愈或一嵗復發又塗之中毒石刻方治蠱毒無論年代近遠但煮一鴨卵插銀叉於內併噙之約一食頃取視叉卵俱黑即中毒也五倍子二兩硫黃末一錢甘草三寸半生半灸丁香木香麝香輕粉各少許糯米二十粒右用水十分於瓶內煎取七分候藥面生皺皮為熟絹濾去滓通口服病人平正仰卧令頭髙覺腹中有物衝心者三即不得動若出以盆桶盛之如鰇魚之類乃是惡物吐罷飲茶一盞㵼亦無妨旋煮白粥補忌生冷油膩鮓醬十日後服解毒圎三五圎經旬復解毒圎治誤食毒草并百物毒救人於必死板籃根四兩乾者淨洗日乾貫衆一兩銼去土青黛研甘草生各一兩右為末煉蜜圎如梧子大以青黛别為衣如稍覺精神恍惚惡心即是誤中諸毒急取藥十五圎爛嚼用新水送下即解或用水浸炊餅為圎尤妙如常服可三五圎大能解暑泉僧方治金蠶蠱毒才覺中毒先吮白礬味甘而不澀次嚼黑豆不腥者是也右以石榴根皮煎汁飲之即吐出活蟲無不愈者礬灰散治中諸物毒晉礬建茶各等分右為末每服三錢汲新水調下得吐即效未吐再服保靈丹治蠱毒諸毒一切藥毒神效朱砂淨細研一兩大山豆根半兩雄黃黃丹麝香黃藥子續隨子生杵末半各二錢川巴豆肥者取肉不去油二錢半斑蝥二錢半足去頭翅糯米半炒半生赤蜈蚣二條一灸一生右各修治入乳鉢研和於端午重陽臘日修合不令雞犬婦人見用糯米稀糊圎如龍眼核大隂乾磁合收每一圎好茶清吞下不得嚼破須臾病人自覺心頭如拽斷皮條聲將次毒物下或自口出或大便出嫩則是血老則成鱉或蜣蜋諸雜帶命之物藥圎凝血並下以水洗淨收可救三人如中毒口噤即挑開下藥或蛇蝎兩汗諸毒以好醋磨傅患處立解服藥已效如知毒害之家不必研究若訴之其毒再發不救瘥後更忌酒肉毒食一月惟軟飯可也或急用但擇吉日精潔修合萬病解毒圎治蠱毒挑生毒藥毒草毒文蛤即五倍子兩半山茨菰即金燈花根一兩洗焙麝香二錢大山豆根續隨子取仁去油留性各半兩糯米朱砂雄黃各二錢紅牙大戟洗兩二右先以五味藥入木臼搗羅為末次研麝續隨子朱砂雄黃夾和糯米糊圎分作三十五圎端午七夕及冬至日淨室修合每服一圎生薑蜜水磨下井水浸研傅所患處解毒收瘡救病神妙朱砂雄黃乃攻五毒第一青黛雄黃散凡始覺中毒及蛇蟲咬癰疽才作服此則毒氣不聚上好青黛雄黃等分右為末新汲水調下二錢辰砂圎治蠱毒從酒食中著者端午日合辰砂另研雄黃别研水飛赤腳蜈蚣續隨子各一兩麝香一分右為末糯米飲圎如雞頭大若覺中毒即以酒下一圎蛇蝎所螫醋磨塗之單方蠶退紙不拘多少以麻油紙撚炒存性右為末新水調一錢頻服諸中毒面青脈絶昏迷如醉口噤吐血服之即蘇甘薺湯治蠱毒多因假毒藥以投之知時宜煮大豆甘草薺苨汁飲之通治諸藥毒國老飲治蠱毒白礬末甘草末右等分清水調下或吐黑涎一兩碗或瀉亦驗解諸毒殺腹內毒蟲右用藍青葉多研水調服又方解諸毒右以黃連甘草節濃煎服效獨勝散解藥毒蠱毒蟲蛇諸毒大甘草節以真麻油浸年嵗愈多愈妙右取甘草嚼或以水煎服神效挑生毒升麻湯治肋下忽腫起如生癰癤狀頃刻間大如碗此即中挑生毒也俟五更以菉豆細嚼試若香甜則是川升麻為細末右取冷熟水調二大錢連服之若洞泄出如蔥數莖根鬚皆具腫即消縮宜煎平胃散調補兼進白粥又方治魚肉瓜果湯茶皆可挑生初中毒覺胸腹稍痛明日漸加攪刺滿十日則物生能動騰上胸痛沈下則腹痛積以瘦悴此候也其法在上膈則取之用熱茶一甌投膽礬半錢於中候礬化盡通口呷服良久以雞翎探喉即吐出毒物在下膈即㵼之以米飲下鬱金末二錢毒即㵼下乃擇人參白水各半兩碾末同無灰酒半升納瓶內慢火熬半日許度酒熟取溫溫服之日一盞五日乃止在便飲食竒方治一切毒白扁豆曬為末新汲水下二三錢䪺服得利則安解砒毒方右用菉豆半升細擂去滓以新汲水調通口服或用真靛花二錢分作二服以井花水濃調服紫河車研水調服黑鉛井水磨下濃研青藍汁磨甘草節同服生麻油一盞飲之不能飲灌之立見起死此毒於肉飯中得之則易治飲酒中得之則酒氣散歸百脈難治若在胸膈作楚則用稀涎散吐之若在腹中作楚急服雄黃圎㵼之徐服參苓白术散無恙矣仍忌雞鵝肉數日又方用早禾稈燒灰新汲水淋汁絹巾濾過冷服一碗毒從下利即安又方用旋刺下羊血雞鴨血熱服兼解鼠莽毒及丹藥毒又方藍飲子解砒毒及巴豆毒用藍根沙糖二味相和擂水服之或更入薄荷汁尤妙又方白扁豆青黛甘草各等分巴豆一邉去殼右為末以沙糖一大塊水化開調一盞飲之毒隨利之却服五苓散之類解射罔毒以生藍汁大小豆汁服效解巴豆毒寒水石磨水服效黃連汁菖蒲屑汁亦效解天雄附子烏頭毒防風棗肉濃煎湯服解丹毒地漿服最妙解一切􅌲毒掘新地窟取真黃土以冷水於內攪之令濁澄少頃取飲之可解亦拾楓木􅌲食之令人笑不止又方用芫花生為末每一錢汲新水下以利為準菌之毒者蓋因蛇蟲毒氣熏蒸所致又解諸毒用玉簪花根擂水服中諸藥毒用甘草黑豆淡竹葉等分銼散水一碗濃煎服解鼠莽毒用金線蟲草根磨水服之即愈或用烏桕根擂水亦好又方用枯過明礬同極等好茶末少許新汲冷水調服纍有效驗又方用大黑豆煮汁服之如欲試其驗先刈鼠莽苗葉以豆汁澆其根從此敗爛不復生矣治猘犬傷或經久復發無藥可療者用之極驗雄黃色黃而明者五錢麝香五分右各研和勻用酒調二錢服如不肯服者則撚其鼻而灌之服藥後必使得腫切勿驚起任其自醒候利下惡物再進前藥即見效矣終身禁食犬肉蠶蛹此毒再發則不可救又方用斑蝥大者二十一隻去頭足翅以糯米一勺先將斑蝥七隻入米內於微火上炒不令米赤去此斑蝥别入七隻再於前米內炒令斑蝥色變復去之又别入七隻如前法炒米出青煙為度去斑蝥不用以米研為粉用冷水入清油少許空心調服頃又再進一服以小便利下惡毒為度如不利再進一服利後或腹肚疼痛急用冷水調青靛服之以解其毒否則有傷或煎黃連水亦可不宜便食熱物蜈蚣毒用清油燈心點燈以傷處於煙上熏之其痛即止或用雞糞塗之嚼吳茱萸擦之立效又方蜘蛛一枚安置於傷處飲出毒氣用冷水一碗在傍如蜘蛛死即投水中救活痛未止再換蜘蛛痛止為度蜂蠆毒用野芋葉擦之如不便急以手就頭爬垢膩傅之或用鹽擦斑蝥毒澤蘭葉挼汁飲之乾者為末白湯調下鱔鱉蝦蟆毒生豉一大合新汲水半碗浸令豉水濃䪺服之即瘥此三物令人小便祕臍下蔽痛有至死者河豚魚毒一時困怠急以清油多灌之使毒物盡吐出為愈白礬為末湯調服河豚能殺人服此毒自消蛇傷毒貝母為末酒調令患者盡量飲之䪺久酒自傷處為水流出候水盡却以藥滓傅瘡上若所傷至垂死但有少氣服此即活又方惡蛇咬傷傾仆不可療者香白芷為末麥門冬去心濃煎湯調下頃刻咬處出黃水盡腫消皮合仍用此藥滓塗傷處又方治毒蛇所傷北細辛川白芷各五錢雄黃二錢為末又另研麝香少許每服二錢溫酒調下又方五靈脂一兩雄黃半兩為末酒調二錢服仍塗傷處又方冷水洗後用茱萸二合水一碗研取汁服以滓傅虎傷生葛汁服兼洗傷處白礬為末納瘡口中痛止立效蜘蛛咬嚼薤白傅雄黃亦可遍身腫服藍汁狗咬杏仁研細先以蔥湯洗然後以此塗傷處又方萆麻子五十粒去殼井水研成膏先以鹽水洗咬處次以此膏敷貼或用虎膏及虎骨末傅狗咬涎文瘡令人昏悶浸椒水調莽草末塗之又方白礬為末摻瘡內裹之亦效馬咬鞭梢燒灰塗之獨顆栗子燒灰貼亦妙蚯蚓咬或於地上坐卧不覺咬腎隂腫鹽湯溫洗數次效貓咬薄荷汁塗之蠶咬苧汁塗之鼠咬貓毛燒灰麝香少許津唾調傳壁虱蜈蚣萍曬乾燒煙薰之則去青鹽水遍灑床席上即絶壁鏡咬毒人必死燒桑柴灰用水煎三四沸濾汁調白礬末塗瘡口兼治蛇毒或醋磨雄黃塗之蝎螫痛不可忍白礬半夏等分為末釅醋調貼痛止毒出八腳蟲傷方其蟲隱於壁間以口水射人遍體生瘡如湯火傷用烏雞翎燒炙雞子白調塗效灸法凡猘犬所嚙未盡其惡血毒者灸上一百壯巴後灸每日一壯若不血出刺出其血百日灸乃止禁飲酒及豬犬肉蛇傷亦灸傷處諸蟲烏梅圎治蛔厥令病者靜而復煩臟寒蛔上入膈故煩須臾復上得食而嘔又煩者蛔聞食臭出其人自吐烏梅去核十箇當歸川椒去目汗細辛附子炮去皮臍桂心人參黃蘗各六分乾薑炮兩一黃連一兩三錢右為末以苦酒漬烏梅一宿去核蒸之五斗米下熟搗成泥和藥相得納臼中與蜜杵一二百下圎如梧子大食前飲服十圎稍加至二十圓集效圎治因臟腑虛弱或多食甘肥致蛔蟲動作心腹絞痛發則腫聚往來上下痛有休止腹中煩熱口吐涎沫是蛔咬宜服此藥若積年不瘥服之亦愈又治下部有蟲生痔癢痛木香鶴虱炒檳榔訶子煨核去蕪荑炒餅附子炮去皮臍乾薑炒各七錢半大黃銼炒半一兩右為末蜜圎梧桐子大每服三十圎食前橘皮湯下婦人醋湯下什蟲散雷丸二箇雞心檳榔二箇鶴虱一錢史君子七箇去殼右為末入輕粉少許分作兩服當晚用豬精肉一兩切成片以皂角漿浸一宿至五更微火炙熟又用些清油拭肉候溫取一服藥末摻於肉上略烘過空腹食之至巳刻蟲自下乃飲食貫衆酒取寸白諸蟲五更嚼肉一片莫吞俟蟲尋肉其頭向上却吐出肉嚼史君子三箇并輕粉一字少頃以當晚所煎貫衆酒吞解毒雄黃圎七粒即㵼下皆蟲也下寸白蟲東邉石榴根煎湯調檳榔末服之即下先將豬肉一塊含在口中咽津下勿食之須臾去肉救急救自縊法凡自縊髙懸者徐徐抱住解繩不得截斷上下安被卧又以一人腳踏其兩肩手挽其髮常令弦急勿使緩縱一人以手據按胸上數摩動之一人摩將臂肘屈伸之若已強直但漸屈之并按其腹如此一時頃雖得氣從口出呼吸眼開仍引按不住須臾以少桂湯及粥清灌令喉潤漸漸能咽乃止更令兩人以管吹其兩耳此法最好無不活者自旦至暮雖冷亦可救暮至旦隂氣盛為難救溺水急解去死人衣帶灸臍中即活令兩人以筆管吹其耳中又法凡人溺水者救上岸即將牛一頭却令溺水之人將肚橫覆在牛背上兩邉用人扶䇿徐徐牽牛而行以出腹內之水如醒即以蘇合香圎之類或老薑擦牙又方雖溺死一宿尚可救搗皂角以綿裹納下部須臾出水即活又將醋半盞灌鼻中又法以屈死人兩腳著生人背上以死人背貼生人背擔走吐水即活又熬熱沙或炒熱灰將溺者埋於其中從頭至腳水出七孔即活又以酒壜一個以紙錢一把燒放壜中急以壜口覆溺水人面上或臍上冷則再燒紙錢於壜內覆面上去水即活數方皆效奈人不諳曉多以為氣絶而不與救療可憐也其便而用之救凍死四肢強直口噤只有微氣者用大釜炒灰令暖以囊盛尉心上冷即換之候目開以溫酒及清粥稍與之若不先溫其心便將火灸冷氣與火爭必死又法用氊或藁薦裹之以案繫定放平穩處令兩人對面輕輕滚轉往來如捲氊法四肢溫和即活救魘死不得著燈火照亦不得近前急喚多殺人但痛咬其足跟大母指甲邉并多唾其面即活如不醒者移動處些子徐喚之若元有燈即得如無燈切不可用燈照又用筆管吹兩耳或以皂角末吹兩鼻內或以鹽湯灌之或搗韭汁半盞灌鼻中冬月掘根研汁用灸法救魘寐一切卒死及諸暴絶證用藥或不效急搯人中穴及兩腳大母指內離甲一薤葉許各灸三五壯即活臍中灸百壯亦效破棺散治魘寐卒死及為牆壁竹木所壓水溺金瘡卒到悶絶産婦惡血衝心諸暴絶證半夏湯洗七次去渣不拘多少右為末每一大豆許吹入鼻中即活但心頭溫者一日可活皂角末亦效又方用蔥黃心或韭黃男左女右鼻中刺入深四五寸令目中出血即活又方視上唇裏有如黍米粒以針挑破單方治胸脅腹內絞急切痛如鬼擊之狀不可按摩或吐血口中衄血用熟艾如拳大水五盞煮三盞頻服又方鹽一盞水二盞和服以冷水噀之吐即瘥又方蓬莪术酒研服一盞備急散治卒中惡風氣忤迷絶不知人用乾薑大黃各一兩巴豆仁十五粒各研細以水三合灌服雄朱散或到客舍官馹及久無人居冷房睡中為鬼物所魘但聞其人吃吃作聲便令人呌喚如不醒不急救則死牛黃雄黃各一錢大朱砂半錢右為末每排一錢床下燒一錢用酒調灌之又方桃栁枝取東邉者各三七寸煎湯二盞候溫并灌服又方竈心土捶碎為末每服二錢新汲井花水調灌更挑半指甲許吹入鼻中朱犀散治中惡中忤鬼氣其證暮夜或登厠或出郊野或遊空冷屋室或人所不至之地忽然眼見鬼物鼻口吸著惡氣驀然倒地四肢厥冷兩手握拳鼻口出清血性命逡巡須臾不救此證與尸厥同但腹不鳴心脅俱暖凡此切勿移動即令親眷人人圍繞打鼓燒火或燒麝香安息香蘇木樟木之類立候其醒方可移歸犀角半兩鎊屑研末生麝香大朱砂各一分右為末每服二錢新汲井水調灌之又方雄黃為末每服一錢桃枝葉煎湯調灌下又方故汗衣須用內衣久遭汙者佳男用女衣女用男衣燒灰為末每服二錢百沸湯調下又方治客忤中惡多於道路在外得之令人心腹絞痛漲滿氣衝心胸不急治即殺人好京墨為末調二錢服或瓦器盛湯用衣襯貼熱湯於肚上轉移溫湯冷别換骨鯁骨鯁入喉以縮砂甘草等分為末以綿裹少許噙之旋吐咽津久之隨痰出又方以野苧根淨洗搗爛如泥每用龍眼大如被雞骨所傷以雞羮化下魚骨則以魚汁化下又方用金鳯花子嚼爛噙下無子用根亦可口中骨自下便用溫水灌嗽免損齒雞骨尤效玉屑無憂散治誤吞骨鯁哽塞不下玄參貫衆滑石縮砂仁黃連甘草茯苓山豆根荆芥穗各半兩寒水石煅鵬砂各三錢右為末每一錢先抄入口以新水咽下蜜綿法通治諸鯁用薤白煮令半熟以線繫定手捉線少嚼薤白咽之度薤至鯁處引鯁即出矣一法綿一小塊以蜜煮用如前法又方以朴消研細對入雞蘇圓别圎如彈子大仰卧含化不過三四圎自然化之又方以南鵬砂新汲水滌洗噙化其骨脫然而失又方以貫衆濃煎一盞半分三服連進片時一咯而骨出神效解毒圎收藏年深愈見神效青靛花六兩天黃山豆根各四兩朴消一錢黃藥子二兩半白藥二兩半自然銅四兩貫衆山梔子宣連楮實子山茨姑各二兩半白滑石一斤十二兩鉛光石芭蕉自然汁右為末糯米糊和藥一千杵隂乾不可見日不然析去一料可作一千圎却用鉛光石打光諸般骨鯁井水磨下一圎作勢一吞即下頰腮焮腫咽喉飛瘍清油調水磨化酒毒腸風下血薄荷湯赤眼腫痛井水金蠶蠱毒黃連水蛇犬蜂螫蜈蚣毒用水磨塗傷處誤吞竹木棘刺井水諸般惡毒用新汲水魚骨鯁以橄欖食即下無則核搗為末用流水調下又方獺爪於咽喉下外爬自下獸骨鯁象牙梳或牙笏等磨水咽下桑木上蟲屑米醋煎灌嗽自下備急圎療心腹諸卒暴百病中惡客忤心腹脹滿卒痛如刀所刺氣急口禁乾薑一兩炮巴豆去皮油二兩大黃二兩右為末煉蜜圎梧桐子大每服三十圎不拘時溫水下誤吞蜈蚣以生豬血令病人喫須臾生清油灌口中惡心其蜈蚣滚在血中吐出繼與雄黃細研水服愈誤吞銅物不能化者濃煎縮砂湯服其銅自下又用生荸薺研爛服其銅自化細研堅炭為末米飲下於大便內㵼下如烏梅狀怪疾得效四十六方項上生瘡如櫻桃大有五色瘡破則項皮斷但逐日飲牛乳自消寒熱不止經日後四肢堅如石以物擊之一似鐘磬聲日漸瘦惡用茱萸木香等分煎湯飲即愈大腸頭出寸餘痛苦直候乾自退落又出名為截腸病若腸盡乃不治但初覺截餘可治用芝麻油器盛之以臀坐之飲大麻子汁數升愈口鼻中腥臭水流以碗盛之有鐵色蝦魚如粳米大走躍不住以手捉之即化為水此肉壞矣任意饌食雞肉愈腹上麻痺不仁多煮蔥白喫之自愈婦人小便中出大糞名交腸服五苓散效如未盡愈可用舊幞頭燒灰酒服之兩足心凸如腫上面生黑色豆瘡硬如釘子釘了履地不得脛骨生碎眼髓流出身發寒顫惟思飲酒此是肝腎氣冷熱相吞用炮川烏頭末傅之煎韭子湯服效凡腹脹經久忽㵼數升晝夜不止服藥不驗乃為氣脫用益智子煎濃湯服立愈四肢節脫但有皮連不能舉動名曰筋解用酒浸黃蘆三兩經一宿取出焙乾為末每服二錢酒調下服盡安玉莖硬不痿精流無歇時時如針狀揑之則脆乃為腎滿漏疾韭子破故紙各一兩為末每服三錢水一盞煎至六分每日三次飲之愈則住服咽喉間生肉層層相疊漸漸腫起不痛多日乃有竅子臭氣自出遂退飲食用臭橘葉煎湯連服愈腹中如鐵石臍中水出旋變作蟲行之狀繞身匝啄癢痛難忍撥掃不盡用濃煎蒼术湯浴之以蒼术末入麝香少許水調服痊眼前常見諸般禽蟲飛走以手捉之則無乃肝膽經為疾用酸棗仁羌活玄明粉青箱子花各一兩為末每服二錢水一大盞煎至七分和滓飲一日三服大腸蟲出不斷斷之復生行坐不得用鶴虱末水調五錢服之自愈眼睛垂出至鼻如黑角色痛不可忍或時時大便血出其名曰肝脹用羌活煎汁服數盞自愈腹中有物作聲隨人語言用板藍汁一盞分五服服之又名應聲蟲當服雷丸自愈有飲油五升以來方始快意長得喫則安不爾則病此是髮入胃被氣血裹了化為蟲也用雄黃半兩為末水調服蟲自出如蟲活者置於油中逡巡間連油撥之長江治卧於床四肢不能動只進得食好大言説喫物謂之失説物望病治如説食豬肉時便云爾喫豬肉一䪺病者聞之即喜遂置肉令病人見臨要却不與喫此乃失他物望也當自睡中涎出便愈手十指節斷壞惟有筋連無節肉蟲出如燈心長數尺餘遍身緣毛卷名曰血餘以茯苓胡黃連煎湯飲之愈遍身忽皮底混混如波浪聲癢不可忍抓之血出不能解謂之氣奔以人參苦杕青鹽細辛各一兩作一服水二碗煎十數沸去滓飲盡便愈眼白人渾黑見物依舊毛髮直如鐵條雖能飲食不語如醉名曰血潰用五靈脂為末二錢酒調下因著艾灸訖火痂便退落瘡內鮮肉片子飛如蝶形狀騰空去了痛不可忍是血肉俱熱用大黃朴消各半兩為末水調下微利即愈臨卧渾身虱出約至五升隨至血肉俱壞每宿漸多癢痛不可言狀惟喫水卧牀晝夜號哭舌尖出血不止身齒俱黑唇動鼻開但飲鹽醋湯十數即安眼赤鼻張大喘渾身出斑毛髮如銅鐵乃目中熱毒氣結於下焦用白礬滑石各一兩為末作一服水三碗煎至半令不住飲候盡乃安有蟲如蟹走於皮下作聲如小兒啼為筋肉之化雷丸雄黃各一兩為末摻在豬肉片上炙熟喫盡自安手足甲忽然長倒生肉刺如錐痛不可忍喫葵菜自愈鼻中毛出晝夜可長一二尺漸漸粗圎如繩痛不可忍雖痛摘一莖即後更生此因食豬羊血過多遂生用乳香硇砂各一兩為末以飯圎梧桐子大空心臨卧各一服水下十粒自然退落面上及遍身生瘡似貓兒眼有光彩無膿血但痛癢不常飲食減少冬則更甚名白寒瘡多喫魚雞韭蔥自愈脅破腸出臭穢急以香油摸腸用手送入煎人參枸杞淋之皮自全矣喫羊腎粥十日即愈口鼻中氣出盤旋不散凝如黑蓋色過十日漸漸至肩曽與肉相連堅勝金石鐵無由飲食此多因瘧後得之煎澤㵼湯日飲三盞連服五日愈遍身忽然肉出如錐既癢且痛不能飲食此名血擁若不速治潰而膿出以赤皮蔥燒灰淋洗喫豉湯數盞自安眉毛搖動目不能視交睫喚之不應但能飲食有經日不效者用蒜三兩取汁酒調下即愈毛竅節次血出若血不出皮脹膨如鼓須臾眼鼻口被氣脹合此名脈溢飲生薑水汁各一二盞即安忽然氣上喘不能語言口中汁流吐逆齒皆搖動氣出轉大則悶絶蘇復如是名曰傷寒併熱霍亂用大黃人參末各半兩水二盞煎至一盞去滓熱服可安口內生肉毬臭惡自己惡見有根線長五寸餘如叉股吐毬出以飲食了却吞其線以手輕揑痛徹於心困不可言用水調生麝香一錢服三日驗渾身生燎炮如甘棠梨每箇破出水內有石一片如指甲大泡復生抽盡肌膚肉不可治急用荆三稜蓬莪术各五兩為末下三服酒調連進愈頭面發熱有光色他人手近之如火燒人用蒜汁半兩汁調下吐如蛇狀遂安人自覺自形作兩人並卧不别真假不語問亦無對乃是離魂用辰砂人參茯苓濃煎湯服之真者氣爽假者化也男子自幼喜飲酒至成丁後日飲一二斗不醉片時無酒呌呼不絶全不進食日就羸弱令其父用手巾縳住其手足不令動搖但扶少立却取生辣酒一壜就於其子口邉打開其酒氣衝入口中病者必欲取飲堅不可與之須臾口中忽吐物一塊直下壜中即用紙封裹壜口用猛火燒滚約酒乾一半却開視之其一塊如豬肝樣約三兩重周回有小孔如針眼不可數計棄之於江飲食復舊雖滴酒不能飲矣夜間飲水誤吞水蛭入腹經停月餘日必生下小蛭能食人肝血腹痛不可忍面目黃瘦全不進食若不早治能令人死用田中乾泥一小塊小死魚三四箇將豬脂溶攪勻用巴豆十粒去殼膜研爛入泥內為圎菉豆大用田中冷水吞下一圎小兒只用三圎至五圎須臾大小水蛭一時皆㵼出却以正方四物湯加黃耆煎服生血補理方見婦人科通治類婦人産後忽兩乳伸長細小如腸垂下直過小肚痛不可忍危亡須臾名曰乳懸將川芎當歸各二斤半斤銼散於瓦石器內用水濃煎不拘時候多少溫服餘一斤半銼作大塊用香爐慢火逐旋燒煙安在病人面前卓子下要煙氣直上不絶令病人低頭伏卓子上將口鼻及兩乳常吸煙氣直候用此一料藥盡看病證如何或未全安略縮減再用一料如前法煎服及燒煙熏吸必安如用此二料已盡雖兩乳略縮上而不復舊用冷水磨萆麻子一粒於頭頂心上塗片時即洗去則全安矣婦人臨産服催生藥驚動太早未嘗離經而用力太過以致肓膜有傷産後水道中垂出肉線一條約三四尺長牽引心腹痛不可忍以手微動之則痛苦欲絶先服失笑散數服仍用老薑三斤淨洗不去皮於石鉢臼內研爛用清油二斤拌勻入鍋內炒熟以油乾焦為度先用熟絹一段約五尺長摺作結方令穩重婦人輕輕盛起肉線使之屈曲作一團納在水道口却用絹袋兜裹油薑稍溫傳在肉線上熏覺薑漸冷又用尉斗火尉熱使之常有薑氣如薑氣已過除去又用新者如此熏尉一日一夜其肉線已縮入半再用前法越兩日其肉線盡入腹中其病全安却再服失笑散芎歸湯補理切不可使肉線斷作兩截則不可醫有人患癆瘵兩年諸藥不效一日無肉味其腹痛不可忍又恐傳染移在空房候其自終經停三日病者腹痛氣息將絶思憶肉味之急忽有人惠雞子三枚其病人俯仰取火低頭取瓦銚煎熟吹火屢燃屢滅鼻中如有所礙將熟間忽嚏噴一聲有紅線一條自鼻中出牽抽約二尺長趨下瓦銚中病人知是怪物急用碗覆煎銚中盡力燒火不住其銚欲裂方住火開銚視之乃是小蟲一條頭目皆具已煅死如鐵線樣即以示其家人後棄之於江其病即安居民逃避石室中賊以煙火熏之欲死迷悶中摸索得一束蘿蔔嚼汁下咽而蘇又炭煙熏人往往致死含蘿蔔一片著口中煙氣不能毒人或預曝乾為末備用亦可或新水擂爛乾蘿蔔飲之亦可自行被攧穿斷舌心血出不止以米醋用雞翎刷所斷處其血即止仍用真蒲黃杏仁去皮尖鵬沙少許研為細末煉蜜調藥稀稠得所噙化而安身上及頭面肉上浮腫如蛇狀者用雨滴階磚上苔痕一錢水化開塗蛇頭立消世醫得效方卷十
