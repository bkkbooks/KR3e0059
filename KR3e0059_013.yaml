取酒用之亦可常服枳皮酒治中風身體強直不得屈伸反覆右取枳樹皮細切成片以酒二升浸一宿每日溫酒飲半升酒盡再作萊服膏治大人小兒禁口風皂角不注者子炙去皮蘿蔔如無以子代之右以皂角為末以蘿蔔同釅醋研雞翎蘸藥塗牙齦即愈一得散治中風口噤不知人事産後中風同右用白术四兩水三升煎一升頓服又方治中風通身冷口噤不知人者右用川獨活四兩好酒一升煎至半升分溫服獨行散治失音槐花一味炒香熟三更后床上仰卧隨意服亦治咯血又方治中風心煩恍惚或腹中痛滿或時絶而復蘇竈心土五升搗為末以冷水八升和之取汁服口噤者以竹筒灌下即愈趂風膏治中風手足偏廢不舉川山甲左廢用左足右廢用右足紅海蛤如棋子者大川烏頭生用各二兩右為末每用半兩搗蔥白汁和成厚餅約徑一寸半貼在所患一邉腳中心用舊絹緊縛定於無風密室中椅子上坐用湯一盆將貼藥腳於盆內浸仍用人扶病人恐汗出不能支持候汗出即急去了藥汗欲出身麻木得汗周遍為妙切宜避風自然手足可舉如病未盡除半月二十日已后再依此法用一次自除其根仍服消風通理藥逺欲以自養乳靈圓治痛風數年不能舉日夜呻吟不數圓大效川烏去皮臍兩生用半生乾地黃酒浸一宿一兩草烏頭小者去皮臍炒半兩去鹽木香不見火二錢半五靈脂揀去沙石微炒麻黃去根節微炒自然銅火煅七次米醋淬七次另研虎脛骨死虎尤好各一兩酥塗火炙存性乾木瓜酸明者二兩滴乳香好者和燈心研二錢半為末去燈心敗龜取市肆間卜筮鑽過下截龜殼者是米醋浸三日炙黃色再用醋淬七錢半右研細如粉煉蜜去上白沫為圓如龍眼大每一兩重作十二圓以帶皮生薑自然汁化開一圓熱酒服更以酒半盞送下病在下空心食前服病在上食后停少時服一日二服口有少麻勿疑追風獨活散治氣虛感風或驚恐相乘肝膽受邪使上氣不守致頭目招搖手足顫掉漸成目昏獨活正地骨皮北細辛大川芎菊花防風去義甘草各等分右銼散每服三錢水一盞半煎取六分清汁入少竹瀝再煎食后服仙桃圓治丈夫婦人手足麻痺時發疼痛腰間氣閉作痛不止或冷地冰身血氣不運打撲閃朒不可忍及癱瘓等疾生川烏三兩五靈脂四兩葳靈仙五兩右各燒焙同研為末醋糊圓梧桐子大每服七八圓空心白水下竒方治中風牙已緊無門下藥天南星末半錢白龍腦一字頻擦令熱牙自開又治暗風倒地北細辛為末每挑一字搐鼻中神應方治諸風癎久服其涎自大便中出生白礬一兩研好臘茶半兩煉蜜為圓梧子大三十圓臘茶湯下烏蝎圓治手足拳攣痛不可忍者蜈蚣一條去足炒乳香沒藥另研地龍去土全蝎去足翅草烏各五分烏藥炒麝香各一錢川烏二隻生用去皮尖右為末麵糊為圓梧桐子大每服七圓至十圓十五圓用麝香少許好酒送下空心服服至七日略利至半月或滿身發風丹經月方沒久服其病安全后常用生川烏沒藥浸酒日二服通氣驅風湯加乳香沒藥生川烏麝香少許酒調服不飲木瓜湯下服此忌熱食一時四神圓治手足頑麻痰涎壅盛頭目昏眩肩背拘急天麻南星各湯洗淨防風去蘆各一兩薄荷葉半兩右為末酒煮薄麵糊圓菉豆大每服二十圓荆芥生薑煎湯送下腎瀝湯腎虛為厲風所傷語音蹇吃不轉偏枯腿腳跛蹇緩弱不能動口喎言音混濁便利耳聾塞腰背相引羊腎一具黃蓍川芎桂心當歸人參防風甘草五味子各一兩磁石一兩七錢玄參芍藥茯苓各一兩二錢半地骨皮五錢生薑二兩右銼散水一斗煮羊腎取五升下藥取二升分三服神效止痛圓治中風癱瘓不遂手足嚲曵口眼喎斜或旋運僵臥涎潮搐搦卒中急風不省人事每服二十圓黑豆淋酒下風虛眩冒項筋拘急太陽穴疼痛亦用生地黃汁調酒下腰腳疼重行步艱辛筋脈攣促俯仰不利賊風所中痛如錐刺皮膚頑厚麻痺不仁或血脈不行肌拘乾瘦生蔥酒下或生蔥茶亦可風濕腳氣腿膝無力或腫或疼不能舉步兩腳生瘡濃血浸潰癢痛無時愈而又發溫鹽酒下打撲閃肭筋骨內損已經多年每遇天寒時發疼痛沒藥酒下乳香川烏沒藥地龍五靈脂白膠香白薑半夏五加皮赤小豆各等分右為末糊圓隨證湯引如前並空心服牛黃清心圓治諸風緩縱不收語言蹇澀痰涎壅盛心怔健忘或發顛狂並皆治之白芍藥一兩半柴胡去苖桔梗各一兩二錢半甘草銼炒五兩山藥麥門冬去心黃芩黃連各一兩半杏仁去皮尖取仁麩炒黃一兩二錢半别研大棗一百枚蒸熟去皮核研成膏神麯研蒲黃炒各二兩半大豆黃卷炒肉桂去皮各一兩七錢半白斂七錢半當歸去苗防風去苗白术各一兩半羚羊角末麝香龍腦研各一兩人參去蘆半二兩白茯苓去皮芎藭各一兩二錢半乾薑炮七錢半阿膠炒一兩七錢半牛黃一兩二錢研犀角末二兩雄黃研飛八錢金箔一千二百箔內四百為衣右除棗杏仁金箔二角末及牛黃麝香雄黃龍腦四味别為末入餘藥和包煉蜜棗膏為丸每兩作十丸以金箔為衣每服一丸食后溫水化下烏荆丸治諸風緩縱手足不隨口眼喎斜言語蹇澀眉目瞤動頭昏腦悶筋脈拘急不得屈伸遍身麻痺百節疼痛皮膚瘙癢抓成瘡瘍又治婦人血風渾見癢痛頭疼眼暈及腸風臟毒下血血下不止服之尤效久服令人顔色和悅力強輕健鬚髮不白川烏去皮臍炮一兩荆芥穗二兩右為末醋麵糊丸梧桐子大每服二十丸酒或熟水任下有痰食空時日三四服無痰早一服青州白丸子治男子婦人手足癱瘓風痰壅盛嘔吐涎沫及小兒驚風並皆治之半夏白好者水浸洗過七兩生用川烏頭去皮臍用半兩生白附子二兩生用天南星三兩生用右為末以生絹袋盛於井花水內擺出未出者更以手握令出以滓更研再入絹袋擺盡為度放瓷盆中日曬夜露每日一換新水攪而復澄春五日夏三日秋七日冬十日去水曬乾如玉片碎研以糯米粉煎粥清為丸如菉豆大常服二十丸生薑湯下不拘時如癱瘓風溫酒下小兒驚風薄苛湯下三五丸蘇毒丸和氣宇散風痰亦可常服右以蘇合香丸方見大方科中氣類與青州白丸子方見前打和薑蘇湯化下蛇黃散治暗風忽然仆地不知人事良久方醒蛇黃不拘多少七次米醋燒淬右為末每服二錢溫酒下數服便愈年深者亦效琥珀丸治暗風百日內者天南星二兩大者掘地坑深尺餘火煅令紅去火安南星在內即以醋沃之瓦盆蓋一伏時取出先去灰土焙乾為末朱砂半兩别研琥珀二錢通明者别研真金泊十片右銼勻以獖豬心血為丸梧桐子大每服十五丸人參或麥門冬湯下臨卧服辰砂丸治暗風年深日近發搐不省人事好辰砂五錢好雄黃三錢各研極細再同一處研右用烏雞心內血和丸梧桐子大每服十丸以煮獖豬心湯吞下如不省人事則灌下仍灸百會穴九壯妙應丸治諸風攣急滿體疼痛遊走無定百藥所不效者穿山甲十五片石灰炒去灰全蝎去毒箇三七蜈蚣七條生用麝香一字别研草烏生去皮一兩地龍去土一兩沒藥别研乳香别研錢各二松脂半兩斑蝥七箇糯米炒去頭足白僵蠶薑汁炒半兩五靈脂三錢石去沙右為末酒糊圓菉豆大青黛為衣每服二十圓不拘時溫酒送下忌食熱物大九寶飲治挾氣中風已微微去其痰或非重熱氣實者亦可服天雄氣弱者以大附子代南星炮薄荷葉地龍捶去土木香全蝎防風沈香各等分麝香别入右銼散每服四錢水一盞半生薑五片煎熟入麝香啜服不拘時候烏附圓去風疏氣川烏二十枚或用草烏一斤苐功效稍劣油燒存性香附子半斤薑汁淹一宿右焙乾為末酒糊圓量數服之若只用草烏當防其麻木人也然肌體肥壯之人及有風疾人宜常服葳靈仙圓治腎臟風壅積滯腰膝沈重葳靈仙酒洗酒浸七日右為末煉蜜圓梧桐子大起初服用溫酒下八十圓平明微利惡物如青膿即是風毒積滯也如未動其夜更服百圓后喫少粥補之茯神圓主四肢攣縮不伸等證曾有人自幼年酒多長而風痰為酒使痰注骨節四肢不能運動服此有效茯神心木白茯苓去皮薑黃白术炒黃耆羌活五加皮川烏炮去皮臍薏苡仁木瓜去皮穰半夏麯神麯炒天雄炮皮去白芍藥乳香别研沒藥研防風獨活當歸延胡索桑寄生海桐皮去粗皮木香陳皮去白枳殼炮去穰南星炮地龍捶去土荆芥穗各五錢麝香一錢右用獖肝一具洗淨煮存性研爛同酒麵為糊圓如梧桐子大每服三十圓溫酒吞下不飲木瓜湯下皂角六一圓疏風活血起癱瘓除腳疾烏鬚髮注紅顔肌肉不緊實久生風證切宜此藥川烏草烏各一兩天台烏藥何首烏各二兩豬牙皂角五錢湯炮去皮弦烏梅肉厚者去核五十箇烏豆一升右銼如指靣大以冬月無灰酒好醋各二升浸一宿瓦銚內慢火煎乾取出曬焦乾何首烏一味别為末煮膏六味焙乾為末以前煮藥餘酒醋及何首烏膏和圓每服三十圓酒吞下金汞靈丹治卒暴中風奄忽手足拖曵口靣喎斜舌強痰盛搐搦戰掉或角弓反張目睛正視口禁閉絶每日三服中風數年不能步履服至十圓復舊新中風三服可無事常服半圓滋養五臟補益真元通流關節袪逐風邪強筋健骨金箔二錢半以火烘過用法醋淬五十次為度細剪如絲水銀一兩辰砂半兩好硫黃一兩自然銅四兩搗細末用銀鍋子一箇盛之不封於地爐內以炭一斤煅之火盡候冷取出研細水飛候乾即同四味同入乳鉢研細如麵不見水無沙子為度生犀角半兩鎊羚羊角三分鎊乾蝎炒尾去白僵蠶炒去絲南星炮皮去藿香葉各半兩官桂一兩烏蛇三兩法酒浸軟剝去皮骨白花蛇同上製白术炒白芷川芎破故紙炒蓽澄茄羌活去蘆當歸法酒洗各一兩防風去蘆牛膝酒浸一宿鹿茸火燎去毛炙各三錢附子炮去皮臍川烏炮去皮尖各一兩三錢沈香半兩鎊天麻一兩二錢木香三錢三分安息香半兩别研白附子炒右先將二十六味為末却連前五味拌和入安息香膏搜和再入臼中杵五百下每一兩作十圓每服一圓空心細嚼溫酒吞下香附湯治十手足指疼痛麻木附子木香右等分銼散生薑煎服木香隨氣虛實加減如治足弱去附子用烏頭甚妙正舌散治中風舌本強難轉語不正神妙蝎梢去毒一分茯苓一兩龍腦薄苛二兩右為末每服二錢溫酒下或擦牙頰亦可仙茅散治背膊手足頭目筋脈虛掣一切風證疼痛不可忍立有效仙茅無則好蒼术代之一兩陳皮枳殼炮厚朴製官桂秦芁各一錢當歸白茯苓白芍藥白芷川芎半夏餅各一錢半麻黃不去節二錢半沒藥甘草川烏炮半兩各白薑乳香川獨活各二錢全蝎七箇麝香半錢右除桂芷麝沒乳餘並炒轉色却入不炒藥同為末每服三大錢炒大黑豆同木瓜蔭酒旋溫調服不拘時候活經丹治丈夫元臟氣虛婦人脾血久冷諸般風邪濕毒之氣留滯經絡流注腳手筋脈攣拳或發赤腫行步艱辛腰腿沈重腳心吊痛及上衝腹脅膨脹胸膈痞悶不思飲食衝心悶亂及一切痛風走注渾身疼痛川烏炮去皮臍六兩草烏炮去皮臍六兩地龍去土天南星炮各六兩乳香沒藥研二兩二錢右為末入研藥和勻酒麵糊為圓梧桐子大每服止十圓空心日午冷酒送下荆芥茶亦可黑附丹治諸風疾夫風之為病半身不遂口眼喎斜手足拘攣或生嚲曵語言蹇澀心多驚悸其狀多端各隨所中由氣血俱虛腠理疏弱風邪外中真氣失守邪正相干而生焉自然銅一斤好者用生鐵銚子內以炭火一稱漸漸煆煉初起聞銅氣或似硫黃氣其藥乃成放冷取出如藥有五色者甚妙然後安向淨黃濕土上著紙先襯其藥用盆子合之不得通風一宿出火毒乳鉢內研細以水淨淘黑汁濃者收取次更洗淘又取濃者三五度淘澄定去清水用新瓦盆內將紙蓋著令自乾如黑粉一稱六兩候炮製右藥了當却入下味川烏四兩略炮麻黃三兩去節黑附子炮裂烏蛇酒浸一夕去皮骨炙厚朴去粗皮薑汁炒防風蒼术麩炒川芎陳皮白芷白术炒黃兩各二芍藥吳茱茰各兩半南星半兩右為末與自然銅粉相和勻搗細煉蜜圓梧桐子大臘月合甚妙男女中風癱瘓半身不遂起止不能者空心服臨卧豆淋酒下一粒六十日內必瘥男女患筋骨腰膝疼痛走注不定坐則刺腰卧則刺背行即入腳跟亦用豆淋酒下須臾以蔥粥一盞投之衣被蓋覆出汗然後更喫一粒必差或患五七日間未得汗亦如前法服才入口汗即出便安依法服二十日定愈治破傷風頑麻風暗風偏風並用豆淋酒下一粒至二粒即見功效丈夫元臟氣虛臍下撮痛不可忍者以檳榔一箇酒磨一半入生薑自然汁少許同煎五七沸研二粒服之須臾以小麥麩醋拌炒尉臍下便止治痃癖氣發時有搐得兩頭相就者用檳榔一箇中分破半生用半炙黃一處為末酒一盞蔥白一握同一處煎蔥白傾盞內俟酒得所時先呷兩口檳榔酒蔥白和藥一粒爛嚼以煎酒咽之但依法服立效須臾間下泄三二度隨即便愈凡些小風疾即一服瘥忌動風有毒物休食左經圓治左癱右瘓手足顫掉言語蹇澀渾身疼痛筋骨拘攣不得屈伸項背強直下注腳膝行履艱難骨節煩疼不能轉側跌撲閃挫外傷內損並皆治之草烏炮兩四川烏炮去皮臍二兩乳香研沒藥各一兩生黑豆一升以斑蝥二十一箇去頭足同煮俟豆漲為皮去斑蝥取豆焙乾入右為末醋糊圓梧桐子大每服三十圓溫酒下不拘時常服通經絡活血脈疏風順氣壯骨輕身川芎散治雞爪風手口搖動不能舉物五加皮海桐皮川烏牡丹皮川芎赤芍藥各五錢乾薑肉桂各一錢右為末每服三錢水一盞將十口銅錢一箇入清油內浸每煎藥入錢同煎不拘時服枳實酒治遍身白疹瘙癢不止切不可全用風藥治之蓋寒邪伏於肌膚相搏凝滯而成瘡或天色冷則重或因患風中若遇天晴日暖則輕宜用烏藥順氣圓為妙更用此酒服纍用神效順氣散方見前枳實不拘多少麵炒黃切片右銼散每服二大錢用酒浸少時去枳實但飲酒最後用枳實煎水洗患處佳祕方芫花散治臂腿間忽一兩點痛著骨不可忍芫花根研為末米醋調隨大小傅之天仙膏治卒中風口眼喎斜南星大者一箇白及一錢草烏大者一箇僵蠶七箇右為末用生鱔魚血調成膏傅喎處覺正便洗去洗方治風損風腫及瘡痔石楠葉馬鞭草貼壁草煎湯洗燒竹瀝法新竹截尺許長用兩磚對立相去八寸置竹在上每截破二片仰安磚上急著火磚外兩頭各置碗以盛瀝瀝盡以絹濾澄清夏秋須沈冷水中防瀝酸大熱有風人亦可單服冷暖隨人勿過度荆瀝亦然灸法治口喎斜即效耳垂下麥粒大艾炷三壯左灸右右灸左又法治痰涎壅塞聲如牽鋸服藥不下宜於關元丹田二穴多灸之良治卒中風口噤不開灸頰車二穴在耳下八分小近前灸五壯隨愈中風失瘖不能言語緩縱不隨先灸天倉二穴五十壯其穴在頸大筋前曲頰下扶突穴后動應手陷中息火仍移灸百會穴五十壯其穴在頂正中心灸畢還灸天倉五十壯始發先灸百會則風氣不得泄內攻五臟喜閉伏仍失音也所以先灸天倉次百會佳一灸五十壯悉泄火勢復灸之視病輕重重者一處三百壯大效凡中風服藥劇者但是風穴悉皆灸之三壯無不愈也勿疑惑不至心者勿浪盡灸癘風得效癘風方治癘風即大風惡疾癩是也雖名曰風未必皆因風大率多是嗜欲勞動氣血熱發汗泄不避邪風使淫氣與衛氣相干則肌肉不仁勞氣泣濁則胕熱不利故色敗皮膚瘍潰鼻梁闒壞或自作不仁極猥之業所致久則或遍身白皮脫落如蛇蛻狀右用桑枝灰一斗熱湯淋取汁洗頭面次用大豆及菉豆漿添熟水三日一浴一日一洗面却用側柏葉蒸曝乾白膠香各等分為末蜜圓溫水下三七粒日三服仙方治大風惡疾雙眼昏咫尺不辨人物髮眉自落鼻梁崩倒肌膚瘡如答蘚勢若不可救此方特效右用皂角刺三斤炭火蒸久曬乾為末濃煎大黃湯下一匕服旬日間眉髮再生肌膚悅潤眼目愈明解毒雄黃圓治多啖炙煿成此癘風茶清下三四服效方見大方科積熱類浴法麻黃根地骨皮草烏頭二兩右銼散研朴消二兩勻和每用藥一兩水一桶椒一合蔥三十莖艾葉一兩同煎十沸用米醋一中盞又打勻去滓坐溫室中自用手巾搭四肢候湯可浴則浴令汗透面上如珠流更坐室中或睡片時尤佳汗解方著衣避風而出五日再浴如此兩三浴便服換骨丹换骨丹九肋鱉甲海蜈蚣細銼兩各二右以鹽泥固濟候乾火煅存二分性為末巴豆半兩去皮膜順手研青州棗七枚去核入巴豆膏在棗中火燒令焦存巴豆五分性將棗巴豆研爛如泥入前二味末研勻以醋煮糊圓如菉豆大每服七圓虛中四五圓用溫虀湯下候利惡物如膿血爛魚腸即住三兩服未利更加三圓次服遇仙丹遇仙丹人參紫參各一兩苦參二兩白僵蠶去觜二兩右為末麵糊圓梧桐子大每服三十圓溫鹽湯吞下食前日二服次服疏風散疏風散山梔子仁兩半大黃白滑石熟地黃右為末入朴硝半兩令勻每服一錢食后淡茶清調下次以佛手膏佛手膏去黑紫瘡核斑蝥七箇去翅足巴豆七粒去皮杏仁二十箇去皮砒霜一錢另研紅娘子二七箇去翅足盆硝一兩黃蠟韶粉各半兩瀝青研兩一硫黃黃丹各三錢膩粉炒兩一菉豆一合槐角三條清油四兩亂髮一兩右用油煎令髮化次下紅娘子次下巴豆槐角等逐味下焦者漉出方下硫黃盆硝及丹粉等以竿子不住手攪令勻滴水成珠為度用時先將針刺瘡核用藥一粟米大放針處次日擠瘡有黑臭膿血出三兩日血漸少次服去毒丹去毒丹赤芍藥甘草白滑石各半兩朴硝大黃各一分巴豆去皮炒别研后入黑牽牛一兩半生半炒右為末麵糊圓菉豆大臨卧服十五圓金銀薄荷湯下加至三十圓次服甘草散甘草散甘草白滑石各半兩山豆根一兩大黃一分右為末每服一錢蜜湯調下日二服次服解毒圓解毒圓瓜蔞根三兩甘草半兩炒大黃一分生朴硝一分别研右為末麵糊圓如菉豆大每服二十圓至五十圓白湯下次服福神丹福神丹訶子四箇炒巴戟炒黑牽牛生各半兩甘遂三錢赤小豆四十九粒生右為末麵糊圓菉豆大每服十圓至十五圓薄苛湯下次用水膏藥水膏藥傅貼破處及面腳上瘡令生肉陳皮去灰土半斤炒紫色陳米半斤炒藿香馬蹄香各一兩麝香一錢别研右為末入麝香用冷水調掃傅瘡上有膿處如損破即煎槐枝湯洗再上藥此十方乃祕傳有驗大要病人猶宜如法將息理會敬而信之通天再造散治大風惡疾鬱金一兩半大黃一兩炮白牽牛六錢半生半炒皂角刺一兩炮經年者右為末每服五錢日未出面東以無灰酒下盡量為度晚利黑頭小蟲病稍輕者止利如魚腸臭穢物忌葷半年但食稠粥軟飯漸漸頭毛皮膚如常甚者不過三兩次須將息不可妄有勞動及終身不得食牛馬驢騾等肉犯者死不救三濟丸治如前當歸熟地黃川芎荆芥穗各二兩防風北細辛各一兩去葉桂心一分右銼散先以醋一升浸一宿漉出焙乾再以生地黃一斤搗汁浸一宿焙乾酒一升浸一宿焙乾旋入乳香半兩以餘酒醋地黃汁釋蒸餅為圓梧桐子大用好川烏頭一箇炮裂銼荆芥穗半兩浸酒三升旋溫下藥五十圓八葉湯淋洗大風瘡桑葉荷葉地黃葉皂角葉蒻葉蒼耳葉菖蒲葉何首烏葉右等分曬乾燒存性為末如面藥用洗手面身體大風惡疾瘡痍荼毒膿汁淋漓眉鬢墜落手足指脫頑痺痛癢顔色枯瘁鼻塌眼爛齒豁唇揭病證之患無越於斯負此病者百無一生猶且愛戀妻孥復著名利不仁之行死而無悔深可悲傷凡遇此疾切須戒鹽及一切口味公私世務悉宜屏置瘓風排風湯治五臟風瘓風亦治風毒腳氣腫痛每服三錢水一盞半生薑四片煎溫服方見前加減續命湯治中風諸風迷仆涎潮舌強語蹇或昏潰痿陀或厥冷拘攣不論表裏淺深服之效方見前蘇合香圓理氣氣和則風散方見大方科中氣散不换金正氣散服之則氣順血行瘓風自愈方見大方科傷寒類一粒金丹疏風健筋骨方見前大鐵強圓治諸風癱瘓川烏炮去皮一兩半川五靈脂四兩乳香沒藥各一兩生麝一錢右乳香以乾竹葉包裹用尉斗火尉過即研成末餘藥末和勻再研滴水圓彈子大每服一圓薄荷酒磨下大四斤圓治風寒濕毒與血氣相摶筋骨緩弱四肢痰疼癢痛天麻川牛膝去苗宣州木瓜肉蓯蓉洗切片四味各一斤用好酒五升浸三日熟附子虎骨酒炙各二兩大當歸三分乳香沒藥五靈脂各半兩生麝香一錢右為末浸藥酒煮麵糊圓梧桐子大每服三四十圓食前溫酒或豆淋酒下未效木瓜湯下亦治腳氣歷節風羌活湯治白虎歷節風短氣自汗頭眩欲吐手指攣曲身體魁瘰其腫如脫其痛如掣因體虛飲酒當風汗出入水受風寒濕毒之氣凝滯筋脈藴於骨節或在四肢肉色不變晝靜夜劇痛徹骨如虎囓不可忍久不治令人骨節蹉跌一名癘風須大作湯圓救治不可以淺近之劑則無驗羌活去蘆二兩附子炮去皮臍秦芁去蘆桂心不見火木香不見火川芎當歸去蘆川牛膝去蘆酒浸桃仁去皮尖麵炒骨碎補防風去蘆各一兩甘草炙兩半右銼散每服四錢水一盞半生薑五片煎不拘時溫服軟痛圓治走注歷節諸風軟痛卒中倒地跌撲傷損草烏頭烏藥熟地黃南星半夏麯白僵蠶各半兩右為末酒糊圓梧桐子大每服五十圓空心日午夜間溫酒下如跌撲損傷痛甚薑汁和酒研十粒塗傷處卒中倒薑汁茶清研五七粒灌下立醒附子八物湯治歷節風四肢疼痛如槌鍛不可忍附子炮去皮臍乾薑芍藥茯苓甘草炙桂心各三兩白术四兩人參三兩右銼散每服四大錢水二盞煎食前服一方去桂心用乾地黃二兩烏頭湯治病歷節痛不可屈伸烏頭五枚銼以蜜二升並取一升去烏頭甘草麻黃去節芍藥黃耆右銼散每服四錢水盞半煎去滓投蜜再煎空心服或加老薑桂心大棗不用麻黃黃耆治寒疝腹中絞痛賊風入腹攻五臟拘急不得轉側呌呼發作有時使人手足厥冷虎骨散治白虎風肢節疼痛發則不可忍或癢痛不得屈伸虎骨炙酥二兩花蛇酒浸取肉天麻防風去蘆川牛膝酒浸去蘆白僵蠶炒除去觜川當歸去蘆酒浸乳香别研桂心不見火各一兩甘草炙全蝎去毒兩各半麝香一錢别研右為末每服一錢溫酒調不拘時服豆淋酒亦可麝香圓治白虎歷節諸風疼痛遊走無定狀如蟲噬晝靜夜劇一切手足不測疼痛及腳痛川烏大八角者三箇全蝎二十一箇黑豆二十一箇地龍半頭並生用右為末入麝香半分以糯糊圓菉豆大每服七圓甚者十圓世醫得效方卷十三
