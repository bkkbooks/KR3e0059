body:
  text: 世醫得效方卷十七元危亦林撰口齒兼咽喉科總説口為身之門舌為心之官主嘗五味以布五臟焉心之别脈係於舌根脾之絡脈係於舌傍肝脈絡於舌本三經為四氣所中則舌卷不能言七情所鬱則舌腫不能語至如心熱則舌破生瘡肝壅則出血如湧脾閉則白胎如雪此舌之為病也口則又稍不然盖熱則口苦寒則口鹹虛則口淡脾冷則口甜宿食則酸煩燥則澁乃口之津液通乎五臟臟氣偏勝則味應乎口或勞鬱則口臭凝滯則生瘡生瘡者夜不可失睡晝不可就寢違此必甚唇乃全屬於脾唇有病則多宜隨證以治脾也齒乃骨之餘腎主營養呼吸之門戸也故腎衰則齒豁精盛則齒堅又手陽明大腸脈入於牙齒灌於大腸壅則齒亦浮腫虛則宣露挾風則上攻面目疳䘌則齲直禹切牙蛀虫也為脱為痔皆當隨證治之喉者候也咽者嚥也咽接三筦以通胃故以之咽物候通五臟以系肺故以之候氣氣喉糓喉皎然明白人諸臟熱則腫寒則縮皆使喉閉風燥亦然五臟久咳則聲嘶聲嘶者喉破也非咽門病若咽腫則不能吞乾則不能嚥多因飲啖辛熱或復嘔吐咯傷咽系乾枯之所致也自與喉病不同又有懸癰暴腫閉塞喉嚨亦如喉閉狀但懸癰在上㬽及關下俗謂之鸎翁又謂之蛾聚俗語聲訛須以後一十八種證辨之口病洗心散合四順清凉飲治心脾有熱口瘡甘露飲治血熱口瘡已上方並見大方科積熱類雞蘇圓治胸中鬱熱口臭煩渴方見大方科失血類黄連阿膠圓治口破生瘡米飲下方見大方科咳嗽類秘𫝊降氣湯治虛熱上壅口瘡生薑蘇葉煎食前吞黒錫丹每服二十粒方見大方科諸氣及痼冷類龍石散治上膈壅毒口舌生瘡咽嗌腫痛少許摻患處嚥津寒水石煅三兩辰砂二錢半别研生腦子半字右為末日夜數次用小兒瘡疹攻口先以五福化毒丹掃却用此摻立效方見小方科疹瘡類緑雲膏治口瘡臭氣瘀爛久而不差黄蘗半兩螺青二分右為末臨卧置一字在舌下不妨嚥津遲明差一法以銅緑易螺青升麻散治上膈壅毒口舌生瘡咽喉腫痛升麻赤芍藥人參洗桔梗去蘆乾葛各一兩甘草生用半兩右剉散每服四錢水一盞半生薑五片煎温服不拘時候一方加薄荷黄芩碧雪治一切壅熱咽喉閉腫不能嚥物口舌生瘡舌根强言語不正腮項腫痛蒲黄青黛鵬沙熖硝甘草各等分右為末每用手指捻摻於喉中津嚥或呷少冷水送下頻頻用之換金散治毒熱口瘡或下虛邪熱右用乾薑黄連為末摻瘡上初若不堪應手而愈赴筵散治口瘡黄蘗蜜塗炙紫色滑石研各半兩五倍子小嫩者一兩右為末和勻每服半錢許乾摻瘡上良久可飯食竒效傅方治滿口瘡爛方見小方科口瘡類杏粉膏治口瘡以凉藥傅之不愈者杏仁十粒去皮尖輕粉一字右研杏仁調勻臨卧傅瘡上少頃吐之勿嚥青黛散治口瘡臭氣瘀爛久不差者右用黄柏半兩青黛一錢為末臨卧安舌下芎芷膏治口氣熱臭香白芷川芎各等分右為末煉蜜圓如鷄頭大食後臨卧噙化一圓益智散治心氣不足口臭右用益智去殻加甘草為末時復乾嚥下或沸湯㸃立效鵬砂圓治口臭口乾口舌瘡寒水石燒紅十兩鵬砂二兩腦子麝香各二錢馬牙硝四分甘草浸汁熬膏二兩右為末甘草膏捜為圓麻子大用噙嚥又方香附子炒去毛為末早晚以少許揩牙上逺智散治口瘡立效五倍子逺志去心各半兩右為末摻少許於舌上吐出而瘡已效又方朴硝寒水石各一錢為末朱砂少許和勻傅瘡上又方生薑自然汁漱口數次涎出而效獨勝散治口瘡縮砂殻火煆存性為末摻口内瘡上即安立效散治口吻邊生瘡浸淫不愈㯽榔火煆為末入輕粉用飯甑上滴淚調傅瘡上立效茱萸散治口瘡及咽痛地龍去土炙吴茱茰去浮者各等分右為末米醋入生麯調塗足心神效貼足方右以茱萸為末水調傅足心效最宜治小兒口瘡不肯服藥者一貼而愈濯足法治下虛上壅口舌生瘡右以白礬為末用湯化以濯足唇病菊花丸治脾肺氣虛憂思過度榮衛不和唇裂瀋𦂳或口吻生瘡容色枯顇男子失精女子血衰悉宜服之甘菊花肉蓯蓉酒浸洗切枸把子巴㦸去心各等分右為末煉蜜圓梧桐子大每服三五十圓菜湯下㵼黄飲子治風熱藴於脾經唇燥瀋裂無色白芷升麻枳殻黄芩防風去蘆半夏湯泡七次石斛去根各半兩甘草二分半右剉散每服四錢水一盞半生薑五片煎不以時服薏苡仁湯治風腫在脾唇口瞤動或生結核或為浮腫薏苡仁防己赤小豆炒甘草炙各三分右剉散煎同上橄欖散治唇𦂳燥裂生瘡右以橄欖不拘多少燒灰為末以猪脂和塗患處白灰散治口𦂳唇小不能開合飲食不得不急治則死此亦竒病以此方治之得效名曰𦂳唇又名瀋唇用白布作燈炷如指大安斧刃上燃炷令斧上汗出拭取傅唇上日二三度故青布亦佳或青布灰以酒服亦可和猪脂塗傅又以蛇皮揩拭為灰傅之又以蠐螬燒灰末猪脂調傅又燒亂髪蜂房六畜毛燒灰用脂調傅莧實條亦名馬齒莧煮汁洗𦂳唇灸法治𦂳唇不能開合灸虎口男左女右又灸承漿三壯穴在頥前唇下足陽明之㑹舌病升麻柴胡湯治心脾虛熱上攻舌生瘡舌本强頰兩邊腫痛柴胡升麻芍藥梔子仁木通各一兩黄芩大青杏仁去皮尖各二分石膏右剉散每服四錢薑五片煎食後服寒重者八正散方見大方科中寒類金沸草散治風寒傷於心脾令人增寒發熱齒浮舌腫方見大方科傷寒陽正類正舌散治中風舌本强難轉語音不正神效蝎梢去毒一分茯神木剉殼炒一兩龍腦薄荷焙乾二兩右為末每服一二錢温酒調食後服五福化毒丹治唇舌腫破生瘡煩渴方見小方科疹瘡類礬石散治風濕寒舌强不能語枯礬桂心各二分右為末每用一錢安舌下或用正舌散治之治木舌腫滿口中氣不得吐右用臘茶陳白梅巴豆七粒去殻同搗如膏薄荷水調稀羽刷口中得下咽片時即㵼一二行以粥補之舌已平矣又方以薄荷水洗之又方右以釡底黒煤研勻内外塗舌良久平又方真蒲黄海螵蛸為末内外皆塗之又方治大人小兒重舌腫起舌下右用朴消研水敷咽喉外其内用成塊者含涎出乃平一方地蜱䖝和薄荷研汁帛包蘸舌下腫䖏重舌極證用指去𤓰先於舌下筋上擦至根漸深深擦入如此三次又用指蘸水取項後燕窠小坑中筋自上赶下至小窟深深捺入亦三次小兒若飲乳勝前則病去矣黑散子治血熱舌忽然腫破右以釡底煤醋調傅舌上下脱去更傅能先决出血竟傅之尤佳一法用鹽等分調薄荷蜜治舌上生白胎乾澁語話不真白蜜薄荷自然汁各等分右以生薑片先蘸水揩洗竟用朱砂雄黄鵬砂腦麝為末傅之良未效更加𤣥明粉文蛤散治熱壅舌上出血如泉五倍子洗白膠香牡礪粉各等分右為末毎以少許摻患處或燒鉄令熟烙孔上必勝散治舌衂真蒲黄略炒螺兒青各等分右為末毎用少許擦患處少待濕鹽水漱之醋飲喉舌生瘡方治連月飲酒咽喉爛舌生瘡右以水中螺蚛肉用葱豉薑椒煮汁飲三盞差治重舌新蒲黄為細末數傅之吐去又傅凡五七次愈亦治舌腫滿口不能聲傅之立安又方五靈脂米醋一椀同煎逐旋潄口立安舌無故出血名舌衂炒槐花為末摻之而愈治舌腫脹好鵬砂為末用薄批生薑蘸藥揩腫處漸退治舌强腫起如猪胞以針刺舌下兩邊大脈血出即消切勿刺著中央脈令人血不止則以火燒銅筯烙之不止則殺人或以釡下墨醋調傅舌上下脱去再傅須臾而消此患人多不識失治則死烙腫法凡舌腫舌下必有噤䖝狀如螻蛄卧蚕有頭有尾頭小白可燒鉄烙烙頭上即消治失音槐花新瓦上炒香熟三更後床上仰卧隨意而食亦治咯血齒病安腎圓八味圓治虛壅牙齒疼痛浮腫方並見大方科虛損類嘉禾散治齒疼壊齒者疣去而齒之左右上下非痛非腫不能嚼食食後生薑煎一服次以地骨皮煎湯潄之空心以羊腰一對切片不令斷以葱縧椒子青鹽蒺䔧末固之再用嘉禾散二錢和勻擦腰子内荷葉包煨熟食之而愈方見大方科脾胃類玉池散治風蚛牙疼腫癢動摇牙齦潰爛渲露出血口氣等疾悉能治之地骨皮香白芷川升麻防風細辛川芎槐花當歸藁本甘草各等分右末每用一字許揩牙或痛甚即取二錢用水一盞半黒豆半合薑三片煎温漱候冷吐之數服亦無妨或用金沸草煎湯潄亦佳蟾酥圓治牙疼不可忍者蟾酥一字生附子角如豆大為末巴豆一粒去殼去沾麝香少許右為末研勻蒸餅為圓如黍豆大以新綿裹一圓噙之有涎即吐去蝎附散治同上蝎梢附子臍蜈蚣頭去毒川烏頭尖各二錢右為末先用竹杖刺痛牙齦次以紙撚上藥一粟米許在痛處甚者不過兩三次效細辛散治風蚛牙疼牙齦宣爛牙齒動摇腮頰腫痛草烏白芷各二兩細辛荆芥各一兩紅椒牙皂鶴虱蓽撥縮砂仁各半兩右為末每用少許擦痛處有涎吐出不得嚥少時以溫水漱口頻頻擦用立效二陳湯加細辛枳殻用生薑棗子烏梅煎治毒痰齒痛仍以片子薑黄蓽撥等分井水煎候温以舌浸其中涎自流出方見大方科痰症類煎脂醋治惡血齒痛右用川五靈脂米醋煎汁含嚥甘露飲治毒血齒痛加入升麻煎方見大方科頭熱類荆槐散治牙宣出血或痛右用槐花荆芥穗等分為末擦牙仍前㸃服鬱金散治齒出血鬱金白芷細辛各等分右為末擦牙仍以竹葉竹皮濃煎入塩少許含嚥或炒鹽傅治牙宣鮮紅者甘露飲瘀紅者雙和湯仍以鹽泥炒為末揩牙上方見大方科虛損類搐鼻方治牙疼雄黄沒藥各一錢乳香半錢右為末若左邊疼用少藥搐入左鼻又吹入左耳如右疼搐右鼻吹入右耳塞耳方蒲黄末乳香末白芷末各半錢雄黄末一錢右和勻以帋醮藥一字𦂳塞耳内隨左右仍用荆芥咬在痛牙上揩牙方鶴虱細辛白芷甘松各等分右為末每用少許揩痛牙上如有蛀孔用藥㸃入孔中效治牙齒痛右以蕪荑仁安蛀齒上有縫就窒之立效治風蚛牙疼馬夜眼上以刀兒薄起一片子扱在所患牙縫中或咬在痛處瀝出風涎即止不可嚥乳香膏治蚛牙痛光明白礬枯過滴乳香各等分右為末溶蠟量多少和成膏旋圓看蚛牙孔子大小填之其痛立止神效又方入胭脂少許和令深桃紅色只作散遇牙疼痛用一字以揩擦良久温鹽湯漱口治牙痛白僵蚕直者不以多少用生薑片切同炒候赤黄色為度去薑不用為末每用取不蚛皂角剝去黒皮以手指蘸湯於皂角黄上擦取汁調僵蚕末揩痛處即止逡巡散治風牙疼腫不拘新久一服立效高良薑一塊約二寸全蝎一枚瓦上焙乾右為末以手指㸃藥搽齒上仍須擦令熱徹須臾吐出少涎以鹽湯潄口大妙亦治腮頰腫痛牢牙散治一切齒痛不問久新風疼痛立效全蝎七枚去毒細辛洗浄三錢草烏二箇去皮乳香二錢别研右為末每用少許擦患處須臾以溫鹽水灌漱莽草散治風壅熱氣上攻齒齦浮腫或連頰車疼痛或宣露血出莽草川升麻栁枝槐角子鶴虱地骨皮藁本去蘆槐白皮右剉散每服一兩水一椀入鹽少許煎熱含冷吐之防風散治牙疼防風鶴虱各等分右剉散濃煎噙潄立效老鶴虱草研爛塞痛處亦可消風散治齒熱痛㫁腫有汁先傅以消風散又以朴消傅其上又法用川升麻煎湯潄嚥解毒方見風利熱證類香椒散治冷證齒痛香附子紅川椒故紙炒各二錢蓽撥一錢右為末和炒鹽二錢擦傅川芎散治面腫牙疼不可忍川芎白芷細辛各等分右為末擦兩三次鹽湯潄立止秘方揩牙散治牙疼遇喫冷熱獨甚良薑細辛大椒草烏尖右為末以指蘸少許揩牙上噙少時開口流出涎妙牙痛有四證熱者怕冷水用牙硝薑黄雄黄荆芥冷者怕熱湯用乾薑蓽撥細辛不怕冷熱乃風牙用猪牙皂角殭蚕蜂房草烏有竅者蛀牙用雄黄石灰沙糖用藥了並用温水灌潄之為佳取蟲方治牙有蠱而痛韭菜頭連根洗淨爛擂同人家槲枝上泥和勻搽痛處腮上用紙貼之一時頃取下細細蟲在泥上可以絶根揩漱方治無故牙動牙宣出血香附子去皮毛剉碎用薑汁浸一宿曝乾為末漱口揩齒齒堅無動無血矣已驗方治牙疼露蜂房𤓰蔞皮右等分燒灰去火毒擦牙或以烏桕根韭菜根荆柴根葱根四味煎湯温漱甘松香散治一切牙疼甘松香莽草川烏去皮各三錢北細辛去葉二分硫黄半錢香附子炒去毛二錢右為末以手指蘸少許揩牙上立效後用鹽湯灌漱妙秘方治經嵗牙疼楓香脂為末入些焚香爐内灰再篩過常日洗面時用揩牙上永無斯疾更臨睡以温水淨潄為佳小薊散治牙齒宣露出血百草霜小薊香附子炒去毛真蒲黄各五錢右為末揩牙齒上立愈芫花散治牙疼陳芫花一握甘草節五錢細剉各煎先用芫花湯噙唾去次用甘草水噙少時效治蛀牙痛莽草為末擦三五次蟲即無治風蛀牙痛霜殺老絲𤓰燒存性為末擦痛處立止治血風蛀牙雄黄乳香各一錢研如粉麻黄半錢白芷一字右為末研勻痛時先以荆芥穂咬在痛處口凉去之次用皮紙撚津濕之㸃藥少許隨痛邊塞耳内又方露蜂房炒川椒一錢為末每二錢煎入少鹽乗熱潄之又方風蛀痛牙用針刺杏仁清油燈上煙熏乗熱認定病牙以杏仁搭之又復熏搭七次絶不痛但其病牙逐時落去斷根治蟲蛀牙痛細川椒三錢明乳香一錢右同研細溶蠟圓如麻子大每用一圓塞孔中敷藥退腫大花粉白芷赤小豆鬱金薄荷荆芥各等分右件日乾為末蜜水調塗痛處常用齒藥牢牙去風冷蚛蝺宣露不問老少用之甚效槐枝栁枝各長四寸一握切碎皂角不蚛者七莖鹽四兩降真香白膠香各兩半右同入甆瓶内黄泥固濟糠火燒一夜候冷取出研細用如常法牙齒日長方牙齒逐日長漸漸脹開口難為飲食盖髓液所致只服白术愈及煮水灌潄齒間肉壅方多因食鹹熱物而得生地黄汁一椀猪牙皂角數鋌火上灸熱蘸冷汁盡為度或為末傅壅内上隨即消縮或朴硝末傅上即消灸法以線量手中指至掌後横紋折為四分去三分將一分於横紋后臂中灸三壯隨左右一方以兩手交义以中指頭盡處是穴灸七壯永不疼手背上又灸眉顒七壯隨左右又法灸耳垂下牙盡骨上三壯未效加壯數又法治口齒蝕生瘡者承漿一穴在頤前唇下宛宛中可灸又方治唇吻强齒齗痛尤端一穴在唇上端鍼入二分可灸三壯導引方治牙齒痛東向坐不息四通上下琢齒三十六下頰車開不可合飲令大醉睡中搐鼻嚏則自正又南星末生薑汁調傅帛縛合一宿愈去風也又法一人以手指牽其頥以漸推之則復入矣推當疾出其指恐嚙傷灸法治失音頰車蹉灸􅗃第五椎一日二七壯又灸足内踝上三寸宛宛中或二寸五分名三陰交穴喉病秘𫝊咽喉一科一十八種喉風證一單蛾風其形圓如小筯頭大生於咽喉關上或左或右舌闗下難治二雙蛾風有兩枚在喉闗兩邊亦圓如小筯頭大闗下難治三蟬舌風自舌下再生重舌者是四牙耆風牙齦上聚成癤毒者五木舌風其舌相似煮熟猪舌不能轉動者六舌黄風自舌上腫痛黄色者是七咬牙噤口風近牙窮頭作臖口噤不開者八魚口風如魚吸水者不治九聚毒塞喉風喉闗聚毒涎唾稠實發寒熱仍分上下三十闗破毒下闗難治十𤣥耆蠱毒風上脽食掩水外溢形如雞卵者十一搶食風一名飛絲毒口中或作穢惡發泡者十二獵頰風腮臉結腫者是從牙窮頭碎此毒若成須要半月調理十三纒喉風風自耳邊過順下赤兔者是也亦有寒熱如甚者傷人命十四松子風口内滿喉赤如猪肝逆張吞則闗閉塞飲食不能者是用藥後口内散㸃松子様腫則喉闗響如雷則不治十五崩砂甘口風自舌上牙齦上下腮赤口内作臖如湯熱牙齦漸爛甚者亦能脫齒十六連咮風自舌上作毒或初成一箇碎而又作一箇以至三五七九箇者是十七蜂子毒或在腮臉洋爛或在喉關舌下作臖如黄荆蜂者是十八走疰瘰癧風頸項結核五七箇皮膚赤腫作寒熱者針灸法第一穴風府穴腦後入髪際一寸治咽喉諸證及毒氣歸心等項惡證並皆治之無有不效針入四分穴髙主暈恐傷人不可不知須令人扶䕶乃針第二穴少商穴在手大指表近虎口一邊指甲與根齊離爪如韭葉許針入二分病甚則入五分咽喉諸證皆治第三穴合谷穴穴法口授治牙闗不開則陽靈穴應針各刺一刺出血入二分關竅即開又有一證潮熱者有作寒者於合谷穴用針左轉發寒右轉發熱第四穴是上星穴在頂前入髪際一寸治頰腫及纒喉風等證又氣急者實熱針足三里虛熱灸足三里以手約膝取中指稍盡處是穴根脚咽喉常發者耳垂珠下半寸近腮骨灸七壯二七尤妙及灸足三里穴在膝下三寸䯒骨外赤眼挑耳後紅筋針攢竹穴即安穴在兩眉頭䧟中實熱一用敗毒散加黄芩半夏連翹倍用桔梗用生薑薄荷煎痰盛者加石膏同煎即效凡服此藥早晨服則午時攻作午後則子時攻作天明退用針則無此攻作若服此藥后自利即换作虛熱醫后藥不可用服敗毒散后失聲即服加減秘𫝊降氣湯方見大方傷寒陽證及諸氣類二用生料消風散加𤣥參全蝎薄荷白水煎服三用前二藥不退用生料洗心散更加一二味去風毒藥為妙方見風科熱證及大方科積熱類四用前三藥不退用防風通聖散立效方見風科熱證類虛熱一用雙解散乃升麻葛根湯消風散加𤣥參黄芩薄荷煎二用秘𫝊降氣湯加生薑黄芩以上方見大方科傷寒陽證及風科熱證諸氣類三如痰盛用桑白皮湯磨沉香吞養正丹仍用枳梗半夏湯冷术附湯等藥調理方見大方科痼冷及痎瘧中濕類又一證上秘下㵼用秘𫝊降氣湯吞碧雪衣附子理中圓如無用桑白皮湯亦可方見諸氣類及見前併痼冷類虛實盥潄藥用消毒飲水煎時時盥潄方見小方科瘡毒類咽喉生瘡冷閉聲不出者秘𫝊降氣湯去陳皮加黄芩煎仍於喉下咽管口灸三壯即愈方見大方科諸氣類勝金散治咽喉腫痛氣急諸項等證於内麝香旋入有孕者不可用麝不問冷熱虛實並皆通用若痰盛者如煎藥内所用不應於中畧加膽礬少許立效或吐無妨鬱金三兩大朱砂南雄黄其色勝於朱砂者妙各五錢麝香乾胭脂菉豆粉各二錢半白礬半生半枯光粉各五錢右為末研薄荷汁同研少許調服防風散虛者少用實者多用防風去蘆一兩羌活黄藥子白藥子蜜灸殭蚕炒鵬砂大黄帋裹煨令香熟荆芥細辛川芎紅内消鬱金山豆根甘草以上各五錢牙硝三錢薄荷葉右為末研薄荷汁同蜜少許調藥𤣥明粉用朴硝十斤防風一斤煎水泡溶却用布荷花葉紙澄濾七遍却於霜下露天露一夜却取内牙硝再用防風水淋漕淨用瓦鉢熬煎成鹽却再入鼎内用鹽泥固濟炭火燒一時通紅為度出火去毒研為末每一斤用甘草三兩每服一茶匙温熟水調如實熱煩渴口乾燥作煩者可略加鵬砂腦子入口噙化乾喉風立效追風散黄丹朴硝猪牙皂角燒灰縮砂殻灰各五錢右為末每服少許以鵞毛蘸入口中舌上下及腫處用水盥漱如喉間毒已破瘡口痛者用猪腦髓蒸熟淡薑醋喫立效如病將可有身體痛於所服藥内加川秦艽同煎效死候毒氣歸心胷前腫滿氣煩促下部洞泄不止重舌木舌川烏尖巴豆為末米醋調刷患處即效木舌須先服勝金散開關竅又方見舌病類帝鍾風即喉間帝鍾長腫有長數寸者虛實用前藥外以食鹽煆過鴉毛蘸下即消不須掛破破則傷人煮針法烏頭一兩去尖巴豆一兩硫黄半兩麻黄五錢木鼈子十箇烏梅右用藥同入甆石器内水煮一日洗擇之再用止痛藥沒藥乳香當歸花蕊石各半兩又如前水煮一日取出用皂角水洗再於犬肉内煮一日仍用瓦屑打磨淨端直松子油塗常近人氣為妙合瘡口白礬黄丹麝香為末以銅筯㸃瘡口上又方滑石黄丹為末點瘡口效仍用黄丹一兩二錢甘草二錢為散煎服尤妙破毒妙方白礬巴豆去殻紅内消草烏尖猪牙皂角薄荷各二錢右為末好酸醋調鵝毛刷入口内勿吞仍以鹽湯盥漱雄黄散治纒喉風喉閉先兩日胷膈氣𦂳取氣短促忽然咽喉腫痛手足厥氣閉不通頃刻不治巴豆七粒三生四熟生者去殻生研熟者去殻燈上燒存性乾桑黄茹雄黄一塊皂角子大透明者細研鬱金一枚蟬肚者研為末右再研勻每服半字茶清少許下如口噤咽塞用小竹管納藥吹入喉中須臾吐利即效又方川升麻四兩剉碎水四椀煎至一椀灌下又方皂角三根搥碎挼水一盞灌下或吐或不吐即安取喉中涎草烏尖殭蠶紫貝根啾唧紅椒白礬山豆根皂角各等分右為末用霜梅拌藥為圓如指頭大含化一圓取下涎然後用鹽湯盥漱吐出不可吞開關潤喉蓬萊雪梅花腦子生麝香各一字鵬砂三錢朴硝五錢以上另研薄荷葉百藥煎全蝎去毒防風去叉粉草各五錢以上並研明乳香没藥各三錢蒻葉或蘆葉或火熨另研右為末每服少許以小匙挑乾糝咽間及瘡上如在關下糝舌上並旋旋嚥下仍用薄荷桔梗甘草煎水噙漱或用生薄荷研自然汁調成膏入口噙化亦妙開喉關薄荷山豆根各五錢麝香腦子各半錢朱砂三錢甘草青鹽川烏各五錢右為末每用半錢臘月内菘菜汁夏月黄麥挼水或葛水調如涕唾稠粘用芭蕉水調下或蜜圓指頭大含化去涎方併碎法草烏尖鴨觜青膽礬為末先用釅醋煮皂角調鵝翎刷傅赤腫處開口流去涎即將綿毬一指頭大以布線繫定蘸前藥末吞嚥至腫毒處即抽出凡如此一二次其毒即破開口流出去盡涎血却以前合瘡口藥㸃上停久温鹽水盥漱后進食亦可又開喉闗南星半夏川烏草烏甘草各五錢右為末用米醋煎成膏傅毒上宣利方巴豆三笨粒去殻雄黃鬱金猪牙皂角大黄各五錢右為末飯圓如菉豆大每服七丸五更三㸃以冷茶清吞下如未利再下四五圓通後補助紫蘇藿香甘草右剉散每服四錢水煎空心服乾喉風朴硝川烏當歸牛膝各五錢麝香腦子各半錢鵬砂三錢荆芥薄荷甘草葛粉各五錢全蝎七箇去毒右為末用清米泔調春用菘菜汁調夏黄麥汁調如不能吞用豆腐切如棊子塊蘸藥入口内含化或新艾汁調下立效搶食風桔梗川烏草烏防風甘草大青根各五錢全蝎七个去毒紫河車五錢右為末每服用酒一盞連根葱一莖紅椒七粒燈心七莖同煎三四沸食後熱服如不安再用酒一盞入茱茰五粒同煎少時熱服之未效用蕉湯調下如落心肺間刺痛用宣藥利下如久不治則變為飛絲勞毒能傷人命潤闗住痛生薄荷研蜜調成膏送入喉咽下立效如涎多未退再用如更不開可通頂又用葱頭兩个搥碎安牙窮頭處立開妙治誤吞銅鉄金石竹木刺雞鵝魚諸骨哽川山豆根山蜈蚣山茨菇葳靈仙鉄脚者滑石馬牙硝金星鳯尾草各一兩急性子二兩苧麻根五錢菉豆粉五錢甘草節三錢佃侵三宿磚五兩厠中製一年右為末白芨五兩與糯米糊一處和劑成鋌子如梧桐子大每用一鋌冷水磨化即下骨哽若金石銅鉄則以生薑汁磨化下世醫得效方卷十七
