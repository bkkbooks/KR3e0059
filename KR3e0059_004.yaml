  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3e0059_WYG_004-1a, image: WYG0746/WYG0746-0142a.png}
body:
  text: 世醫得效方卷四元危亦林撰大方脉雜醫科諸積肉積三稜煎圓治脾虚為肉食所傷停久不散作為腹滿膨痛或洩瀉毎服三十五圓淡薑湯食後服方見諸氣類阿魏圓治脾胃怯弱食肉食麫或食生菓停滯中焦不能尅化致脹滿腹疼嘔惡不食或利或秘阿魏酒浸化官桂不見火蓬术炮麥蘗炒神麯炒青皮去白蘿蔔子炒白术各半兩百草霜三錢巴豆去殻油三十個乾薑炮兩半右為末和勻用薄糊圓如菉豆大毎服二十圓不拘時薑湯送下麫傷用麫湯送下生菓傷用麝香湯下血積抵當湯治瘀血凝滯腹内刺痛或膀胱痛身面微黃水硜剉炒䖟虫去翅足炒三十箇桃仁三十七箇炒去皮臍大黃蒸錢三字三右剉散毎服四錢水一盞半煎七分去滓温服血未利更服氣積木香流氣飲熱者分心氣飲方並見諸氣類水積重者拾棗湯治泛飲水漿多感冷濕胸腹脹滿瀝洛有聲喘急氣促面色痿黃芫花炒赤甘遂大㦸黒牽牛炒取為末右各等分為末毎服一錢先将紅棗十枚煎湯一盞調溫再單飲棗湯送下平旦服病不除明日更服加半錢利後麋粥自養但服加味控涎圓尤效方見喘急類輕者青木香圓方見諸疝通治類涎積炒粉圓治積聚涎塊結於心腹之間致令心腹刺痛日久不愈或乾嘔減食蚌粉一兩巴豆七粒去殻及膜右二味同炒令赤色去巴豆不用只以醋圓其粉如梧桐子大丈夫腹臍痛炒茴香酒吞下二十圓婦人血氣炒薑酒下敗血衝心童子小便和當歸酒服常服薑酒下控涎圓空心茶清下三七粒方見臂痛類魚蟹積香蘓散多加生薑陳皮煎菓菜積平胃散加丁香麝香為末熱鹽湯調服麝香湯送下阿魏圓三十粒立效方見脾胃類阿魏圓見前酒積冷者平胃散加丁香縮砂麥芽神麯或香蘓散亦可加入並用薑棗鹽煎空腹服丁香縮砂香附子甘草各少許為散細嚼名醉鄉寳屑效熱者麯蘗圓治酒癖不消心腹脹滿噫醋吞酸啘逆不食脇肋疼痛神麯剉炒麥蘗炒一兩各黃連去鬚半兩巴豆三粒去殻同炒令轉色去巴豆不用右為末沸湯捜圓如梧子大毎服五十圓食後薑湯下茶積磨積圓治茶積飲食減少面黃腹痛陳倉米半升用巴豆七粒去殻同米炒令赤色去巴豆不用青皮去穰炒陳橘紅各二兩右為末好醋捜和為圓如豌豆大毎服二十圓食後用淡薑湯下粉片索粉積紫蘇濃煎汁加杏泥服即愈麫積阿魏圓濃煎蘿蔔子湯下方見前糍糕傷積加味青木香圓治糍糕傷脾噫酸不食心腹作痛百藥不效宜用青木香圓三百粒白丁香十粒小酒麯二錢同為末入巴豆三粒更研和令勻蒸餅為圓如梧子大毎服二十圓漸加至三十圓生薑橘皮湯下宿滯既去其疾自安又用小酒麯木香二􅟢為末鹽湯調服口有酒香是效虚人沈積盧氏感應圓治虚弱人久積不可直取宜此藥多用蠟匱庶使久留腸胃又不傷氣能消磨至盡又右腸氣偏虚飲食遲化止宜助脾養胃不須用尅化藥自然平復又名如神木香圓黃蠟真者十兩巴豆百粒去皮尖研為粉用紙數重裹搥透再易紙至油盡成白霜為妙杏仁七十粒去皮尖研細依巴豆法去油丁香懷乾一兩木香濕紙裹煨一兩乾薑炮肉豆蔲麫裹煨㯽榔蓽澄茄各一兩乳香研錢三百草霜青皮洗去穰炒片子薑黃各一兩右除巴豆粉百草霜杏仁乳香外並為末却同前四味拌和研勻先将上項黃蠟十兩於銀石器内溶化作汁用重綿濾去渣以無灰酒一升於銀石器内煑蠟鎔滚取起候冷其蠟自浮於酒上去酒不用春夏修合用清油一兩秋冬用一兩半大銀器内熬令香熟次下酒煑糊同蠟化作汁乘熱拌和前項藥末十分均勻了候稍凝分作劑子用罐子盛之半月後方可服旋圓如蘿蔔子大任意服之二三十圓加至五十圓無礙此藥以蠟多雖難圓然圓子愈細其功愈愽臨睡須常服之若欲治病不拘時候治豆積香蘓散三錢水一盞煎服加白芥子一撮炒硏入用通治大抵治積以所惡者攻之以所喜者誘之則易愈太乙神明再造感應圓治虚中積冷氣弱有傷不能傳化心下堅滿兩脇膨脹心腹疼痛噫宿腐氣及霍亂吐㵼或復遲澁赤白膿血相雜米榖不消久病形羸面黃口淡不能飲食多服有效又能消化酒毒肉豆蔲川薑炮百草霜各二兩木香一兩半蓽澄茄京三稜炮各一兩巴豆一百粒去心另研酒蠟四兩杏仁一百粒去皮尖别研清油丁香各一兩右除巴豆杏仁外並為末次下巴豆杏仁等和勻先将油煎蠟令鎔化傾在藥末内和成劑入臼内杵千餘下旋圓如菉豆大毎服三五圓熟水吞下食後臨卧服小兒如粟米大二十圓乾薑湯下傷滯糞白有效缺圓子治冷積停滯腹痛淡薑下三十圓方見痎瘧類縮砂香附湯合和平胃散治食積食前鹽蘇湯調服方見諸氣脾胃類五積散香蘇散合和亦治冷積生薑煨葱白烏梅煎空心服方見傷寒隂證及和解類握藥宣積巴豆乾薑韮子良薑硫黃甘遂白㯽榔各等分右為末研飯為圓如中指頭大用時早朝用椒湯洗手了麻油塗手掌中握藥一圓移時便㵼欲得瀉止即以冷水洗手利藥蕩積巴豆一百粒去殻水洗四十次五靈脂白薑赤茯苓一兩右為末醋糊圓如菉豆大毎服七圓冷茶清五更初服或欲㵼止冷水洗手面脚三處立住萬金圓治諸般食積氣積血積蠱脹之類石菖蒲去根節剉如米大半斤重斑猫半斤重去足翅同菖蒲慢火炒不可燒了如菖蒲黃色揀去斑猫用小布袋盛起菖蒲兩人牽掣布袋去盡斑猫屑止将菖蒲研為末用米醋煑糊為圓如梧桐子大毎服二三十圓隨意加減温酒熟水不拘時候治蠱脹加香附子末湯調吞下治腫亦快五積肝積肥氣圓治肝之積在左脇下如覆杯有頭足龜鱉状久久不愈發咳嘔􅬏痎瘧連歲月不已其脉弦而細青皮炒兩二當歸鬚蒼术各一兩半蓬术三稜切鐡孕粉各三兩與三稜蓬术同入醋煑一伏時蛇含石煆醋淬三分右為末醋煑米糊圓菉豆大毎服四十圓當歸浸酒下心積伏梁圓治心之積起於臍上至心大如臂久久不已病煩心身體髀股皆腫環臍而痛其脉沈而芤茯苓厚朴薑汁炒人參枳殻麩炒去穰白术半夏洗七次三稜慢火煨熟乘熱剉右等分為末煑糊圓梧子大米飲下二十圓食前日兩服作末酒調服絶勝脾積痞氣圓治脾之積在胃管覆大如盤久久不愈病四肢不收黃癉飲食不為肌膚心痛徹背背痛徹心脉浮大而長大烏頭一分炮去皮尖附子半兩炮去皮臍赤石脂煆醋淬川椒炒出汗乾薑炮二兩各桂心半兩右為末蜜圓如梧子大朱砂為衣毎服五七圓米飲下漸加圓數肺積息貢圓治肺之積在右脇下大如覆杯久久不愈病洒洒寒熱氣逆喘嗽發為肺癰其脉浮而毛半夏湯洗七次呉茱萸湯洗桂心各二兩半甘草桑白皮炙葶藶炒各二兩半右剉散毎服四錢水一盞半薑三片紅棗二枚煎七分去滓食前服腎積奔豚湯治腎之積發於小腹上至心如豚奔走上下無時久久不已病喘逆骨痿少氣其脉沈而滑甘李根皮焙乾乾葛各一兩一分當歸川芎白芍藥甘草炙黃苓各二兩半夏湯洗十次四兩右剉散毎服四錢水一盞半煎七分去渣服灸法卒厥逆上氣氣攻兩脇心上痛滿奄奄欲絶此為奔㹠氣先急作湯以浸兩手足頻頻易之後炙氣海百壮穴在臍下一寸半又灸闗元百壮穴在臍下三寸又灸期門百壮穴直兩乳下第二肋間端傍一寸五分奔㹠腹腫灸章門百壮穴在大橫外直臍季肋端奔㹠槍心不得息灸中極枉十壮穴在臍下四寸六聚散聚湯治久氣積聚状如癥瘕隨氣上下發作有時心腹㽲痛攻刺腰脇上氣窒塞喘咳滿悶小腹䐜脹大小便不利或復泄瀉淋瀝無度遺精白濁状若虚勞半夏湯洗七次㯽榔當歸各三分橘皮杏仁麩炒去皮尖桂心各二兩茯苓甘草炙附子炮去皮臍川芎枳殻去穰麩炒厚朴薑汁製炒呉茱萸湯洗兩各一右剉散毎服四錢水一盞半煎七分去渣食前服大便不利加大黃煎服荆蓬煎圓方見痰飲類治同上息積􅍮積圓治腸胃因虚氣癖於肓膜之外流於季脇氣逆息難積日頻年醫所不治久則榮衛停凝一旦敗濁潰為癰膿多致不救胡椒五百十十粒木香一分全蝎十箇去苖右為末粟米飲圓如菉豆大毎服十五圓橘皮湯下化氣湯治息積癖於腹脇之下偏脹膨滿不妨飲食諸藥不能取轉及治心脾疼痛嘔吐酸水丈夫小腸氣婦人脾血氣縮砂仁桂心木香各一分甘草炙茴香炒丁香皮青皮炒陳皮生乾薑蓬术炒半兩各胡椒沈香各一錢一字右為末毎服二錢薑蘓鹽湯調下婦人醋湯調服導引法以兩手拇指壓無名指本節作拳按髀趺坐扣齒三十六屏息二十一息嗛氣三口再屏息再嚥如是三作以氣通為效遇子午卯酉時則行然按摩導引之法甚多隨意用之皆可不必拘此法餘見養生書癥瘕大消石圓治七癥八瘕聚結杯塊及婦人帶下絶産并欲服丹藥服中有癥瘕者當先下此藥但去癥瘕不令人困消石三兩大黃四兩人參甘草各一兩半右為末以三年苦酒三升置銅石器中以竹作凖毎一升作一刻拄器中先納大黃常攪不息使微沸盡一刻乃内餘藥又盡一刻極微火熬使可圓則圓如梧桐子大毎服三十圓米飲下四日一服婦人服之或下如雞肝或如米泔正赤黒等三二升後忌風冷如産婦小三稜煎治食癥酒癖血瘕氣塊時發刺痛全不思食及積滯不消心腹堅脹痰逆嘔噦噫醋吞酸脇肋刺痛胸膈痞悶并脾氣橫泄京三稜蓬莪术各四兩芫花一兩葉去梗右同入磁器中用米醋五升浸滿封器口以灰火煨令乾取出稜术将芫花以餘醋炒令微焦焙乾為末醋糊圓如菉豆大毎服十五圓生薑湯下婦人血分男子脾氣橫泄腫滿如水桑白皮煎湯下三聖圓治積年癥瘕癖塊諸藥療理不瘥至效舶上硫黃一兩水銀半兩硇砂一分製如右三物乳鉢内滚研如粉却以生鐡銚内用文武火熬鎔成汁以火筯攪令勻停冷刀剗下以紙裹置地坑内埋一宿取出再研細次以赤芍藥當歸京三稜蓬莪术紅花各一分同用並細剉以法酒一升煎及一半漉出砂盆内研生布裂汁再熬放冷入飛羅麫為糊捜圓如菉豆大治因産後傷於飲食結伏在腹脇時發疼痛不可忍者當歸浸酒一升遂旋取酒煖下七圓至十圓毎服磨癖塊空心溫酒下三圓至五圓所是藥渣裂了焙乾為末别入乾地黃半真蒲黃芫花各一兩黃微炒焦右為末以前一般糊圓如菉豆大治女人血臟冷氣攻心疼及一切血疾溫酒下十圓一握七圓治臟腑宿蘊風冷氣血不和停滯宿飲結為癥瘕痞塊及婦人血瘕腸胃中寒飲食不下欬逆脹滿及下痢赤白霍亂轉筋及踒躄拳攣脚膝疼痛行步不能常服健脾暖胃堅骨强陽神麯半斤炒黃大附子二隻炮去皮臍甘草二兩炙右為末煉蜜圓毎左手一握分作七圓細嚼米飲下妙應丹治諸臟氣虚積聚煩悶及飲食中蠱毒或食水木果蓏子卵入腹而成虫蛇魚鱉或宿食留飲婦人産後敗血不消女子月水不通結為癥瘕時發寒熱唇口焦黒肢體痩削嗜卧多魘食少腹痛大便糟粕變成冷痢附子四箇六七錢重者生去皮臍宛作瓮入研砂共一兩七錢重麫齊裹煨熟去麫不用蓽撥木香煨青皮破故紙各三兩右為末麫糊捜圓如梧子大毎服三十圓生薑橘皮湯下洩痢米湯下加至五十圓灸法灸内踝後宛宛中隨年壮又灸氣海百壮其穴在臍下一寸五分久冷及婦人癥瘕腸鳴洩痢遶臍絞痛灸天樞百壮其穴在臍傍二寸勿針積聚堅大如盤冷脹灸胃管二伯壮其上在上管下一寸心痛腹疼附風證重者蜜附湯治胃涉風邪入腹拘急切痛或吐或泄状如霍亂附子去皮臍切作四斤以蜜煎令附子變色以湯洗去蜜切半斤桂心芍藥各三分甘草四錢炙右剉散毎服四大錢水一盞半薑五片棗一枚煎八分去渣食前服大便秘