拘時候水浸丹治伏暑傷冷冷熱不調霍亂吐利口乾煩渇黃丹一兩二錢半炒巴豆二十五个去皮心右同研勻用黃蠟鎔作汁和為圓如梧子大毎服五圓水浸少頃别以新汲水吞下不拘時候又用薑附湯清煎沈冷服之大效熱因寒用之法也見中寒類亁霍亂鹽湯治忽然心腹脹滿痞刺疼痛蠱毒煩寃欲吐不吐欲利不利状若神靈所附頃刻之間便至悶絶亦涉三因或臟虚或腸胃素實故吐利不行極鹹鹽湯三升熱飲一升刺口令吐宿食使盡不吐更服吐訖復飲三吐乃止此法大勝諸治俗人以為田舍淺近鄙而不用守死而已凢有此病即先用之續以理中湯倍加橘紅與之或藿香正氣散加官桂茯苓煨枳殻就吞蘇合香圓炒通治藿香正氣散治霍亂吐瀉通用腹痛者加桂小便不利加車前子毎料各一兩訶子散治老㓜霍亂吐利一服取效方見心痛類加味薑附湯治吐㵼過多手足逆冷氣少不語六脉沈伏附子炮乾薑人參各一兩甘草五錢右剉散毎服四錢水二盞煎至一盞空心服腹痛加官桂小便不利加茯苓毎料各五錢養正丹治霍亂轉筋咳逆不定病勢危篤毎服三十圓鹽湯下方見痼冷類胡椒湯治霍亂吐瀉胡椒七粒生菉豆二十一粒右為末宜木𤓰湯溫和調下竒方鹽一撮醋一盞同煎八分溫服二盞鹽梅鹹酸等物皆可煮服又方星南末三錢棗三枚薑五片煎極熟服治吐下四肢逆冷不省人事一服可效半夏為末薑汁㸃亦一服效白礬為末毎服一大錢沸湯㸃服亦騐熏洗法治霍亂轉筋陳大蓼一把水三升煑取二升乘熱熏洗仍飲半盞凢用蓼須家園種者鹽熨方治霍亂吐瀉心腹作痛炒鹽二盌紙包紗䕶頓其胸前并腹肚上一截以熨斗火熨氣透則蘇續又以炒鹽熨其背則十分無事灸法治霍亂轉筋欲死氣絶惟腹中有煖氣者可用其法納鹽於臍中令實就鹽上灸二七壮名神闕穴立效併灸臍下一寸半名氣海穴二七壮妙痰飲懸飲十棗湯治飲水流在脇下咳唾引痛一嵗不愈者芫花微炒甘遂大㦸炒右等分剉散水一盞半棗十枚煎八分去棗調藥壮人一錢羸人半錢平旦溫服不下者次日更加半錢下后麋粥自養若已下不可服五苓散治流行水飲毎服二錢沸湯調小便更不利加防己佐之方見傷暑類支飲防己桂枝湯治隔間支飲其人喘滿心下痞堅面色黧黑其脉沉𦂳得之數十日醫吐下之不愈漢防己三兩桂心二兩人參四兩石膏六兩右剉散毎服四大錢水一盞半煎七分去滓溫服虚者即愈實者二日復發再服不愈去石膏加茯苓四兩芒硝一兩半微利則愈茯苓五味子湯治支飲手足冷多唾口燥氣促小腹上衝胸咽手足痺面熱翕然如醉因復下流隂服小便難時復咳胃嘔腫茯苓四兩桂心甘草炙三兩各五味子二兩半右剉散毎服四錢水一盞半煎七分去滓溫服服之衝氣却低久更咳滿者去桂加乾薑細辛各三兩咳滿止而復渇衝氣更發者以細辛乾薑為熱藥此法不當逐渇反止者為支飲也支飲法當冐冐者必嘔嘔者復内半夏二兩半以去其飲飲去嘔則止其人形腫與痺加杏仁二兩半若面赤如醉以胃中熱上熏加大黃三兩須詳證加減溢飲大青丸湯治溢飲身體疼重汗不出拘急痛麻黃去節湯洗七次桂心甘草炙各二錢半石膏雞子大杏仁四十个炒去皮尖便鞭也甘草瀉心湯主之屬太陽三隂可汗隂病不當發汗發汗即動經然太隂脉浮少隂病發熱亦須微微出汗但不可正汗耳太隂脉浮者宜桂枝湯少隂發熱脉沈宜麻黃細辛附子湯少隂二三日常見少隂證無陽證者宜麻黃甘草附子陽微發汗皆隂證表藥也差后昏沈傷寒差後十數日或半月二十日終不醒惺常昏沈似失精神言語錯謬又無寒熱醫或作鬼祟或作風疾多般治之不差或朝夕潮熱頰赤或有寒熱似瘧皆緣發汗不盡餘毒在心胞絡間所致也知母麻黃湯主之飲酒復劇傷寒時疾三日已汗解因飲酒復劇苦煩悶乾嘔口燥呻吟錯語不得卧黃連解毒湯主之循衣摸牀傷寒若吐若下後不解不大便五六日以上至十餘日日晡即發熱不惡寒獨語如見鬼状若劇者發則不識人循衣摸牀惕而不安微喘直視若微者但發熱譫語大承氣湯主之者一服利則止後服脉弦者生脉濇者死傷寒别名清便自調自可謂大小便如常也大便秘而堅則曰鞕小便不利小便少下利清榖皆謂水榖不分得大便曰更衣大便坚小便利曰脾約下利曰飱泄腸僻謂痔也寒蔽利曰鴨溏熱而利曰腸垢轉失氣謂氣轉而響時時失下即後分泄氣葢腹中有積大汗傷氣大下傷血或火邪逼迫驚狂或尺寸脉𦂳而反有汗或發汗後汗不止曰漏風或隂病本無汗而反有汗或其脉浮遲微弱不能作汗皆曰亡陽吐汗下溫針以後其病不解曰壞病曰何逆瘥後更發熱曰遺熱脉相尅賊曰負兩手無脉曰雙伏一手無脉曰單伏左闗脉曰人迎右闗脉曰氣口是趺上動脉曰衝陽足后根上䧟中動脉曰太谿婦人乳頭直下近腹處曰期門臍下一寸半曰氣海二寸曰丹田三寸曰闗元𤣥府即汗空也臍下動氣曰奔豚筋惕肉動曰瞤中暑曰中暍妄發濕溫汗曰重暍渇欲飲水水入即吐曰水逆心下停水怔忪身無大熱頭額微汗曰水結胸乾嘔曰啘咳逆曰􅎪目中不了了謂不明了也睛不和謂不和平如常也三月至夏方發病曰晚發傷寒戒忌傷寒新瘥後但少喫麋粥常令稍饑不得飽食反此則復發不得早起不得梳頭洗面不得多言不得勞心費力反此則復發瘥後百日内氣體未得平復犯房室者死忌食羊雞狗肉肥魚油膩諸骨汁及鹹藏鮓脯油餅麫病再發臨治警省川芎細辛防風桔梗白芷甘草羗活各一兩桑白皮半兩右剉散毎服二錢水一盞半薑二片薄荷三葉煎至七分不饑不飽時溫服枳殻半夏湯除熱痰下氣寛中利膈清上治痞滿枳殻半夏黃芩桔梗各二兩甘草五分右剉散毎服四錢生薑三片桑白皮七寸烏梅一個煎未效加甜葶藶馬兠鈴防已薄荷立效熱痰黃色是也虚證順元散治氣虚痰甚不得伸卧氣中痰厥尤宜服之方見傷寒隂類黑錫丹治下虚上壅頭暈痰盛服之立愈方見痼冷類靈砂丹治上盛下虚痰涎壅盛此藥最能鎮墜升䧏隂陽安和五臟方見痼冷類七味圓治脾虚不得剋制腎水多吐痰唾而不咳者方見虚損類暖胃圓去虚痰利冷飲硫黃研白礬各一兩炒半夏二兩炒薑汁丁香茴香炒木散各一兩右為末薑汁痰麫糊丸梧子大毎服二十圓空心米飲下靈白圓治元氣虚弱痰氣上攻風痰壅塞嘔吐不已靈砂青州白圓子各一兩各研右和匀生薑自然汁和米糊丸如梧桐子大每服三十圓空腹人參湯或棗湯下通治二賢湯治痰實食後胸滿年逺痰飲服之愈薄橘皮四兩甘草一兩右為末沸湯調服其功在茯苓半夏枳實南星之上茱苓圓治頭疼背寒嘔吐酸汁不思飲食小便不利氣壅昏眩白茯苓呉茱萸各二兩末湯洗去右為末煉蜜丸如梧子大毎服三十丸不拘時候熟水吞下服後便漩中作茱萸氣是騐他痰藥不能及此一方只将茱萸酒浸三宿以茯苓末拌之候乾或湯或酒下百餘粒亦效快活圓常服消食化痰養生之家不可缺枳殻一兩半炒桂一兩桔梗二兩半夏湯洗七次二兩右為未薑汁糊丸梧子大毎服二十丸食後薑湯下茯苓圓治臂痛不能舉手或左右時復轉移由伏痰在内中脘停滯脾氣不流行上與氣摶四肢屬脾滯而氣不支故上行攻臂其脉沈細者是也後人謂此臂痛乃痰証也用以治痰無不效者茯苓一兩枳殻麩炒去穣半兩半夏二兩風化朴消一分右為末薑汁煑糊丸如梧子大毎服三十丸生薑湯下累有人為痰所苦夜間兩臂常若有人抽牽兩手戰炸至於茶盞亦不能舉只以此藥治之皆隨服隨愈世間所謂痰藥者多矣至於立效未有如此藥之妙也倍术散治酒癖五飲停水在心下或兩脇胃中膈上腸間動摇有聲皆由飲酒冐寒飲水過多白术二兩附子炮去皮臍一兩右剉散分三服水一大盞薑十片煎空腹服臟腑微動即安一方除附子加乾薑肉桂各一兩為末蜜丸梧桐子大毎服二十五丸米飲下食前大效桂辛湯下痰飲散風邪止痰𠻳聰耳鼻宣闗竅利咽膈清頭目解冐眩進飲食桂去麄皮細辛去苖土乾薑炮人參去蘆白茯苓去皮甘草炙各二兩五倍子陳皮去白白术半夏湯洗七次各三分右剉散毎服二錢水二盞煎至一盞去渣食前溫服丁香半夏圓治脾胃宿冷嘔吐痰水噫氣吞酸人參丁香木香肉豆蔲陳皮各一分藿香葉半兩半夏湯洗七次薑汁令炒黃三兩右為末薑汁糊丸如小豆大毎服四十丸薑湯下二陳湯煎送下青州白圓子治眉心并眉梁骨疼又治臂疼或麻木或戰掉皆痰飲所作宜服方見痎瘧類白丸子方見風科通治類控涎圓治同上方見臂痛類二生湯專主治痰附子生去皮臍半夏生用右等分剉散毎服四錢水二盞生薑十片七分去滓煎空腹溫服少許木香煎尤佳闕痰消飲圓治一切停痰留飲青皮陳皮並洗京三稜泡槌碎用川薑炮草果麫裹煨蓬术泡槌碎良薑濕紙裹煨各一兩右為末水麫糊丸如梧子大隂乾毎服五十丸薑湯下破飲圓治五飲停蓄胸腹結為癥癖支滿胸脇傍攻兩脇搶心疼痛飲食不下翻胃吐逆九種心痛積年宿食不消久瘧久痢遁尸疰忤顛癎厥暈心氣不足憂愁思慮婦人腹中諸病悉能治療久服尤妙且不傷臟氣蓽撥丁香不見火胡椒縮砂仁木香不見火蝎稍烏梅青皮巴豆去殻膜各等分右以青皮同巴豆漿水浸一宿次日漉出同炒青皮焦去巴豆水淹烏梅肉蒸一炊久研細為膏入藥末和匀丸如菉豆大毎服五七丸臨卧薑湯吞下曽有婦人頭風服之亦效且㫁根不復發豈頭風即痰飲耶導痰湯一切痰頭目旋暈或痰飲留積不散胸膈痞塞脇肋脹滿頭痛吐逆喘急痰嗽涕唾稠粘坐卧不安不思飲食半夏泡七次四兩天南星炮去皮橘紅枳實去穰麩炒赤茯苓去皮各一兩甘草炙兩半右剉散毎服四錢水二盞生薑十片煎八分食後溫服工陳湯治痰飲為患或嘔吐惡心或頭眩心悸或中脘快或因食生冷飲酒過度脾胃不和並宜服之一方加丁香方見痎瘧類荆蓬煎圓破痰癖消癥塊冷熱積聚胃膈痞悶通和三焦升降隂陽順氣消化宿食荆三稜酒浸三日夏一日蓬莪术酒浸三日夏一日以上二味用去皮巴豆二十粒於銀石器内文武火炒令乾黃色去巴豆却用湯浸去白木香枳殻去穰青皮去穰川茴香微炒㯽榔剉各一兩右為末麫糊丸如菉豆大毎服三十丸食後生薑湯下理中湯治停痰留飲加茯苓半夏導利之方見霍亂類咳逆冷證丁香柿蒂散治吐利及病後胃中虚寒咳逆至七八聲相連收氣不回者難治人參茯苓橘皮半夏良薑炒丁香杮蒂各一兩生薑一兩半甘草五錢右剉散毎服三錢水一盞煎乘熱頓服或用此調蘓香丸亦妙木香匀氣散治同上用萊菔子湯泡研取汁調熱服方見諸疝類沈香降氣湯縮砂烏沈湯治同前蘓葉三皮鹽少許煎湯㸃熱服方見諸氣類橘皮乾薑湯治胃中有寒咳逆橘皮通草乾薑桂心人參甘草右散等分剉散毎服四錢水盞半煎六分温服日三服羗活附子湯治吐利後背寒咳逆羗活去蘆附子炮去皮臍茴香炒各半兩乾薑炮丁香各一兩右剉散毎服二錢水一盞鹽少許煎至七分空心熱服蓽澄茹散療噫氣咳逆蓽澄茹良薑各二兩右剉散毎服二錢水一盞煎六分沸投醋半盞取出時哈之甚妙熱證小柴胡湯治同上毎服三錢水一盞半薑三片杮蒂三個煎熱服方見傷寒泄㵼類橘皮竹茹湯治胃虚膈熱者橘皮去白二兩人參甘草炙半兩各右剉散毎服四錢水一盞半竹茹一小塊生薑五片棗二枚煎至七分去滓溫服不以時灸咳逆法乳下一指許正與乳相直骨間陷處婦人即屈乳頭度之乳頭齊處是穴艾灸炷如小豆大灸三壮男左女右只灸一處火到肌即瘥不瘥不可治也其穴只當取乳下骨間動脉處是世醫得效方卷四
