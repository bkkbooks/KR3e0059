銼散每服三錢水一盞煎空心服加味治中湯治腸胃虛弱腹內痛身體怯寒泄瀉乾薑炮白术炒青皮去白陳皮去白縮砂仁各一兩人參甘草炙各半兩右銼散每服四錢水一盞半生薑五片棗子一枚煎至七分去滓溫服不拘時或兼進感應圓暑證香薷散治傷暑煩渴引飲所下如水方見傷暑類胃苓湯治傷暑煩渴引飲所下如水五苓散方見傷暑類平胃散方見脾胃類右二錢合和紫蘇烏梅煎湯下未效加木香縮砂白术丁香煎服來復丹亦可方見痼冷類或感寒濕水泄平胃散理中湯蘇梅米湯調下通來散分利水穀解煩熱止泄瀉豬苓去皮白术去蘆澤瀉去毛赤茯苓去皮車前子木通茵陳瞿麥右銼散每服四錢水一盞半燈心麥門冬煎服六和湯治暑瀉小便赤澀方見傷暑類水浸丹治感暑口乾煩渴頻㵼方見霍亂類濕證藿香正氣散治腰腳冷痺小便自利肢體重著所下黃黑方見傷寒隂證類胃苓湯治傷濕瀉每服二錢蘇葉三皮食鹽少許調熱服白术附子湯治腸胃虛受濕腸鳴泄㵼自汗白术二兩附子炮茯苓去皮各一兩右銼散每服四錢水一盞半生薑七片棗子一枚煎至七分去滓溫服不拘時候麯芎丸治臟腑受風濕泄瀉不止芎藭神麯白术附子各等分右為末糊圓如梧子大每服五十丸米飲下七情加味藿香正氣散治飲食中憂怒傷脾腹內膨脹吐㵼頻併或作晨泄加丁香縮砂良薑南木香各半錢生薑三片紅棗二枚煎效木香散治臟寒冷極及久冷傷敗口瘡下泄米穀不化飲食無味肌肉瘦瘁心多嗔恚婦人産后虛冷下泄及一切水㵼冷痢木香破故紙各一兩良薑砂仁厚朴薑製各三分赤芍藥陳皮肉桂白术各半兩胡椒茱萸各一分肉豆蔲四餘檳榔一箇右為末每服三大錢用不經水豬肝四兩批薄重重糝藥漿水一碗入醋茶腳少許入甑蓋覆煮熟入鹽蔥白三箇生薑彈子大同煮欲盡空心作一服冷食之初微溏不妨此是逐下冷氣少時自住經年冷痢滑泄只是一服渴則飲粥湯忌冷油膩如不能食冷則漿水暖食之若只用漿水煮豬肝為圓如梧子大每服五十丸用粥飲下亦效若暴㵼只一服熱證黃連香薷散治熱㵼溏利大便熱煩燥小便赤喜飲冷香薷散每一兩加宣連五錢銼碎合和燈心二十莖車前草二根同煎方見傷暑類五苓散治法湯引同上方見傷暑類黃連阿膠九每服五十丸米飲下空腹服方見咳嗽類升麻葛根湯小柴胡湯治傷寒身熱目疼煩渴泄㵼二藥和合用生薑陳米烏梅煎服立效方並見傷寒陽證類蘖皮湯治挾熱泄㵼亦治血痢蘖皮三兩黃苓二兩黃連一兩右銼散每服四錢水一大盞煎至七分入阿膠末半錢再煎少頃溫服調胃承氣湯治大實熱下利譫言此有燥屎也夫泄㵼反用大黃者乃因所利而利之此治熱㵼也非大實勿妄輕用之方見傷寒陽證類冷證去麻黃五積散炒過名和氣飲治脾胃宿冷腹內切痛或外感風寒內傷生冷泄㵼黃白色不止或肝經受寒面色青慘厥而泄利生薑三片鹽梅一箇紅棗二枚同煎大效方見傷寒隂證類豆附丸治丈夫婦人腸胃虛弱內受風冷水穀不化泄㵼注下腹痛腸鳴手足逆冷服諸藥不效者此藥主之肉豆蔲炮四兩木香二兩不見火白茯苓四兩乾薑炮四兩附子炮去皮臍肉桂去粗皮二兩丁香一兩不見火右為末薑汁糊為丸如梧子大每服五十圓加至一百圓薑湯吞下粥飲亦可空心食前服薑附湯治下泄如水或青或白臍腹痛手足冷脈細欲絶漸漸短氣由陽氣暴絶為隂所迫則注下不止陽復則生不復則死又不止灸氣海百壯傷寒虛證鶩溏亦效方見大方科中寒類太已寒丸治沈寒痼冷臟腑虛憊心腹疼痛脅肋脹滿泄㵼腸鳴自利自汗久痢休息蓽撥肉桂各四兩乾薑炮髙良薑各六兩右為末煮麵糊圓如梧子大每服三十圓空心米飲下加味四柱散治臟腑虛怯本氣衰弱脾胃不快不進飲食時加泄利晝夜不息人參去蘆白茯苓去皮附子炮去皮臍各一兩木香濕紙包煨過訶子濕布包炮取皮用各半兩右銼散每服二錢薑三片棗一枚煎至六分服加味三建湯治洞泄不止大川烏綿附天雄三味並炮鹽水浸去皮臍木香肉豆䓻煨裂訶子去核各一兩右銼散每服三錢生薑十片紅棗二枚鹽梅一箇陳米一撮同煎空腹熱服未效仍服來復丹來復丹治同上方見痼冷類茱萸斷下圓治臟寒腹痛泄㵼不止艾葉炒赤石脂川薑各半兩吳茱萸炒二兩半縮砂仁肉豆蔲附子炮去皮臍各七分右為末麵糊圓如梧子大每服五十圓食前米飲下豬臟圓治臟寒泄㵼不進飲食氣體倦怠吳茱萸淨去枝梗不以多少用水浸透右用獖豬臟頭一截去脂膜淨洗將茱萸入臟內兩頭扎定慢火煮令極爛用甑蒸熟尤好將二味於臼內杵千下令極細圓如梧子大每服五十圓米飲下豬肚圓治臟寒泄㵼先用製成厚朴附子二味生薑棗子煎服空心仍服此豬肚圓川烏附子炮各二兩乾薑炮白术厚朴各一兩半良薑炒肉豆蔲煨蓽撥禹餘糧火煆醋碎縮砂仁丁香桂心各一兩右為末用獖豬肚一隻淨洗以川椒一兩去目茴香一兩大麯二兩入豬肚內用線縫定酒醋煮爛取出川椒茴香大麯焙乾為末均和煎藥以豬肚杵和得所為圓如梧子大每服五十圓空心米飲送下椒艾圓治臟腑虛寒泄痢不止烏梅去核二兩半醋浸布裹蒸揉成無滓艾一兩半川椒炒去目乾薑赤石脂黑附炮製各一兩右除烏梅外同為末將蒸過烏梅肉研勻更入熟棗肉蜜少許和圓如梧子大每服二十圓米飲下茱萸湯治脾泄多老人腎虛謂之水土同化吳茱萸取淨不以多少右用白水煮去滓入鹽少許通口服蓋茱萸能暖膀胱水道既清大腸自固餘藥雖熱不能分解清濁也大理中圓治大便虛滑不禁每一圓用平胃散一貼煎化服便止加鹽梅同煎尤妙人參白术乾薑甘草各等分右為末煉蜜圓如指頭大每服十圓米飲下六君子湯治臟腑虛怯心腹脹滿嘔􅎪不食腸鳴泄㵼人參甘草白茯苓白术肉豆蔲濕紙裹煨熟銼碎以厚紙盛壓去油訶子煨去核各等分右銼散每服三錢生薑三片紅棗二枚煎服或為末熱鹽湯調服亦可養氣丹治久冷泄㵼及休息痢疾每服三十圓空心米飲吞下多服收功方見痼冷類冷熱不調參連圓治腸胃虛弱冷熱不調泄痢腸鳴日夜無度艾葉用糯米糊拌勻焙取細末稱二兩半乾薑炮取末二兩用艾末米醋升半慢火熬成膏宣連一兩半銼如麻豆大用吳茱萸兩半同黃連炒色紫㨂去茱萸不用訶子煨去核一兩木香一兩半别用黃連一兩半為粗末將木香泡水一升慢火煮盡水去黃連不用切焙乾人參去蘆白术烏梅去核焙乾稱百草霜别研白茯苓去皮酸石榴皮炒當歸洗焙各一兩半地榆一兩赤石脂一兩三分龍骨一兩三分火煨阿膠二兩蚌粉炒罌粟殼二箇蜜炙右為末將前項艾膏和為圓如梧子大每服五十圓陳米飲下戊巳圓治脾胃不足濕熱泄㵼不止米穀不化腸鳴腹痛黃連白芍藥吳茱萸泡七次焙乾右等分為末用糊圓如梧子大每服三四十圓空心食前濃米飲下腎泄安腎圓治腎泄腹痛無定處似痢非痢骨痛面黧腰腳時冷用七氣湯送下安腎圓方見虛損類七氣湯見心痛類震靈丹治同前每服三十圓炒破故紙棗子煎湯調鍾乳粉少許空心送下小兒腎泄白膿褐汁面黯齒脫偎人怯寒震靈丹末入些鍾乳粉以棗煎炒破故紙取熱汁調下效方見痼冷類金鎖正元丹治腎虛泄㵼小便頻數盜汗遺精一切虛冷之證並皆治之方見痼冷類脾泄炙肝散治久患不愈白术白芷白芍藥桔梗右等分為末炙鹽肝蘸服和氣散即除麻黃五積散治久虛脾泄大效方見傷寒隂證類朴附圓治脾元虛弱久患脾泄冷㵼不止及翻胃惡心臟腑滑泄厚朴去粗皮薑汁製一兩綿附子炮去皮臍淨一兩神麯炒五錢乾薑炮三兩右為末酒煮麵糊圓如梧子大每服三十圓空心食前米飲或鹽湯下脾腎泄木香散治脾胃俱虛泄㵼肉豆蔲麵褁紙煨破故紙炒白术白茯苓各半兩木香甘草炙各七錢右銼散每服三錢生薑三片紅棗二枚煎食前溫服二神圓治脾胃虛弱泄㵼不止全不進食肉豆蔲二兩破故紙四兩炒熟右為末用肥棗四十九箇生薑四兩切片同煮棗爛去薑取棗剝去皮核用肉研為膏入藥和杵圓如梧子大每服三十圓鹽湯下立效弱甚加茯苓二兩木香一兩積證香蘇散治食傷脾胃噫生熟氣及所泄穢氣殊甚或腹緊塊痛水煎吞盧氏感應圓每服三七粒立效久患食積泄㵼不止經驗方見傷寒和解及諸積類縮砂香附湯治傷食成積下㵼與平胃散合和每服二錢紫蘇葉食鹽煎湯調常服有效方見諸氣及脾胃類酒泄虛者香茸圓治飲酒多遂成酒泄骨立不能食但再飲一二盞泄作幾年矣嫩鹿茸草火燎去毛酥炙黃肉豆蔲火煨生麝香另研右為末白陳米飯為圓如梧子大每服五十圓空腹米飲下熱者酒蒸黃連圓方見下痢類平胃散専治酒泄飲後獨甚加丁香縮砂麥芽神麯各五錢為末空腹米飲調二錢立愈晨泄又名瀼泄香薑散生薑四兩切如豆大黃連二兩銼右一處淹一宿慢火炒薑紫色去薑不用將黃連末每服二錢用臘茶清調一劑而愈又用米飲酒調治白痢尤妙若欲速效一料只作二服五味子散治五更天明溏泄一次名腎虛泄感隂氣而然五味子㨂去梗二兩吳茱萸半兩右同炒香熟研為末每服二錢用陳米飲調下食前空腹服或加破故紙炒香肉豆蔲煨裂為末蒜膏為圓如梧子大每服三十圓米飲下大效滑泄大斷下圓治下痢滑數肌肉消瘦飲食不入脈細皮寒氣少不能言有時發虛熱由脾胃虛耗耗則氣奪由穀氣不入胃胃無主以養故形氣消索五臟之液不收謂之五虛此為難治略能食者生附子炮肉豆蔲牡蠣煆稱各一兩細辛乾薑炮良薑白龍骨赤石脂酸石榴皮醋煮乾為度焙乾各一兩半白礬枯訶子去核各一兩右為末糊圓如梧子大每服三十圓粟米湯下豆蔲飲治滑泄神效陳米一兩肉豆蔲麵裹煨五味子赤石脂研各半兩右為末每服二錢粟米湯飲調下日進三服乳豆圓治滑泄不止諸藥無效肉豆蔲生為末右以通明乳香用酒浸透研成膏和前藥末為圓如梧子大每服五十圓空腹飯飲下世醫得效方卷五
