body:
  text: 世醫得效方卷六元危亦林撰大方脈雜醫科下痢風證神术散治胃經傷風自汗小便難下痢方見咳嗽類露宿湯治風痢純下清血杏仁七個尖去皮苦木瘡一掌烏梅二個草果一個酸石榴皮半皮青皮二個甘草右銼散作一劑水二碗生薑叁片煎土分露星一宿次早空腹服間風湯治法藥件並見泄瀉類寒證人參敗毒散治寒邪壯熱下痢及所下似痢非痢似血非血色如濁酒者加陳米百粒煎方見傷安陽證類不換金正氣散治臟腑受寒下痢赤白加烏梅陳光煎方見時疫類暑證六和湯治冒暑伏熱致成痢疾煩渴小便赤澀方見傷暑類五苓散治同上能分隂陽利水道方見傷暑類蘖皮湯治暑痢方見泄瀉類酒蒸黃連圓治伏熱㵼痢不止用香薷散燈心二十莖車前草二根煎吞服立效方見後面及傷暑類濕證加味除濕湯治一身盡痛重者浮黃下痢如豆羮汁半夏麯厚朴去粗皮薑汁削蒼术炒各一兩藿香葉陳皮炒茯苓各五錢粉草宫桂木香各三錢右銼散每服四錢水一盞半生薑三片紅棗二枚煎服空心仍以五苓散兼服利其小水艾薑圓治濕冷下痢膿血腹痛婦人下血乾艾葉四兩炒焦存性川白薑一兩炮右為末醋煮麵糊圎如梧子大每服三十圓溫米飲下苦散治脾受濕氣泄痢不止米榖不化黃連去鬚銼如豆吳茱茰白芍藥銼如豆各二兩同炒令赤色右銼散每服二錢水一盞煎至七分去滓溫服熱證小承氣湯治下痢赤黃但煩飲冷小便不利得熱則極心煩燥喜渴先服一二服蕩之須審是實熱方可次用五苓散加車前子以利小便黃連阿膠圎佐治之即效方見傷暑及咳嗽類小柴胡湯治下痢赤白心中煩燥潮熱加赤芍藥地榆麥門冬淡竹葉煎效方見傷寒陽證類敗毒散治同上加陳米煎方見傷寒陽證類烏梅圓治下痢純血臍腹絞痛脈急大數由腸胃久虛或先經下血痢未止服熱藥藴毒伏熱滲成血痢烏梅二兩焙黃連三兩茱茰酸石榴皮各一兩右為末醋糊圓如梧子大每服三十圓米飲湯下更以意加減服地榆散治熱留腸胃下痢鮮血亦名潑火散方見傷暑類蘖皮湯治熱證發熱下痢方見泄㵼類芍藥蘖皮圓治一切濕熱惡痢頻并窘痛無問膿血並宜服芍藥黃蘗各一兩當歸黃連各半右為末水圓小豆大溫水下三四十圓無時候及夜五六服忌油膩脂肥發熱等物熱痢大效三黃熟艾湯治傷寒四五日大下熱痢諸藥不止宜服此除熱止痢亦作圓子熟水吞下四十圓治時行毒痢良驗黃苓黃連黃蘗各二分熟艾右銼散每服三錢水一盞煎至七分去滓溫服不拘時酒蒸黃連圓治身熱下痢鮮血煩燥多渴或傷熱物過度黃連一斤去鬚好酒二斤半右用酒浸瓦器盛置甑上蒸至爛取出曬乾研為末用麵糊為圓如梧子大每服三十圓熟水吞下又療傷酒過多臟毒下血大便泄㵼用溫米飲下食前一日兩服白頭翁湯治熱痢下血連月不瘥白頭翁二兩黃連黃蘗皮秦皮各三兩右銼散每服四錢水一盞半煎至八分不拘時溫服冷證當歸圓治冷痢凄清腸鳴所下純白腹痛不止手足冷者宜服之當歸白芍藥附子炮白术乾薑炮厚朴製炒阿膠粉炒兩各一烏梅二兩右為末醋糊圓如梧子大每服五十圓米飲吞下空心服腹痛甚加桂半兩小便不利加白茯苓一兩大凡痢疾雖體寒手足逆冷冷汗自出六脈沉伏不宜輕用附子多因伏暑而得此疾亦有冷汗自出四肢逆冷六脈虛弱但背寒面垢或面如塗油齒乾煩寃燥渴引飲此伏暑證也小柴胡湯五苓散酒蒸黃連圓必能奏效學者宜審思耳方見傷寒陽證傷暑類及見類水煮木香圓治純下白痢及淡紅黑痢罌粟殼二兩去蒂毫訶子肉六錢乾薑四兩木香青皮陳皮甘草各二錢當歸白芍藥各半兩右為末煉蜜圓如彈子大每服一圓熟水空心服豆寇散治脾虛腸鳴大肉豆蔲一枚剜小孔子入乳香三小塊在內以麵裹煨麵熟為度去麵右為末每服一錢米飲調下附子理中湯正理中湯加炮附子每料一兩术附湯薑附湯治同上方見霍亂中濕中暑類玉華白丹治臟腑久虛下痢空心米飲下渴者人參湯下亦治腸風下血震靈丹橘皮煎圓治同上方並見痼冷及虛鍾乳健脾圓治男子婦人虛損羸瘦身體沉重脾胃冷滯飲食不消腹脹雷鳴泄瀉不止又治腸虛積冷清痢清榖或下純白腹中㽱痛及久痢赤白腸滑不禁少氣羸弱不思飲食並宜服之由桂去粗皮人參去蘆黃連去鬚乾薑龍骨各二兩蜀椒去目及閉口者微炒出汗三兩半當歸去蘆大麥糵炒石斛去根兩各一附子炮去皮臍五刃茯苓去皮細辛去苗上神麯炒赤石脂各一兩鍾乳粉一兩半右為末入鍾乳粉和勻煉蜜為圓如梧桐子大每服三十圓食前溫米飲下日三服未效用三建湯吞金粟黃芽丹數粒方見病冷類木香散治脾胃虛弱內挾風冷泄瀉注下水榖不化臍下㽱痛腹中雷鳴及積寒久痢腸滑不禁藿香葉洗焙四兩赤石脂附子去皮臍醋煮切焙各一兩丁香當歸去蘆焙肉豆蔲仁木香甘炙二兩各訶子皮一兩半右銼散每服三錢生薑三片棗子二枚煎空心溫服五積散治內傷生冷下痢加縮砂木香製栗殼炒阿膠大效方見傷寒隂證類椒艾圓治虛寒下痢不止方見泄㵼類四注散治下痢又復泄㵼耳鳴手冷腹痛加木香生薑棗子粟米煎就後後藥方見泄㵼類赤石脂散治腸胃虛弱水榖不化泄㵼注下腹中雷鳴及冷熱不調下痢赤白腸滑腹痛遍數頻多脅肋虛滿胸膈痞悶肢體困倦飲食減少赤石脂甘草炙各一兩二錢半肉豆蔲麵裹煨令熟十兩縮砂仁五兩為末二錢一粟米飲調冷熱不調下痢真人養臟湯香連圓治同上二兩並泄瀉類駐車圓治同上方見後並已上三方用皆立效氣痢牛乳治氣痢泄如蟹渤蓽撥二錢牛乳半升右同煎減半空腹服效木香流氣飲治同上方見諸氣類五膈寬中散治同上方見五膈類異香散治憂鬱氣滯不散腹中膨滿刺痛下痛不止蓬莪茂煨益知仁甘草炙京三稜煨六兩各青皮去白陳皮去白兩各三石蓮肉一兩厚朴薑汁浸炒二兩右銼散每服二錢水一盞薑三片棗一枚鹽一捻煎七分通口服不計時或鹽湯鹽酒亦可木香勻氣散治氣痢腹痛經驗方見諸疝類積痢治食積下痢腹內緊痛不進飲食鹽梅湯或米飲多服廬氏感應圓或用蘇合香圓和圓仍用平胃散五苓散二末藥鹽湯空心服調理立安方見積中氣脾胃傷暑類蠟匱圓又名靈妙圓治痢止水㵼􅔈砂研分一辰砂研分一巴豆去殼黃蠟半兩右以二砂為末外將巴豆黃蠟銀石器內重湯煮一伏時候巴豆紫色為度去十四粒將七粒與二砂末同研極勻再鎔蠟匱藥每旋圓如菉豆大每服三粒至五粒水㵼生薑湯吞下白痢艾湯赤痢烏梅湯五更空心時服服畢一時不須喫食臨卧服尤佳禁口痢敗毒散治心煩手足熱頭痛此乃毒氣上衝心肺所以嘔而不食每服四錢水一盞半陳倉米一百粒薑三片棗一枚煎溫服方見傷寒陽證類加料參苓白术散治禁口痢食飲不下棗湯調效方見脾胃類又方用石蓮肉留心為末陳米飲下又方治心腹虛膨手足厥冷或飲過苦澀涼劑晨朝未食先嘔或聞食即吐不思飲食此乃脾胃虛弱山藥一味銼如小豆大一半銀石器內炒熟一半生用為末米飲調下自獲其功煨即魚方治禁口痢鯽魚撚去膽與腸肚入白礬一大豆許同煨熟入鹽醋喫不過兩枚與痢俱效休息痢加味養臟湯加炮附子青皮烏藥茯苓各五錢治傷酒肉炙􅏼後發為痢疾休作無時名曰休息生薑三片紅棗二枚煎方見泄㵼類神效散治休息痢氣痢膿血不止疼痛困弱當歸焙烏梅肉黃連右等分為末研大蒜成膏為圓如梧子大每服二三十圓厚朴湯下一方加阿膠炒五積散治同上生薑三片紅棗二枚鹽梅一箇木香半錢煎方見傷寒隂證類駐車圓治冷熱不調下痢赤白日夜無度腹痛不可忍者及治休息痢下大效痢方之魁黃連去鬚六兩阿膠蛤粉炒三兩當歸去蘆洗焙三兩乾薑炮兩二右為末醋煮米糊圓如梧子大每服五十圓加至七十圓空心米飲下祕方養臟湯治同上方見後大巴寒圓虛冷者效方見泄㵼類薑苓圓止休息痢大效乾薑炮建茶各一兩右以烏梅取肉圓如梧子大每服三十圓食前米飲下毒痢茜根圓治毒痢及蠱注下血如豚肝心煩腹痛又脈或大或小浮熖而起下血如豚肝五內切痛此因服五石湯圓逼損隂氣甚則其血自百脈經絡而來注下成蠱毒此為難治茜根川升麻去蘆犀角地榆黃連當歸去蘆枳殼去穰白芍藥右等分為末醋糊圓如梧子大每五十圓米飲空心下魚鮓湯治痢下五色膿血或如爛魚腸並無大便腸中攪痛不可忍呻吟呌呼聲聞於外粉霜研輕粉朱砂砂􅔈砂研去砂石白丁香各一錢乳香半錢巴豆二十個去殼不去油右為末蒸棗肉為圓嬰孩三圓如粟米大二三嵗四五嵗如麻粒大每用三四圓並旋圓煎鮓湯吞下仍間服調胃藥此證緣久積而成故小兒多有之蠱疰痢羚羊角圓治下血黑如雞肝色相似時發渴者羚羊角一兩半黃連二兩白茯苓一兩黃柏去黑皮一兩半右為末煉蜜圓如梧子大每服五六十圓蠟茶送下病危者復生若血鮮滑泄不固欲作厥狀此藥不可服當灸臍下氣海關元二冗更服玉華白丹方見痼冷類人參綿附炮去皮臍肉豆蔲微火煨裂右銼散每服二錢水盞半生薑七片棗二枚煎食前服腹痛不止薑茶方治痢下腹痛肚皮熱手不可近右用生薑切碎如粟米大草茶相等煎服效又方煮茶白痢用蜜赤痢用薑未效用真人養臟湯再加楊芍藥當歸立止方見泄㵼類香連圓治冷熱下痢腹痛甚肛門所泄皆熱方見泄㵼類木香勻氣散治宿冷不消氣滯腹痛用紫蘇湯調下未效用乳香沒藥湯調服方見諸病類瘧痢六和湯治夏月冒暑瘧痢俱作瘧則間日而寒戰掉煩燥難禁當發瘧之時痢或暫止痢則腹痛晝夜頻數又胸滿乾嘔食藥莫下以此藥治之用生薑三片烏梅一個紅棗二枚麥門冬二十粒去心煎仍間服香連圓米飲下未效用五苓散消暑圓仍多服加減清脾更用勝金圓繼之方見傷暑泄㵼中暑痎瘧類痢風加味敗毒散治痢手足拘攣疼痛加檳榔木瓜虛人五積散合和生薑紅棗煎方見傷寒隂證類大防風湯祛風順氣活血脈壯筋骨逐寒濕逐冷氣又治患痢後腳痛瘓不能行履名曰痢風或兩膝腫大痛脾脛枯臘但存皮骨拘攣跧卧不能屈伸名曰鶴膝風服之氣血流暢肌肉漸生自然行履如故熟乾地黃湯白木各二兩羌活去蘆人參去蘆一兩川芎洗附子炮去皮臍參一兩半防風去蘆二兩牛膝去蘆酒浸切微炒一兩川當歸洗去蘆酒浸焙炒二兩黃芩去蘆微炒杜仲去􅀢皮炒白芍藥各二兩甘草一兩右銼散每服五錢水一盞半生薑七片大棗一枚煎八分空腹溫服郁李圓治痢後風手足不能屈伸或麻豆證傳變手足筋脈急亦能治之郁李仁枳殼川獨活鱉甲醋炙黃右等分為末木瓜湯調下酒亦可又方治腳手皆腫不能行步川烏赤芍藥蒼术酒浸土朱右為末糊圓如梧子大引子同上通治木香散住腹痛痢南木香地榆一兩黃連七錢青皮去穰赤芍藥枳殼煨去穰乳香甘草各五錢右為末每服二錢熱湯調服黑豆散小黑豆炒川練子烏梅甘草乾薑罌粟殼二個去蒂蕚穰右罌銼煎至七分將紗濾過栵自然汁空腹服當歸散住㵼痢地榆陳皮罌粟殼去蒂蕚穰當歸去尾赤芍藥甘草肉豆蔲煨加黃連右等分為末每服二錢冷水調服獨神圓治痢神效罌粟殼十兩重分作三分去穰及蒂蕚一分醋炒一分蜜炙一分生用右為末用蜜圓如小指頭大紅痢生地黃春茶煎湯嚼下白痢烏梅甘草莭但為末二錢陳米鹽梅湯亦效神應散治痢緊嚴絶妙金罌草肉豆蔲訶子地榆罌粟殼去蒂萼甘草當歸去尾茯苓白术