半細研用水浸濾去皮取濃汁脂麻半盞微炒研用水浸取濃汁桃仁湯洗去皮麩炒黃研如泥荆芥穗搗末兩各一右用前藥入鹽少許同煎可以當茶飲之以利為度蔥白散治老人大便不通蔥白二莖阿膠一片右以水煎蔥候熟不用却入阿膠溶開溫服胃氣散治老人胃寒氣怯大便反祕每服五十丸米飲空腹下未效生薑自然汁著熱水少許吞下方見霍亂類黃耆湯治年髙老人大便祕澀綿黃耆陳皮去白兩各半右為末每服三錢用大麻仁一合爛研以水投取漿水一盞濾去滓於銀石器內煎候有乳起即入白蜜一大匙再煎令沸調藥末空心食前服祕甚者不過兩服愈常服即無祕澀之患此藥不冷不燥其效如神熱祕神功圓治氣壅風盛大便祕澀後重疼痛煩悶此藥當量虛實加減大黃四兩煨蒸皆可人參二兩訶子皮四兩麻仁二兩另研右為末煉蜜丸如梧子大每服二十丸溫湯酒米飲任意下食後臨卧服檳榔圓治大腸實熱氣壅不通心腹脹滿大便祕結檳榔大黃蒸麻子仁炒去殼别研枳實麩炒羌活去蘆杏仁去皮尖炒牽牛炒白芷黃芩各一兩人參半兩右為末煉蜜丸如梧子大每服四十丸空心熟水下四順清涼飲治同上每服三錢水一盞半燈心十莖枳殼十片去穰煎立效方見積熱類小三黃圓治熱證大便祕結每服三十圓溫水下方見積熱類小柴胡湯治傷寒陽結能食而大便不下方見傷寒陽證類濕祕檳榔散治腸胃有濕大便祕澀檳榔不拘多少右為末每服二錢用蜜湯點服不以時候香蘇散多加枳殼檳榔亦效方見傷寒和解類通治甘遂散治大小便不通右以甘遂二兩赤皮者為末煉蜜二合和勻每一兩重分作四服日進一服蜜水下未知日二脈漸加之又方葵子末三合青竹葉一把水一升煮五沸頓服又方葵子末三合水一升煮去滓分作二服豬脂二兩空心服又方治大小便關格不通經三五日者用不蛀皂角燒灰米湯調下即通又方豬脂二兩水一升煮三沸飲汁立通八正散治同上方見積熱類推車散治大小便祕經月欲死者推車客七個土狗七個如男子病推車客用頭土狗用身如女子病土狗用頭推車客用身右新瓦土焙乾為末用虎目樹皮向南者濃煎汁調只一服經驗如神又掩臍法治大小便不通用連根蔥一莖帶土不洗以生薑一塊淡䜴二十一粒鹽二匙同研爛揭餅烘熱掩臍中以帛札定良久氣透自通不然再換一劑通治大便不通大潤腸圓大便祕澀通用杏仁去皮尖微炒枳殼浸去穰麻仁陳皮各半兩阿膠炒防風各二錢半右為末煉蜜丸梧桐子大每服五十丸老者蘇子煎湯下壯者荆芥泡湯下獨棗湯治大便積日不通大好棗一枚擘開入輕粉半錢右以棗相合麻線扎縛慢火煮熟嚼細以棗汁送下敷藥治閉結至亟昏不知人生大螺一二枚以鹽一匙和殼生搗碎置病者臍下一寸三分用寬帛緊繫之即大通未效烏桕木根三寸研井水服亦效就多研爛敷臍下亦可蜜兊法蜜三合入豬膽汁兩枚在內煎如飴以井水出冷候凝撚如指大長三寸許納下部立通活人書單用蜜一法入皂角末在人斟酌用一法入薄荷末代皂角用尤好又或偶無蜜只嚼薄荷以津液調作挺用之亦妙煨蒜方獨頭蒜煨熟去皮以綿裹納後部自通熏方不蛀皂角用碗燒置於桶內其後部自通老人臟腑祕不可用大黃老人津液少所以臟腑祕澀更服大黃以㵼之津液皆去定須再祕甚於前只可服寬潤大腸之藥更用槐花煎湯淋洗亦效更有老人發熱而大腑祕澀或因多服丹藥脾胃虛弱煮化不行遂為臟腑積熱須用神保圓得通㵼一行熱亦即退脹滿風寒暑濕脹大正氣散治脾胃怯風寒濕氣傷動沖和心腹脹滿有妨飲食厚朴薑製炒藿香葉半夏橘紅白术各一兩甘草炙檳榔桂枝不見尖枳殼去穰麩炒乾薑炮各半兩右銼散每服四錢水一盞半生薑五片棗子二枚煎至七分去滓不以時溫服疏順飲子治喜怒不節肝氣不平邪乘脾胃心腹脹滿連兩脅妨悶頭暈嘔逆脈來浮弦防風去蘆桂枝不見火枳殼去穰炒赤芍藥桔梗去蘆炒各一兩木香不見火人參檳榔當歸去蘆酒浸川芎橘紅甘草炙各半兩右銼散每服四錢水一盞薑五片煎七分不拘時溫服五膈寬中散治七氣流滯飲食不下氣滿膨脹方見五膈類木香流氣飲調榮衛利三焦行痞滯消脹滿方見諸氣類附子粳米湯治憂怒相乘神志不守思慮兼并擾亂臟氣不主傳使諸陽不舒反順為逆中寒氣脹腸鳴腹痛胸脅逆滿嘔吐不食附子一個去生皮臍虛人略炮半夏湯洗七次粳米各三錢甘草炙錢半一乾薑一分去皮右銼每服二錢水一盞棗三個煎至七分去滓食前服溫胃湯治憂思聚結脾肺氣凝陽不能正大腸與胃氣不平脹滿衝咳食不得下脈虛而緊澀附子炮去皮劑當歸厚朴去粗皮生用人參橘皮白芍藥甘草炙各一兩乾薑一兩一分川椒炒出汗去合口者三分右銼散每服四大錢水二盞煎七分去滓食前服沉香降氣湯治中脘脹滿時復脅肚痛楚每噫則覺氣快氣不噫則悶漸覺面浮磨檳榔入紫蘇同煎下神丸五七圓二方並見諸氣類穀脹大異香散治失飢傷飽痞悶停酸早食暮不能食名穀脹京三稜蓬术青皮陳皮半夏麯藿香北梗益智仁枳殼製香附子炒半兩各甘草炙分三右銼散每服三錢水盞半薑五片棗二枚煎服蓽澄茄圓治痞滿脹痛穀脹氣脹通用蓽澄茄白豆蔲仁縮砂仁青皮蘿蔔子木香各二分肉豆蔲煨茴香炒辣桂丁香各一分半陳皮三分右為末麵煮稀糊丸梧桐子大每服三十丸陳皮湯下水脹大半夏湯治脾土受濕不能制水水漬於腸胃溢於皮膚漉漉有聲怔忪喘息名水脹半夏湯洗陳皮茯苓桔梗檳榔甘草各等分右銼散每服三錢水一盞半薑三片煎溫服青木香圓治同上方見諸疝類血脹人參芎歸湯治煩燥嗽水迷忘驚狂痛悶喘惡虛汗厥逆小便多大便黑名血脹當歸半夏製同上三分川芎一兩蓬术煨木香縮砂仁烏藥甘草炙各半兩人參辣桂去粗皮五靈脂炒一分各右銼散每服三錢薑五片棗二枚紫蘇四葉煎食前服熱脹七物厚朴湯治腹滿發熱以陽并隂則陽實隂虛陽盛生外熱隂虛生內熱脈必浮數浮則為虛數則為熱隂虛不能宣導飲食如故致脹滿者為熱脹厚朴薑汁炒一兩甘草炙大黃蒸各三力三字枳實麩炒去穰半兩桂心一分右銼散每服四錢水盞半生薑七片棗三枚煎至七分食煎服嘔加半夏利者去大黃寒多則加生薑十片煎推氣圓治三焦痞塞氣不升降胸膈脹滿大便祕澀小便赤少並宜服之大黃陳皮檳榔枳殼小者去穰黃苓黑牽牛生用分各等右為蜜丸如梧桐子大每服五七十丸臨卧以溫然水下更量虛實加減寒脹朴附湯治老人虛人中寒下虛心腹膨脹不喜飲食脈來浮遲而弱此名寒脹附子炮去皮臍厚朴薑製炒右等分銼散每服四錢水二盞生薑七片紅棗二枚煎至八分去滓溫服不拘時候加少木香尤佳順氣木香散治氣不升降嘔逆惡心胸膈痞悶脅肋脹滿及酒食所傷噎氣吞酸心脾刺痛大便不調面色痿黃肌肉消瘦不思飲食兼婦人血氣刺痛及一切冷氣並治之丁香不見火縮砂仁良薑去蘆肉桂去粗皮乾薑炮甘草炙陳皮去白厚朴去粗皮薑汁炙蒼术米泔浸炒桔梗去蘆茴香炒三兩各右銼每服二錢水一盞生薑三片棗二枚煎至八分稍熱不拘時或入鹽少許沸湯點服寬中順氣和胃進食食脹強中湯治脾胃不和食啖生冷過飲寒漿多致腹脹心下痞滿有妨飲食甚則腹痛乾薑炮去土白术各一兩青皮去白橘紅人參附子炮去皮臍厚朴薑製甘草炙各半兩草果仁丁香各三兩右銼散每服四錢水一盞半生薑五片大棗二枚煎至七分去滓溫服不拘時嘔者加半夏半兩或食麵致脹滿加蘿蔔子半兩溫中散治虛人老人喜啖生冷多致腹脹心下痞滿有妨飲食或刺痛泄利氣痞滯悶厚朴去皮細銼甘草細銼青州棗生薑洗切右以厚朴甘草搗令得所方入生薑再杵令勻取出同棗焙令浥浥微燥却入鍋內慢火炒至紫色再焙乾為末每服一大錢擦生薑少許沸湯點空腹以和為度氣味甚美兼能愈疾又易修合桂香圓治大人小兒過食雜果腹脹氣急肉桂不見火一兩麝香另研右為末飯丸如菉豆大大人十五圓小兒七圓不拘時熟水送下未痊再服獨聖散治脾胃不足過食瓜果心腹堅脹痛悶不安鹽五合右用水一升煎消頓服自吐下即定或因食麥令人腹脹暖酒和薑汁飲一兩杯即消感應圓治積食停滯脾胃作脹方見祕澀類北亭圓治稟受怯弱脾胃易傷因此積聚中脘脹滿心腹堅硬㽱痛攻衝牽引小腹如蠱之狀方見虛損類溫中圓治心腹積聚九癥癖塊腹脹心下堅結大如杯碗傍攻兩脅心痛積年食不消化吳茱茰湯洗七次焙炒桔梗柴胡去蘆菖蒲紫苑黃連去鬚乾薑炮肉桂去粗皮茯苓去皮蜀椒去目及閉口者炒出汗人參去蘆厚朴去粗皮薑汁製巴豆去皮心膜出油炒研已上各半兩川烏炮去皮臍二兩半皂莢去皮子炙半兩右為末入巴豆令勻煉蜜圓如梧子大每服三十丸紫蘇湯下取下積滯如魚腦爛綿而安鼓脹嘉禾散四柱散治脾胃虛憊腹脹如綳鼓氣宇喘促食後愈甚方見脾胃類四柱散方見泄㵼類厚朴橘皮煎治傷冷溏下腹肚䐜脹其狀如覆栲栳喘息奔急鼻張口呿氣上下不得分泄厚朴去粗皮薑製三兩枳殼麩炒乾薑炮良薑切各一兩二錢青皮去白陳皮去白肉桂去粗皮全蝎去尾足毒斟酌分兩右為末醋糊圓如梧子大每服三十丸生薑橘皮湯吞下或紫蘇湯下三稜煎圓青木香圓治心腹堅脹喘滿短氣緊促噫氣不通飲食不消或嘔逆吐痰或腸中水聲大便或祕或泄二藥合和每服三十圓食後米飲下方見諸氣諸疝類四炒枳殼圓主腹脹鼓疾枳殼去穰四兩右分作四分每分一兩一分用銼散碎蒼术一兩同炒一分用蘿蔔子一合同炒一分用乾漆一兩同炒一分用茴香一兩同炒各以枳殼黃為度只取枳殼一味為末却將蒼术等四味用水二碗煮至一碗半去滓取汁煮麵糊為丸如梧桐子大每服五十丸食後米飲下氣針圓専治氣膨全蝎去毒并足木香丁香不見火胡椒肉豆蔲煨各一兩片子薑黃青皮去白兩各二右為末用蘿蔔子炒淨退殼取仁四兩爛研和藥令勻紅酒生薑汁各少許煮糊丸如梧子大每服四五十圓紫蘇陳皮湯下不以時候丁沉透膈湯治氣滿不食腹中膨脹刺痛方見脾胃類導氣圓治諸痞塞關格不通腹脹如鼓大便結祕等證又腎氣小腸氣等功效尤速青皮水蛭等分同炒赤去水蛭蓬莪术虻蟲等分同炒去虻蟲胡椒茴香炒去茴香三稜乾漆炒去乾漆茱茰牽牛炒去牽牛赤芍川椒炒去川椒石菖蒲桃仁炒去桃仁檳榔斑貓炒去斑貓乾薑碙砂炒去碙砂附子靑鹽炒去鹽右各銼碎與所注藥炒熟去水蛭等不用秪以青皮等十味為末酒糊丸如梧子大每服五十丸加至七十圓空心紫蘇湯吞下尉法治腹脹緊如鼓澀如木皮樣杜烏藥荆芥蒼术菵草山茵陳夏蠶沙松毛樟根葉北蒜螃蚍葉橘葉椒目烏豆赤豆藠各等分右銼細分作二次炒熟以布袋盛尉腫處冷又炒尉三四十度或後用煎水熏洗或服神保圓微溏泄去其氣敷藥治腹緊硬如石或隂囊腫大先用熱水嚼甘草後用大戟芫花甘遂海藻各等分右為末醋調塗或用白麵和藥調一片覆肚上通治沉香飲治腹脹氣喘坐卧不得沉香木香枳殼各半兩蘿蔔子炒右銼散每服三錢水一盞半生薑三片煎七分溫服檳榔治脾虛腹脹不進飲食快氣寬中蘿蔔子炒檳榔煨黑牽牛炒木香各半兩右末水煮麵糊圓梧桐子大每服三十圓薑湯食前下灸法脹滿水腫灸法腧隨年壯穴在第十一椎下兩傍各去一寸半胸滿心腹積聚痞痛灸肝腧百壯穴在第九椎下兩傍各去一寸半腹脹滿繞臍結痛堅不能食灸中守穴百壯在臍上一寸一名水分胸滿瘕聚滯下冷疼灸氣海十壯穴在臍下一寸五分腸中膨脹不消灸大腸腧四十九壯穴在第十六椎下兩傍各一寸半腸中雷鳴相逐痢下灸承滿五十壯穴在俠巨闕相去五寸巨闕在心下一寸灸之者俠巨闕兩邊各二寸半五臟六腑心腹滿腰背疼飲食吐逆寒熱往來小便不利羸瘦少氣炙三焦腧隨年壯穴在十三椎下兩傍各一寸半世醫得效方卷六
