body:
  text: 世醫得效方卷十五元危亦林撰産科兼婦人雜病科通治四物湯隨證加味宜酌量入當歸川芎熟地黄洗焙酒炒白芍藥各等分右剉散每服四錢水一盞半煎至七分去滓食前熱服為末服亦可若平常血氣不調及常服只用本方春加當歸夏加芍藥秋加川芎冬加地黄各一兩半日二三服姙婦作惡生寒面青不思飲食憔悴陳皮枳殻白术茯苓甘草産后敗血築心地骨皮芍藥潮熱黄芩地骨皮柴胡咳𠻳桑白皮半夏生薑人參甘草北五味子地骨皮損孕下血不止頭痛寒熱耳鳴氣血勞傷所致黄芩荆芥生地黄生薑赤芍藥虚寒潮熱柴胡地骨皮白术茯苓甘草秦芁知母黄芩麥芽貝母人參烏梅棗子心腹脹滿枳殻青皮虚汗麻黄根産後潮熱北柴胡白术甘草牡丹皮地骨皮有熱黄芩汗加浮麥腸風下血槐角槐花枳殻荆芥黄芩大腹皮紅内消地榆石楠皮白雞冠花為散煎一半為末空心鹽湯舊酒調下鼻衂吐紅竹青蒲黄藕節半夏丁香訶子桂花紅棗飛羅麫白茅根蚌粉妳癰連翹茨菰子紅内消白芷菰片荆芥牛膝山蜈蚣乳香没藥漏蘆生地黄血風兩脇築疼或盤腸成塊大黄蓽橃乳香胎動漏下不止黄耆側栢阿膠甘草續斷平常經血淋瀝不斷或多或少或赤或白非時漏下可多服有效月水不通野苧根牛膝紅花蘇木舊酒水同煎臨産小腹𦂳痛紅花滑石甘草燈心葵子閉經枳殻大黄荆芥黄芩青皮滑石木通瞿麥海金沙山梔子車前子安胎及胎漏下血阿膠大艾甘草蒲黄炒過産後腹痛血塊攻腸大艾没藥好酒産後病眼北細辛荆芥羗活甘草菊花木賊石决明草决明女人赤眼頭風疾薄荷清茶赤眼生風防風黄芩産後浮腫氣急腹大喉中水雞聲牡丹皮荆芥白术桑白皮赤小荳大腹皮杏仁半夏馬兠鈴生薑葱白薄荷月水不調血崩或多少或前後嘔逆心膨陳艾黄耆血弱生風四肢痺疼行步艱難乳香人參没藥麝香甘草五靈脂羗活獨活防風荆芥地龍南星白附子澤蘭為末蜜圓木𤓰鹽湯下血氣膨脹甘草木香枳殻馬兠鈴葶􅏣紫蘇藿香地黄空心服補血住崩百草霜敗棕灰月綿灰蒲黄炒過龍骨白薑血成片地黄藕節黒血片人參白术白血片龍骨青黄木𤓰五色生麝香好酒鮮紅溫酒鹽湯風瘡赤腫荆芥牛蒡子何首烏甘草防風羗活地黄鹽酒帶下肉桂蒲黄百草霜甘草黒荳白术𤣥胡索白薑龍骨空心鹽酒血寒甘草烏梅柴胡桃柳枝感風勞𠻳欵花知母阿膠半夏麻黄甘草馬兠鈴黄芩杏仁柴胡姜錢訶子烏梅月經久閉肉桂甘草黄耆姜錢棗子木通紅花大便下血四肢寒膨脹乃腸胃有風槐花枳殻漏蘆荆芥木香白雞冠花木通紅内消紫草石榴皮陳皮黄芩青皮甘草白茅根槐角虚㵼人參川芎白芷蒲黄炒阿膠白术茱茰續斷乾薑黑附子肉桂黄耆赤石脂甘草蜜丸鹽梅湯下白帶用龍骨酒胎前産後痢後風乳香龍骨茱茰木香肉桂蒼术牡丹皮白薇人參甘草澤蘭大椒茴香煉蜜為圓木𤓰酒下亦治帶下赤白痢陳米飲心腹膨炒薑酒血氣艾醋湯渾泉勞倦為末炒薑酒陳青蒿鹽和調下虚證四肢黄甘草牡丹皮澤蘭白薇蒼术桂心茴香蜜丸鹽湯温酒下嘔逆飲食不入加白术丁香甘草人參縮砂益智仁胡椒經行腹痛腰背痛蕓薹牛膝紅花吳茱茰菴䕡甘草銀器燈心熱服虚渇人參乾葛烏梅𤓰蔞根受胎小腸氣痛木香銀器胎前𠻳枳殻甘草欵花知母馬兠鈴半夏木通葶􅏣人參苦梗麥門冬脚腫大腹皮赤小荳茯苓皮生薑皮産後不語失音訶子人參砂蜜百藥煎隂陽交合經脉行赤石脂黄耆肉桂百草霜敗棕灰肉荳䓻當歸木香龍骨白术茯苓地榆藕節胎氣衝肝腰脚痺行步艱難枳殻甘草木通連荆芥地黄羗活獨活山梔子燈心空心服氣築小腹痛𤣥胡索煎效常服加茱茰陽臓少使隂臓多用莪术湯隨證加味宜酌量入當歸去尾川芎莪术煨甘草楊芍藥熟地黄酒蒸洗茴香白芷右為末每服二錢鹽酒調下月經不調銀器燈心安胎黄耆生地黄補虚調氣生薑紅棗遍身虚腫當歸小便不通滑石末心虚發狂朱砂研調敗血衝心腹痛如刀刺燒秤錘紅焠酒不退五靈脂酒血閉身疼炒薑酒吐酸水丁香七粒煎湯血風上攻眼目浮腫荆芥小腹痛木𤓰渾身浮腫薑湯或蔥湯胃惡藿香頭面腫赤荳荆芥湯下血不止木香湯冷𠻳桑白皮乾柿頭痛川芎細辛血風熱潮生薑紅棗虚汗麻黄根吐不止陳青蒿血風腰疼蕓薹子搥碎女人血結不通手發孿急不知苦薺菜一握順流水柳汁手足痺樟柳根浸酒血海虚冷大艾腹脹不消芝麻一合炒薑酒月水不匀當歸浸酒女人血氣成塊築心銀子燈心血崩赤白帶真龍骨末好紅酒調血風中心狂言亂語渾身壯熱桃柳枝七寸血刺成塊不散菴䕡女人癖氣膈氣炒茴香酒婦人不問虚熱傷風血氣潮熱憎寒一切百病先以參服隨證湯引投之服以他藥調理無不應驗冷𠻳猪血心燥猪肝酒催生順流子滑石禹餘糧榆白皮坯子乳香葵子酸車草汁煎湯黄柞葉垂下者胎衣不下再加莪术地黄竹青行血菴䕡生地黄紅花蘓木陳艾減揚芍藥加赤芍藥梢加味五積散厚朴去麄皮薑汁炒半夏洗楊芍藥枳殻去穰炒木香肉桂各一兩陳皮白薑一兩三錢蒼术六兩米泔浸炒桔梗香附子炒去毛茴香炒粉草人參去芦茯苓去皮川芎當歸去尾川白芷各一兩右剉散生薑木𤓰入鹽煎服隂證傷寒生薑附子血脉不匀紫蘇氣𠻳烏梅姜錢匀經棗子姜錢補益血海蘇鹽産後生薑醋炒陳艾胃冷不納食陳皮縮砂赤白帶陳米冷氣疾木香茱茰心燥背筋急頭暈腰脚痠生乾地黄當歸脾虚蘇葉粉草月中被驚或因争觸心頭結塊五膈五噎茴香棗子口苦舌乾吞酸噫氣此為胃冷生薑鹽腰痛桃仁木𤓰杜仲川續斷身疼秦芁諸虚脾胃不和羸痩冷氣蘇鹽冷㵼炒過生薑烏梅肉荳蔲陳米芎歸湯治産前産後腹痛體熱脅疼及諸疾纔差了未進藥即先服此能除諸疾逐敗血生新血川芎二兩川當歸三兩右剉散每服三錢水一盞酒二分煎温服為末亦可將産先安排兩服煎産了速進之三日内日二服三日外日一服諸證失血傷胎去血産後去血崩中去血金瘡去血拔牙去血不止及一切去血過多心煩眩暈悶絶不省人事頭重目暗舉頭欲倒悉治若産後眩暈宜加楊芍藥産後腹疼不可忍者加桂心酒與童子小便合煎立效臨月服之則縮胎易産兼治産後諸疾虚損羸乏腹中㽲痛徃來寒熱吸吸少氣不能支持頭眩自汗腹内拘急每服用精猪肉一兩薑十片水二盞煎温服婦人室女心腹㽲痛經脉不匀水煎姙婦胎氣不安産後諸疾酒煎婦人血氣上喘下腫等分為末二錢空心煎艾湯産後及損娠敗血衝腹脹氣絶者神效難生倒横子死腹中先用黒荳一大合炒熟水一盞入童子小便一盞藥四錢煎至一盞以上分為二服未效再作産後惡血注心迷悶喘急腹痛依前用黒荳加生薑自然汁半合煎服兼治臟毒每服一錢半入炒槐花半錢水一盞煎不以時服三日取下血塊即愈産後頭痛荆芥吐血亦宜服通真丸隨證加減當歸去尾蒼术切炒肉桂防風川芎人參白芍藥白薇去土熟地黄酒炒牡丹皮茴香白术白茯苓桔梗附子炮澤蘭葉各等右為末蜜丸每服一丸血崩經脉不匀赤白帶下炒當歸酒下血風癮㾉瘙痒或痛薑下冷氣塊築心腹嘔逆反胃炒鹽湯下腸風㵼血赤白痢月信不止米飲下血風勞倦青蒿酒頭疼眼花荆芥茶下月信不行室女紅脉不通産後諸風中風不語迷悶五丸紅花蘇木湯胎漏下血氣刺心腹脹滿炒薑酒下白薇散隨證酌量用湯引白薇去土川芎熟地黄酒炒桂心牡丹皮去骨甘草當歸去尾澤蘭葉蒼术切炒芍藥各等分右為末每服三錢氣刺心脅痛艾醋澤蘭湯頭痛心燥米泔米飲氣虚土芎湯頭痛荆芥湯胎前潮熱氣急心悶生地黄燈心産後腹膨吐逆藿香胡椒胎氣不安陳艾下血不止糯米地榆陳艾産後血刺脇痛艾醋湯小腹疼地黄薑汁好酒産後腰腿疼背膊痛木𤓰白膠香没藥好酒月經不匀百草霜温酒若過多藕節酒煎又用陳艾阿膠月水不通杜牛膝野苧根蘇木紅花酒下脅腰痛没藥白𢃄黄耆切和鹽炒酒浸喫十服胎衣不下順流水酸車草産後血氣當歸鹽炒好酒産後勞𠻳糯米桑白皮熱𠻳生地黄芭蕉水産前産後浪熱桃柳枝臨産小腹𦂳痛桑白皮葛根立便追生産前産後臟腑結枳殻下血地榆心神亂銀器大小便秘麻仁蘇子血風脚膝腫痛寒熱生薑黄水柳根血崩竹青藕節霜梅熱吐紅山梔子竹青藕節妳癰蔓荆子酒煎調大烏鷄圓治胎前産後諸般疾患並皆治之烏雄雞烏藥五錢海桐皮一兩草果二錢半石牀五錢肉桂去麄皮一兩熟乾地黄洗焙半三錢人參白术各半兩附子去皮臍一兩木香二錢半黄耆牡丹皮各半兩白芍藥蓬莪荗川烏炮陳皮紅花各一兩𤣥胡索肉荳䓻各二錢半蒼术米泔浸切七錢半琥珀二錢半右剉散用烏雄鷄一隻湯撏去毛及腸肚將藥安置肚中用新甆瓶好酒一㪷同煑令乾去鷄骨以油單盛焙乾為末煉蜜丸梧桐子大每服三十丸胎前産後傷寒蜜糖酒服胎前氣悶壯熱炒薑酒赤白𢃄下生薑地黄煑酒産後敗血攻心童子小便炒薑酒産後血塊築痛𤣥胡索酒胎前嘔逆薑湯催生炒蜀葵子研入酒安胎鹽酒室女紅脉當通不通四肢疼痛煎紅花研入酒血氣攻刺心腹疼痛煎當歸酒血暈棕櫚燒灰入酒血邪研朱砂麝香入酒血悶煎烏梅湯入朱砂末子宫乂冷温酒或棗湯空腹日一服血風勞人參酒小便㽲痛炒茴香食鹽入酒血散四肢遍身虚浮黄腫赤小荳研細入酒常服温酒醋湯並空心吞服大效活血圓治産後虚羸及傷血過多虚竭少氣臍腹拘急痛引腰面面白脱色嗜卧不眠唇口乾燥心忪煩倦手足寒熱頭重目眩不思飲食或勞傷衝任内積風冷崩中漏下淋瀝不斷及月水將行腰腿重疼臍腹急痛及治男子婦人從髙墜下内有瘀血吐血下血等病真蒲黄炒分半三熟乾地黄酒炒阿膠蛤粉炒成珠當歸川續斷乾薑甘草芎藭附子白芷白术各三兩肉桂去麄皮白芍藥各三兩吳茱茰右為末煉蜜圓如梧桐子大每服二十圓食前温酒下漸加至五十圓一方加杜仲鹿茸肉蓯蓉北五味子飬榮衛湯治榮衛不調血氣虚弱面色痿黄四肢無力手足倦怠盗汗併出皮肉枯瘁骨肉羸瘦飲食不進日漸著床病後不能調理變成崩漏用之神效木香丁香丁皮巴㦸去心紫蘇葉白茯苓蒼术肉荳蔲附子沉香苦梗粉草茴香山藥白荳蔲偏荳右剉散每服三錢水一盞半生薑三片紅棗煎温服止㵼加黒荳炒止痢加粟殻蜜炒神應圓治月水過期不通乆無嗣息血癖氣痛四肢浮腫嘔逆心疼虚煩欎悶面色痿黄崩漏𢃄下寒熱蒸勞頭疼齒痛血下無度淋瀝諸疾産前安胎臨産催生産後胎結疼痛傷寒煩渇㵼痢血暈血勞筋攣痰盛頭疼敗血上衝血刺泄㵼咳𠻳喘急咯血血塊起伏氣痞氣膈血滯腰痛小便不禁子死腹中傷寒汗不出血風脚手痺頑凡産後諸疾並皆治之牡丹皮去骨川藁本人參去蘆川當歸去尾白茯苓赤石脂香白芷交趾桂去麄皮白薇去土川芎𤣥胡索白芍藥白术米泔浸一宿各一兩甘草炙沉香不見火右件並用温水洗淨藥乾搗羅為末煉蜜丸如弹子大每服一丸空心温酒下凡姙娠臨月服此五六丸即易産如乆無子息服二十丸當月有子并治積年血風光身不遂種種血疾不問年深日乆皆療神效大聖散治血海虚冷乆無子息及産後敗血衝心中風口禁子死腹中擘開口灌藥湏㬰生下無恙并治墮胎腹中攻刺疼痛横生逆産胎衣不下血暈血癖血滯血崩血入四肢一應血臟有患及諸種風氣或傷寒吐逆咳𠻳寒熱麻木遍身生瘡頭痛惡心經脉不調赤白𢃄下乳生惡瘡胎産虚冷數曽