末每二錢酒調空心日三服養胎益血安和子臟通經圓治婦人室女月候不通疼痛或成血瘕桂心青皮去白大黄炮乾薑炮川椒炒出蓬蒁炮乾漆炒去煙川烏炮當歸去蘆桃仁炒等分各右為末取四分用米醋熬成膏和餘六分未成劑臼中治之圓如梧桐子大略曬乾每服二十圓至三十圓用醋湯温酒空心下尋常血氣凝滯疼痛𢾗服立效鹿茸附子圓補氣固血治木臟因虚生寒月經行多或少或及期腹痛怯風臟腑不和鹿茸五味子蓯蓉杜仲赤石脂各兩吳茱茰附子炮乾薑黒龍骨肉荳䓻白茯苓各半兩乾地黄一兩半右為末酒煮麫糊為丸梧桐子大空心食前熱米飲下五七十丸一月血氣已安去龍骨加沉香半兩可以常服中年以後婦人最宜服此三稜丸治紅脉不通氣痛滯下兼治血瘕形如鎌鐡樣當歸去尾川芎牛膝去苗芫花三稜莪蒁煨蒲黄𤣥胡索牡丹皮乾薑菴䕡白芷地龍去泥土酒浸炒各一兩大黄二兩為末米醋一升文武火熬成膏右為末入大黄膏和研杵爛為丸每服二十丸氣痛淡醋湯下炒薑酒亦可未通紅花酒下治經脉不利方縁經滯即為水水流走四肢悉皆腫滿名曰血分其候與水相類醫作水治之非也宜此人參當歸大黄濕紙褁三斗米下蒸米熟去紙切焙桂心瞿麥穗赤芍藥白茯苓各半兩葶藶炒别研一分右為末煉蜜丸梧桐子大每服十五丸至二三十丸空心米飲送下獨勝方治月信退出皆為禽獸之狀似來傷人先將綿塞隂戸只須服右以没藥一兩作丸散皆可服即愈調氣阿魏丸大聖散兼服治經行腹痛不可忍者立效紅丸子亦效阿魏丸大方科心痛類紅丸子大方大聖散方見前艾煎丸治婦人室女經候不調臍腹冷痛惡心腹常脹滿至晚則増食茱茰湯洗當歸各七錢半熟地黄白芍藥石菖蒲炒川芎人參各一兩熟艾四兩糯米飲調作餅焙右為末煑酒糊丸梧桐子大調縮砂香附湯送下五十丸方見大方科諸氣類濟隂丹治經水不時或崩中漏下一切血疾方見前杜牛膝散治婦人室女血閉不通五心煩熱紅花二錢半大當歸杜牛膝各五錢桃仁去皮尖炒研二錢半右為末每服二錢空心温酒下大油煎散治經候不調臍腹脹腰腿無力煩渇潮熱身體拘倦日漸羸瘦海桐皮五加皮牡丹皮地骨皮桑白皮各等分右剉散每服四錢生薑三片紅棗一枚清油數㸃水一盞半同煎空心温服血氣抽刀散治血風血氣等疾五靈脂炒兩一莪蒁桂心蕓薹子炒各半兩右為末每服二大錢酒半盞煎八分疾作熱服二神圓治血氣不和作痛不止及下血無時月水不調真蒲黄炒蓽撥鹽炒右等分為末煉蜜圓梧桐子大每服三十圓空心温酒送下不飲米飲下一二服即止沒藥散治一切血氣臍腹撮痛及産後惡露不行兒枕塊痛血竭没藥火煨細研桂心當歸去尾蒲黄紅花木香延胡索乾漆炒赤芍藥各等分右為末每服二錢食前熱酒調下𤣥胡索湯治婦人室女七情傷感遂使血與氣併心腹作痛或連腰脇或引背膂上下攻刺甚作搐搦經候不匀但是一切血氣疼痛並可服之當歸去蘆酒浸剉炒𤣥胡索炒去毛蒲黄炒赤芍藥官桂不見火各半兩片子薑黄洗乳香没藥木香不見火各三錢甘草炙錢半二右剉散每服四錢水一盞半生薑七片煎食前温服吐逆加半夏橘紅各半兩寄奴圓治婦人室女月水凝滯脇肋脹刺臍腹㽲痛不可忍及惡露不下血上攻心迷悶不省應有血氣腹痛並牡丹皮去木赤芍藥蓬莪蒁剉荆三稜剉用劉寄奴去梗熟地黄酒炒𤣥胡索炒當歸酒浸烏藥官桂不見火各一兩右用前五味以烏荳一升生薑半斤切片米醋四升同煮荳爛為度焙乾入後五味同為末每服二錢温酒調空心食前服最神圓治室女血氣相摶腹中刺痛痛引心端經行澁少或經事不調以致疼痛橘紅二兩𤣥胡索去皮醋當歸去蘆酒浸剉畧炒各一兩右為末酒煑米糊為圓梧桐子大每服七十圓加至一百圓空心艾湯或米飲送下失笑散治血氣心腹刺痛欲死諸藥不效服此頓愈五靈脂蒲黄㣲炒各等分右為末先用二錢醋調熬成膏入水一盞煎七分食前熱服竒方治血氣痛遊走及腰痛右用莪蒁切片乾漆打碎各二兩同炒令漆焦香取出漆不用只以莪蒁為末温酒調下三錢腰痛胡桃酒下遊走痛冷水調下手拈散治血氣刺痛不可忍者及諸般氣痛方見前大方息痛類二神圓治血氣絞刺痛方見前大效煎圓治血氣痞滿刺痛大效方見大方科諸氣類血瘕桃仁煎治血瘕血積經候不通桃仁大黄各一兩蝱虫半兩炒黒川朴硝一兩右並為末以醇醋二升半銀石器中慢火煎取一升五合下大黄桃仁等不住手攪欲下手圓下朴硝更不住手攪良乆出之圓如梧子大前一日不喫晩食五更初用温酒吞下五圓取下如赤荳汁或如雞肝蝦蟆水狀未下再作如鮮血來即止續以調血氣藥補之虚人酌用琥珀圓治血瘕腹中有塊攻刺小腹痛重或腰背相引為痛久而不治黄瘦羸乏琥珀另研白芍藥川烏炮去皮川牛膝去蘆酒浸鱉甲蓬莪蒁炮當歸去蘆酒浸梓厚朴薑炒兩各一木香不見火澤蘭葉官桂不見火各半兩麝香另分五右為末酒糊圓梧桐子大每服七十圓空心温酒米飲下通經圓治室女月經不行臍下堅結大如杯升發熱徃來此名血瘕加紅花方見前黒神圓神麯茴香各四兩木香川椒炒出汗丁香各半兩㯽榔四枚漆六兩半生半重湯煑半兩右除椒漆餘五味皆半生半炒為末用生熟漆和圓如彈子大茴香末十二兩鋪隂地䕃乾候外乾并茴香收器中極乾去茴香膀胱痃癖及疝墜五膈血崩産後血虚或下赤白並一圓分四服死胎一圓舊綿灰酒下難産炒葵子四十九粒搗碎酒煎下一圓諸疫不過三服痃氣十服膈氣癥癖五服血瘕三圓當差血蠱木香散治脾氣血氣血蠱氣蠱水蠱石蠱木香沉香乳香炮甘草炙一分各川芎胡椒陳皮人􅀢晉礬各半兩桂心乾薑炮縮砂各一兩茴香大茄五兩赤小者乾秤右洗焙為末每服二錢空心陳米飲調下忌羊肉茱萸圓治婦人諸疾繼續而生帶下淋瀝五邪失心愁憂思慮意思不樂飲食無味月水不調及腹中一切疾病有以懐孕連年累月羸瘦困弊或歌或哭如鬼所使但服此藥無不愈者吳茱茰湯洗七次焙炒半両桔梗半兩柴胡菖蒲紫苑去苗菓土黄連去鬚肉桂去麄皮茯苓蜀椒去目及閉口者炒出汗人參去蘆厚朴去麄皮薑汁炒巴豆去皮心膜出油炒研皂莢去皮子各半兩川烏炮去皮臍二兩半右為末入巴荳和匀煉蜜圓梧桐子大每服二圓生薑湯下食後臨卧漸加至五七圓血癖紅圓子治經水不調腹中癖聚成塊流走作痛肌膚消疚腹滿不敢食用烏梅濃煎湯入鹽少許服之薑湯下亦可方見大方科痎瘧類大麝香圓治痃癖冷氣兼疰氣心腹痛不可忍麝香半兩另研阿魏一分麫裹煨麫熟取出五靈脂桃仁去皮尖三稜各三分芫花醋炒㯽榔各一兩莪荗煨桂心没藥另研木香當歸各半兩右為末入麝香令匀用粳米軟飯為丸梧桐子大每服十丸不以時淡薑湯下神效方治痃癖及血氣右以獖猪肝一具可及十兩者用巴豆五十粒去大皮劄入肝内用釅醋三盌慢火熬令肝爛熟去巴豆入砂鉢内研極爛入荆三稜末和就得所丸如梧桐子大每服五丸食前熱酒下小烏鷄煎丸治痃癖癥瘕血氣塊硬發歇刺痛甚則欲死或塊如小盤每作痛要人伏定方少止數年不愈者與蔥白散間服即效吳茱茰良薑白薑當歸去頭赤芍藥延胡索破故紙川椒生乾地黄劉寄奴蓬莪蒁橘紅青皮川芎各一兩荷葉灰四兩熟艾二兩右為末醋煑麫糊丸梧桐子大每服三五十丸熱酒下川芎散治産前後腹痛胎不安或血刺痛百兼治血臟宿冷百節倦疼肌體怯弱勞傷𢃄癖久服盡除婦人一切疾病最宜服之川芎當歸去尾枳殻厚朴去麄皮薑汁炒桂心乾薑芍藥舶上茴香青皮苦楝子木香熟地黄酒炒麥芽三稜莪蒁煨茯苓去皮神麯人參各等分右為末每服三錢連根蔥白二寸擘破鹽半錢煎服如大便不利入大黄煎却不入鹽若大便自利入訶子煎腸覃烏啄丸治腸覃病因寒氣客於腸外與胃氣相摶正氣不勝繫瘕内著惡氣乃起其生也始如鷄卵久久乃成狀如懐胎按之堅推之即移月事時下故曰腸覃亦治乳餘疾大小便不利并食有伏蠱臚服癰疽毒腫乆寒邪氣鳥喙炮去皮尖二錢半夏湯洗四錢石膏炮藜蘆炒牡䝉即紫參蓯蓉酒浸錢各一乾薑炮桂心各一錢三字巴豆六七粒研膏右為末煉蜜圓菉荳大每服三五丸食後酒或飲送下亦治男子疝痛食積三稜煎治血癥血瘕食積痰滯三稜煨莪蒁煨二兩各青橘皮去白半夏麥芽炒各一兩右以好醋六升煑乾焙為末醋糊圓梧桐子大每服三四十圓淡醋湯下痰積多以薑湯送下紅圓子治食積作塊膨痛面黄方見大方科痎瘧類膈氣五膈寛中散分心氣飲沉香降氣湯方並見大方科諸氣類血風人參荆芥散治血風勞氣身體疼痛頭昏目澁心忪煩倦寒熱盗汗頰赤口乾痰嗽胸滿精神不爽或月水不調臍腹㽲痛痃癖塊硬疼痛發歇或時嘔逆飲食不進或因産將理失節淹延瘦瘁乍起乍卧甚即著牀常服除一切風虚勞冷孕婦莫服荆芥穗人參桂心生乾地黄北柴胡去苗鱉甲醋炙酸棗仁炒枳殻去穰羚羊角屑另為末白术各七錢半川芎當歸防風甘草各半両右剉散每服三錢水一盞半生薑三片煎熱服日二服單方治血風攻頭腦旋倒地不知人事右以嫩蒼耳草心不拘多少隂乾為末不以時服一錢效小黒神圓治血風走注攻刺半身不遂麻痺瘙痒急風口眼喎斜言語蹇澁手足拘攣烏頭一個芫花乾薑各五錢右為末醋煑令乾更杵為末再入桂心二錢天麻一錢海桐皮一錢黒荳為末入前藥和匀别用黒荳煑極爛研如泥以荳汁調和前末研合為圓每服七圓至十圓以黒荳淋酒下忌一切毒物大芎藭散治婦人血風身體骨節疼痛心膈壅滯少思飲食川芎一兩赤茯苓赤芍藥酸棗仁炒桂心當歸去尾木香川牛膝各三分羗活枳殻去穰麩炒甘草各半兩右剉散每服三錢水一大盞薑三片煎不拘時熱服羚羊角散治血風身體疼痛手足無力心神壅悶羚羊角屑酸棗仁炒生乾地黄㯽榔各一兩五加皮防風去叉赤芍藥當歸骨碎補炒毛去海桐皮川芎各三分甘草半兩右為末每服二錢温酒調下歴節風麝香圓治白虎歴節諸風疼痛遊走不定狀如蟲囓晝静夜劇及一切手足不測痛大八角川烏頭二十三個去一粒皮臍生生全蝎二十一個生黒荳生地龍去土净半兩右為末入麝香一字同研停匀糯米糊圓菉荳大每服七圓甚者十圓夜卧令膈空温酒吞下微出冷汗便瘥血虚大補血虚湯治頭痛發熱多汗六脉虚細尺脉或絶作血虚治之服後藥見效术附湯加川芎先服方見大方科中濕類十全大補湯加附子次服大方科虚損類又服萬安圓大方科虚損類神术散大方科傷寒類内補圓芎歸湯方見前靈砂丹有婦人頭痛惡風發熱六脉沉取無根浮取却有乃是虚證方見大方科痼冷類右用人參一二兩銀銚煎湯空心下二十粒五更又下二十粒天明而愈鹿膠湯治血虚勞倦鹿角膠當歸去尾黄耆鹽炙肉桂乾地黄酒炒石斛木香白术白茯苓鱉甲醋炙秦芁川巴㦸柑子皮各一兩牡丹皮天仙藤甘草各半兩人參二錢枳殻三錢右剉散每服水盞半生薑九片薤白三寸煎空心温服性香散治脾胃虚弱并脾血久冷草荳蔲去殻炒用甘草髙良薑剉炒香白术縮砂仁各一兩青皮去穰炒黄訶子肉各半兩肉桂一分生薑切炒乾厚朴去麄皮薑汁炒棗肉切三味各一兩水一碗煑令乾同符為圓焙乾右為末每服二錢入鹽少許沸湯㸃空心服及療腹痛又治冷㵼尤妙腹痛最難得藥此方只是温補藥耳特工止痛理不可知顛狂加味逍遥散