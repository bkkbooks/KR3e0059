木𤓰當歸浸酒赤白帶下蔥白連根煎酒血海虚冷下白不止用鯉魚一箇去腸肚不去鱗將油髮一塊入魚肚内黄泥固濟炭火内燒煙淡淡留性去泥碾為末後入當歸頭甘草炒為末每服一錢用舊酒調下白濁一氣正元丹方見大方科虚損類秘精圓方見大方科淋濁類四七湯吞青州白圓子方見大方科喘急類及風科通治類崩漏鎮宫圓治崩漏不止或五色或赤白不定或如荳汁或狀若豚肝或下瘀血臍腹脹痛頭暈眼花久久不止令人黄瘦口乾胸煩不食代赭石火煆醋焠七次紫石英製同上禹餘糧製同上香附子去毛醋煑各二兩陽起石煆紅細研芎藭鹿茸燎去毛醋蒸焙茯神去木阿膠蛤粉炒當歸去蘆酒浸蒲黄炒一兩各血竭别研半兩右為末艾醋汁打糯米糊圓梧桐子大每服七十圓空心米飲下川續斷湯治憂思過度勞傷心經心主血心虚不能維持諸經之血亦能致崩中下血之患當歸去蘆酒浸芎藭茯神去木小草阿膠蛤粉炒鹿茸燎去毛酒蒸焙栢子仁炒各一兩香附子二兩甘草炙半兩川續斷酒浸半一兩右剉散每服四錢水盞半生薑五片煎空心食前温服秘方龍骨圓治半産後及下虚數月崩漏不止白牡蠣北赤石脂大赭石已上並煅白龍骨伏龍肝海螵蛸五靈脂側柏葉各等分棕櫚不拘多少燒灰真蒲黄多加入右為末醋糊圓如梧桐子大每服三十五圓以十全大補湯三錢加嫰鹿茸去毛酒炙阿膠蚌粉炒各一錢半薑三片棗二枚烏梅二箇煎吞服立效平胃散治脾血不固崩漏温酒調下方見大方科脾胃類滋榮圓治勞傷過度致傷臟腑衝任氣虚不能約制或暴下崩中或下鮮血或瘀血連日不止淋瀝不斷形羸氣劣倦怠困乏並皆治之赤石脂海螵蛸去殻側柏去梗兩各五右為末醋糊圓梧桐子大每服三十圓飯飲送下空心日三服神效加味四物湯治經斷後多年忽然再行遂成崩漏腹痛寒熱加人參茱茰生薑紅棗煎兼用熟附圓四物湯方見前熟附圓大川芎當歸赤石脂煆白龍骨木賊去節熟附子各等分右用醋米糊圓梧桐子大每服五十圓米飲吞下漸安金華散治經血得熱崩漏不止口苦咽乾經候不通宜服延胡索瞿麥穗川當歸牡丹皮乾葛各一兩石膏一兩蒲黄半兩桂心葳靈仙各三分右為末每服二錢水一盞薑三片煎食前温服日二三服黄芩湯治崩中下血諸藥多用止血補血之劑此是陽乘隂前所云天暑地熱經水沸溢是也右用黄芩不以多少為末燒秤錘淬酒調下又方黄芩黄檗各一錢黄連三錢去毛右用水四盞煎取一半去滓入炒阿膠末五錢滓再煎温温分三服空心腹痛加梔子三錢亦可又方治積年血崩一服而愈右以草血竭嫰者蒸油鹽姜淹喫小酒嚥下或收為末薑酒調服血竭草生於磚縫井頭少在地上活血散治血崩不止用鹽梅七箇燒灰為末空心米飲服又方陳槐花一兩百草霜半兩為末燒紅科錘淬酒下五倍子散治血崩帶下大艾一兩醋炙五倍子二兩炒赤烏梅半兩去核川芎半兩右為末每服二錢空心米飲下兩服止竒效四物湯治有熱久患血崩一服稍安八服無恙當歸頭尾用熟乾地黄洗焙白芍藥大川芎大艾葉阿膠蛤粉炒如珠黄芩去爛者各半兩右剉散每服四錢水一盞半薑五片煎空心温服荳花散治白崩不止白扁荳花焙乾為末紫者不用炒米煑飲入燒鹽少許空心數服即效又方用棕櫚絲𤓰燒灰等分為末鹽酒或鹽湯下灸法治白崩小腹文當臍空直下百壯又灸内踝上三寸左右各百壯名三隂治漏下不止或赤或白灸交儀穴在内踝上五寸帶下白歛圓治衝任虚寒帶下純白鹿茸醋蒸焙二兩白歛金毛狗脊燎去毛各一兩右為末艾煎醋汁打糯米糊圓梧桐子犬每服五十圓空心温酒下當歸煎治赤帶不止腹内疼痛四肢煩疼不欲飲食日漸羸瘦當歸去蘆酒浸赤芍藥牡蠣火煆取粉熟地黄酒蒸焙阿膠剉蚌粉炒白芍藥續斷酒浸兩各一地榆半兩右為末醋糊圓梧桐子大每服五十圓空心米飲送下卷栢圓治腹臟冷熱相攻心腹絞痛腰腿俱疼赤白帶下面色痿黄四肢羸乏黄耆去蘆炙蜜水熟地黄洗各半兩卷栢醋炙赤石脂煆醋淬鹿茸醋炙白石脂芎藭代赭石煆醋淬艾葉醋炒桑寄生鱉甲醋炙當歸去蘆酒洗炒地榆各一兩木香不見火龍骨各半兩乾薑炮一分右為末醋煑糯米糊圓梧桐子大每服七十圓空心食前米飲送下温經散治衝任虚損月水過多崩漏帶下淋瀝不斷腰腹重痛凡是五色帶疾並皆治之禹餘糧煅醋淬細研水飛乾三兩赤石脂煅龍骨煆石器研白芍藥川芎附子熟地黄當歸各一兩乾薑肉桂各半兩右為末每服二錢入麝香少許空心米飲調日二服香附散治赤白帶下百草霜一兩當歸香附子紫金皮烏藥八錢伏龍肝一兩右為末以水牛膏同茴香炒舊酒調三大錢不拘時候通口服忌卵魚腥母猪等肉白芷圓治婦人帶下腸有敗膿淋露不已腥穢殊甚遂至臍腹更増冷痛此盖為敗膿血所致卒無已期湏以此排膿白芷一兩單葉紅蜀葵根二兩即争荅古梅根無則以蘇木節代之亦可白芍藥白礬燒枯别研各半兩右為末蠟圓如梧桐子大空腹米飲下十圓或十五圓候膿盡仍以他藥補之白芍藥散治赤白帶下臍腹疼痛神效白芍藥一兩乾薑半兩右為末微炒黄色每服二錢空心米飲下脫又服半月效秋霜丹治赤白帶下真秋石為末北棗去皮煑爛為圓梧桐子大每服五十圓空心醋湯下求嗣温經湯治衝任虚損月候不調或來多不斷或過期不來或崩中去血過多不止小腹有寒乆不受胎曽經損娠瘀血停留小腹急痛發熱下痢手足煩熱唇口乾燥吳茱茰三兩湯洗十次炒半夏二兩半洗七次桂心去麄皮人參去蘆白芍藥牡丹皮當歸去蘆阿膠搗破蚱粉炒川芎甘草炒各二兩麥門冬去心兩半右剉散每服四錢水一盞半薑五片煎空心熱服經事來多不斷以此吞服煖宫圓亦效暖宫圓治婦人無子暖子宫冷服之神效附子炮去皮臍一枚杜仲炒斷絲地榆桔梗白薇去土川牛膝去苖川白芷黄耆沙參厚朴去麄皮薑汁炒各四錢北細辛去葉乾薑蜀椒各二錢半右為末煉蜜圓梧桐子大每服二十圓鹽酒下服之一月自然有孕局方四物湯羊肉圓多服亦效抑氣散治氣盛於血所以無子尋常頭暈膈滿體痛怔忡皆可服之香附子乃婦人之仙藥不可謂其耗氣而勿服香附子炒杵浄四兩茯神去木一兩橘紅二兩甘草炙兩一右為末每服二錢食前沸湯調服仍兼進紫石英圓炙用小温經湯治經血不調血臟冷痛此方甚平易用藥且不多當歸去尾附子炮去皮臍右為末每服三錢水一盞半煎空心温服秦桂圓治婦人無子經進有效秦芁桂心杜仲炒斷絲防風厚朴各三分附子生白茯苓各一兩半白薇乾薑沙參牛膝半夏各半兩人參一兩細辛二兩一分右並生碾為末煉蜜圓如赤荳大每服三十圓空心食前醋湯或米飲下未效更加圓數次覺有孕便不可服陽起石圓治丈夫真精氣不濃不能施化是以無子陽起石火煅紅研極細鹿茸燎去毛酒煑焙兎絲子水淘浄酒浸蒸焙别研天雄炮去皮韭子炒肉蓯蓉酒浸已上各一兩覆盆子酒浸石斛去根桑寄生沉香别研原蚕蛾酒炙五味子各半兩右為末酒煑糯米糊圓梧桐子大每服七十圓空心鹽湯或鹽酒下濟隂丹治婦人乆冷無子及數經墮胎皆因衝任之脉虚損胞内宿挾疾病經水非時暴下不止月内再行或前或後或崩中漏下三十六疾積聚癥瘕臍下冷痛小便白濁心上疾訂皆令孕育不成以致絶嗣方見前灸法婦人絶子灸然容五十壯在内踝前直下一寸又法絶嗣胞門閉塞灸闗元穴三十壯通之婦人姙子不成數墮腹痛漏下灸胞門五十壯在闗元左邉二寸是也右邉二寸名子户雜方厚朴圓治婦人胃冷嘔吐不下食厚朴去麄皮切薑汁炒三兩附子去皮剉如荳三兩右以生薑汁一升水五合煑令汁盡焙乾為末以酒煑神麯為圓梧桐子大每服三十圓不拘時温酒下芎歸湯治頭暈痛諸脉平和惟肝脉獨弱可預見有崩疾來及治血虚頭暈方見前即佛手散橄㰖圓止渇潤咽乾川百藥煎烏梅甘草石膏各等分右為末煉蜜圓如彈子大每服一圓噙化橘歸湯治肌膚手足俱有血線路此怒氣傷肝血失常經以致如此服之神效橘皮二兩當歸一兩右為末煉蜜圓梧桐子大每服三十圓温酒下八味圓治大小便秘澁此血弱不能榮飬臟腑津液枯澁數服即愈方見大方科痟渇類鹿茸圓治虚弱服剛劑太過發搐此肝血不足為剛劑所燥故令搐搦服此而愈方見大方科痟渇類芍藥湯治冷證脇痛諸藥不效香附子四兩黄了醋二升鹽一兩煑乾為度肉桂延胡索白芍藥右為末每服二錢沸湯調不拘時候服健骨散治腰上實肉處痛不可忍右以麝香末半錢用酒調服補心湯治隂中生瘡名曰䘌瘡或痛或痒如蟲行狀淋瀝膿汁隂蝕幾盡治之當補心養胃白茯苓人參前胡半夏湯洗七次去滑川芎各三分橘皮枳殻麩炒去穰紫蘇桔梗甘草炙乾薑各半兩當歸一兩三分白芍藥一兩熟地黄一兩半右剉散每服四錢水盞半薑五片棗一枚同煎食前服狼牙湯治隂中蝕瘡爛潰膿水淋漓臭穢狼牙剉煎濃汁以綿纒筯頭大如蠒浸濃汁瀝隂中數次雄黄兊散治下部䘌瘡雄黄研青箱子苦參黄連各二分桃仁去皮尖研一分右為末以生艾搗汁和如棗核大綿裹内下部未效更加扁竹汁無艾只用綿裹散子内下部亦可洗榻湯療隂蝕甘草乾漆各一兩黄芩乾地黄當歸芍藥各兩龜甲五兩右藥用水七升煑取一半去滓以綿帛納湯中搨瘡處良乆即易日二度每搨湯可行十里許即拭乾再取甘濕散薄𫝊瘡上使徧可經半日又以湯搨搨訖如前敷藥甘濕散用五月五日蝦蟆青木香石硫黄鋪精為末生麝香臨時加入藿香飬胃湯治陽明經虚不榮肌肉隂中生瘡不愈藿香白术白茯苓神麯炒烏藥去木縮砂仁薏苡仁半夏麯人參各半兩蓽澄茄甘草炙各三錢半右剉散每服四錢水盞半薑五片棗二枚同煎不以時妳癰瘡黄𤓰蔞一二箇連皮穰子剉碎右用無灰常酒一二升於沙瓶内煑存一升去滓時時温服酒盡再煑滓服如覺初時便服此藥即時止痛更不成瘡如已成瘡服之其瘡自穿而痛自止又方尚未成瘡纔覺腫硬作痛以蔥白熨之其法用中様小海味瓶口寛者以炭火入瓶内上以熱灰填之不封口用蔥葉及蔥白搥損令徧覆瓶口以手帕子裹定倒執將瓶口向腫處任意輕輕熨之有驗治茄子疾心燥連綿黄水易治白水難愈烏金二豆散薑棗子煎温服方見前又方生枳殻為散煑熏洗却用綃帛包枳殻滓納入隂中即日漸消圓方茄皮白礬馬稻頭根朴硝澤蘭煑水熏洗加入炒茄灰少許敷藥朴硝為末黄瓶柴燒瀝調敷或用濃鉄漿水敷丁疽病心燥四肢痠臍輪冷痛或腹中絞刺小嘉禾散猪肝蒜片煎服方見前又方硫黄一兩大鯉魚一箇去頭皮納入藥故紙裹黄泥固濟火煅煙盡為末米糊圓梧桐子大每二十圓温酒下如下疽生蟲所下如柿汁臭穢心中㽲痛悶絶虚煩甚者不可治磁石散治子宫不收名瘣疾有痛不可忍者磁石酒浸火煆右為末糯米糊圓梧子大每服二十圓空心滑石湯下鉄粉散治同前當歸磁石半兩酒浸鉄粉右為末米飲調下隔夜用角藥次日服此角藥用銕粉螺青為末磨刀水調塗産門上熏洗方荆芥穗藿香葉臭椿樹皮煎湯熏洗即入三茰圓食茱茰吳茱茰湯洗微炒桔梗水浸一伏時取出漫火焙白蒺藜青皮去白山茱茰去核取肉舶上茴香湯去砂兩炮各一五味子浄揀海藻大腹皮酒浸過川練子去核𤣥胡索各一兩二錢半右為末酒糊圓如梧桐子大每服三十五圓木通湯下下虚加川烏炮去皮肉桂去麄皮各一兩腰腹疼夏用桃仁去皮尖麩炒别研青皮去白枳實去穰各一兩為南木香七錢半一捻金圓服前藥未效却用𤣥胡索舶上茴香吳茱茰炒川練子青木香各二兩右為末粳米糊圓如梧桐子大每服三十五圓空心木通湯服又用梅花腦子半錢鐵孕粉一錢水調刷上如隂畔生疱以凉血飲每服三錢加凌霄花少許煎空心服見前四物湯治産育艱難或一嵗一産可以此少間之每服三錢加蕓薹子一撮於經行後空心服又方用對麻葛根湯二兩加瞿麥乾土牛膝栝蔞根豆豉炒各半兩為散分作八服空心一日二服世醫得效方卷十五
